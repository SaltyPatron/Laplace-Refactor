name: Converge and verify exact installed cognition requests
on:
  push:
    branches: [diag/cognition-requests-419-20260916]
permissions:
  contents: read
jobs:
  requests:
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify actual HTTP assets and retain explicit native request results
        shell: bash tools/host/run-exclusive.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(id -un)" = laplace-runner
          git merge-base --is-ancestor b25d107ec9fdea3b125937790aa1045a0e3ac129 HEAD
          test "$(git hash-object tools/sources/stockfish_corpus_acceptance.py)" = ff0c3264a4d9f615d54e827a19e6e0b1066e4b32
          test "$(git hash-object tests/stockfish_corpus_acceptance_tests.py)" = b83e48c918da95df6dfb77bb1512dcd2ff6d2776
          test "$(git diff --name-only b25d107ec9fdea3b125937790aa1045a0e3ac129 HEAD)" = .github/workflows/inspect-installed-cognition-requests.yml
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,sys,time
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"tools"))
          from sources.stockfish_corpus_acceptance import observe_activation,stable_activation
          output=Path(os.environ["RUNNER_TEMP"])/("installed-requests-"+os.environ["GITHUB_RUN_ID"])
          output.mkdir(mode=0o700)
          expected="419cbcb4fd4c569706ee3c253ab4775f5fcaebad"
          before=observe_activation(expected,output/"activation-before.json")
          assert before["package_id"]=="daeec53fd6e39668bbbcceb239b1da4837c89f62e3aaae9d8e99cf993f6dab64"
          from delivery import receipt_estate as estate
          receipt_root=Path("/opt/laplace/receipts/postgresql/refactor")
          canonical_root=receipt_root/"cluster-activation"
          historical="b935c2916fea6ac9761f43f9066c13263f3dd959ce251447b1ea8415aac5c919"
          historical_paths=[receipt_root/"release-capacity"/historical/"capacity.json",
              canonical_root/historical/"release-capacity.json"]
          def retained_hash(path):
              assert path.is_file() and not path.is_symlink() and path.stat().st_size<=1024*1024
              return hashlib.sha256(path.read_bytes()).hexdigest()
          historical_before={str(path):retained_hash(path) for path in historical_paths}
          migrated=[]
          for label,field in (("unicode","unicode_activation"),("highway","highway_activation")):
              source=Path(before["native_receipt_paths"][label])
              assert source.name in {"unicode-product-activation.json","highway-product-activation.json","highway-committed-revalidation.json"}
              assert estate.load_json(source)==before[field]
              assert before[field]["package_id"]==before["package_id"]
              if source.parent==receipt_root:
                  estate.migrate_singleton_product_receipt(source,canonical_root,source.name,
                      os.geteuid(),os.getegid(),False,migrated)
              else:
                  assert source.parent==canonical_root/before["package_id"]
          historical_after={str(path):retained_hash(path) for path in historical_paths}
          assert historical_before==historical_after
          migration={"schema":"laplace.current-native-receipt-convergence/v1",
              "package_id":before["package_id"],"migration_count":len(migrated),"migrated":migrated,
              "preserved_historical_conflict":historical_after}
          (output/"convergence.json").write_text(json.dumps(migration,sort_keys=True,indent=2)+"\n")
          print(json.dumps(migration,sort_keys=True))
          commands=[
            ("http",[sys.executable,"tools/delivery/product_gateway_live_proof.py","--readiness-only",
              "--package-id",before["package_id"],"--product-receipt",
              "/build/laplace/runner/product/build/4c403055443c121f8d4b71bb91fa7cd77ba802a818eb0bb1976304c0e77246be/package-receipt.json",
              "--output",str(output/"http-readiness.json")],50),
            ("explicit",["/opt/laplace/runtime/refactor/bin/laplace-cognition","--relations","constituent","--json","AA"],30),
            ("automatic",["/opt/laplace/runtime/refactor/bin/laplace-cognition","--session","service-diagnostic",
              "--state-root",str(output/"state"),"--reset-session","--json","AA"],30),
            ("continued",["/opt/laplace/runtime/refactor/bin/laplace-cognition","--session","service-diagnostic",
              "--state-root",str(output/"state"),"--json","AA"],30),
          ]
          report={"schema":"laplace.installed-request-diagnostic/v1","package_id":before["package_id"],
              "commands":[],"activation_unchanged":False}
          for label,command,budget in commands:
              started=time.monotonic()
              try:
                  result=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=budget,check=False)
                  code=result.returncode;stdout=result.stdout;stderr=result.stderr
              except subprocess.TimeoutExpired as error:
                  code=None;stdout=error.stdout or b"";stderr=error.stderr or b""
              (output/(label+".stdout")).write_bytes(stdout)
              (output/(label+".stderr")).write_bytes(stderr)
              item={"label":label,"exit_code":code,"elapsed_seconds":time.monotonic()-started,
                  "stdout_sha256":hashlib.sha256(stdout).hexdigest(),"stderr_sha256":hashlib.sha256(stderr).hexdigest(),
                  "stdout_bytes":len(stdout),"stderr_bytes":len(stderr)}
              report["commands"].append(item)
              print(json.dumps(item,sort_keys=True))
              if code!=0:
                  print(label+" STDERR: "+stderr[-8000:].decode(errors="replace"))
          after=observe_activation(expected,output/"activation-after.json")
          report["activation_unchanged"]=stable_activation(before)==stable_activation(after)
          report["status"]="failed"
          try:
              assert report["activation_unchanged"], "activated package/native binding changed"
              assert all(item["exit_code"]==0 for item in report["commands"]), "request command failed"
              explicit=json.loads((output/"explicit.stdout").read_text())
              first=json.loads((output/"automatic.stdout").read_text())
              second=json.loads((output/"continued.stdout").read_text())
              assert explicit["status"]==0 and explicit["output_utf8"]=="A" and explicit["execution_route"]=="explicit-firmware"
              assert explicit["relations"]==["constituent"]
              for name,response in (("explicit",explicit),("automatic",first),("continued",second)):
                  assert response["package_id"]==before["package_id"]
                  assert response["execution"]["native_status"]==0
                  assert response["output_utf8"]=="A"
                  assert isinstance(response["checkpoint_hex"],str) and response["checkpoint_hex"]
                  assert re.fullmatch("[0-9a-f]{64}",response["next_checkpoint_fingerprint"])
                  assert re.fullmatch(r"\\x[0-9a-f]{64}",response["execution"]["execution_receipt_id"])
                  report[name]={key:response[key] for key in
                      ("package_id","execution_route","mode","status","output_utf8","turn_ordinal",
                       "continued","program_id","next_checkpoint_fingerprint")}
                  report[name]["native_status"]=response["execution"]["native_status"]
                  report[name]["execution_receipt_id"]=response["execution"]["execution_receipt_id"]
              assert first["status"]==second["status"]==0 and first["mode"]==second["mode"]=="auto"
              assert first["execution_route"]==second["execution_route"]=="automatic-firmware"
              assert first["turn_ordinal"]==0 and first["continued"] is False
              assert second["turn_ordinal"]==1 and second["continued"] is True
              assert first["program_id"]==second["program_id"]
              assert first["next_checkpoint_fingerprint"]!=second["next_checkpoint_fingerprint"]
              assert json.loads((output/"http-readiness.json").read_text())["status"]=="passed"
              report["status"]="passed"
          except (AssertionError,KeyError,TypeError,ValueError) as error:
              report["error"]=str(error) or type(error).__name__
          (output/"requests.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True))
          if report["status"]!="passed": raise SystemExit(1)
          PY
      - name: Retain actual request and HTTP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-requests-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 7
