name: Native CuteChess rules provider qualification

on:
  push:
    branches:
      - verify/cutechess-rules-provider
      - main
    paths:
      - '.github/workflows/chess-rules-qualification.yml'
      - 'dependencies/lock.json'
      - 'dependencies/artifact-lock.json'
      - 'dependencies/chess-release-selection.json'
      - 'tools/dependencies/chess_tools.py'
      - 'tools/dependencies/git_checkout.py'
      - 'tools/chess/**'
      - 'tests/cutechess_rules_provider_tests.py'
      - 'tests/cutechess_trace_adapter_tests.cpp'
      - 'tests/chess_line_tests.cpp'
      - 'tests/registry.d/chess-line.json'
      - 'tests/CMakeLists.txt'
      - 'engine/**'
      - 'contracts/chess-line.json'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'tests/fixtures/cutechess-rules/**'
      - 'tests/fixtures/pgn-provider/upstream-117-ply.pgn'
      - 'tests/registry.d/cutechess-rules-provider.json'
      - 'cmake/LaplaceOutputBoundary.cmake'
  pull_request:
    paths:
      - '.github/workflows/chess-rules-qualification.yml'
      - 'dependencies/lock.json'
      - 'dependencies/artifact-lock.json'
      - 'dependencies/chess-release-selection.json'
      - 'tools/dependencies/chess_tools.py'
      - 'tools/dependencies/git_checkout.py'
      - 'tools/chess/**'
      - 'tests/cutechess_rules_provider_tests.py'
      - 'tests/cutechess_trace_adapter_tests.cpp'
      - 'tests/chess_line_tests.cpp'
      - 'tests/registry.d/chess-line.json'
      - 'tests/CMakeLists.txt'
      - 'engine/**'
      - 'contracts/chess-line.json'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'tests/fixtures/cutechess-rules/**'
      - 'tests/fixtures/pgn-provider/upstream-117-ply.pgn'
      - 'tests/registry.d/cutechess-rules-provider.json'
      - 'cmake/LaplaceOutputBoundary.cmake'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutechess-rules-qualification
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install physical build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ninja-build libgl1-mesa-dev libxkbcommon-dev libvulkan1
      - name: Build selected official CuteChess and Qt through the common tool owner
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/laplace-cutechess-rules"
          mkdir -p "$root/output"
          printf 'LAPLACE_RULES_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
          python3 tools/dependencies/chess_tools.py install --tool cutechess \
            --prefix "$root/tools" --source-root "$root/sources" \
            --build-root "$root/build" --cache "$root/downloads" --jobs 2 \
            | tee "$root/output/tool-install.json"
          cp "$root/tools/current.json" "$root/output/tool-source-build.json"
      - name: Build common native LINE planner and execute canonical identity controls
        shell: bash
        run: |
          set -euo pipefail
          dependencies="$LAPLACE_RULES_ROOT/native-dependencies"
          native="$LAPLACE_RULES_ROOT/native-build"
          ./tools/dependencies/acquire-locked-git.sh dependencies/lock.json "$dependencies" blake3 eigen googletest spectra tree-sitter
          printf 'LAPLACE_NATIVE_BUILD=%s\n' "$native" >> "$GITHUB_ENV"
          cmake --preset linux-dev -B "$native" \
            -DLAPLACE_BLAKE3_SOURCE="$dependencies/blake3/c" \
            -DLAPLACE_GTEST_SOURCE="$dependencies/googletest" \
            -DLAPLACE_EIGEN_SOURCE="$dependencies/eigen" \
            -DLAPLACE_SPECTRA_SOURCE="$dependencies/spectra" \
            -DLAPLACE_TREE_SITTER_SOURCE="$dependencies/tree-sitter" \
            2>&1 | tee "$LAPLACE_RULES_ROOT/output/native-configure.log"
          cmake --build "$native" --target laplace_chess_line_tests --parallel 2 \
            2>&1 | tee "$LAPLACE_RULES_ROOT/output/native-build.log"
          ctest --test-dir "$native" --no-tests=error --output-on-failure -V \
            -R '^ChessLine[.]' 2>&1 | tee "$LAPLACE_RULES_ROOT/output/native-planner-test.log"
      - name: Build exact native mechanism and deliberate noncanonical-SAN defect
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/chess/qualify_rules_provider.py \
            --chess-prefix "$LAPLACE_RULES_ROOT/tools" \
            --output "$LAPLACE_RULES_ROOT/output/rules" --native-build "$LAPLACE_NATIVE_BUILD" --jobs 2
      - name: Execute registered native rules and history conformance
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$LAPLACE_RULES_ROOT/output/rules/build" \
            --no-tests=error --output-on-failure -V \
            -R '^chess[.]native-(rules-provider|trace-adapter)-contract$'
      - name: Retain partial build and native qualification diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/laplace-cutechess-rules"
          mkdir -p "$root/output"
          for log in "$root/build/cutechess/"*/build.log; do
            if [[ -f "$log" ]]; then cp "$log" "$root/output/cutechess-source-build.log"; fi
          done
          for receipt in "$root/output/rules/build-receipt.json" "$root/output/rules/native-qualification.json" "$root/output/rules/native-adapter-qualification.json"; do
            if [[ -f "$receipt" ]]; then cat "$receipt"; fi
          done
          if [[ -f "$root/output/rules/build.log" ]]; then tail -n 100 "$root/output/rules/build.log"; fi
      - name: Retain exact source, binaries, licenses and execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cutechess-rules-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/laplace-cutechess-rules/output/
          if-no-files-found: error
          retention-days: 30
