name: one-shot-composition-frontier-memory

on:
  push:
    branches:
      - product/installed-cognition-surface

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Account composition frontier concurrent scratch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: product/installed-cognition-surface
          fetch-depth: 0
      - name: Bind execution to shared frontier plan and account concurrent scratch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/src/composition_legacy.inc')
          text = path.read_text(encoding='utf-8')

          start = text.index('        const std::size_t request_count =\n', text.index('laplace_composition_status CalculateRequestLevels('))
          end_marker = '''        std::vector<ResolvedValue> calculated(request_count);\n        for (const auto& request_indexes : levels) {\n            if (request_indexes.empty()) {\n                continue;\n            }\n'''
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''        const std::size_t request_count =\n            static_cast<std::size_t>(input.request_count);\n        FrontierPlan local_frontier_plan{};\n        const FrontierPlan* frontier_plan = nullptr;\n        if (active_frontier_capture != nullptr) {\n            frontier_plan = &active_frontier_capture->expected;\n        } else {\n            const auto frontier_status =\n                BuildFrontierPlan(input, local_frontier_plan);\n            if (frontier_status != LAPLACE_COMPOSITION_OK) {\n                return frontier_status;\n            }\n            frontier_plan = &local_frontier_plan;\n        }\n        if (frontier_plan->request_indices.size() != request_count ||\n            frontier_plan->frontier_offsets.empty()) {\n            return LAPLACE_COMPOSITION_REFERENCE_INVALID;\n        }\n\n        std::vector<ResolvedValue> calculated(request_count);\n        for (std::size_t frontier = 0U;\n             frontier < static_cast<std::size_t>(frontier_plan->frontier_count());\n             ++frontier) {\n            const std::uint64_t first = frontier_plan->frontier_offsets[frontier];\n            const std::uint64_t end = frontier_plan->frontier_offsets[frontier + 1U];\n            if (end <= first || end > frontier_plan->request_indices.size()) {\n                return LAPLACE_COMPOSITION_REFERENCE_INVALID;\n            }\n            std::vector<std::uint64_t> request_indexes(\n                frontier_plan->request_indices.begin() +\n                    static_cast<std::ptrdiff_t>(first),\n                frontier_plan->request_indices.begin() +\n                    static_cast<std::ptrdiff_t>(end));\n'''
          text = text[:start] + replacement + text[end:]

          estimate_marker = 'laplace_composition_status EstimatePlanningMemory(\n'
          insert_at = text.index(estimate_marker)
          helper = r'''laplace_composition_status EstimateFrontierConcurrentMemory(
              const laplace_composition_working_set_input& input,
              std::uint64_t& estimated) {
              estimated = 0U;
              FrontierPlan local_frontier_plan{};
              const FrontierPlan* frontier_plan = nullptr;
              if (active_frontier_capture != nullptr) {
                  frontier_plan = &active_frontier_capture->expected;
              } else {
                  const auto frontier_status =
                      BuildFrontierPlan(input, local_frontier_plan);
                  if (frontier_status != LAPLACE_COMPOSITION_OK) {
                      return frontier_status;
                  }
                  frontier_plan = &local_frontier_plan;
              }
              if (frontier_plan->request_indices.size() != input.request_count ||
                  frontier_plan->frontier_offsets.empty()) {
                  return LAPLACE_COMPOSITION_REFERENCE_INVALID;
              }

              std::uint64_t retained_plan_bytes{};
              if (!AddMemory(
                      input.request_count,
                      sizeof(std::uint64_t) * 2U,
                      retained_plan_bytes) ||
                  !AddMemory(
                      frontier_plan->frontier_offsets.size(),
                      sizeof(std::uint64_t),
                      retained_plan_bytes) ||
                  !AddMemory(
                      frontier_plan->frontier_count(),
                      sizeof(laplace_execution_work_receipt),
                      retained_plan_bytes)) {
                  return LAPLACE_COMPOSITION_COUNT_OVERFLOW;
              }
              estimated = retained_plan_bytes;

              for (std::size_t frontier = 0U;
                   frontier < static_cast<std::size_t>(frontier_plan->frontier_count());
                   ++frontier) {
                  const std::uint64_t first =
                      frontier_plan->frontier_offsets[frontier];
                  const std::uint64_t end =
                      frontier_plan->frontier_offsets[frontier + 1U];
                  if (end <= first || end > frontier_plan->request_indices.size()) {
                      return LAPLACE_COMPOSITION_REFERENCE_INVALID;
                  }
                  const std::uint64_t width = end - first;
                  std::uint64_t frontier_bytes = retained_plan_bytes;
                  if (!AddMemory(
                          width,
                          sizeof(RequestCalculation) + sizeof(std::uint64_t),
                          frontier_bytes)) {
                      return LAPLACE_COMPOSITION_COUNT_OVERFLOW;
                  }

                  std::vector<std::uint64_t> active_scratch;
                  active_scratch.reserve(static_cast<std::size_t>(width));
                  for (std::uint64_t position = first; position < end; ++position) {
                      const std::uint64_t request_index =
                          frontier_plan->request_indices[
                              static_cast<std::size_t>(position)];
                      if (request_index >= input.request_count) {
                          return LAPLACE_COMPOSITION_REFERENCE_INVALID;
                      }
                      const auto& request =
                          input.requests[static_cast<std::size_t>(request_index)];
                      std::uint64_t request_carriers{};
                      const std::uint64_t operand_end =
                          request.first_operand + request.operand_count;
                      for (std::uint64_t operand_index = request.first_operand;
                           operand_index < operand_end; ++operand_index) {
                          const std::uint64_t multiplicity =
                              input.operands[static_cast<std::size_t>(operand_index)]
                                  .multiplicity;
                          const std::uint64_t carriers =
                              multiplicity /
                                  LAPLACE_COMPOSITION_MAXIMUM_RUN_PER_CARRIER +
                              ((multiplicity %
                                LAPLACE_COMPOSITION_MAXIMUM_RUN_PER_CARRIER) != 0U
                                   ? 1U
                                   : 0U);
                          if (AddOverflow(
                                  request_carriers, carriers, request_carriers)) {
                              return LAPLACE_COMPOSITION_COUNT_OVERFLOW;
                          }
                      }
                      if (!AddMemory(
                              request_carriers,
                              sizeof(laplace_trajectory_carrier),
                              frontier_bytes)) {
                          return LAPLACE_COMPOSITION_COUNT_OVERFLOW;
                      }
                      std::uint64_t request_scratch{};
                      if (!AddMemory(
                              request.operand_count,
                              sizeof(laplace_id_run) +
                                  sizeof(std::pair<
                                      ResolvedValue,
                                      laplace_composition_operand>),
                              request_scratch)) {
                          return LAPLACE_COMPOSITION_COUNT_OVERFLOW;
                      }
                      active_scratch.push_back(request_scratch);
                  }

                  std::sort(
                      active_scratch.begin(), active_scratch.end(),
                      std::greater<std::uint64_t>());
                  const std::size_t worker_count = std::min<std::size_t>(
                      active_scratch.size(),
                      std::max<std::size_t>(
                          1U, input.context->resource_grant.cpu_slots));
                  for (std::size_t worker = 0U; worker < worker_count; ++worker) {
                      if (AddOverflow(
                              frontier_bytes,
                              active_scratch[worker],
                              frontier_bytes)) {
                          return LAPLACE_COMPOSITION_COUNT_OVERFLOW;
                      }
                  }
                  estimated = std::max(estimated, frontier_bytes);
              }
              return LAPLACE_COMPOSITION_OK;
          }

          '''
          text = text[:insert_at] + helper + text[insert_at:]

          planning_start = text.index(estimate_marker)
          planning_end = text.index('laplace_composition_status PlanResourceBounds(\n', planning_start)
          planning = r'''laplace_composition_status EstimatePlanningMemory(
              const laplace_composition_working_set_input& input,
              std::uint64_t& estimated) {
              estimated = 0U;
              std::uint64_t maximum_entities{};
              if (AddOverflow(
                      input.known_entity_count, input.request_count,
                      maximum_entities)) {
                  return LAPLACE_COMPOSITION_COUNT_OVERFLOW;
              }
              std::uint64_t frontier_bytes{};
              const auto frontier_status =
                  EstimateFrontierConcurrentMemory(input, frontier_bytes);
              if (frontier_status != LAPLACE_COMPOSITION_OK) {
                  return frontier_status;
              }
              const std::uint64_t map_pair_bytes =
                  static_cast<std::uint64_t>(sizeof(IdKey) + sizeof(DigestKey));
              if (!AddMemory(input.request_count, sizeof(ResolvedValue), estimated) ||
                  !AddMemory(maximum_entities, map_pair_bytes * 4U, estimated) ||
                  !AddMemory(input.request_count, sizeof(DigestKey) * 8U, estimated) ||
                  AddOverflow(estimated, frontier_bytes, estimated)) {
                  return LAPLACE_COMPOSITION_COUNT_OVERFLOW;
              }
              return LAPLACE_COMPOSITION_OK;
          }

          '''
          text = text[:planning_start] + planning + text[planning_end:]

          working_marker = '''    std::uint64_t occurrence_count = resources.unique_occurrence_count;\n    if (!AddMemory(input.request_count,\n                   sizeof(laplace_composition_result), estimated) ||\n        !AddMemory(input.request_count, sizeof(ResolvedValue), estimated) ||\n        !AddMemory(resources.maximum_request_operand_count,\n                   sizeof(laplace_id_run) +\n                       sizeof(std::pair<ResolvedValue, laplace_composition_operand>),\n                   estimated) ||\n        !AddMemory(resources.maximum_request_carrier_count,\n                   sizeof(laplace_trajectory_carrier), estimated) ||\n'''
          working_replacement = '''    std::uint64_t occurrence_count = resources.unique_occurrence_count;\n    std::uint64_t frontier_bytes{};\n    const auto frontier_status =\n        EstimateFrontierConcurrentMemory(input, frontier_bytes);\n    if (frontier_status != LAPLACE_COMPOSITION_OK) {\n        return frontier_status;\n    }\n    if (!AddMemory(input.request_count,\n                   sizeof(laplace_composition_result), estimated) ||\n        !AddMemory(input.request_count, sizeof(ResolvedValue), estimated) ||\n        AddOverflow(estimated, frontier_bytes, estimated) ||\n'''
          if text.count(working_marker) != 1:
              raise SystemExit(f'working-memory marker count {text.count(working_marker)}')
          text = text.replace(working_marker, working_replacement, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/composition_frontier_runtime_tests.cpp')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '''TEST(\n    CompositionFrontierRuntime,\n    RuntimeReceiptCardinalityCannotDivergeFromSharedPlanner) {\n'''
          test = '''TEST(\n    CompositionFrontierRuntime,\n    WideFrontierAccountsForConcurrentScratchResidency) {\n    const auto wide = Scenario(false, 4U);\n    const auto deep = Scenario(true, 4U);\n\n    ASSERT_EQ(wide.preflight.maximum_frontier_width, RequestCount);\n    ASSERT_EQ(deep.preflight.maximum_frontier_width, 1U);\n    EXPECT_GT(\n        wide.summary.estimated_peak_working_bytes,\n        deep.summary.estimated_peak_working_bytes);\n}\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit('composition runtime test anchor drifted')
          tests = tests.replace(anchor, test + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

          grep -F 'EstimateFrontierConcurrentMemory' engine/src/composition_legacy.inc
          grep -F 'WideFrontierAccountsForConcurrentScratchResidency' tests/composition_frontier_runtime_tests.cpp

          git config user.name 'laplace-ci'
          git config user.email 'laplace-ci@users.noreply.github.com'
          git add engine/src/composition_legacy.inc tests/composition_frontier_runtime_tests.cpp
          git commit -m 'Account composition frontier concurrent scratch'
          git push origin HEAD:product/installed-cognition-surface
