name: one-shot-fix-composition-physical-identity-mutant

on:
  push:
    branches:
      - product/installed-cognition-surface

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: product/installed-cognition-surface
          fetch-depth: 0
      - name: Repair physical identity mutant and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          composition = Path('engine/src/composition_legacy.inc')
          text = composition.read_text(encoding='utf-8')
          broken = '''#if defined(LAPLACE_TEST_COMPOSITION_PHYSICAL_PLAN_IN_SEMANTIC_RECEIPT)
    for (const auto& execution_receipt : state.frontier_execution_receipts) {
        blake3_hasher_update(
            &hasher, execution_receipt.plan_fingerprint.bytes,
            sizeof(execution_receipt.plan_fingerprint.bytes));
    }
#endif
'''
          if text.count(broken) != 1:
              raise SystemExit(f'broken receipt mutant count={text.count(broken)}')
          text = text.replace(broken, '', 1)
          marker = '    HashString(hasher, InputDomain);\n'
          replacement = '''    HashString(hasher, InputDomain);
#if defined(LAPLACE_TEST_COMPOSITION_PHYSICAL_PLAN_IN_SEMANTIC_RECEIPT)
    HashU32(hasher, input.context->resource_grant.cpu_slots);
#endif
'''
          if text.count(marker) != 1:
              raise SystemExit(f'input fingerprint marker count={text.count(marker)}')
          composition.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          registry = Path('tests/registry.d/composition-frontier.json')
          document = json.loads(registry.read_text(encoding='utf-8'))
          found = False
          for item in document['tests']:
              if item.get('ctest_name') == 'composition.mutation-physical-plan-semantic-identity-detected':
                  item['covered_dimensions'] = [
                      'changing physical worker grant and chunk plan cannot alter canonical composition publication identity',
                      'the deliberate mutant salts the physical CPU worker grant into semantic working-set identity and must be detected',
                  ]
                  item['defect_controls'] = [
                      'physical worker or batch scheduling metadata enters canonical semantic composition identity',
                  ]
                  found = True
                  break
          if not found:
              raise SystemExit('physical-plan identity mutation registry entry is missing')
          registry.write_text(json.dumps(document, indent=2) + '\n', encoding='utf-8')
          PY

          git rm .github/workflows/one-shot-fix-composition-physical-identity-mutant.yml
          git config user.name laplace-ci
          git config user.email laplace-ci@users.noreply.github.com
          git add engine/src/composition_legacy.inc tests/registry.d/composition-frontier.json
          git commit -m 'Repair composition physical identity mutant'
          git push origin HEAD:product/installed-cognition-surface
