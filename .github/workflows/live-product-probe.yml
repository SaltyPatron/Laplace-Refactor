name: live-product-probe

on:
  push:
    branches:
      - ops/live-product-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - postgres-18
    timeout-minutes: 5
    steps:
      - name: Discover and query actual PostgreSQL state
        shell: bash
        run: |
          set -u -o pipefail
          test "$(id -un)" = laplace-runner || exit 2
          echo "runner_user=$(id -un)"
          echo "host=$(hostname)"
          echo "observed_at=$(date -Iseconds)"
          printf 'active_root='; readlink -f /opt/laplace/current 2>/dev/null || true
          printf 'declared_service='; systemctl is-active laplace-refactor-postgresql.service 2>/dev/null || true

          echo '--- postgres processes ---'
          pgrep -a -f '[p]ostgres' || true
          echo '--- postgres-related services ---'
          systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'postgres|laplace' || true
          echo '--- listening tcp ports ---'
          ss -ltn 2>/dev/null | grep -E ':(5432|55433)\b' || true
          echo '--- unix sockets ---'
          find /run /var/run /tmp -maxdepth 4 -type s -name '.s.PGSQL.*' -print 2>/dev/null | sort -u || true
          echo '--- installed postgres binaries ---'
          find /opt/laplace -maxdepth 4 -type f \( -name psql -o -name postgres -o -name pg_isready \) -perm -0100 -print 2>/dev/null | sort || true

          psql=''
          for candidate in \
            /opt/laplace/current/pgsql-18/bin/psql \
            /opt/laplace/pgsql-18/bin/psql \
            /usr/bin/psql; do
            if test -x "$candidate"; then psql="$candidate"; break; fi
          done
          if test -z "$psql"; then echo 'psql=missing'; exit 0; fi
          echo "psql=$psql"
          "$psql" --version || true
          pg_isready="$(dirname "$psql")/pg_isready"

          echo '--- readiness probes ---'
          for host in /run/laplace-refactor-postgresql /var/run/postgresql /run/postgresql /tmp localhost; do
            for port in 55433 5432; do
              if test -x "$pg_isready"; then "$pg_isready" -h "$host" -p "$port" -t 1 || true; fi
            done
          done

          echo '--- connection probes as laplace-runner ---'
          query="select current_database(), current_user, current_setting('server_version'), current_setting('data_directory');"
          for spec in \
            '/run/laplace-refactor-postgresql|55433|laplace_refactor|laplace_app' \
            '/var/run/postgresql|5432|laplace|laplace_admin' \
            '/var/run/postgresql|5432|laplace_refactor|laplace_app' \
            '/run/postgresql|5432|laplace|laplace_admin' \
            'localhost|5432|laplace|laplace_admin'; do
            IFS='|' read -r host port db role <<< "$spec"
            echo "TRY host=$host port=$port db=$db role=$role"
            "$psql" -X -w -A -t -v ON_ERROR_STOP=1 -h "$host" -p "$port" -d "$db" -U "$role" -c "$query" 2>&1 || true
          done

          echo '--- sudo authority ---'
          sudo -n -l 2>&1 || true
          echo '--- local postgres-superuser observation if authorized ---'
          sudo -n -u postgres "$psql" -X -w -A -t -d postgres -c \
            "select datname from pg_database where datallowconn order by datname;" 2>&1 || true

          echo '--- installed Laplace objects ---'
          find /opt/laplace -maxdepth 6 -type f \( -name 'laplace_pg.so' -o -name 'liblaplace_engine.so*' -o -name 'laplace.control' \) -print -exec sha256sum {} \; 2>/dev/null || true
