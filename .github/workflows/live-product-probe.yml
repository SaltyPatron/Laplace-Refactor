name: live-product-probe

on:
  push:
    branches:
      - ops/live-product-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - postgres-18
    timeout-minutes: 5
    steps:
      - name: Query actual running Laplace database and service surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          psql=/opt/laplace/pgsql-18/bin/psql
          args=(-X -w -A -t -v ON_ERROR_STOP=1 -h /run/postgresql -p 5432 -d laplace -U laplace_admin)

          echo '--- database identity ---'
          "$psql" "${args[@]}" -c "select current_database(),current_user,current_setting('server_version'),current_setting('data_directory'),pg_size_pretty(pg_database_size(current_database()));"

          echo '--- schemas ---'
          "$psql" "${args[@]}" -c "select nspname from pg_namespace where nspname not like 'pg_%' and nspname <> 'information_schema' order by 1;"

          echo '--- extensions ---'
          "$psql" "${args[@]}" -c "select extname,extversion from pg_extension order by 1;"

          echo '--- laplace tables: estimates and bytes ---'
          "$psql" "${args[@]}" -c "select schemaname,relname,n_live_tup,pg_total_relation_size(format('%I.%I',schemaname,relname)::regclass) from pg_stat_user_tables where schemaname='laplace' order by pg_total_relation_size(format('%I.%I',schemaname,relname)::regclass) desc,relname;"

          echo '--- laplace materialized/views ---'
          "$psql" "${args[@]}" -c "select n.nspname,c.relname,c.relkind from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='laplace' and c.relkind in ('v','m') order by c.relkind,c.relname;"

          echo '--- laplace callable surfaces ---'
          "$psql" "${args[@]}" -c "select p.proname,pg_get_function_identity_arguments(p.oid),pg_get_function_result(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='laplace' order by p.proname,2;"

          echo '--- exact counts for core tables that actually exist ---'
          for rel in entities entity physicalities physicality attestations attestation relations relation compositions composition_occurrences calculation_receipts execution_receipts perfcache_generations; do
            fq="laplace.$rel"
            present=$("$psql" "${args[@]}" -c "select to_regclass('$fq') is not null;")
            if test "$present" = t; then
              count=$("$psql" "${args[@]}" -c "select count(*) from $fq;")
              echo "$fq=$count"
            fi
          done

          echo '--- active SQL activity involving laplace roles ---'
          "$psql" "${args[@]}" -c "select usename,datname,state,wait_event_type,wait_event,left(query,120) from pg_stat_activity where datname='laplace' order by pid;"

          echo '--- API service identity ---'
          systemctl show laplace-api.service -p ActiveState -p SubState -p FragmentPath -p ExecStart --no-pager || true
          echo '--- listening application ports ---'
          ss -ltnp 2>/dev/null | grep -E 'LISTEN|laplace' || true
