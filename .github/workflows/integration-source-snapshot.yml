name: integration-source-snapshot
on:
  push:
    branches: ['delivery/prompt-conversation-composition-20260906']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked repository history only
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/laplace-refactor.bundle" --all
          git bundle verify "$RUNNER_TEMP/laplace-refactor.bundle"
          sha256sum "$RUNNER_TEMP/laplace-refactor.bundle" > "$RUNNER_TEMP/laplace-refactor.bundle.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/laplace-refactor.bundle
            ${{ runner.temp }}/laplace-refactor.bundle.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
