name: pr85-ci-recovery

on:
  push:
    branches:
      - fix/pr85-current-ci

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/pr85-current-ci
          fetch-depth: 0
      - name: Apply exact CI evidence corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Byte-governed batching deliberately changed spool partitioning. The
          # canonical stream stayed stable; only the batch-bound build/spool
          # receipts and batch count changed on the exact custom-stack run.
          replace(
              'tests/unicode_root_builder_tests.cpp',
              'Digest("a390dd47fce00fab8fa836fc4b8f0474212d714bc6654d42bf8e28ec3fd036e3")',
              'Digest("d075bc1fc1c977a55ed49b6dc314a9adbcc653d4902b22c08f7c3951f134f462")')
          replace(
              'tests/unicode_root_builder_tests.cpp',
              'Digest("2b8bcaf463a118c6979983767c6efb08f8c6c468f99f695b76c450eeccc1b4d6")',
              'Digest("b31ba287b04ef1eb61d9987cae5832dd0ac34950642ee73b42eb4bddd8949f6b")')
          replace(
              'tests/unicode_root_builder_tests.cpp',
              'EXPECT_EQ(build.spool.batch_count, UINT64_C(546));',
              'EXPECT_EQ(build.spool.batch_count, UINT64_C(178));')

          # Composition persistence now uses canonical Entity / Physicality /
          # Attestation families. The measurement client was still truncating
          # and counting retired private occurrence/trajectory tables.
          replace(
              'tests/postgres/composition_measurement_client.cpp',
              '"TRUNCATE laplace.canonical_deposit_receipt,"\n                "laplace.observed_occurrence,"\n                "laplace.composition_trajectory_vertex,"\n                "laplace.physicality,laplace.entity CASCADE"',
              '"TRUNCATE laplace.canonical_deposit_receipt,"\n                "laplace.attestation,"\n                "laplace.physicality,laplace.entity CASCADE"')
          replace(
              'tests/postgres/composition_measurement_client.cpp',
              '"(SELECT count(*) FROM laplace.physicality) + "\n                "(SELECT count(*) FROM laplace.composition_trajectory_vertex) + "\n                "(SELECT count(*) FROM laplace.observed_occurrence) + "\n                "(SELECT count(*) FROM laplace.canonical_deposit_receipt)"',
              '"(SELECT count(*) FROM laplace.physicality) + "\n                "(SELECT count(*) FROM laplace.attestation "\n                " WHERE attestation_kind = 1) + "\n                "(SELECT count(*) FROM laplace.canonical_deposit_receipt)"')
          replace(
              'tests/composition_performance_receipt_tests.py',
              'sample["durable_outputs"] == EXPECTED["stream_records"] + 1,',
              'sample["durable_outputs"] == (\n                EXPECTED["entities"] + EXPECTED["physicalities"]\n                + EXPECTED["occurrences"] + 1\n            ),')
          replace(
              'tests/composition_performance_receipt_tests.py',
              'f"sample {ordinal} durable readback denominator changed")',
              'f"sample {ordinal} canonical durable readback denominator changed")')

          # The blind-presence mutant is now rejected earlier by the canonical
          # persistence producer/preflight parity gate. That is the intended
          # defect being caught, not an unrelated failure.
          replace(
              'tests/CMakeLists.txt',
              '"blind composition-presence mutant published without observing canonical state")',
              '"Laplace persistence producer execution diverged from preflight")')

          # This workflow is a one-shot transport for the corrections, not part
          # of the product or CI authority.
          Path('.github/workflows/pr85-ci-recovery.yml').unlink()
          PY
          git diff --check
      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct canonical persistence CI expectations"
          git push origin HEAD:fix/pr85-current-ci
