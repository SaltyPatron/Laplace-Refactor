name: live-product-execution

on:
  push:
    branches:
      - delivery/laplace-live-product-20260911
    paths:
      - '.github/workflows/live-product-execution.yml'
      - 'contracts/sources/**'
      - 'tools/live_product/**'
      - 'tools/source_recipe/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-product-execution
  cancel-in-progress: false

jobs:
  inspect-live-estate:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify exact OEWN 2025+ artifact and inspect WN-LMF structure
        shell: bash
        run: |
          set -euo pipefail
          root=/vault/Data/.refresh-20260903/OpenEnglishWordNet-2025-plus
          artifact="$root/english-wordnet-2025-plus.xml.gz"
          test -d "$root"
          test -f "$artifact"
          test ! -L "$artifact"
          expected=31f4af16c54b532fd5484d4cc33aee588a31bb5b70683ae8197842fde5b586bc
          actual=$(sha256sum "$artifact" | awk '{print $1}')
          test "$actual" = "$expected"

          python3 - "$artifact" "$RUNNER_TEMP/oewn-structure.json" <<'PY'
          import gzip
          import json
          import sys
          import xml.etree.ElementTree as ET
          from collections import Counter, defaultdict

          artifact, output = sys.argv[1:]
          tags = Counter()
          attrs = defaultdict(Counter)
          examples = defaultdict(list)
          root_tag = None
          namespace = None
          with gzip.open(artifact, 'rb') as stream:
              for event, element in ET.iterparse(stream, events=('start', 'end')):
                  if event == 'start':
                      if root_tag is None:
                          root_tag = element.tag
                          if element.tag.startswith('{'):
                              namespace = element.tag[1:].split('}', 1)[0]
                      local = element.tag.rsplit('}', 1)[-1]
                      tags[local] += 1
                      for key in element.attrib:
                          attrs[local][key.rsplit('}', 1)[-1]] += 1
                      if len(examples[local]) < 3:
                          sample = {k.rsplit('}', 1)[-1]: v for k, v in element.attrib.items()}
                          if sample:
                              examples[local].append(sample)
                  else:
                      element.clear()
          document = {
              'schema': 'laplace.live-source-structure/v1',
              'source': 'oewn-2025-plus',
              'artifact': artifact,
              'root_tag': root_tag,
              'namespace': namespace,
              'element_counts': dict(sorted(tags.items())),
              'attribute_counts': {k: dict(sorted(v.items())) for k, v in sorted(attrs.items())},
              'attribute_examples': dict(sorted(examples.items())),
          }
          with open(output, 'w', encoding='utf-8') as handle:
              json.dump(document, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY

          jq -e '
            .schema == "laplace.live-source-structure/v1" and
            .source == "oewn-2025-plus" and
            (.element_counts.Lexicon // 0) > 0 and
            (.element_counts.LexicalEntry // 0) > 0 and
            (.element_counts.Synset // 0) > 0 and
            (.element_counts.Sense // 0) > 0
          ' "$RUNNER_TEMP/oewn-structure.json" >/dev/null
          echo "OEWN_SHA256=$actual"
          jq '{root_tag,namespace,element_counts,attribute_counts}' "$RUNNER_TEMP/oewn-structure.json"

          {
            echo '## Live OEWN 2025+ source'
            echo "SHA-256: $actual"
            echo '```json'
            cat "$RUNNER_TEMP/oewn-structure.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect persistent Laplace release runtime and receipt estate without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          echo '=== /opt/laplace ==='
          if [[ -d /opt/laplace ]]; then
            find /opt/laplace -maxdepth 2 -mindepth 1 -printf '%y %u:%g %m %p -> %l\n' 2>&1 | sort | head -n 500
          else
            echo '/opt/laplace is absent'
          fi

          echo '=== release directories ==='
          if [[ -d /opt/laplace/releases ]]; then
            find /opt/laplace/releases -maxdepth 1 -mindepth 1 -type d -printf '%T@ %f\n' \
              | sort -nr | head -n 20
          fi

          echo '=== deployment receipts ==='
          if [[ -d /opt/laplace/receipts/deployments ]]; then
            find /opt/laplace/receipts/deployments -maxdepth 2 -type f -printf '%T@ %p\n' 2>&1 \
              | sort -nr | head -n 50
          fi

          echo '=== package receipts ==='
          if [[ -d /opt/laplace/receipts/packages ]]; then
            find /opt/laplace/receipts/packages -maxdepth 2 -type f -printf '%T@ %p\n' 2>&1 \
              | sort -nr | head -n 50
          fi

          echo '=== PostgreSQL activation receipts ==='
          if [[ -d /opt/laplace/receipts/postgresql/refactor/cluster-activation ]]; then
            find /opt/laplace/receipts/postgresql/refactor/cluster-activation -maxdepth 2 -type f \
              -printf '%T@ %p\n' 2>&1 | sort -nr | head -n 100
          fi

          active=''
          if [[ -L /opt/laplace/current ]]; then
            active=$(readlink -f /opt/laplace/current || true)
          fi
          if [[ -z "$active" || ! -d "$active" ]]; then
            active=$(find /opt/laplace/releases -maxdepth 1 -mindepth 1 -type d -printf '%T@ %p\n' 2>/dev/null \
              | sort -nr | head -n 1 | cut -d' ' -f2- || true)
          fi
          if [[ -n "$active" && -d "$active" ]]; then
            echo "selected_release=$active"
            for tool in \
              laplace-cognition \
              laplace-cognition-service \
              laplace-inspect \
              laplace-admit-source \
              laplace-model-export \
              laplace-live-substrate; do
              if [[ -x "$active/bin/$tool" ]]; then
                printf '%s=present\n' "$tool"
              else
                printf '%s=absent\n' "$tool"
              fi
            done
          else
            echo 'selected_release=absent'
          fi
