name: clean-room-ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  requirements:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify requirement graph
        run: ./tools/tests/verify-requirements.sh
      - name: Verify source-estate discovery catalog
        run: python3 tests/source_discovery_catalog_tests.py
      - name: Execute requirement verifier mutation checks
        run: python3 tests/requirements_trace_tests.py
      - name: Prove selective custom-stack QA planning and fail-fast semantics
        run: python3 tests/custom_stack_qa_tests.py
      - name: Verify source-estate profile resolution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/source_estate_catalog_tests.py
          python3 tools/sources/catalog-source-estate.py \
            --output "$RUNNER_TEMP/laplace-source-estate-catalog.json"
      - name: Prove activation provider contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/product_activation_runtime_adapter_tests.py
          python3 tests/product_activation_runner_tests.py
      - name: Prove durable product service and cold-boot contracts
        run: python3 tests/product_service_state_tests.py
      - name: Prove hosted compiler-cache contract
        run: python3 tests/hosted_ci_cache_contract_tests.py

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-dev
          - linux-sanitize
    env:
      CCACHE_DIR: ${{ runner.temp }}/laplace-ccache/${{ matrix.preset }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 512M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ccache jq ninja-build
      - name: Restore compiler object cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/laplace-ccache/${{ matrix.preset }}
          key: laplace-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            laplace-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-
      - name: Configure compiler object cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compiler_check="$CCACHE_COMPILERCHECK"
          ccache --set-config=base_dir="$CCACHE_BASEDIR"
          ccache --set-config=hash_dir=false
          ccache --zero-stats
          ccache --show-config
      - name: Acquire pinned build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dependency_root="$RUNNER_TEMP/laplace-dependencies"
          ./tools/dependencies/acquire-locked-git.sh \
            dependencies/lock.json "$dependency_root" \
            blake3 eigen googletest spectra tree-sitter
          printf 'LAPLACE_DEPENDENCY_ROOT=%s\n' "$dependency_root" >> "$GITHUB_ENV"
      - name: Acquire locked source-profile fixtures
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/laplace-sources/iso-639-3-20260415"
          python3 tools/sources/acquire-tabular-source.py \
            --profile contracts/sources/iso-639-3-20260415.json \
            --destination "$source_root"
          printf 'LAPLACE_ISO_639_SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"
          cili_root="$RUNNER_TEMP/laplace-sources/cili-pwn-mappings-20240611"
          python3 tools/sources/acquire-tabular-source.py \
            --profile contracts/sources/cili-pwn-mappings-20240611.json \
            --destination "$cili_root"
          printf 'LAPLACE_CILI_SOURCE_ROOT=%s\n' "$cili_root" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          build_directory="$RUNNER_TEMP/laplace-output/build/${{ matrix.preset }}"
          cmake --preset "${{ matrix.preset }}" -B "$build_directory" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLAPLACE_BLAKE3_SOURCE="$LAPLACE_DEPENDENCY_ROOT/blake3/c" \
            -DLAPLACE_GTEST_SOURCE="$LAPLACE_DEPENDENCY_ROOT/googletest" \
            -DLAPLACE_EIGEN_SOURCE="$LAPLACE_DEPENDENCY_ROOT/eigen" \
            -DLAPLACE_SPECTRA_SOURCE="$LAPLACE_DEPENDENCY_ROOT/spectra" \
            -DLAPLACE_TREE_SITTER_SOURCE="$LAPLACE_DEPENDENCY_ROOT/tree-sitter" \
            -DLAPLACE_ISO_639_SOURCE_ROOT="$LAPLACE_ISO_639_SOURCE_ROOT" \
            -DLAPLACE_CILI_SOURCE_ROOT="$LAPLACE_CILI_SOURCE_ROOT"
          printf 'LAPLACE_CI_BUILD_DIRECTORY=%s\n' "$build_directory" >> "$GITHUB_ENV"
      - name: Build
        run: cmake --build "$LAPLACE_CI_BUILD_DIRECTORY" --parallel 2
      - name: Report compiler object cache
        if: always()
        run: ccache --show-stats --verbose
      - name: Execute implementation tests
        run: ctest --test-dir "$LAPLACE_CI_BUILD_DIRECTORY" --output-on-failure
      - name: Verify test registry
        run: ./tools/tests/verify-registry.sh "$LAPLACE_CI_BUILD_DIRECTORY"