name: clean-room-ci

on:
  workflow_call:
    inputs:
      run_native:
        description: Execute native builds and tests; false requires current-source audit-only proof
        type: boolean
        required: false
        default: true
      audit_base_sha:
        type: string
        required: false
        default: ''
      audit_head_sha:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  requirements:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify requirement graph
        run: ./tools/tests/verify-requirements.sh
      - name: Verify source-estate discovery catalog
        run: python3 tests/source_discovery_catalog_tests.py
      - name: Execute requirement verifier mutation checks
        run: python3 tests/requirements_trace_tests.py
      - name: Prove selective custom-stack QA planning and fail-fast semantics
        run: python3 tests/custom_stack_qa_tests.py
      - name: Verify source-estate profile resolution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/source_estate_catalog_tests.py
          python3 tools/sources/catalog-source-estate.py \
            --output "$RUNNER_TEMP/laplace-source-estate-catalog.json"
      - name: Prove activation provider contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/product_activation_gateway_tests.py
          python3 tests/product_activation_runtime_adapter_tests.py
          python3 tests/product_activation_runner_tests.py
      - name: Prove receipt and build estate lifecycle
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup-host.sh
          bash -n scripts/setup-chess.sh
          python3 tests/chess_dependency_tests.py
          python3 tests/chess_benchmark_tests.py
          python3 tests/chess_host_evidence_tests.py
          python3 tests/receipt_estate_tests.py
          python3 tests/receipt_estate_runner_tests.py
          python3 tests/product_build_workspace_retention_tests.py
      - name: Prove durable product service and cold-boot contracts
        run: python3 tests/product_service_state_tests.py
      - name: Prove hosted compiler-cache contract
        run: python3 tests/hosted_ci_cache_contract_tests.py

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-dev
          - linux-sanitize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Keep both protected matrix contexts instantiated. This step verifies the
      # current commit delta; it does not claim that native tests executed.
      - name: Verify current-source audit-only classification
        if: ${{ !inputs.run_native }}
        shell: bash
        env:
          AUDIT_BASE_SHA: ${{ inputs.audit_base_sha }}
          AUDIT_HEAD_SHA: ${{ inputs.audit_head_sha }}
          EVENT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$AUDIT_HEAD_SHA" = "$EVENT_HEAD_SHA"
          python3 tools/delivery/product_path.py verify-audit-only \
            --base "$AUDIT_BASE_SHA" --head "$AUDIT_HEAD_SHA" \
            --expected-checkout "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/laplace-audit-only-${{ matrix.preset }}.json"
          {
            echo '## Native execution not requested'
            echo 'This matrix context verified the current-source audit-only classification.'
            echo 'Native builds and tests did not execute.'
            cat "$RUNNER_TEMP/laplace-audit-only-${{ matrix.preset }}.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install build tools
        if: inputs.run_native
        run: sudo apt-get update && sudo apt-get install --yes ccache jq ninja-build
      - name: Restore compiler object cache
        if: inputs.run_native
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/laplace-ccache/${{ matrix.preset }}
          key: laplace-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            laplace-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-
      - name: Configure compiler object cache
        if: inputs.run_native
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/laplace-ccache/${{ matrix.preset }}"
          mkdir -p "$cache_dir"
          export CCACHE_DIR="$cache_dir"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_MAXSIZE=512M
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compiler_check="$CCACHE_COMPILERCHECK"
          ccache --set-config=base_dir="$CCACHE_BASEDIR"
          ccache --set-config=hash_dir=false
          ccache --zero-stats
          ccache --show-config
          printf 'CCACHE_DIR=%s\n' "$CCACHE_DIR" >> "$GITHUB_ENV"
          printf 'CCACHE_BASEDIR=%s\n' "$CCACHE_BASEDIR" >> "$GITHUB_ENV"
          printf 'CCACHE_COMPILERCHECK=%s\n' "$CCACHE_COMPILERCHECK" >> "$GITHUB_ENV"
          printf 'CCACHE_MAXSIZE=%s\n' "$CCACHE_MAXSIZE" >> "$GITHUB_ENV"
      - name: Acquire pinned build dependencies
        if: inputs.run_native
        shell: bash
        run: |
          set -euo pipefail
          dependency_root="$RUNNER_TEMP/laplace-dependencies"
          ./tools/dependencies/acquire-locked-git.sh \
            dependencies/lock.json "$dependency_root" \
            blake3 eigen googletest spectra tree-sitter
          printf 'LAPLACE_DEPENDENCY_ROOT=%s\n' "$dependency_root" >> "$GITHUB_ENV"
      - name: Acquire locked source-profile fixtures
        if: inputs.run_native
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/laplace-sources/iso-639-3-20260415"
          python3 tools/sources/acquire-tabular-source.py \
            --profile contracts/sources/iso-639-3-20260415.json \
            --destination "$source_root"
          printf 'LAPLACE_ISO_639_SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"
          cili_root="$RUNNER_TEMP/laplace-sources/cili-pwn-mappings-20240611"
          python3 tools/sources/acquire-tabular-source.py \
            --profile contracts/sources/cili-pwn-mappings-20240611.json \
            --destination "$cili_root"
          printf 'LAPLACE_CILI_SOURCE_ROOT=%s\n' "$cili_root" >> "$GITHUB_ENV"
      - name: Build and verify the locked C++ syntax provider
        if: inputs.run_native
        shell: bash
        run: |
          set -euo pipefail
          provider_root="$RUNNER_TEMP/laplace-output/cpp-grammar"
          printf 'LAPLACE_CPP_GRAMMAR_RECEIPT=%s\n' "$provider_root/build-receipt.json" >> "$GITHUB_ENV"
          python3 tools/sources/qualify_grammar.py --acquire \
            --grammar-root "$RUNNER_TEMP/laplace-sources/tree-sitter-cpp" \
            --runtime-root "$LAPLACE_DEPENDENCY_ROOT/tree-sitter" \
            --grammar-lock dependencies/tree-sitter-grammars.lock.json \
            --dependency-lock dependencies/lock.json \
            --grammar tree-sitter-cpp --output "$provider_root"
          test -s "$provider_root/build-receipt.json"
      - name: Build and verify the locked PGN syntax provider
        if: inputs.run_native
        shell: bash
        run: |
          set -euo pipefail
          provider_root="$RUNNER_TEMP/laplace-output/pgn-grammar"
          printf 'LAPLACE_PGN_GRAMMAR_RECEIPT=%s\n' "$provider_root/build-receipt.json" >> "$GITHUB_ENV"
          python3 tools/sources/qualify_grammar.py --acquire \
            --grammar-root "$RUNNER_TEMP/laplace-sources/tree-sitter-pgn" \
            --runtime-root "$LAPLACE_DEPENDENCY_ROOT/tree-sitter" \
            --grammar-lock dependencies/tree-sitter-grammars.lock.json \
            --dependency-lock dependencies/lock.json \
            --grammar tree-sitter-pgn --output "$provider_root"
          test -s "$provider_root/build-receipt.json"
      - name: Configure
        if: inputs.run_native
        shell: bash
        run: |
          set -euo pipefail
          build_directory="$RUNNER_TEMP/laplace-output/build/${{ matrix.preset }}"
          cmake --preset "${{ matrix.preset }}" -B "$build_directory" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLAPLACE_BLAKE3_SOURCE="$LAPLACE_DEPENDENCY_ROOT/blake3/c" \
            -DLAPLACE_GTEST_SOURCE="$LAPLACE_DEPENDENCY_ROOT/googletest" \
            -DLAPLACE_EIGEN_SOURCE="$LAPLACE_DEPENDENCY_ROOT/eigen" \
            -DLAPLACE_SPECTRA_SOURCE="$LAPLACE_DEPENDENCY_ROOT/spectra" \
            -DLAPLACE_TREE_SITTER_SOURCE="$LAPLACE_DEPENDENCY_ROOT/tree-sitter" \
            -DLAPLACE_CPP_GRAMMAR_RECEIPT="$LAPLACE_CPP_GRAMMAR_RECEIPT" \
            -DLAPLACE_PGN_GRAMMAR_RECEIPT="$LAPLACE_PGN_GRAMMAR_RECEIPT" \
            -DLAPLACE_ISO_639_SOURCE_ROOT="$LAPLACE_ISO_639_SOURCE_ROOT" \
            -DLAPLACE_CILI_SOURCE_ROOT="$LAPLACE_CILI_SOURCE_ROOT"
          printf 'LAPLACE_CI_BUILD_DIRECTORY=%s\n' "$build_directory" >> "$GITHUB_ENV"
      - name: Build
        if: inputs.run_native
        run: cmake --build "$LAPLACE_CI_BUILD_DIRECTORY" --parallel 2
      - name: Report compiler object cache
        if: always() && inputs.run_native
        run: ccache --show-stats --verbose
      - name: Execute implementation tests
        if: inputs.run_native
        run: ctest --test-dir "$LAPLACE_CI_BUILD_DIRECTORY" --output-on-failure
      - name: Verify test registry
        if: inputs.run_native
        run: ./tools/tests/verify-registry.sh "$LAPLACE_CI_BUILD_DIRECTORY"
      - name: Retain exact C++ provider build evidence
        if: always() && inputs.run_native
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpp-provider-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/laplace-output/cpp-grammar/build-receipt.json
            ${{ runner.temp }}/laplace-output/cpp-grammar/build.stdout.log
            ${{ runner.temp }}/laplace-output/cpp-grammar/build.stderr.log
            ${{ runner.temp }}/laplace-output/cpp-grammar/provider.so
          if-no-files-found: warn
          retention-days: 30
      - name: Retain exact PGN provider and native conformance evidence
        if: always() && inputs.run_native
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pgn-provider-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/laplace-output/pgn-grammar/build-receipt.json
            ${{ runner.temp }}/laplace-output/pgn-grammar/build.stdout.log
            ${{ runner.temp }}/laplace-output/pgn-grammar/build.stderr.log
            ${{ runner.temp }}/laplace-output/pgn-grammar/provider.so
            ${{ runner.temp }}/laplace-output/build/${{ matrix.preset }}/tests/pgn-native-source-qualification.json
          if-no-files-found: warn
          retention-days: 30
