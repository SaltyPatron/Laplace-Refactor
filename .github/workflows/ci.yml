name: clean-room-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: clean-room-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify requirement graph
        run: ./tools/tests/verify-requirements.sh
      - name: Execute requirement verifier mutation checks
        run: python3 tests/requirements_trace_tests.py

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-dev
          - linux-sanitize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes jq ninja-build
      - name: Acquire pinned build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dependency_root="$RUNNER_TEMP/laplace-dependencies"
          mkdir -p "$dependency_root"
          for dependency in blake3 googletest; do
            upstream=$(jq -r --arg dependency "$dependency" '.dependencies[$dependency].upstream' dependencies/lock.json)
            revision=$(jq -r --arg dependency "$dependency" '.dependencies[$dependency].revision' dependencies/lock.json)
            source="$dependency_root/$dependency"
            git init --quiet "$source"
            git -C "$source" remote add origin "$upstream"
            git -C "$source" fetch --quiet --depth=1 origin "$revision"
            git -C "$source" checkout --quiet --detach FETCH_HEAD
          done
          printf 'LAPLACE_DEPENDENCY_ROOT=%s\n' "$dependency_root" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake --preset "${{ matrix.preset }}"
          -DLAPLACE_BLAKE3_SOURCE="$LAPLACE_DEPENDENCY_ROOT/blake3/c"
          -DLAPLACE_GTEST_SOURCE="$LAPLACE_DEPENDENCY_ROOT/googletest"
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2
      - name: Execute implementation tests
        run: ctest --preset "${{ matrix.preset }}"
      - name: Verify test registry
        run: ./tools/tests/verify-registry.sh "out/build/${{ matrix.preset }}"
