name: merge-persistence-into-cognition

on:
  push:
    branches:
      - feat/cognition-solver

permissions:
  contents: write

jobs:
  merge:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Merge persistence performance repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/pr85-current-ci
          git merge --no-ff --no-edit origin/fix/pr85-current-ci
          git rm .github/workflows/merge-persistence-into-cognition.yml
          git commit --amend --no-edit
          git push origin HEAD:feat/cognition-solver
