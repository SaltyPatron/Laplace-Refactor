name: unicode-activation-repair
on:
  push:
    branches: ['fix/unicode-activation-contract']
permissions:
  contents: read
concurrency:
  group: product-activation-refs/heads/main
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Execute installed Unicode operation without committing diagnostic state
        run: python3 tools/postgresql/diagnose_unicode_activation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unicode-native-diagnosis-${{ github.sha }}
          path: ${{ runner.temp }}/unicode-native-diagnosis/
          retention-days: 7
          if-no-files-found: error
