name: unicode-activation-repair
on:
  push:
    branches: ['fix/unicode-activation-contract']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retain exact source for deployment repair
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unicode-repair"
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/unicode-repair/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/unicode-repair/identity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unicode-repair-source-${{ github.sha }}
          path: ${{ runner.temp }}/unicode-repair/
          retention-days: 7
