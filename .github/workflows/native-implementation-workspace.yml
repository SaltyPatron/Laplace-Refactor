name: native-implementation-publish

on:
  push:
    branches: [implement/native-prompt-execution]
    paths: [.github/workflows/native-implementation-workspace.yml]

permissions:
  contents: write

concurrency:
  group: native-implementation-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply exact tested native implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import lzma
          import pathlib
          payload = (
          ""
          ""
          )
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          expected = 'da1569079358a1db66409a3d07339108d936bcf5efdc3277567b54c28dd4b69f'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Implementation patch checksum mismatch')
          pathlib.Path('/tmp/laplace-native-implementation.patch').write_bytes(patch)
          PY
          git diff --quiet
          git diff --cached --quiet
          git apply --check --index /tmp/laplace-native-implementation.patch
          git apply --index /tmp/laplace-native-implementation.patch
          git rm -- .github/workflows/native-implementation-workspace.yml
          test "$(git write-tree)" = aa1adead71724a6659a0d9f2f883bb0c59c47a94
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Implement retained native prompt structure and canonical run coalescing'
          git push origin HEAD:refs/heads/implement/native-prompt-execution
