name: unicode-epoch-live-proof
on:
  push:
    branches: ['fix/unicode-activation-contract']
permissions:
  contents: read
concurrency:
  group: product-activation-refs/heads/main
  cancel-in-progress: false
jobs:
  verify-real-artifacts:
    runs-on: [self-hosted, Linux, X64, laplace-refactor, oneapi, postgres-18, avx2]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compose exact candidate package without installing or activating it
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test "$GITHUB_REPOSITORY" = SaltyPatron/Laplace-Refactor
          test "$GITHUB_REF" = refs/heads/fix/unicode-activation-contract
          git diff --quiet
          git diff --cached --quiet
          publication=$(jq -er '.product_activation_projection.postgresql_publication.receipt' state/continuation.json)
          expected=$(jq -er '.product_activation_projection.postgresql_publication.receipt_sha256' state/continuation.json)
          test ! -L "$publication"
          test "$(sha256sum "$publication" | awk '{print $1}')" = "$expected"
          python3 tools/delivery/postgresql_package_publication.py verify --receipt "$publication" >/dev/null
          mkdir -p "$RUNNER_TEMP/unicode-epoch-proof"
          python3 tools/product/build-package.py compose --postgresql-publication "$publication" --output "$RUNNER_TEMP/unicode-epoch-proof/selection.json"
      - name: Execute the package-owned native verifier against actual deployment-epoch files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, runpy
          from pathlib import Path
          r=runpy.run_path('tools/delivery/product_activation_runner.py')
          c=r['clusterctl']; u=r['unicodectl']
          contract=c.load_json(Path('contracts/postgresql-cluster.json'))
          activation=u.load_json(Path('contracts/unicode-product-activation.json'))
          root=Path(os.environ['RUNNER_TEMP'])/'unicode-epoch-proof'
          selection=c.load_json(root/'selection.json')
          package=c.load_json(Path(selection['product_receipt']))
          manifest=c.load_json(Path(package['manifest']))
          executable=Path(package['physical_root'])/activation['artifact_reference']['package_path']
          entry=next(item for item in manifest['files'] if item['path']==activation['artifact_reference']['package_path'])
          if entry['sha256'] != c.sha256_file(executable):
              raise RuntimeError('Candidate verifier does not match packaged bytes')
          active=Path(contract['package']['active_link'])
          before=os.readlink(active)
          expected='releases/cd6290e2bdbea789a211c2965f0e17001d39a4f61ab7e5404359513a6409eef4'
          if before != expected:
              raise RuntimeError('Selected installed generation changed; do not reuse this diagnostic selection')
          directory=Path(contract['instance']['receipt_directory'])/'cluster-activation'/expected.split('/')[1]
          receipt=c.load_json(directory/'activation-result.json')
          plan=c.load_json(Path(receipt['cluster_plan_path']))
          loaded=c.observe_loaded_live(plan,contract,Path('/'))
          c.verify_loaded(plan,contract,loaded)
          cache=Path(contract['instance']['perfcache_directory'])
          generation=cache/'unicode-contract-check-d9fb4835837e4f3993df9dbefc83d12e'
          ids={'activation_epoch_id':'4100d9b22e460063af972b7842046f82','activation_epoch_fingerprint':'4ef35930445a8f0072cf7fdb58e3db7c779821f8dea23cf26db92dde60f32f27'}
          verified, command=u.run_artifact_verifier(executable,cache,generation/'unicode-tier0.lpc',generation/'unicode-identity-reverse.lpc',Path('/vault/Data/UCD/Public/UCD/latest'),activation,ids)
          u.validate_artifact_verification(verified,activation,ids)
          assert verified['tier0_artifact_digest']=='92857924b18d6fcf60beae5f210a490ef5841312b73710feac7efd3563be3e8c'
          assert verified['reverse_artifact_digest']=='129fe7cd30803a56c564c8807addb40ec972b15885b16ab4ecc8708dc1c709b6'
          inspection,_=r['runner_sql'](plan,contract,u.render_inspection_sql(),'verify-unchanged-installed-state',contract['instance']['os_user'],contract['instance']['admin_role'],120)
          assert inspection['sequence']==0 and inspection['active_present'] is False
          assert os.readlink(active)==before
          after=c.observe_loaded_live(plan,contract,Path('/'))
          c.verify_loaded(plan,contract,after)
          assert loaded['system_identifier']==after['system_identifier'] and loaded['postmaster_pid']==after['postmaster_pid']
          result={'schema':'laplace.unicode-epoch-live-proof/v1','candidate_package_id':package['package_id'],'verifier_sha256':entry['sha256'],'verification':verified,'command_receipt':command,'installed_state_unchanged':True,'system_identifier':after['system_identifier'],'postmaster_pid':after['postmaster_pid'],'inspection':inspection}
          (root/'proof.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unicode-epoch-live-proof-${{ github.sha }}
          path: ${{ runner.temp }}/unicode-epoch-proof/
          retention-days: 7
          if-no-files-found: error
