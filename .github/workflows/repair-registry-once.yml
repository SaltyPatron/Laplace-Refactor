name: repair-registry-once

on:
  push:
    branches:
      - codex/complete-laplace-20260831

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/complete-laplace-20260831
          fetch-depth: 1
      - name: Register exact missing CTest and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/registry.json')
          text = path.read_text(encoding='utf-8')
          name = 'postgres.source-resource-guard-contract'
          if f'"ctest_name": "{name}"' not in text:
              marker = '      "ctest_name": "delivery.runner-orphan-cleanup-contract",'
              start = text.index(marker)
              next_entry = text.index('\n    {', start + len(marker))
              entry = '''\n    {
                "ctest_name": "postgres.source-resource-guard-contract",
                "evidence_targets": ["LP-TEST-TOPOLOGY-RESOURCE-PLAN"],
                "covered_dimensions": ["baseline-relative PostgreSQL data WAL and workspace growth ceilings", "absolute process-tree RSS and wall-time ceilings", "bounded source-admission resource authority"],
                "defect_controls": ["preexisting database bytes charged as new growth", "WAL ceiling breach", "wall-time ceiling breach", "source-admission guard omission"]
              },'''
              # Match the registry's two-space JSON nesting without reformatting the file.
              entry = '\n'.join(line[10:] if line.startswith('          ') else line for line in entry.splitlines())
              text = text[:next_entry] + entry + text[next_entry:]
              path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/repair-registry-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/registry.json
          git diff --cached --check
          git commit -m 'Register PostgreSQL source resource guard contract'
          git push origin HEAD:codex/complete-laplace-20260831
