name: pr94-source-scaling-repair

on:
  push:
    branches:
      - integration/whole-product-current-main

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - oneapi
      - postgres-18
      - dotnet-10
      - avx2
    timeout-minutes: 120
    env:
      PATH: /opt/laplace/pgsql-18/bin:/usr/local/bin:/usr/bin:/bin
      LAPLACE_PG_CONFIG: /opt/laplace/pgsql-18/bin/pg_config
      LAPLACE_SOURCE_ESTATE_ROOT: /vault/Data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integration/whole-product-current-main
          fetch-depth: 0

      - name: Apply bounded source composition scheduler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('postgres/extension/src/source_admission_pg_legacy.inc')
          text = path.read_text()
          anchor = 'Datum LAPLACE_PG_SOURCE_ADMIT_TABULAR_SYMBOL(PG_FUNCTION_ARGS) {'
          if text.count(anchor) != 1:
              raise SystemExit('source admission entry anchor drifted')
          if 'laplace_pg_execute_source_composition_bounded' in text:
              raise SystemExit('bounded scheduler already present')

          helper = r'''
/*
 * A recursive source plan is a DAG of independent artifact/decomposition
 * subgraphs joined only by their higher roots.  Do not force the complete
 * source through one composition working set: doing so makes the memory grant
 * scale with the entire corpus even though canonical persistence is already
 * transactional and each child root is content-addressed.
 *
 * Execute each complete subgraph under the same outer PostgreSQL transaction,
 * carry only its root/result identities into later segments, and retain the
 * original request-index result vector for reference/evidence closure.  A
 * failure in any segment aborts the outer transaction, so no partial source is
 * externally visible.  Source ordinals and all content/physicality identities
 * are unchanged.
 */
static laplace_composition_known_entity
laplace_pg_source_result_as_known(const laplace_composition_result* result) {
    laplace_composition_known_entity known;
    memset(&known, 0, sizeof(known));
    known.entity_id = result->entity_id;
    known.identity_witness = result->identity_witness;
    known.physicality_id = result->physicality_id;
    known.centroid = result->centroid;
    known.tier_floor = result->tier_floor;
    return known;
}

static void laplace_pg_source_summary_accumulate(
    laplace_composition_working_set_summary* total,
    const laplace_composition_working_set_summary* part) {
#define LAPLACE_SOURCE_ADD_SUMMARY(field)                                      \
    do {                                                                        \
        if (UINT64_MAX - total->field < part->field) {                         \
            ereport(ERROR,                                                      \
                    (errcode(ERRCODE_PROGRAM_LIMIT_EXCEEDED),                  \
                     errmsg("Laplace source composition summary overflow")));  \
        }                                                                       \
        total->field += part->field;                                            \
    } while (0)
    LAPLACE_SOURCE_ADD_SUMMARY(unique_entity_count);
    LAPLACE_SOURCE_ADD_SUMMARY(unique_physicality_count);
    LAPLACE_SOURCE_ADD_SUMMARY(novel_entity_count);
    LAPLACE_SOURCE_ADD_SUMMARY(novel_physicality_count);
    LAPLACE_SOURCE_ADD_SUMMARY(novel_trajectory_vertex_count);
    LAPLACE_SOURCE_ADD_SUMMARY(trajectory_vertex_count);
    LAPLACE_SOURCE_ADD_SUMMARY(occurrence_count);
    LAPLACE_SOURCE_ADD_SUMMARY(logical_occurrence_count);
    LAPLACE_SOURCE_ADD_SUMMARY(collapsed_request_count);
    LAPLACE_SOURCE_ADD_SUMMARY(deduplicated_entity_count);
    LAPLACE_SOURCE_ADD_SUMMARY(batch_count);
    LAPLACE_SOURCE_ADD_SUMMARY(stream_record_count);
    LAPLACE_SOURCE_ADD_SUMMARY(stream_byte_count);
#undef LAPLACE_SOURCE_ADD_SUMMARY
    if (part->estimated_peak_working_bytes > total->estimated_peak_working_bytes) {
        total->estimated_peak_working_bytes = part->estimated_peak_working_bytes;
    }
    if (part->maximum_tier_floor > total->maximum_tier_floor) {
        total->maximum_tier_floor = part->maximum_tier_floor;
    }
}

static void laplace_pg_execute_source_composition_bounded(
    const laplace_framework_context* context,
    const laplace_tabular_source_plan_view* plan,
    const laplace_composition_known_entity* base_known,
    uint64_t preferred_batch_bytes,
    laplace_pg_composition_execution* execution) {
    const laplace_composition_request* final_request;
    uint64_t* segment_roots;
    size_t segment_capacity;
    size_t segment_count = 0u;
    uint64_t prior_root = UINT64_MAX;
    laplace_composition_result* all_results;
    laplace_composition_known_entity* segment_known;
    uint64_t* external_indexes;
    laplace_composition_working_set_summary aggregate;
    size_t segment_index;

    if (context == NULL || plan == NULL || base_known == NULL || execution == NULL ||
        plan->artifact_count == 0u || plan->request_count == 0u ||
        plan->root_result_index + 1u != plan->request_count ||
        plan->root_result_index > SIZE_MAX || plan->request_count > SIZE_MAX ||
        plan->atom_count > SIZE_MAX) {
        ereport(ERROR,
                (errcode(ERRCODE_INVALID_PARAMETER_VALUE),
                 errmsg("Laplace bounded source composition input is invalid")));
    }

    final_request = &plan->requests[plan->root_result_index];
    if (final_request->operand_count == 0u ||
        final_request->first_operand > plan->operand_count ||
        final_request->operand_count >
            plan->operand_count - final_request->first_operand ||
        final_request->operand_count > SIZE_MAX ||
        plan->artifact_count > SIZE_MAX - (size_t)final_request->operand_count - 1u) {
        ereport(ERROR,
                (errcode(ERRCODE_DATA_CORRUPTED),
                 errmsg("Laplace recursive source root is malformed")));
    }

    segment_capacity = (size_t)plan->artifact_count +
        (size_t)final_request->operand_count + 1u;
    segment_roots = (uint64_t*)palloc0(sizeof(*segment_roots) * segment_capacity);

    for (segment_index = 0u; segment_index < (size_t)plan->artifact_count;
         ++segment_index) {
        const uint64_t root = plan->artifact_root_result_indexes[segment_index];
        if (root >= plan->root_result_index ||
            (segment_count != 0u && root <= segment_roots[segment_count - 1u])) {
            ereport(ERROR,
                    (errcode(ERRCODE_DATA_CORRUPTED),
                     errmsg("Laplace artifact source subgraph is not topological")));
        }
        segment_roots[segment_count++] = root;
    }

    for (segment_index = 0u; segment_index < (size_t)final_request->operand_count;
         ++segment_index) {
        const laplace_composition_operand* operand =
            &plan->operands[final_request->first_operand + segment_index];
        const uint64_t root = operand->reference_index;
        if (operand->reference_kind != LAPLACE_COMPOSITION_REFERENCE_PRIOR_RESULT ||
            root >= plan->root_result_index) {
            ereport(ERROR,
                    (errcode(ERRCODE_DATA_CORRUPTED),
                     errmsg("Laplace recursive source root bypassed prior subgraph results")));
        }
        if (segment_count == 0u || root > segment_roots[segment_count - 1u]) {
            segment_roots[segment_count++] = root;
        } else if (root != segment_roots[segment_count - 1u]) {
            ereport(ERROR,
                    (errcode(ERRCODE_DATA_CORRUPTED),
                     errmsg("Laplace recursive source subgraphs are not ordered")));
        }
    }
    if (segment_count == 0u ||
        segment_roots[segment_count - 1u] >= plan->root_result_index) {
        ereport(ERROR,
                (errcode(ERRCODE_DATA_CORRUPTED),
                 errmsg("Laplace recursive source has no bounded child roots")));
    }
    segment_roots[segment_count++] = plan->root_result_index;

    all_results = (laplace_composition_result*)palloc0(
        sizeof(*all_results) * (size_t)plan->request_count);
    if (plan->atom_count > SIZE_MAX - segment_count) {
        ereport(ERROR,
                (errcode(ERRCODE_PROGRAM_LIMIT_EXCEEDED),
                 errmsg("Laplace bounded source known-entity count overflow")));
    }
    segment_known = (laplace_composition_known_entity*)palloc0(
        sizeof(*segment_known) * ((size_t)plan->atom_count + segment_count));
    memcpy(segment_known, base_known,
           sizeof(*segment_known) * (size_t)plan->atom_count);
    external_indexes = (uint64_t*)palloc0(sizeof(*external_indexes) * segment_count);
    memset(&aggregate, 0, sizeof(aggregate));
    aggregate.context_fingerprint = (laplace_digest256){{0}};
    aggregate.source_fingerprint = plan->source_fingerprint;
    aggregate.calculation_recipe_fingerprint =
        plan->profile.recipe_program_fingerprint;
    aggregate.known_entity_count = plan->atom_count;
    aggregate.request_count = plan->request_count;
    aggregate.operand_count = plan->operand_count;
    aggregate.status = LAPLACE_COMPOSITION_OK;
    memset(execution, 0, sizeof(*execution));

    for (segment_index = 0u; segment_index < segment_count; ++segment_index) {
        const uint64_t first_request =
            prior_root == UINT64_MAX ? 0u : prior_root + 1u;
        const uint64_t root_request = segment_roots[segment_index];
        const uint64_t request_count = root_request - first_request + 1u;
        const uint64_t first_operand = plan->requests[first_request].first_operand;
        const laplace_composition_request* last_request =
            &plan->requests[root_request];
        uint64_t operand_end;
        uint64_t operand_count;
        laplace_composition_operand* operands;
        laplace_composition_request* requests;
        size_t external_count = 0u;
        uint64_t request_offset;
        uint64_t operand_offset;
        laplace_composition_working_set_input input;
        laplace_pg_composition_execution part;

        if (last_request->first_operand > plan->operand_count ||
            last_request->operand_count >
                plan->operand_count - last_request->first_operand) {
            ereport(ERROR,
                    (errcode(ERRCODE_DATA_CORRUPTED),
                     errmsg("Laplace source segment operand range is invalid")));
        }
        operand_end = last_request->first_operand + last_request->operand_count;
        if (operand_end < first_operand) {
            ereport(ERROR,
                    (errcode(ERRCODE_DATA_CORRUPTED),
                     errmsg("Laplace source segment operand range underflowed")));
        }
        operand_count = operand_end - first_operand;
        if (request_count > SIZE_MAX || operand_count > SIZE_MAX) {
            ereport(ERROR,
                    (errcode(ERRCODE_PROGRAM_LIMIT_EXCEEDED),
                     errmsg("Laplace source segment exceeds addressable memory")));
        }
        requests = (laplace_composition_request*)palloc(
            sizeof(*requests) * (size_t)request_count);
        operands = (laplace_composition_operand*)palloc(
            sizeof(*operands) * (size_t)operand_count);
        memcpy(requests, plan->requests + first_request,
               sizeof(*requests) * (size_t)request_count);
        memcpy(operands, plan->operands + first_operand,
               sizeof(*operands) * (size_t)operand_count);

        for (request_offset = 0u; request_offset < request_count; ++request_offset) {
            if (requests[request_offset].first_operand < first_operand) {
                ereport(ERROR,
                        (errcode(ERRCODE_DATA_CORRUPTED),
                         errmsg("Laplace source request crossed a segment operand boundary")));
            }
            requests[request_offset].first_operand -= first_operand;
        }
        for (operand_offset = 0u; operand_offset < operand_count; ++operand_offset) {
            laplace_composition_operand* operand = &operands[operand_offset];
            if (operand->reference_kind == LAPLACE_COMPOSITION_REFERENCE_KNOWN_ENTITY) {
                if (operand->reference_index >= plan->atom_count) {
                    ereport(ERROR,
                            (errcode(ERRCODE_DATA_CORRUPTED),
                             errmsg("Laplace source segment known reference is out of range")));
                }
                continue;
            }
            if (operand->reference_kind != LAPLACE_COMPOSITION_REFERENCE_PRIOR_RESULT ||
                operand->reference_index >= plan->request_count) {
                ereport(ERROR,
                        (errcode(ERRCODE_DATA_CORRUPTED),
                         errmsg("Laplace source segment contains an invalid result reference")));
            }
            if (operand->reference_index >= first_request) {
                if (operand->reference_index > root_request) {
                    ereport(ERROR,
                            (errcode(ERRCODE_DATA_CORRUPTED),
                             errmsg("Laplace source segment contains a forward result reference")));
                }
                operand->reference_index -= first_request;
            } else {
                size_t external = 0u;
                while (external < external_count &&
                       external_indexes[external] != operand->reference_index) {
                    ++external;
                }
                if (external == external_count) {
                    if (external_count >= segment_count) {
                        ereport(ERROR,
                                (errcode(ERRCODE_DATA_CORRUPTED),
                                 errmsg("Laplace source segment exceeded root dependency bound")));
                    }
                    external_indexes[external_count] = operand->reference_index;
                    segment_known[(size_t)plan->atom_count + external_count] =
                        laplace_pg_source_result_as_known(
                            &all_results[operand->reference_index]);
                    external = external_count++;
                }
                operand->reference_kind = LAPLACE_COMPOSITION_REFERENCE_KNOWN_ENTITY;
                operand->reference_index = plan->atom_count + external;
            }
        }

        memset(&input, 0, sizeof(input));
        input.context = context;
        input.source_fingerprint = &plan->source_fingerprint;
        input.calculation_recipe_fingerprint =
            &plan->profile.recipe_program_fingerprint;
        input.known_entities = segment_known;
        input.known_entity_count = plan->atom_count + external_count;
        input.operands = operands;
        input.operand_count = operand_count;
        input.requests = requests;
        input.request_count = request_count;
        input.preferred_batch_bytes = preferred_batch_bytes;
        memset(&part, 0, sizeof(part));
        LAPLACE_PG_COMPOSITION_EXECUTE_SYMBOL(&input, &part);
        laplace_pg_persist_composition_execution_receipt(&part, &input);
        if (part.result_count != (size_t)request_count) {
            LAPLACE_PG_COMPOSITION_DESTROY_SYMBOL(&part);
            ereport(ERROR,
                    (errcode(ERRCODE_DATA_CORRUPTED),
                     errmsg("Laplace bounded source composition lost request results")));
        }
        memcpy(all_results + first_request, part.results,
               sizeof(*all_results) * (size_t)request_count);
        laplace_pg_source_summary_accumulate(&aggregate, &part.summary);

        if (segment_index + 1u == segment_count) {
            *execution = part;
            execution->results = all_results;
            execution->result_count = (size_t)plan->request_count;
            aggregate.receipt_id = part.summary.receipt_id;
            aggregate.presence_receipt_id = part.summary.presence_receipt_id;
            aggregate.context_fingerprint = part.summary.context_fingerprint;
            aggregate.input_fingerprint = part.summary.input_fingerprint;
            aggregate.stream_fingerprint = part.summary.stream_fingerprint;
            aggregate.presence_applied = part.summary.presence_applied;
            execution->summary = aggregate;
        } else {
            LAPLACE_PG_COMPOSITION_DESTROY_SYMBOL(&part);
        }
        pfree(operands);
        pfree(requests);
        prior_root = root_request;
    }
    pfree(external_indexes);
    pfree(segment_known);
    pfree(segment_roots);
}

static void laplace_pg_destroy_source_composition_execution(
    laplace_pg_composition_execution* execution) {
    const laplace_composition_result* results;
    if (execution == NULL) return;
    results = execution->results;
    execution->results = NULL;
    LAPLACE_PG_COMPOSITION_DESTROY_SYMBOL(execution);
    if (results != NULL) pfree((void*)results);
}

'''
          text = text.replace(anchor, helper + anchor, 1)

          old_decl = '    laplace_composition_working_set_input composition_input;\n'
          if text.count(old_decl) != 1:
              raise SystemExit('composition_input declaration drifted')
          text = text.replace(old_decl, '', 1)

          old = '''        composition_input.context = &context;
        composition_input.source_fingerprint = &plan.source_fingerprint;
        composition_input.calculation_recipe_fingerprint =
            &plan.profile.recipe_program_fingerprint;
        composition_input.known_entities = known;
        composition_input.known_entity_count = plan.atom_count;
