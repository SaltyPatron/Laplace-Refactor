            &context, &plan, known, preferred_batch_bytes, &execution);
'''
          if text.count(old) != 1:
              raise SystemExit('monolithic composition block drifted')
          text = text.replace(old, new, 1)

          old_destroy = '        LAPLACE_PG_COMPOSITION_DESTROY_SYMBOL(&execution);'
          if text.count(old_destroy) != 1:
              raise SystemExit(f'catch destroy anchor drifted: {text.count(old_destroy)}')
          text = text.replace(
              old_destroy,
              '        laplace_pg_destroy_source_composition_execution(&execution);',
              1)
          old_final = '    LAPLACE_PG_COMPOSITION_DESTROY_SYMBOL(&execution);\n    laplace_tabular_source_plan_destroy(&source_plan);'
          if text.count(old_final) != 1:
              raise SystemExit('final destroy anchor drifted')
          text = text.replace(
              old_final,
              '    laplace_pg_destroy_source_composition_execution(&execution);\n'
              '    laplace_tabular_source_plan_destroy(&source_plan);',
              1)

          path.write_text(text)
          Path('.github/workflows/pr94-source-scaling-repair.yml').unlink()
