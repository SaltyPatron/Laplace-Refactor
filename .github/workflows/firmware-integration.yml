name: firmware-integration
on:
  push:
    branches: ['feat/firmware-request-execution']
permissions:
  contents: write
concurrency:
  group: firmware-source-integration
  cancel-in-progress: false
jobs:
  publish-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply and verify the exact locally compiled implementation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          encoded=''.join((Path('.github/firmware-transfer')/('part'+str(i))).read_text() for i in range(4))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          if hashlib.sha256(patch).hexdigest()!='4d395a0e4830662d67b1ac3a90bd832627847cac77569e78a7cfd0e62b3a3178':
              raise SystemExit('Implementation transfer checksum mismatch')
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          expected={'engine/CMakeLists.txt':'72703ba33448fca687da1ad32121de16a92a30e1','engine/include/laplace/cognition_firmware.h':'88cc057f80d9ecfda5017b82e1eaf52f18fa94da','engine/src/cognition_firmware.cpp':'5cfdd42afe9e4cf656af76fccff254d14639feec','tests/cognition_firmware_tests.cpp':'319f2e0f79be8a194b62c0d25d94fca31da2788b','tests/prompt_admission_fixture.h':'554fcdf9be61efea37cebb13ea32f0f29ed69332','tests/cognition_prompt_conversation_tests.cpp':'48f002b1fef0cb267a1fc1866cc02986458ce112','tests/query_search.cmake':'04c9e8e9e7f4392cb0b723966089ae0c184951fc','tests/registry.d/cognition-firmware.json':'591cc4538fe93ce4924d7a0a27fb3d551b53f0a1','state/continuation.json':'1b6c7f48273b80086f02732acf613763a8885011'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if changed != set(expected): raise SystemExit('Unexpected implementation file set')
          for path,wanted in expected.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if actual!=wanted: raise SystemExit(path+': source identity mismatch')
          print('All nine locally tested implementation and test files verified')
          PY
          git diff --cached --check
          ./tools/tests/verify-requirements.sh
      - name: Publish source and remove this completed transfer mechanism
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SaltyPatron/Laplace-Refactor'
          test "$GITHUB_REF" = 'refs/heads/feat/firmware-request-execution'
          git rm -r .github/firmware-transfer .github/workflows/firmware-integration.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement stored firmware request execution through native cognition and shared publication'
          git push origin HEAD:refs/heads/feat/firmware-request-execution
          echo "Published source commit $(git rev-parse HEAD). Full native and sanitizer PR checks are still required." >> "$GITHUB_STEP_SUMMARY"
