name: one-shot-postgresql-aio-fix

on:
  push:
    branches:
      - product/installed-cognition-surface

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Repair PostgreSQL runtime AIO method'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: product/installed-cognition-surface
          fetch-depth: 0
      - name: Switch product PostgreSQL AIO runtime to worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/postgresql/cluster_core.py')
          text = path.read_text(encoding='utf-8')
          old = '        "io_method": "io_uring",\n'
          new = '        "io_method": "worker",\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one product io_method selection, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          grep -F '"io_method": "worker"' tools/postgresql/cluster_core.py
          python3 -m py_compile tools/postgresql/cluster_core.py

          git config user.name 'laplace-ci'
          git config user.email 'laplace-ci@users.noreply.github.com'
          git add tools/postgresql/cluster_core.py
          git commit -m 'Repair PostgreSQL runtime AIO method'
          git push origin HEAD:product/installed-cognition-surface
