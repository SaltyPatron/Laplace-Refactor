name: custom-stack-ci

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: laplace-physical-product-proof
  cancel-in-progress: false

jobs:
  postgresql-native:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - oneapi
      - postgres-18
      - dotnet-10
      - avx2
    timeout-minutes: 120
    env:
      PATH: /opt/laplace/pgsql-18/bin:/usr/local/bin:/usr/bin:/bin
      LAPLACE_PG_CONFIG: /opt/laplace/pgsql-18/bin/pg_config
      LAPLACE_SOURCE_ESTATE_ROOT: /vault/Data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select exact custom-stack QA boundaries
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          changed="$RUNNER_TEMP/laplace-custom-stack-changed.status"
          plan="$RUNNER_TEMP/laplace-custom-stack-qa-plan.json"
          git diff --name-status -z -M --diff-filter=ACMRTD "$BASE_SHA" "$HEAD_SHA" > "$changed"
          test -s "$changed"
          python3 tools/tests/custom_stack_qa.py select \
            --contract contracts/custom-stack-qa.json \
            --git-name-status-z "$changed" \
            --head-sha "$HEAD_SHA" \
            --output "$plan"
          printf 'LAPLACE_CUSTOM_STACK_QA_PLAN=%s\n' "$plan" >> "$GITHUB_ENV"
          {
            echo '## Custom-stack QA selection'
            echo '```json'
            jq '{head_sha, selected_rules, selected_profiles, eligible_test_count, core_test_count, selected_physical_test_count, selected_physical_tests}' "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify execution identity and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test -w "$RUNNER_TEMP"
          test -x "$LAPLACE_PG_CONFIG"
          test "$($LAPLACE_PG_CONFIG --version | awk '{print $2}' | cut -d. -f1)" = 18
          LAPLACE_ICX=$(jq -r '.toolchain.c_compiler' contracts/postgresql-build.json)
          LAPLACE_ICPX=$(jq -r '.toolchain.cxx_compiler' contracts/postgresql-build.json)
          expected_icx_sha=$(jq -r '.toolchain.c_compiler_sha256' contracts/postgresql-build.json)
          expected_icpx_sha=$(jq -r '.toolchain.cxx_compiler_sha256' contracts/postgresql-build.json)
          test -x "$LAPLACE_ICX"
          test -x "$LAPLACE_ICPX"
          test "$(sha256sum "$LAPLACE_ICX" | awk '{print $1}')" = "$expected_icx_sha"
          test "$(sha256sum "$LAPLACE_ICPX" | awk '{print $1}')" = "$expected_icpx_sha"
          test "$(dotnet --version | cut -d. -f1)" = 10
          grep -qm1 -w avx2 /proc/cpuinfo
          printf 'LAPLACE_ICX=%s\n' "$LAPLACE_ICX" >> "$GITHUB_ENV"
          printf 'LAPLACE_ICPX=%s\n' "$LAPLACE_ICPX" >> "$GITHUB_ENV"
          cmake --version
          ninja --version
          "$LAPLACE_PG_CONFIG" --version
          "$LAPLACE_ICX" --version
          dotnet --version
      - name: Select exact locally verified dependencies and source estate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/dependencies/verify-installed-lock.py --verify-files
          lock_sha=$(sha256sum dependencies/lock.json | awk '{print $1}')
          dependency_root="/opt/laplace/external/source-generations/$lock_sha"
          test -d "$dependency_root"
          ./tools/dependencies/verify-lock.sh "$dependency_root"

          test -d "$LAPLACE_SOURCE_ESTATE_ROOT"
          unicode_root="$LAPLACE_SOURCE_ESTATE_ROOT/UCD/Public/UCD/latest"
          test -d "$unicode_root"

          controlled_source_root="$RUNNER_TEMP/laplace-sources"
          iso_fixture="$controlled_source_root/iso-639-3-20260415"
          cili_fixture="$controlled_source_root/cili-pwn-mappings-20240611"
          python3 tools/sources/acquire-tabular-source.py \
            --profile contracts/sources/iso-639-3-20260415.json \
            --destination "$iso_fixture"
          python3 tools/sources/acquire-tabular-source.py \
            --profile contracts/sources/cili-pwn-mappings-20240611.json \
            --destination "$cili_fixture"

          printf 'LAPLACE_DEPENDENCY_ROOT=%s\n' "$dependency_root" >> "$GITHUB_ENV"
          printf 'LAPLACE_UNICODE_SOURCE_ROOT=%s\n' "$unicode_root" >> "$GITHUB_ENV"
          printf 'LAPLACE_ISO_639_SOURCE_ROOT=%s\n' "$iso_fixture" >> "$GITHUB_ENV"
          printf 'LAPLACE_CILI_SOURCE_ROOT=%s\n' "$cili_fixture" >> "$GITHUB_ENV"
      - name: Configure outside the repository
        shell: bash
        run: |
          set -euo pipefail
          build_directory="$RUNNER_TEMP/laplace-output/postgresql-native"
          c_flags=$(jq -r '.build.c_flags | join(" ")' contracts/postgresql-build.json)
          cxx_flags=$(jq -r '.build.cxx_flags | join(" ")' contracts/postgresql-build.json)
          linker_flags=$(jq -r '.build.linker_flags | join(" ")' contracts/postgresql-build.json)
          cmake -S . -B "$build_directory" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER="$LAPLACE_ICX" \
            -DCMAKE_CXX_COMPILER="$LAPLACE_ICPX" \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="$c_flags" \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="$cxx_flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$linker_flags" \
            -DLAPLACE_BLAKE3_SOURCE="$LAPLACE_DEPENDENCY_ROOT/blake3/c" \
            -DLAPLACE_GTEST_SOURCE="$LAPLACE_DEPENDENCY_ROOT/googletest" \
            -DLAPLACE_EIGEN_SOURCE="$LAPLACE_DEPENDENCY_ROOT/eigen" \
            -DLAPLACE_SPECTRA_SOURCE="$LAPLACE_DEPENDENCY_ROOT/spectra" \
            -DLAPLACE_TREE_SITTER_SOURCE="$LAPLACE_DEPENDENCY_ROOT/tree-sitter" \
            -DLAPLACE_SOURCE_ESTATE_ROOT="$LAPLACE_SOURCE_ESTATE_ROOT" \
            -DLAPLACE_UNICODE_SOURCE_ROOT="$LAPLACE_UNICODE_SOURCE_ROOT" \
            -DLAPLACE_ISO_639_SOURCE_ROOT="$LAPLACE_ISO_639_SOURCE_ROOT" \
            -DLAPLACE_CILI_SOURCE_ROOT="$LAPLACE_CILI_SOURCE_ROOT" \
            -DLAPLACE_ENABLE_DOTNET_BINDINGS=ON \
            -DLAPLACE_VERIFY_ONEAPI_INSTALLED_PROVIDER=ON \
            -DLAPLACE_PG_CONFIG="$LAPLACE_PG_CONFIG"
          printf 'LAPLACE_CI_BUILD_DIRECTORY=%s\n' "$build_directory" >> "$GITHUB_ENV"
      - name: Build native engine PostgreSQL extension and managed bindings
        run: cmake --build "$LAPLACE_CI_BUILD_DIRECTORY" --parallel 6
      - name: Execute selected custom-stack QA fail-fast
        shell: bash
        run: |
          set -uo pipefail
          qa_directory="$RUNNER_TEMP/laplace-custom-stack-qa"
          result="$qa_directory/result.json"
          mkdir -p "$qa_directory"
          printf 'LAPLACE_CUSTOM_STACK_QA_RESULT=%s\n' "$result" >> "$GITHUB_ENV"
          set +e
          python3 tools/tests/custom_stack_qa.py execute \
            --plan "$LAPLACE_CUSTOM_STACK_QA_PLAN" \
            --build-directory "$LAPLACE_CI_BUILD_DIRECTORY" \
            --output-directory "$qa_directory" \
            --result "$result"
          status=$?
          set -e
          if [[ -s "$result" ]]; then
            cat "$result"
          fi
          exit "$status"
      - name: Retain exact custom-stack terminal result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="${LAPLACE_CUSTOM_STACK_QA_RESULT:-$RUNNER_TEMP/laplace-custom-stack-qa/result.json}"
          if [[ ! -s "$result" ]]; then
            echo 'Custom-stack QA was interrupted before a terminal result receipt was written.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Custom-stack QA terminal state'
            echo '```json'
            jq '{head_sha, selected_profiles, aggregate_required_qa, primary_terminal_result, lanes: [.lanes[] | {lane, test_count, result, exit_code, elapsed_seconds, primary_failure}]}' "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(jq -r '.aggregate_required_qa' "$result")" == failed ]]; then
            failure=$(jq -r '.primary_terminal_result.failure.test // .primary_terminal_result.failure.class // "unknown custom-stack failure"' "$result")
            echo "::error title=custom-stack primary terminal failure::$failure"
          fi
      - name: Persist custom-stack terminal result by BLAKE3
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="${LAPLACE_CUSTOM_STACK_QA_RESULT:-$RUNNER_TEMP/laplace-custom-stack-qa/result.json}"
          if [[ ! -s "$result" ]]; then
            echo 'No completed custom-stack terminal result exists for durable publication.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          store="$LAPLACE_CI_BUILD_DIRECTORY/tools/laplace_receipt_store"
          receipt_root=$(jq -r '.durability.receipt_root' contracts/custom-stack-qa.json)
          test -x "$store"
          test "$receipt_root" != null
          test "${receipt_root#/}" != "$receipt_root"
          mkdir -p "$receipt_root"
          test -d "$receipt_root"
          test ! -L "$receipt_root"
          digest=$("$store" put --receipt "$result" --root "$receipt_root")
          test "${#digest}" -eq 64
          "$store" verify --digest "$digest" --root "$receipt_root"
          replay="$RUNNER_TEMP/laplace-custom-stack-qa-result-replay.json"
          "$store" get --digest "$digest" --root "$receipt_root" > "$replay"
          cmp --silent "$result" "$replay"
          printf 'LAPLACE_CUSTOM_STACK_QA_BLAKE3=%s\n' "$digest" >> "$GITHUB_ENV"
          {
            echo '## Durable custom-stack QA receipt'
            echo "- BLAKE3: \`$digest\`"
            echo "- receipt root: \`$receipt_root\`"
            echo '- exact readback: verified'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload custom-stack QA evidence copy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: custom-stack-qa-${{ github.sha }}
          path: ${{ runner.temp }}/laplace-custom-stack-qa/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
      - name: Verify custom-stack registry
        if: success()
        run: ./tools/tests/verify-registry.sh "$LAPLACE_CI_BUILD_DIRECTORY" custom-stack
      - name: Publish measured perfcache receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="${LAPLACE_CI_BUILD_DIRECTORY:-$RUNNER_TEMP/laplace-output/postgresql-native}/receipts/unicode-perfcache-hot.json"
          if [[ -f "$receipt" ]]; then
            {
              echo '## Unicode perfcache hot-lookup receipt'
              echo '```json'
              cat "$receipt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Unicode perfcache hot-lookup receipt was not produced.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Print retained PostgreSQL evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP" -type f -path '*/laplace-postgres-test.*/postgres.log' \
            -print -exec sed -n '1,240p' {} \;
