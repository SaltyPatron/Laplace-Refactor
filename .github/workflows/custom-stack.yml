name: custom-stack-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: custom-stack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgresql-native:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - oneapi
      - postgres-18
      - dotnet-10
      - avx2
    timeout-minutes: 30
    env:
      PATH: /opt/laplace/pgsql-18/bin:/usr/local/bin:/usr/bin:/bin
      LAPLACE_PG_CONFIG: /opt/laplace/pgsql-18/bin/pg_config
      LAPLACE_ICX: /opt/intel/oneapi/compiler/latest/bin/icx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify execution identity and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test -w "$RUNNER_TEMP"
          test -x "$LAPLACE_PG_CONFIG"
          test "$($LAPLACE_PG_CONFIG --version | awk '{print $2}' | cut -d. -f1)" = 18
          test -x "$LAPLACE_ICX"
          test "$(dotnet --version | cut -d. -f1)" = 10
          grep -qm1 -w avx2 /proc/cpuinfo
          cmake --version
          ninja --version
          "$LAPLACE_PG_CONFIG" --version
          "$LAPLACE_ICX" --version
          dotnet --version
      - name: Acquire exact locked build and numeric sources
        shell: bash
        run: |
          set -euo pipefail
          dependency_root="$RUNNER_TEMP/laplace-dependencies"
          mkdir -p "$dependency_root"
          for dependency in blake3 eigen googletest spectra; do
            upstream=$(jq -r --arg dependency "$dependency" '.dependencies[$dependency].upstream' dependencies/lock.json)
            revision=$(jq -r --arg dependency "$dependency" '.dependencies[$dependency].revision' dependencies/lock.json)
            source="$dependency_root/$dependency"
            git init --quiet "$source"
            git -C "$source" remote add origin "$upstream"
            git -C "$source" fetch --quiet --depth=1 origin "$revision"
            git -C "$source" checkout --quiet --detach FETCH_HEAD
          done
          printf 'LAPLACE_DEPENDENCY_ROOT=%s\n' "$dependency_root" >> "$GITHUB_ENV"
      - name: Configure outside the repository
        shell: bash
        run: |
          set -euo pipefail
          build_directory="$RUNNER_TEMP/laplace-output/postgresql-native"
          cmake -S . -B "$build_directory" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLAPLACE_BLAKE3_SOURCE="$LAPLACE_DEPENDENCY_ROOT/blake3/c" \
            -DLAPLACE_GTEST_SOURCE="$LAPLACE_DEPENDENCY_ROOT/googletest" \
            -DLAPLACE_EIGEN_SOURCE="$LAPLACE_DEPENDENCY_ROOT/eigen" \
            -DLAPLACE_SPECTRA_SOURCE="$LAPLACE_DEPENDENCY_ROOT/spectra" \
            -DLAPLACE_PG_CONFIG="$LAPLACE_PG_CONFIG"
          printf 'LAPLACE_CI_BUILD_DIRECTORY=%s\n' "$build_directory" >> "$GITHUB_ENV"
      - name: Build native engine and PostgreSQL extension
        run: cmake --build "$LAPLACE_CI_BUILD_DIRECTORY" --parallel 6
      - name: Execute complete PostgreSQL profile
        run: ctest --test-dir "$LAPLACE_CI_BUILD_DIRECTORY" --output-on-failure
      - name: Verify PostgreSQL-profile registry
        run: ./tools/tests/verify-registry.sh "$LAPLACE_CI_BUILD_DIRECTORY" postgres
      - name: Print retained PostgreSQL evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP" -type f -path '*/laplace-postgres-test.*/postgres.log' \
            -print -exec sed -n '1,240p' {} \;
