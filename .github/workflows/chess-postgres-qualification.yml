name: Native chess LINE durable PostgreSQL qualification

on:
  push:
    branches:
      - 'verify/chess-line-hosted-*'
      - 'verify/chess-line-postgres-*'

permissions:
  contents: read

jobs:
  runner-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Execute actual private-runner counterexamples and source contract controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/chess/qualify_rules_provider.py
          bash -n tests/postgres/run_spi_test.sh
          python3 tests/postgres_resource_guard_tests.py
          python3 tests/source_admission_guard_tests.py tools/admit_source_guard.py
          python3 tests/requirements_trace_tests.py
          python3 tests/program_authority_tests.py

  durable-line:
    if: startsWith(github.ref_name, 'verify/chess-line-postgres-')
    needs: runner-controls
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - oneapi
      - postgres-18
      - dotnet-10
      - avx2
    timeout-minutes: 45
    concurrency:
      group: laplace-physical-product-proof
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        shell: bash tools/host/run-exclusive.sh bash --noprofile --norc -e -o pipefail {0}
    env:
      PATH: /opt/laplace/pgsql-18/bin:/usr/local/bin:/usr/bin:/bin
      LAPLACE_PG_CONFIG: /opt/laplace/pgsql-18/bin/pg_config
      LAPLACE_SOURCE_ESTATE_ROOT: /vault/Data
      LAPLACE_MODEL_ESTATE_ROOT: /vault/models
      TMPDIR: /build/laplace/work
      TMP: /build/laplace/work
      TEMP: /build/laplace/work
      LAPLACE_CHESS_PG_ROOT: /build/laplace/work/chess-line-postgres-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create isolated evidence and retain the exact source selection
        run: |
          set -euo pipefail
          mountpoint -q /build
          umask 0002
          test ! -e "$LAPLACE_CHESS_PG_ROOT"
          mkdir -p "$LAPLACE_CHESS_PG_ROOT/output"
          git rev-parse HEAD > "$LAPLACE_CHESS_PG_ROOT/output/commit.txt"
          git status --porcelain=v1 > "$LAPLACE_CHESS_PG_ROOT/output/worktree-status.txt"
          test ! -s "$LAPLACE_CHESS_PG_ROOT/output/worktree-status.txt"
          sha256sum tests/postgres/run_spi_test.sh tools/tests/postgres_resource_guard.py \
            tests/postgres/chess_line_contract_probe.cpp tests/postgres/chess_line_contract.sql \
            tools/chess/ChessPostgreSQL.cmake tools/chess/qualify_rules_provider.py \
            dependencies/lock.json dependencies/installed-lock.json \
            > "$LAPLACE_CHESS_PG_ROOT/output/execution-inputs.sha256"
      - name: Verify execution identity and toolchain
        shell: bash tools/host/run-exclusive.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test -w "$RUNNER_TEMP"
          test -x "$LAPLACE_PG_CONFIG"
          test "$($LAPLACE_PG_CONFIG --version | awk '{print $2}' | cut -d. -f1)" = 18
          LAPLACE_ICX=$(jq -r '.toolchain.c_compiler' contracts/postgresql-build.json)
          LAPLACE_ICPX=$(jq -r '.toolchain.cxx_compiler' contracts/postgresql-build.json)
          expected_icx_sha=$(jq -r '.toolchain.c_compiler_sha256' contracts/postgresql-build.json)
          expected_icpx_sha=$(jq -r '.toolchain.cxx_compiler_sha256' contracts/postgresql-build.json)
          test -x "$LAPLACE_ICX"
          test -x "$LAPLACE_ICPX"
          test "$(sha256sum "$LAPLACE_ICX" | awk '{print $1}')" = "$expected_icx_sha"
          test "$(sha256sum "$LAPLACE_ICPX" | awk '{print $1}')" = "$expected_icpx_sha"
          test "$(dotnet --version | cut -d. -f1)" = 10
          grep -qm1 -w avx2 /proc/cpuinfo
          printf 'LAPLACE_ICX=%s\n' "$LAPLACE_ICX" >> "$GITHUB_ENV"
          printf 'LAPLACE_ICPX=%s\n' "$LAPLACE_ICPX" >> "$GITHUB_ENV"
          cmake --version
          ninja --version
          "$LAPLACE_PG_CONFIG" --version
          "$LAPLACE_ICX" --version
          dotnet --version
      - name: Select exact locally verified dependencies and source estate
        shell: bash tools/host/run-exclusive.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python3 tools/dependencies/verify-installed-lock.py --verify-files
          dependency_root=$(python3 tools/dependencies/source_estate.py --lock dependencies/lock.json)
          bash tools/dependencies/ensure-locked-git.sh "$dependency_root"
          ./tools/dependencies/verify-lock.sh "$dependency_root"

          test -d "$LAPLACE_SOURCE_ESTATE_ROOT"
          test -d "$LAPLACE_MODEL_ESTATE_ROOT"
          unicode_root="$LAPLACE_SOURCE_ESTATE_ROOT/UCD/Public/UCD/latest"
          test -d "$unicode_root"

          controlled_source_root="$LAPLACE_CHESS_PG_ROOT/sources"
          iso_fixture="$controlled_source_root/iso-639-3-20260415"
          cili_fixture="$controlled_source_root/cili-pwn-mappings-20240611"
          python3 tools/sources/acquire-tabular-source.py \
            --profile contracts/sources/iso-639-3-20260415.json \
            --destination "$iso_fixture"
          python3 tools/sources/acquire-tabular-source.py \
            --profile contracts/sources/cili-pwn-mappings-20240611.json \
            --destination "$cili_fixture"

          printf 'LAPLACE_DEPENDENCY_ROOT=%s\n' "$dependency_root" >> "$GITHUB_ENV"
          printf 'LAPLACE_UNICODE_SOURCE_ROOT=%s\n' "$unicode_root" >> "$GITHUB_ENV"
          printf 'LAPLACE_ISO_639_SOURCE_ROOT=%s\n' "$iso_fixture" >> "$GITHUB_ENV"
          printf 'LAPLACE_CILI_SOURCE_ROOT=%s\n' "$cili_fixture" >> "$GITHUB_ENV"
      - name: Build and verify the locked C++ syntax provider
        run: |
          set -euo pipefail
          provider_root="$LAPLACE_CHESS_PG_ROOT/output/cpp-grammar"
          printf 'LAPLACE_CPP_GRAMMAR_RECEIPT=%s\n' "$provider_root/build-receipt.json" >> "$GITHUB_ENV"
          python3 tools/sources/qualify_grammar.py --acquire \
            --grammar-root "$LAPLACE_CHESS_PG_ROOT/sources/tree-sitter-cpp" \
            --runtime-root "$LAPLACE_DEPENDENCY_ROOT/tree-sitter" \
            --grammar-lock dependencies/tree-sitter-grammars.lock.json \
            --dependency-lock dependencies/lock.json \
            --compiler "$LAPLACE_ICX" \
            --grammar tree-sitter-cpp --output "$provider_root"
          test -s "$provider_root/build-receipt.json"
      - name: Build and verify the locked PGN syntax provider
        run: |
          set -euo pipefail
          provider_root="$LAPLACE_CHESS_PG_ROOT/output/pgn-grammar"
          printf 'LAPLACE_PGN_GRAMMAR_RECEIPT=%s\n' "$provider_root/build-receipt.json" >> "$GITHUB_ENV"
          python3 tools/sources/qualify_grammar.py --acquire \
            --grammar-root "$LAPLACE_CHESS_PG_ROOT/sources/tree-sitter-pgn" \
            --runtime-root "$LAPLACE_DEPENDENCY_ROOT/tree-sitter" \
            --grammar-lock dependencies/tree-sitter-grammars.lock.json \
            --dependency-lock dependencies/lock.json \
            --compiler "$LAPLACE_ICX" \
            --grammar tree-sitter-pgn --output "$provider_root"
          test -s "$provider_root/build-receipt.json"
      - name: Configure and build the actual common native PostgreSQL providers
        run: |
          set -euo pipefail
          bash tools/tests/configure-custom-stack.sh
          native=$(tail -n 1 "$GITHUB_ENV" | sed -n 's/^LAPLACE_CI_BUILD_DIRECTORY=//p')
          test -n "$native"
          cmake --build "$native" --parallel 6 --target \
            laplace_pg laplace_postgres_native_receipt_probe laplace_chess_line_tests \
            laplace_pgn_native_source_probe \
            2>&1 | tee "$LAPLACE_CHESS_PG_ROOT/output/native-build.log"
          ctest --test-dir "$native" --no-tests=error --output-on-failure -V \
            -R '^(ChessLine[.]|source[.]pgn-native-provider-contract$)' \
            2>&1 | tee "$LAPLACE_CHESS_PG_ROOT/output/native-controls.log"
      - name: Verify the existing selected official CuteChess source build
        run: |
          set -euo pipefail
          python3 tools/dependencies/chess_tools.py check --tool cutechess \
            --prefix /opt/laplace/tools/chess \
            | tee "$LAPLACE_CHESS_PG_ROOT/output/cutechess-installed-check.json"
      - name: Build the selected native chess PostgreSQL bridge
        run: |
          set -euo pipefail
          python3 tools/chess/qualify_rules_provider.py \
            --chess-prefix /opt/laplace/tools/chess --postgres \
            --native-build "$LAPLACE_CI_BUILD_DIRECTORY" \
            --output "$LAPLACE_CHESS_PG_ROOT/output/rules" --jobs 6
          ctest --test-dir "$LAPLACE_CHESS_PG_ROOT/output/rules/build" \
            --no-tests=error --output-on-failure -V \
            -R '^chess[.]native-(rules-provider|trace-adapter)-contract$' \
            2>&1 | tee "$LAPLACE_CHESS_PG_ROOT/output/provider-controls.log"
      - name: Execute actual durable LINE admission, rollback and fresh-backend replay
        run: |
          set -euo pipefail
          ctest --test-dir "$LAPLACE_CHESS_PG_ROOT/output/rules/build" \
            --no-tests=error --output-on-failure -V \
            -R '^postgres[.]chess-line-durable-replay-contract$' \
            2>&1 | tee "$LAPLACE_CHESS_PG_ROOT/output/postgres-line-test.log"
      - name: Print retained success or partial failure receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$LAPLACE_CHESS_PG_ROOT/output"
          if [[ ! -d "$root" ]]; then exit 0; fi
          python3 - "$root" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          names = {"build-receipt.json", "native-qualification.json",
                   "native-adapter-qualification.json", "runner-receipt.json",
                   "chess-line-receipt.json", "chess-line-resource-guard.json",
                   "unicode-resource-guard.json", "resource-guard.json"}
          for path in sorted(root.rglob("*.json")):
              if path.name in names and path.is_file() and path.stat().st_size <= 1024 * 1024:
                  print(f"RETAINED RECEIPT: {path}")
                  print(path.read_text())
          PY
          if [[ -f "$root/rules/build.log" ]]; then tail -n 120 "$root/rules/build.log"; fi
      - name: Retain exact native source, selected provider files and database evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chess-line-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LAPLACE_CHESS_PG_ROOT }}/output/
          if-no-files-found: error
          retention-days: 30
