name: Inspect retained installed service failure
on:
  push:
    branches: [diag/inspect-installed-service-419-20260916]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate exact retained archive and inspect bounded command log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.error, urllib.parse, urllib.request, zipfile
          REPO = "SaltyPatron/Laplace-Refactor"
          ARTIFACT = 10439300223
          EXPECTED = "7f19c95a5d5af4c5b77e699c1f4c4ee8e24df10bc96c79d4e518cf4f4d588588"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def get_api(url, maximum):
              req = urllib.request.Request(url, headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with opener.open(req, timeout=30) as response:
                  raw = response.read(maximum+1)
              if len(raw)>maximum:
                  raise RuntimeError("API response exceeded bound")
              return raw
          base = "https://api.github.com/repos/"+REPO+"/actions/artifacts/"+str(ARTIFACT)
          metadata = json.loads(get_api(base, 65536))
          if (metadata["id"] != ARTIFACT or metadata["expired"] or metadata["size_in_bytes"] != 290688
                  or metadata["digest"] != "sha256:"+EXPECTED
                  or metadata["workflow_run"]["id"] != 35077783809
                  or metadata["workflow_run"]["head_sha"] != "9774cf6aaee2efa10f92d45a421838ca204d0de7"):
              raise RuntimeError("artifact identity differs")
          try:
              get_api(base+"/zip", 1024)
              raise RuntimeError("artifact endpoint did not provide expected redirect")
          except urllib.error.HTTPError as response:
              if response.code != 302:
                  raise
              location = response.headers["Location"]
          target = urllib.parse.urlsplit(location)
          if (target.scheme != "https" or target.username or target.password
                  or not target.hostname or not (target.hostname.endswith(".blob.core.windows.net")
                  or target.hostname.endswith(".githubusercontent.com"))):
              raise RuntimeError("artifact redirect is not an allowed HTTPS download")
          with opener.open(urllib.request.Request(location), timeout=30) as response:
              archive = response.read(290689)
          if len(archive) != 290688 or hashlib.sha256(archive).hexdigest() != EXPECTED:
              raise RuntimeError("actual archive bytes differ from retained digest")
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              members = bundle.infolist()
              if len(members)>100 or len({m.filename for m in members}) != len(members):
                  raise RuntimeError("artifact member inventory differs")
              def read(name, maximum):
                  info = bundle.getinfo(name)
                  if info.file_size>maximum or info.is_dir():
                      raise RuntimeError("selected member exceeds its bound")
                  with bundle.open(info) as stream:
                      data=stream.read(maximum+1)
                  if len(data)>maximum:
                      raise RuntimeError("selected member expansion exceeded bound")
                  return data
              receipt = json.loads(read("service-recovery.json", 262144))
              identity = receipt.pop("receipt_sha256")
              encoded = json.dumps(receipt, sort_keys=True, separators=(",",":"), ensure_ascii=True).encode()
              if identity != "c56e7a0352d26a421c2f98f1bc36ebf12bd6e85c98f5ffcb83ea935cb841478e" or hashlib.sha256(encoded).hexdigest()!=identity:
                  raise RuntimeError("canonical recovery receipt differs")
              log=read("service-check.log", 32768)
              selected=[x for x in receipt["files"] if x["path"]=="service-check.log"]
              if len(selected)!=1 or selected[0]["bytes"]!=len(log) or selected[0]["sha256"]!=hashlib.sha256(log).hexdigest():
                  raise RuntimeError("command log is not bound to recovery receipt")
              print(json.dumps({"schema":"laplace.installed-service-failure-inspection/v1",
                  "artifact_id":ARTIFACT,"archive_sha256":EXPECTED,"recovery_receipt_sha256":identity,
                  "command_exit_code":receipt["command_exit_code"],"activation_unchanged":receipt["activation_unchanged"],
                  "log_sha256":hashlib.sha256(log).hexdigest(),"log_bytes":len(log),
                  "command_log_utf8":log.decode("utf-8")}, sort_keys=True))
          
          PY
