name: persisted-provider-build-inputs
on:
  push:
    branches: ['fix/persisted-cognition-provider']
permissions:
  contents: read
jobs:
  build-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire and verify the repository's exact dependency revisions
        shell: bash
        run: |
          set -euo pipefail
          ./tools/dependencies/acquire-locked-git.sh dependencies/lock.json "$RUNNER_TEMP/locked-inputs" blake3 eigen googletest spectra tree-sitter
          git bundle create "$RUNNER_TEMP/current-source.bundle" --all
          git bundle verify "$RUNNER_TEMP/current-source.bundle"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/persisted-build-inputs.tar.gz" locked-inputs current-source.bundle
          sha256sum "$RUNNER_TEMP/persisted-build-inputs.tar.gz" > "$RUNNER_TEMP/persisted-build-inputs.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persisted-build-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/persisted-build-inputs.tar.gz
            ${{ runner.temp }}/persisted-build-inputs.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
