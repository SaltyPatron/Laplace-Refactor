name: postgresql-product-provider-repair

on:
  push:
    branches:
      - feat/postgresql-product-proof

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPAIR_BASE_SHA: 2e9e90ad0448bd17dd914514582d7d655f353e67
      REPAIR_BRANCH: feat/postgresql-product-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Recover and execute asserted provider transformation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$REPAIR_BASE_SHA")" = "$REPAIR_BASE_SHA"
          test "$(git rev-list --count "$REPAIR_BASE_SHA"..HEAD)" = 3
          python3 - <<'PY'
          from pathlib import Path
          authority = Path('.github/repair/postgresql-product-provider-authority.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = authority.index(marker) + len(marker)
          end = authority.index("\n          PY", start)
          lines = authority[start:end].splitlines()
          margin = '          '
          script = '\n'.join(
              line[len(margin):] if line.startswith(margin) else line
              for line in lines
          )
          if 'Gateway contract: the already-authorized probe becomes a live product proof.' not in script:
              raise SystemExit('provider transformation authority marker missing')
          Path('/tmp/laplace-postgresql-product-repair.py').write_text(script + '\n', encoding='utf-8')
          PY
          python3 /tmp/laplace-postgresql-product-repair.py
          chmod +x tools/product/prove-postgresql-product.py tests/postgresql_product_proof_tests.py
          git diff --check
          python3 -m py_compile tools/delivery/product_activation.py tools/product/prove-postgresql-product.py

      - name: Run product-path gateway and provider mutation suites
        run: |
          set -euo pipefail
          python3 tests/product_path_tests.py
          python3 tests/product_activation_gateway_tests.py
          python3 tests/postgresql_product_proof_tests.py

      - name: Validate generated provider wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'uses: ./.github/workflows/postgresql-product.yml' .github/workflows/product-path.yml
          grep -Fq '"implemented": true' contracts/product-path.json
          grep -Fq 'product_probe_schema' contracts/product-activation-gateway.json
          grep -Fq 'root-authoritative PostgreSQL product probe' tools/product/prove-postgresql-product.py

      - name: Publish one clean provider commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/postgresql-product-provider-repair.yml
          rm .github/repair/postgresql-product-provider-authority.yml
          rmdir .github/repair 2>/dev/null || true
          git add -A
          git diff --cached --check
          git reset --soft "$REPAIR_BASE_SHA"
          test -z "$(git diff --cached --name-only | grep '^.github/repair/' || true)"
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/postgresql-product-provider-repair.yml$' || true)"
          git config user.name SaltyPatron
          git config user.email thesaltypatron@gmail.com
          git commit -m "Implement exact PostgreSQL product proof" \
            -m "Extend the existing root-owned gateway probe into a read-only live PostgreSQL 18.6 verifier, bind its loaded-object observation to the exact current-source package proof, retain the binding in the BLAKE3 receipt store, and wire the provider into the single fail-closed product-path gate."
          git push --force-with-lease origin "HEAD:$REPAIR_BRANCH"
