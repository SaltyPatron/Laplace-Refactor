name: firmware-provider-validation
on:
  push:
    branches: ['feat/firmware-request-execution']
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply exact generated-binding repair
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/firmware-provider-transfer/fix.patch
          git apply --index .github/firmware-provider-transfer/fix.patch
          test "$(git hash-object cmake/LaplaceFrameworkContract.cmake)" = 6880b44bec788469a42ae0b2debca57ee15166e2
          test "$(git hash-object integrations/postgresql/extension/CMakeLists.txt)" = aa07e58a35b04542983bcdf86934566a0dd60815
          ./tools/tests/verify-requirements.sh
          git diff --cached --check
      - name: Publish source on the same integration branch
        id: source
        run: |
          set -euo pipefail
          git rm -r .github/firmware-provider-transfer
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bind PostgreSQL firmware context to the generated native epoch slot'
          git push origin HEAD:refs/heads/feat/firmware-request-execution
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  postgresql:
    needs: integrate
    runs-on: [self-hosted, Linux, X64, laplace-refactor, postgres-18]
    timeout-minutes: 30
    concurrency:
      group: laplace-physical-product-proof
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.integrate.outputs.source_sha }}
          persist-credentials: false
      - name: Compile and execute firmware against real disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          build="$RUNNER_TEMP/laplace-firmware-provider-$GITHUB_RUN_ID"
          inputs="$RUNNER_TEMP/laplace-firmware-provider-inputs-$GITHUB_RUN_ID"
          mkdir -p "$build"
          ./tools/dependencies/acquire-locked-git.sh dependencies/lock.json "$inputs" blake3 eigen googletest spectra tree-sitter
          cmake -S . -B "$build" -G Ninja \
            -DPython3_EXECUTABLE=/usr/bin/python3 -DCMAKE_BUILD_TYPE=Debug \
            -DLAPLACE_PG_CONFIG=/opt/laplace/current/pgsql-18/bin/pg_config \
            -DLAPLACE_BLAKE3_SOURCE="$inputs/blake3/c" -DLAPLACE_GTEST_SOURCE="$inputs/googletest" \
            -DLAPLACE_EIGEN_SOURCE="$inputs/eigen" -DLAPLACE_SPECTRA_SOURCE="$inputs/spectra" \
            -DLAPLACE_TREE_SITTER_SOURCE="$inputs/tree-sitter" 2>&1 | tee "$build/configure.log"
          cmake --build "$build" --parallel 4 --target laplace_pg \
            laplace_postgres_observation_cognition_probe laplace_observation_query_tests \
            2>&1 | tee "$build/build.log"
          "$build/laplace_observation_query_tests" 2>&1 | tee "$build/native-tests.log"
          ctest --test-dir "$build" -R '^postgres.observation-cognition-native-parity$' \
            --output-on-failure --no-tests=error 2>&1 | tee "$build/postgresql-tests.log"
      - name: Retain exact database and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-provider-postgresql-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/laplace-firmware-provider-${{ github.run_id }}/*.log
            ${{ runner.temp }}/laplace-firmware-provider-${{ github.run_id }}/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/laplace-firmware-provider-${{ github.run_id }}/integrations/postgresql/extension/observation_cognition_contract.sql
          if-no-files-found: error
          retention-days: 7
