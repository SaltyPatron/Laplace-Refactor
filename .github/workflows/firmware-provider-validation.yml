name: firmware-provider-validation
on:
  push:
    branches: ['feat/firmware-request-execution']
permissions:
  contents: read
jobs:
  source-and-requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate current implementation contracts
        run: ./tools/tests/verify-requirements.sh
      - name: Export tracked source without local credentials or runtime state
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firmware-provider-source"
          git archive HEAD --format=tar.gz -o "$RUNNER_TEMP/firmware-provider-source/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/firmware-provider-source/identity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-provider-source-${{ github.sha }}
          path: ${{ runner.temp }}/firmware-provider-source/
          if-no-files-found: error
          retention-days: 7
