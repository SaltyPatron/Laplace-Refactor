name: firmware-provider-validation
on:
  push:
    branches: ['feat/firmware-request-execution']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Replace the obsolete pending checkpoint with executed acceptance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('state/continuation.json')
          source=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(source)).encode()+b'\0'+source).hexdigest()=='400543e8e957f16ad1f59c5445aa5b9096524d05'
          old='Local native build, 95 tests and requirements passed. Actual PostgreSQL compilation, shared-provider parity and stored-firmware replay/missing-data/corruption acceptance are submitted next.'
          new='Source edcc46a1255eadd3c5ec8a31dfa6f666bee061be passed actual PostgreSQL/native run 34187301079 on hart-server: 95 native tests, indexed-provider parity, the same stored firmware and prompt producing A or B from changed persisted compositions, exact replay, checkpoint restoration, and missing-data/corruption/joint-capacity rejection. Artifact 10040962245 retains generated SQL and complete logs. Ordinary full native/sanitizer/requirements checks on the finalized source remain required; this was disposable PostgreSQL acceptance, not production deployment. This supersedes the pending concrete-candidate-provider status below, not the remaining admission, semantic evidence, realization, publication and public-request obligations.'
          text=source.decode('utf-8')
          assert text.count(old)==1
          output=text.replace(old,new).encode('utf-8')
          assert hashlib.sha1(b'blob '+str(len(output)).encode()+b'\0'+output).hexdigest()=='2c40eefd60631d3cf9792778795e36310a1197d2'
          json.loads(output)
          p.write_bytes(output)
          PY
          ./tools/tests/verify-requirements.sh
          git diff --check
      - name: Publish only the verified checkpoint
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/firmware-request-execution
          git add state/continuation.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record the executed PostgreSQL firmware-provider boundary and remaining public integration'
          git push origin HEAD:refs/heads/feat/firmware-request-execution
