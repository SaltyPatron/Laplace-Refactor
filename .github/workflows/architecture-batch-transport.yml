name: architecture-batch-transport

on:
  push:
    branches:
      - feat/decomposition-orchestration

permissions:
  contents: write

concurrency:
  group: architecture-batch-transport
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Stage epistemic authority batch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind source provenance through admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} replacements, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          for path, source_type in (
              ('contracts/sources/iso-639-3-20260415.json', 'standard'),
              ('contracts/sources/cili-pwn-mappings-20240611.json', 'curated_dataset'),
          ):
              p = Path(path)
              document = json.loads(p.read_text(encoding='utf-8'))
              if document['profile'].get('source_class') != 'foundational_seed':
                  raise SystemExit(f'{path}: foundational seed class missing')
              document['profile']['evidence_source_type'] = source_type
              p.write_text(
                  json.dumps(document, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8', newline='\n')

          replace_once(
              'tests/tabular_profile_fixture.hpp',
              '        declaration.flags = Profile::epistemic_class;\n',
              '        declaration.flags = LAPLACE_SOURCE_PROFILE_MAKE_FLAGS(\n'
              '            Profile::epistemic_class, Profile::evidence_type);\n')

          old_test = '''TEST(SourceProfile, EpistemicClassIsOrthogonalAndIdentityBound) {
              auto seed = MakeProfile(0x21u);
              seed.flags = LAPLACE_SOURCE_PROFILE_EPISTEMIC_FOUNDATIONAL_SEED;
              ASSERT_EQ(laplace_source_profile_identify(&seed, &seed.profile_id),
                        LAPLACE_SOURCE_PROFILE_OK);

              auto observation = seed;
              observation.flags = LAPLACE_SOURCE_PROFILE_EPISTEMIC_OBSERVATION;
              ASSERT_EQ(laplace_source_profile_identify(
                            &observation, &observation.profile_id),
                        LAPLACE_SOURCE_PROFILE_OK);
              EXPECT_NE(std::memcmp(seed.profile_id.bytes, observation.profile_id.bytes, 32u), 0);

              auto derived = seed;
              derived.flags = LAPLACE_SOURCE_PROFILE_EPISTEMIC_DERIVED;
              ASSERT_EQ(laplace_source_profile_identify(&derived, &derived.profile_id),
                        LAPLACE_SOURCE_PROFILE_OK);
              EXPECT_NE(std::memcmp(seed.profile_id.bytes, derived.profile_id.bytes, 32u), 0);

              auto invalid = MakeProfile(0x22u);
              invalid.flags = UINT32_C(0x10);
              EXPECT_EQ(laplace_source_profile_identify(&invalid, &invalid.profile_id),
                        LAPLACE_SOURCE_PROFILE_INVALID_ARGUMENT);
          }
          '''
          new_test = '''TEST(SourceProfile, EpistemicAndEvidenceAxesAreOrthogonalAndIdentityBound) {
              auto seed_standard = MakeProfile(0x21u);
              seed_standard.flags = LAPLACE_SOURCE_PROFILE_MAKE_FLAGS(
                  LAPLACE_SOURCE_PROFILE_EPISTEMIC_FOUNDATIONAL_SEED,
                  LAPLACE_SOURCE_PROFILE_EVIDENCE_STANDARD);
              ASSERT_EQ(laplace_source_profile_identify(
                            &seed_standard, &seed_standard.profile_id),
                        LAPLACE_SOURCE_PROFILE_OK);
              EXPECT_EQ(laplace_source_profile_epistemic_class(&seed_standard),
                        LAPLACE_SOURCE_PROFILE_EPISTEMIC_FOUNDATIONAL_SEED);
              EXPECT_EQ(laplace_source_profile_evidence_source_type(&seed_standard),
                        LAPLACE_SOURCE_PROFILE_EVIDENCE_STANDARD);

              auto seed_curated = seed_standard;
              seed_curated.flags = LAPLACE_SOURCE_PROFILE_MAKE_FLAGS(
                  LAPLACE_SOURCE_PROFILE_EPISTEMIC_FOUNDATIONAL_SEED,
                  LAPLACE_SOURCE_PROFILE_EVIDENCE_CURATED_DATASET);
              ASSERT_EQ(laplace_source_profile_identify(
                            &seed_curated, &seed_curated.profile_id),
                        LAPLACE_SOURCE_PROFILE_OK);
              EXPECT_NE(std::memcmp(
                  seed_standard.profile_id.bytes, seed_curated.profile_id.bytes, 32u), 0);

              auto observation_standard = seed_standard;
              observation_standard.flags = LAPLACE_SOURCE_PROFILE_MAKE_FLAGS(
                  LAPLACE_SOURCE_PROFILE_EPISTEMIC_OBSERVATION,
                  LAPLACE_SOURCE_PROFILE_EVIDENCE_STANDARD);
              ASSERT_EQ(laplace_source_profile_identify(
                            &observation_standard, &observation_standard.profile_id),
                        LAPLACE_SOURCE_PROFILE_OK);
              EXPECT_NE(std::memcmp(
                  seed_standard.profile_id.bytes,
                  observation_standard.profile_id.bytes, 32u), 0);

              auto invalid = MakeProfile(0x22u);
              invalid.flags = UINT32_C(0x100);
              EXPECT_EQ(laplace_source_profile_identify(&invalid, &invalid.profile_id),
                        LAPLACE_SOURCE_PROFILE_INVALID_ARGUMENT);
              invalid = MakeProfile(0x23u);
              invalid.flags = LAPLACE_SOURCE_PROFILE_MAKE_FLAGS(
                  LAPLACE_SOURCE_PROFILE_EPISTEMIC_MAX + 1u,
                  LAPLACE_SOURCE_PROFILE_EVIDENCE_STANDARD);
              EXPECT_EQ(laplace_source_profile_identify(&invalid, &invalid.profile_id),
                        LAPLACE_SOURCE_PROFILE_INVALID_ARGUMENT);
              invalid = MakeProfile(0x24u);
              invalid.flags = LAPLACE_SOURCE_PROFILE_MAKE_FLAGS(
                  LAPLACE_SOURCE_PROFILE_EPISTEMIC_FOUNDATIONAL_SEED,
                  LAPLACE_SOURCE_PROFILE_EVIDENCE_MAX + 1u);
              EXPECT_EQ(laplace_source_profile_identify(&invalid, &invalid.profile_id),
                        LAPLACE_SOURCE_PROFILE_INVALID_ARGUMENT);
          }
          '''
          replace_once('tests/source_profile_tests.cpp', old_test, new_test)

          pg = Path('postgres/extension/src/source_admission_pg.c')
          pg_text = pg.read_text(encoding='utf-8')
          marker = 'PG_FUNCTION_INFO_V1(LAPLACE_PG_SOURCE_ADMIT_TABULAR_SYMBOL);\n'
          asserts = '''PG_FUNCTION_INFO_V1(LAPLACE_PG_SOURCE_ADMIT_TABULAR_SYMBOL);

          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_STANDARD == LAPLACE_EVIDENCE_SOURCE_STANDARD,
                         "source-profile standard provenance must match evidence testimony");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_CURATED_DATASET == LAPLACE_EVIDENCE_SOURCE_CURATED_DATASET,
                         "source-profile curated provenance must match evidence testimony");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_CORPUS == LAPLACE_EVIDENCE_SOURCE_CORPUS,
                         "source-profile corpus provenance must match evidence testimony");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_DIRECT_OBSERVATION == LAPLACE_EVIDENCE_SOURCE_DIRECT_OBSERVATION,
                         "source-profile observation provenance must match evidence testimony");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_CALCULATION == LAPLACE_EVIDENCE_SOURCE_CALCULATION,
                         "source-profile calculation provenance must match evidence testimony");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_MODEL == LAPLACE_EVIDENCE_SOURCE_MODEL,
                         "source-profile model provenance must match evidence testimony");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_SELF_ASSERTION == LAPLACE_EVIDENCE_SOURCE_SELF_ASSERTION,
                         "source-profile self-assertion provenance must match evidence testimony");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_EXTERNAL_PROVIDER == LAPLACE_EVIDENCE_SOURCE_EXTERNAL_PROVIDER,
                         "source-profile external-provider provenance must match evidence testimony");
          '''
          if pg_text.count(marker) != 1:
              raise SystemExit('source_admission_pg.c: PG function marker changed')
          pg_text = pg_text.replace(marker, asserts)
          old_build = '''    laplace_evidence_testimony_record* records =
                  (laplace_evidence_testimony_record*)palloc0(
                      sizeof(*records) * claim_count);
              const laplace_digest256 trust = trust_input_id(profile);
              size_t index;
          '''
          new_build = '''    laplace_evidence_testimony_record* records =
                  (laplace_evidence_testimony_record*)palloc0(
                      sizeof(*records) * claim_count);
              const laplace_digest256 trust = trust_input_id(profile);
              const uint32_t source_type =
                  laplace_source_profile_evidence_source_type(profile);
              size_t index;
              if (source_type == LAPLACE_SOURCE_PROFILE_EVIDENCE_UNSPECIFIED) {
                  ereport(ERROR,
                          (errcode(ERRCODE_DATA_CORRUPTED),
                           errmsg("Laplace admitted testimony has no declared evidence source type")));
              }
          '''
          if pg_text.count(old_build) != 1:
              raise SystemExit('source_admission_pg.c: testimony builder changed')
          pg_text = pg_text.replace(old_build, new_build)
          if pg_text.count('records[index].source_type = LAPLACE_EVIDENCE_SOURCE_STANDARD;') != 1:
              raise SystemExit('source_admission_pg.c: hard-coded source type changed')
          pg_text = pg_text.replace(
              'records[index].source_type = LAPLACE_EVIDENCE_SOURCE_STANDARD;',
              'records[index].source_type = source_type;')
          pg.write_text(pg_text, encoding='utf-8', newline='\n')

          flags_check = '''flags integer NOT NULL CHECK (
                  flags >= 0 AND (flags & ~255) = 0 AND
                  (flags & 15) BETWEEN 0 AND 4 AND
                  ((flags >> 4) & 15) BETWEEN 0 AND 8),'''
          replace_count(
              'postgres/extension/laplace--version.sql.in',
              'flags integer NOT NULL CHECK (flags = 0),',
              flags_check,
              2)

          replace_once(
              'tests/isa_tests.cpp',
              '    static_assert(LAPLACE_ISA_MINOR == 10u);\n',
              '    static_assert(LAPLACE_ISA_MINOR == 11u);\n')
          replace_once(
              'tests/isa_tests.cpp',
              '    EXPECT_EQ(LAPLACE_ISA_OPCODE_REFERENCE_MAPPING_RESOLVE_BATCH, 0x00060004u);\n',
              '    EXPECT_EQ(LAPLACE_ISA_OPCODE_REFERENCE_MAPPING_RESOLVE_BATCH, 0x00060004u);\n'
              '    EXPECT_EQ(LAPLACE_ISA_OPCODE_COGNITION_SOLVE_PACKET, 0x00070001u);\n'
              '    EXPECT_EQ(LAPLACE_ISA_INSTRUCTION_VERSION_COGNITION_SOLVE_PACKET, 1u);\n'
              '    EXPECT_EQ(LAPLACE_ISA_INTRODUCED_MINOR_COGNITION_SOLVE_PACKET, 11u);\n')
          PY
          rm .github/workflows/architecture-batch-transport.yml
          git config user.name "laplace-runner"
          git config user.email "laplace-runner@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind seeded authority provenance through admission"
          git push origin HEAD:feat/decomposition-orchestration
