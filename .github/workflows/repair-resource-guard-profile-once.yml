name: repair-resource-guard-profile-once

on:
  push:
    branches:
      - codex/complete-laplace-20260831

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/complete-laplace-20260831
          fetch-depth: 1
      - name: Align resource guard with the core CTest inventory and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('tests/registry.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          matches = [t for t in data['tests'] if t.get('ctest_name') == 'postgres.source-resource-guard-contract']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one resource guard registry row, found {len(matches)}')
          row = matches[0]
          profiles = row.get('profiles')
          if profiles != ['postgres', 'custom-stack'] and profiles != ['core', 'postgres', 'custom-stack']:
              raise SystemExit(f'unexpected existing profiles: {profiles!r}')
          row['profiles'] = ['core', 'postgres', 'custom-stack']
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          python3 -m json.tool tests/registry.json >/dev/null
          git rm .github/workflows/repair-resource-guard-profile-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/registry.json
          git diff --cached --check
          git commit -m 'Include source resource guard in core registry profile'
          git push origin HEAD:codex/complete-laplace-20260831
