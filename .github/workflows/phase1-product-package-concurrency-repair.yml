name: phase1-product-package-concurrency-repair

on:
  push:
    branches:
      - repair/phase1-product-package-concurrency

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Preserve inert repair authority
        shell: bash
        run: |
          set -euo pipefail
          cp .github/repair/phase1_product_package_concurrency.py \
            "$RUNNER_TEMP/phase1_product_package_concurrency.py"
          test -s "$RUNNER_TEMP/phase1_product_package_concurrency.py"

      - name: Check out exact product-path head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/product-path-gate
          fetch-depth: 0

      - name: Refuse stale publication base
        shell: bash
        run: |
          set -euo pipefail
          expected=7373fb384f1c1b7307d74ea02ac3adfae35d5f7d
          actual=$(git rev-parse HEAD)
          test "$actual" = "$expected"
          git diff --quiet
          git diff --cached --quiet

      - name: Apply same-plan single-writer repair and proof diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/phase1_product_package_concurrency.py"
          git diff --check

      - name: Prove repair and deliberate defects
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/product_package_tests.py
          python3 tests/package_product_proof_tests.py
          python3 tests/postgresql_product_proof_tests.py
          python3 tests/product_path_tests.py

      - name: Publish one clean source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "laplace-ci"
          git config user.email "laplace-ci@users.noreply.github.com"
          git add \
            tools/product/build-package.py \
            tools/product/prove-package.py \
            tests/product_package_tests.py \
            tests/package_product_proof_tests.py
          test -n "$(git status --porcelain)"
          git commit -m "Serialize exact product package composition"
          git push origin HEAD:refs/heads/feat/product-path-gate
