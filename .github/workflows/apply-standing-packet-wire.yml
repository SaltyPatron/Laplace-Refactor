name: apply-standing-packet-wire
on:
  push:
    branches:
      - complete/typed-standing-query-20260913
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete/typed-standing-query-20260913
      - run: python3 tools/apply_standing_packet_wire.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Preserve exact standing through cognition packet wire"
          git push origin HEAD:complete/typed-standing-query-20260913
