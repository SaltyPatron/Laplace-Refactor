name: one-shot-fix-source-admission-live-generation

on:
  push:
    branches:
      - repair/source-admission-live-generation-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repair/source-admission-live-generation-20260912
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          guard = Path('tools/admit_source_guard.py')
          text = guard.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'DEFAULT_ACTIVE = Path("/opt/laplace/current")\n',
              'DEFAULT_ACTIVE = Path("/opt/laplace/current")\n'
              'DEFAULT_RELEASE_ROOT = Path("/opt/laplace/releases")\n',
              'release root constant')

          old_sql = '''    sql = """
          SELECT pg_catalog.json_build_object(
            'activation_epoch_id',pg_catalog.encode(u.activation_epoch_id,'hex'),
            'activation_epoch_fingerprint',pg_catalog.encode(u.epoch_fingerprint,'hex'),
            'geometry_epoch',(
              SELECT pg_catalog.encode(g.geometry_epoch,'hex')
              FROM laplace.unicode_root_generation AS g
              ORDER BY g.recorded_at DESC
              LIMIT 1
            ),
            'perfcache_epoch',pg_catalog.encode(u.epoch_fingerprint,'hex'),
            'numeric_epoch',pg_catalog.encode(h.activation_epoch_fingerprint,'hex')
          )::text
          FROM laplace.perfcache_active_control AS u
          CROSS JOIN laplace.highway_registry_active_control AS h
          WHERE u.singleton AND u.active_present
            AND h.singleton AND h.active_present;
          """
          '''
          new_sql = '''    sql = """
          SELECT pg_catalog.json_build_object(
            'activation_epoch_id',pg_catalog.encode(u.activation_epoch_id,'hex'),
            'activation_epoch_fingerprint',pg_catalog.encode(u.epoch_fingerprint,'hex'),
            'geometry_epoch',pg_catalog.encode(g.geometry_epoch,'hex'),
            'perfcache_epoch',pg_catalog.encode(u.epoch_fingerprint,'hex'),
            'numeric_epoch',pg_catalog.encode(h.activation_epoch_fingerprint,'hex')
          )::text
          FROM laplace.perfcache_active_control AS u
          JOIN laplace.unicode_root_generation AS g
            ON g.activation_epoch_id=u.activation_epoch_id
           AND g.activation_epoch_fingerprint=u.epoch_fingerprint
          CROSS JOIN laplace.highway_registry_active_control AS h
          JOIN laplace.highway_registry_generation AS hg
            ON hg.activation_epoch_id=h.activation_epoch_id
           AND hg.activation_epoch_fingerprint=h.activation_epoch_fingerprint
          WHERE u.singleton AND u.active_present
            AND h.singleton AND h.active_present
            AND hg.unicode_activation_epoch_id=u.activation_epoch_id
            AND hg.unicode_activation_epoch_fingerprint=u.epoch_fingerprint;
          """
          '''
          replace_once(old_sql, new_sql, 'live runtime SQL')

          old_match = '''        if (
                      identities.get("schema") == "laplace.unicode-activation-identities/v1"
                      and identities.get("request_fingerprint") == request
                      and identities.get("geometry_epoch") == live["geometry_epoch"]
                      and identities.get("perfcache_epoch") == live["perfcache_epoch"]
                      and identities.get("numeric_epoch") == live["numeric_epoch"]
                  ):
                      matches.append(generation)
          '''
          new_match = '''        if (
                      identities.get("schema") == "laplace.unicode-activation-identities/v1"
                      and identities.get("request_fingerprint") == request
                      and identities.get("geometry_epoch") == live["geometry_epoch"]
                  ):
                      matches.append(generation)
          '''
          replace_once(old_match, new_match, 'generation match predicate')

          replace_once(
              '    active_path: Path = DEFAULT_ACTIVE,\n    live_state: dict[str, str] | None = None,\n',
              '    active_path: Path = DEFAULT_ACTIVE,\n'
              '    release_root: Path = DEFAULT_RELEASE_ROOT,\n'
              '    live_state: dict[str, str] | None = None,\n',
              'bind signature')

          old_bind = '''    values.extend(["--active", str(matches[0])])
              return values
          '''
          new_bind = '''    package_id = matches[0].name
              try:
                  release_root = release_root.resolve(strict=True)
              except OSError as error:
                  raise AdmissionGuardError(
                      f"product release root is unavailable: {release_root}: {error}"
                  ) from error
              candidate = release_root / package_id
              if candidate.is_symlink() or not candidate.is_dir():
                  raise AdmissionGuardError(
                      f"live activation package release is unavailable: {candidate}"
                  )
              try:
                  selected_release = candidate.resolve(strict=True)
              except OSError as error:
                  raise AdmissionGuardError(
                      f"live activation package release cannot be resolved: {candidate}: {error}"
                  ) from error
              if selected_release.parent != release_root:
                  raise AdmissionGuardError(
                      f"live activation package release escaped its root: {selected_release}"
                  )
              values.extend(["--active", str(selected_release)])
              return values
          '''
          replace_once(old_bind, new_bind, 'active release binding')
          guard.write_text(text, encoding='utf-8')

          core = Path('tools/admit_source.py')
          core_text = core.read_text(encoding='utf-8')
          old_geometry = '''                "SELECT pg_catalog.encode(geometry_epoch,'hex') "
                              "FROM laplace.unicode_root_generation "
                              "ORDER BY recorded_at DESC LIMIT 1;\\n",
          '''
          new_geometry = '''                "SELECT pg_catalog.encode(g.geometry_epoch,'hex') "
                              "FROM laplace.perfcache_active_control AS a "
                              "JOIN laplace.unicode_root_generation AS g "
                              "ON g.activation_epoch_id=a.activation_epoch_id "
                              "AND g.activation_epoch_fingerprint=a.epoch_fingerprint "
                              "WHERE a.singleton AND a.active_present;\\n",
          '''
          count = core_text.count(old_geometry)
          if count != 1:
              raise SystemExit(f'core geometry query: expected 1 anchor, found {count}')
          core_text = core_text.replace(old_geometry, new_geometry, 1)
          old_checks = '''        if perfcache_epoch != identities["perfcache_epoch"]:
                      raise AdmissionError("live Unicode perfcache epoch differs from active product receipt")
                  if numeric_epoch != identities["numeric_epoch"]:
                      raise AdmissionError("live Highway epoch differs from active product receipt")
          '''
          new_checks = '''        # Perfcache and numeric epochs are live successor execution-context
                  # generations. They intentionally advance beyond the Unicode activation
                  # request's original framework context after Unicode/Highway activation.
          '''
          count = core_text.count(old_checks)
          if count != 1:
              raise SystemExit(f'core live epoch checks: expected 1 anchor, found {count}')
          core_text = core_text.replace(old_checks, new_checks, 1)
          core.write_text(core_text, encoding='utf-8')

          tests = Path('tests/source_admission_guard_tests.py')
          test_text = tests.read_text(encoding='utf-8')
          test_text = test_text.replace(
              '        self.receipts = self.root / "receipts"\n',
              '        self.receipts = self.root / "receipts"\n'
              '        self.releases = self.root / "releases"\n'
              '        self.releases.mkdir()\n',
              1,
          )
          test_text = test_text.replace(
              '                    "perfcache_epoch": self.live["perfcache_epoch"],\n'
              '                    "numeric_epoch": numeric_epoch or self.live["numeric_epoch"],\n',
              '                    "perfcache_epoch": "66" * 32,\n'
              '                    "numeric_epoch": numeric_epoch or "77" * 32,\n',
              1,
          )
          old_return = '''        return generation
          '''
          new_return = '''        release = self.releases / package
                  release.mkdir()
                  return generation
          '''
          if test_text.count(old_return) < 1:
              raise SystemExit('generation return anchor absent')
          test_text = test_text.replace(old_return, new_return, 1)
          test_text = test_text.replace(
              '            self.argv(), active_path=self.active, live_state=self.live\n',
              '            self.argv(), active_path=self.active, release_root=self.releases, live_state=self.live\n',
          )
          test_text = test_text.replace(
              '        self.assertEqual(values[-2:], ["--active", str(generation.resolve())])\n',
              '        self.assertEqual(\n'
              '            values[-2:],\n'
              '            ["--active", str((self.releases / generation.name).resolve())],\n'
              '        )\n',
          )
          test_text = test_text.replace(
              '        self.add_generation("c", "d", numeric_epoch="55" * 32)\n',
              '        self.add_generation("c", "d", geometry_epoch="55" * 32)\n',
              1,
          )
          tests.write_text(test_text, encoding='utf-8')
          PY

          python3 tests/source_admission_guard_tests.py tools/admit_source_guard.py
          python3 -m py_compile tools/admit_source_guard.py tools/admit_source.py
          git diff --check
          git diff -- tools/admit_source_guard.py tools/admit_source.py tests/source_admission_guard_tests.py
          git config user.name laplace-ci
          git config user.email laplace-ci@users.noreply.github.com
          git add tools/admit_source_guard.py tools/admit_source.py tests/source_admission_guard_tests.py
          git commit -m 'Bind package source admission to live activation generation'
          git push origin HEAD:repair/source-admission-live-generation-20260912
