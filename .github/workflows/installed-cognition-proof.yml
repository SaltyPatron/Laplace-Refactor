name: installed-cognition-proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/delivery/product_cognition_live_proof.py
      - .github/workflows/installed-cognition-proof.yml

permissions:
  contents: read

concurrency:
  group: installed-cognition-proof
  cancel-in-progress: false

jobs:
  prove-installed-cognition:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Execute the currently installed persistent product cognition route
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test "$GITHUB_REPOSITORY" = SaltyPatron/Laplace-Refactor
          test "$GITHUB_REF" = refs/heads/main
          test -L /opt/laplace/current
          package_id=$(basename "$(readlink -f /opt/laplace/current)")
          [[ "$package_id" =~ ^[0-9a-f]{64}$ ]]
          receipt_root=$(jq -er '.instance.receipt_directory' contracts/postgresql-cluster.json)
          proof="$receipt_root/product-cognition/$package_id/installed-proof.json"
          python3 tools/delivery/product_cognition_live_proof.py --output "$proof"
          jq -e \
            --arg package_id "$package_id" '
            .schema == "laplace.installed-product-cognition-proof/v1" and
            .package_id == $package_id and
            .prompt_utf8 == "AA" and
            .observed_output_utf8 == "A" and
            .execution.status == 0 and
            .execution.completed_steps == 2 and
            .execution.emitted_parts == 1 and
            .execution.provider_call_count > 0 and
            .execution.materialization_resolved_nodes > 0 and
            .execution.materialization_database_operations > 0 and
            (.execution.execution_receipt_id | test("^\\\\x[0-9a-f]{64}$")) and
            (.proof_sha256 | test("^[0-9a-f]{64}$"))
          ' "$proof" >/dev/null
          {
            echo '## Actual installed cognition output'
            echo '```json'
            jq '{schema,package_id,program:.program.program_id,prompt_utf8,observed_output_utf8,execution:{status:.execution.status,completed_steps:.execution.completed_steps,emitted_parts:.execution.emitted_parts,provider_call_count:.execution.provider_call_count,materialization_resolved_nodes:.execution.materialization_resolved_nodes,materialization_database_operations:.execution.materialization_database_operations,execution_receipt_id:.execution.execution_receipt_id},proof_sha256}' "$proof"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
