name: prompt-reconciliation-source
on:
  push:
    branches: [delivery/prompt-conversation-composition-20260906]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Preserve source ancestry for exact local reconciliation
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/laplace-reconciliation.bundle" --all
          git bundle verify "$RUNNER_TEMP/laplace-reconciliation.bundle"
          sha256sum "$RUNNER_TEMP/laplace-reconciliation.bundle" > "$RUNNER_TEMP/laplace-reconciliation.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-reconciliation-source
          path: |
            ${{ runner.temp }}/laplace-reconciliation.bundle
            ${{ runner.temp }}/laplace-reconciliation.sha256
          retention-days: 7
          if-no-files-found: error
