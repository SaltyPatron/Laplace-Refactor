name: Qualify selected package receipt convergence
on:
  push:
    branches: ['verify/selected-package-receipts-20260916']
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify exact candidate and execute receipt and service controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/selected-receipt-controls"
          python3 - <<'PY'
          import json, subprocess
          expected = json.loads("{\".github/workflows/product-activation.yml\":[\"100644\",\"24e06a27bde828805cc784d26ebb2e4b012a42a7\"],\"packaging/systemd/laplace-refactor-cognition.service\":[\"100644\",\"5ad2d319b9f479dedabec20143792591c2dd89e7\"],\"packaging/systemd/user/laplace-refactor-cognition.service\":[\"100644\",\"7e1898131e9f227e3a0d9d01b483f809b09bfe87\"],\"scripts/setup-host.sh\":[\"100644\",\"db1ace80a0da7e659d2b21258474db227c0e5702\"],\"scripts/setup-product.sh\":[\"100644\",\"e92b4a8040f5a495516c528095d4b17e4e8ae7b9\"],\"tests/product_activation_runner_tests.py\":[\"100644\",\"ffdac49a91c09c914a02024971e1e18d1a89af7a\"],\"tests/product_host_tests.py\":[\"100644\",\"9d2dd4ed7167ed14f7d0f2c9b6e59e7773d14314\"],\"tests/receipt_estate_runner_tests.py\":[\"100644\",\"96779d28c5c737f787c9f57816f89bb996fc5ee0\"],\"tests/stockfish_corpus_acceptance_tests.py\":[\"100644\",\"b83e48c918da95df6dfb77bb1512dcd2ff6d2776\"],\"tools/_openai_api_compat_pre_reconciliation.py\":[\"100644\",\"31c9702aef6de4b0a9d0794a946d5e13ad41b28d\"],\"tools/delivery/product_cognition_live_proof.py\":[\"100644\",\"5d290ca5d3ac99fe36a2f72d3f3213f34233f7b5\"],\"tools/delivery/product_cognition_service.py\":[\"100755\",\"e3a19d4f7a9f69a8490d4713ce5035090fdda37b\"],\"tools/delivery/receipt_estate.py\":[\"100644\",\"6ac6f5973a69c3b5a465f31ddf35d278496b835b\"],\"tools/delivery/receipt_estate_runner.py\":[\"100644\",\"b56fcd82b0c5fe38c75bdaa27aefda833cc28228\"],\"tools/openai_api_compat.py\":[\"100644\",\"fc23a1930195a89720eee3e9b0b96cd577671635\"],\"tools/sources/stockfish_corpus_acceptance.py\":[\"100644\",\"ff0c3264a4d9f615d54e827a19e6e0b1066e4b32\"]}")
          actual = set(subprocess.check_output(["git","diff","--name-only","419cbcb4fd4c569706ee3c253ab4775f5fcaebad","HEAD"], text=True).splitlines())
          if actual != set(expected) | {".github/workflows/qualify-selected-receipt-estate.yml"}:
              raise RuntimeError("candidate changes differ from the reviewed source")
          for path, (mode, identity) in expected.items():
              observed = subprocess.check_output(["git","ls-tree","HEAD","--",path],text=True).split()
              if len(observed) != 4 or observed[:3] != [mode,"blob",identity]:
                  raise RuntimeError("candidate leaf differs: " + path)
          print(json.dumps({"reviewed_production_paths":len(expected),"native_runtime_mutated":False}))
          PY
          bash -n scripts/setup-host.sh scripts/setup-product.sh
          for suite in receipt_estate_runner receipt_estate product_host product_activation_runner product_activation_gateway stockfish_corpus_acceptance; do
            python3 "tests/${suite}_tests.py" -v 2>&1 | tee "$RUNNER_TEMP/selected-receipt-controls/${suite}.log"
          done
      - name: Retain actual control output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selected-receipt-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selected-receipt-controls/
          if-no-files-found: error
          retention-days: 30
