name: fix-typed-standing-wire

on:
  push:
    branches:
      - complete/typed-standing-query-20260913

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete/typed-standing-query-20260913
          fetch-depth: 0
      - run: python3 tools/fix_typed_standing_wire.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Repair typed standing packet wire layout"
          git push origin HEAD:complete/typed-standing-query-20260913
