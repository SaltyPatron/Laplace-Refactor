name: product-activation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact accepted main commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: product-activation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-authority:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the one-time host bootstrap and recurring runner authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test "$GITHUB_REPOSITORY" = SaltyPatron/Laplace-Refactor
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_SHA" = '${{ inputs.expected_sha }}'

          bootstrap=/opt/laplace/receipts/bootstrap/host.json
          test -r "$bootstrap"
          test ! -L "$bootstrap"
          jq -e '
            .schema == "laplace.host-bootstrap/v1" and
            .phase == "host-prerequisites-ready" and
            .service_identity.user == "laplace-runner" and
            .service_identity.group == "laplace-runner" and
            .service_envelope.enabled == true and
            .service_envelope.started_by_bootstrap == false and
            .sudo_policy.allowed_actions == ["start","stop","restart"] and
            .product_activated == false and
            .postgresql_initialized == false and
            .activation_gateway_installed == false
          ' "$bootstrap" >/dev/null

          service=$(jq -er '.sudo_policy.service' "$bootstrap")
          systemctl_bin=$(jq -er '.sudo_policy.systemctl' "$bootstrap")
          service_path=$(jq -er '.service_envelope.path' "$bootstrap")
          service_sha=$(jq -er '.service_envelope.sha256' "$bootstrap")
          test "$service" = laplace-refactor-postgresql.service
          test -f "$service_path"
          test ! -L "$service_path"
          test "$(sha256sum "$service_path" | awk '{print $1}')" = "$service_sha"
          test "$(sha256sum packaging/systemd/laplace-refactor-postgresql.service | awk '{print $1}')" = "$service_sha"
          test "$($systemctl_bin is-enabled "$service")" = enabled
          for action in start stop restart; do
            sudo -n -l "$systemctl_bin" "$action" "$service" >/dev/null
          done

          test -w /build/laplace/runner
          test -w /opt/laplace/releases
          test -w /opt/laplace/runtime
          test -w /opt/laplace/pgdata/refactor
          test -w /var/lib/pgwal
          test -w /pgtemp
          test -w /var/log/laplace/postgresql
          test -w /etc/laplace/instances

      - name: Verify runner-owned activation contracts
        run: |
          python3 tests/postgresql_cluster_tests.py
          python3 tests/unicode_product_activation_tests.py
          python3 tests/highway_product_activation_tests.py
          python3 tests/product_activation_runner_tests.py
          python3 tests/product_service_state_tests.py

  compose-product:
    if: github.event_name == 'workflow_dispatch'
    needs: runner-authority
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - oneapi
      - postgres-18
      - avx2
    timeout-minutes: 120
    outputs:
      product_receipt: ${{ steps.compose.outputs.product_receipt }}
      resource_observation: ${{ steps.compose.outputs.resource_observation }}
      package_id: ${{ steps.compose.outputs.package_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify protected product-build context and accepted PostgreSQL input
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test "$GITHUB_REPOSITORY" = SaltyPatron/Laplace-Refactor
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_SHA" = '${{ inputs.expected_sha }}'
          git diff --quiet
          git diff --cached --quiet
          postgresql_publication=$(jq -er '.product_activation_projection.postgresql_publication.receipt' state/continuation.json)
          expected_sha=$(jq -er '.product_activation_projection.postgresql_publication.receipt_sha256' state/continuation.json)
          test -f "$postgresql_publication"
          test ! -L "$postgresql_publication"
          test "$(sha256sum "$postgresql_publication" | awk '{print $1}')" = "$expected_sha"
          python3 tools/delivery/postgresql_package_publication.py verify \
            --receipt "$postgresql_publication" >/dev/null
          printf 'postgresql_publication=%s\n' "$postgresql_publication" >> "$GITHUB_OUTPUT"

      - name: Compose or verify the exact content-addressed product package
        id: compose
        shell: bash
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/laplace-product-selection.json"
          python3 tools/product/build-package.py compose \
            --postgresql-publication '${{ steps.inputs.outputs.postgresql_publication }}' \
            --output "$selection"
          expected_plan_sha=$(jq -er '.plan_sha256' "$selection")
          product_receipt=$(jq -er '.product_receipt' "$selection")
          test -f "$product_receipt"
          test ! -L "$product_receipt"
          test "$(jq -er '.plan_sha256' "$product_receipt")" = "$expected_plan_sha"
          test "$(jq -er '.activation_eligible' "$product_receipt")" = true
          test "$(jq -er '.build_input_closure_complete' "$product_receipt")" = true
          test "$(jq -er '.product_activated' "$product_receipt")" = false
          manifest=$(jq -er '.manifest' "$product_receipt")
          expected_manifest_sha=$(jq -er '.manifest_sha256' "$product_receipt")
          test -f "$manifest"
          test ! -L "$manifest"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$expected_manifest_sha"
          package_id=$(jq -er '.package_id' "$product_receipt")
          test "$(jq -er '.package_id' "$manifest")" = "$package_id"
          physical_release=$(jq -er '.physical_root' "$product_receipt")
          logical_release=$(jq -er '.root' "$manifest")
          case "$physical_release" in
            *"$logical_release") source_root="${physical_release%"$logical_release"}" ;;
            *) echo 'product physical root does not end in its logical release root' >&2; exit 1 ;;
          esac
          expected_source_root="$(jq -er '.stage_directory' "$selection")/root"
          test "$source_root" = "$expected_source_root"
          test -d "$physical_release"

          receipt_root=$(jq -er '.instance.receipt_directory' contracts/postgresql-cluster.json)
          resource_directory="$receipt_root/plan/$package_id"
          resource_observation="$resource_directory/resource-observation.json"
          install -d -m 0750 "$resource_directory"
          python3 tools/postgresql/clusterctl.py observe-resources \
            --contract contracts/postgresql-cluster.json \
            --package-manifest "$manifest" \
            --package-physical-root "$source_root" \
            --output "$resource_observation"
          test "$(jq -er '.package_id' "$resource_observation")" = "$package_id"
          test "$(jq -er '.observation_sha256' "$resource_observation")" != null
          printf 'product_receipt=%s\n' "$product_receipt" >> "$GITHUB_OUTPUT"
          printf 'resource_observation=%s\n' "$resource_observation" >> "$GITHUB_OUTPUT"
          printf 'package_id=%s\n' "$package_id" >> "$GITHUB_OUTPUT"
          {
            echo '## Product package selected for persistent DEV/BAT activation'
            echo '```json'
            jq '{schema, package_id, manifest, manifest_sha256, physical_root, activation_eligible, build_input_closure_complete}' "$product_receipt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  activate-product:
    if: github.event_name == 'workflow_dispatch'
    needs: compose-product
    environment: product
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify protected runner-owned deployment context
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test "$GITHUB_REPOSITORY" = SaltyPatron/Laplace-Refactor
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_SHA" = '${{ inputs.expected_sha }}'
          git diff --quiet
          git diff --cached --quiet

          bootstrap=/opt/laplace/receipts/bootstrap/host.json
          test -r "$bootstrap"
          service=$(jq -er '.sudo_policy.service' "$bootstrap")
          systemctl_bin=$(jq -er '.sudo_policy.systemctl' "$bootstrap")
          service_path=$(jq -er '.service_envelope.path' "$bootstrap")
          expected_service_sha=$(jq -er '.service_envelope.sha256' "$bootstrap")
          test "$(sha256sum "$service_path" | awk '{print $1}')" = "$expected_service_sha"
          test "$(sha256sum packaging/systemd/laplace-refactor-postgresql.service | awk '{print $1}')" = "$expected_service_sha"
          test "$($systemctl_bin is-enabled "$service")" = enabled
          for action in start stop restart; do
            sudo -n -l "$systemctl_bin" "$action" "$service" >/dev/null
          done

      - name: Activate PostgreSQL, Unicode, and Highway as laplace-runner
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/laplace-product-activation-result.json"
          python3 tools/delivery/product_activation_runner.py \
            --product-receipt '${{ needs.compose-product.outputs.product_receipt }}' \
            --resource-observation '${{ needs.compose-product.outputs.resource_observation }}' \
            --repository-commit "$GITHUB_SHA" \
            --output "$result"
          jq -e \
            --arg package_id '${{ needs.compose-product.outputs.package_id }}' \
            --arg repository_commit "$GITHUB_SHA" '
            .schema == "laplace.product-activation-result/v1" and
            .phase == "product-unicode-and-highway-activated" and
            .execution_owner == "laplace-runner" and
            .root_product_executor == false and
            .package_id == $package_id and
            .repository_commit == $repository_commit and
            (.package_installation_receipt_sha256 | test("^[0-9a-f]{64}$")) and
            (.cluster_activation_receipt_sha256 | test("^[0-9a-f]{64}$")) and
            (.unicode_activation_receipt_sha256 | test("^[0-9a-f]{64}$")) and
            (.highway_activation_receipt_sha256 | test("^[0-9a-f]{64}$")) and
            (.result_sha256 | test("^[0-9a-f]{64}$"))
          ' "$result" >/dev/null
          printf 'LAPLACE_PRODUCT_ACTIVATION_RESULT=%s\n' "$result" >> "$GITHUB_ENV"
          {
            echo '## Runner-owned product activation result'
            echo '```json'
            cat "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the persistent DEV/BAT product directly
        shell: bash
        run: |
          set -euo pipefail
          result="$LAPLACE_PRODUCT_ACTIVATION_RESULT"
          package_id='${{ needs.compose-product.outputs.package_id }}'
          test -s "$result"
          test "$(jq -er '.execution_owner' "$result")" = laplace-runner
          test "$(jq -er '.root_product_executor' "$result")" = false
          cluster_result=$(jq -er '.cluster_result' "$result")
          unicode_result=$(jq -er '.unicode_result' "$result")
          highway_result=$(jq -er '.highway_result' "$result")
          for receipt in "$cluster_result" "$unicode_result" "$highway_result"; do
            test -r "$receipt"
            test ! -L "$receipt"
          done
          test "$(jq -er '.phase' "$cluster_result")" = activated
          test "$(jq -er '.package_id' "$cluster_result")" = "$package_id"
          test "$(jq -er '.restart_proven' "$cluster_result")" = true
          test "$(jq -er '.boot_enabled' "$cluster_result")" = true
          test "$(jq -er '.package_id' "$unicode_result")" = "$package_id"
          test "$(jq -er '.package_id' "$highway_result")" = "$package_id"

          test -L /opt/laplace/current
          test "$(readlink /opt/laplace/current)" = "releases/$package_id"
          test -L /opt/laplace/runtime/refactor
          test "$(readlink /opt/laplace/runtime/refactor)" = "../releases/$package_id"
          test "$(systemctl is-enabled laplace-refactor-postgresql.service)" = enabled
          test "$(systemctl is-active laplace-refactor-postgresql.service)" = active

          package_root="/opt/laplace/releases/$package_id"
          pg_isready="$package_root/pgsql-18/bin/pg_isready"
          psql="$package_root/pgsql-18/bin/psql"
          test -x "$pg_isready"
          test -x "$psql"
          "$pg_isready" \
            --host /run/laplace-refactor-postgresql \
            --port 55433 \
            --dbname laplace_refactor

          live_query=$(
            "$psql" \
              --host /run/laplace-refactor-postgresql \
              --port 55433 \
              --username laplace_app \
              --dbname laplace_refactor \
              --no-psqlrc \
              --set ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --field-separator '|' \
              --command "SELECT version(),current_database(),current_user,(SELECT extversion FROM pg_extension WHERE extname='laplace')"
          )
          IFS='|' read -r live_version live_database live_role live_extension <<<"$live_query"
          [[ "$live_version" == PostgreSQL\ 18.6* ]]
          test "$live_database" = laplace_refactor
          test "$live_role" = laplace_app
          [[ "$live_extension" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          {
            echo '## DEV/BAT persistent post-deploy proof'
            echo "- repository commit: \`$GITHUB_SHA\`"
            echo "- package: \`$package_id\`"
            echo '- recurring execution owner: `laplace-runner`'
            echo '- root product executor: `false`'
            echo "- live query: \`$live_version | $live_database | $live_role | laplace $live_extension\`"
            echo '- PostgreSQL process restart: proven'
            echo '- Unicode activation receipt: readable'
            echo '- Highway activation receipt: readable'
            echo '- PostgreSQL service enabled for host boot: proven'
          } >> "$GITHUB_STEP_SUMMARY"
