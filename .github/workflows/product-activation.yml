name: product-activation

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact accepted main commit to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact accepted main commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: product-activation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-authority:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner-owned host prerequisites
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            printf 'Laplace host prerequisite failed: %s\n' "$*" >&2
            return 1
          }

          require_equal() {
            local actual="$1"
            local expected="$2"
            local field="$3"
            [[ "$actual" == "$expected" ]] ||
              fail "$field expected=$expected actual=$actual"
          }

          require_writable_directory() {
            local path="$1"
            if [[ ! -e "$path" && ! -L "$path" ]]; then
              fail "$path is missing"
              return
            fi
            if [[ -L "$path" ]]; then
              fail "$path is a symlink"
              return
            fi
            if [[ ! -d "$path" ]]; then
              fail "$path is not a directory"
              return
            fi
            if [[ ! -w "$path" ]]; then
              local ownership mode
              ownership=$(stat -c '%U:%G' "$path" 2>/dev/null || printf '<unavailable>')
              mode=$(stat -c '%a' "$path" 2>/dev/null || printf '<unavailable>')
              fail "$path is not writable by $(id -un) (owner=$ownership mode=$mode)"
            fi
          }

          require_equal "$(id -un)" laplace-runner runner-user
          require_equal "$GITHUB_REPOSITORY" SaltyPatron/Laplace-Refactor repository
          require_equal "$GITHUB_REF" refs/heads/main git-ref
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) fail "event expected=push-or-workflow_dispatch actual=$GITHUB_EVENT_NAME" ;;
          esac
          require_equal "$GITHUB_SHA" '${{ inputs.expected_sha }}' repository-sha

          bootstrap=/opt/laplace/receipts/bootstrap/host.json
          bootstrap_directory=$(dirname "$bootstrap")
          bootstrap_missing=false
          if [[ -L "$bootstrap" ]]; then
            fail "$bootstrap is a symlink"
          elif [[ -e "$bootstrap" ]]; then
            if [[ ! -r "$bootstrap" ]]; then
              ownership=$(stat -c '%U:%G' "$bootstrap" 2>/dev/null || printf '<unavailable>')
              mode=$(stat -c '%a' "$bootstrap" 2>/dev/null || printf '<unavailable>')
              fail "$bootstrap is not readable by $(id -un) (owner=$ownership mode=$mode)"
            fi
            if ! jq -e '
              .schema == "laplace.host-bootstrap/v1" and
              .phase == "host-prerequisites-ready" and
              .service_identity.user == "laplace-runner" and
              .service_identity.group == "laplace-runner" and
              .product_activated == false and
              .postgresql_initialized == false and
              .activation_gateway_installed == false
            ' "$bootstrap" >/dev/null; then
              jq '{schema,phase,service_identity,product_activated,postgresql_initialized,activation_gateway_installed}' \
                "$bootstrap" >&2 || true
              fail "$bootstrap does not describe the required prerequisites-only host envelope"
            fi
          else
            bootstrap_missing=true
          fi

          release_root=/opt/laplace/releases
          if [[ ! -e "$release_root" && ! -L "$release_root" ]]; then
            install -d -m 0755 "$release_root"
          fi
          [[ -d "$release_root" ]] || fail "$release_root is not a directory"
          [[ ! -L "$release_root" ]] || fail "$release_root is a symlink"
          require_equal "$(stat -c '%U:%G' "$release_root")" laplace-runner:laplace-runner release-root-owner

          for path in \
            /build/laplace/runner \
            "$release_root" \
            /opt/laplace/runtime \
            /opt/laplace/pgdata/refactor \
            /opt/laplace/receipts \
            /var/lib/pgwal \
            /pgtemp \
            /var/log/laplace/postgresql \
            /etc/laplace/instances; do
            require_writable_directory "$path"
          done

          if [[ ! -e "$bootstrap_directory" && ! -L "$bootstrap_directory" ]]; then
            install -d -m 0750 "$bootstrap_directory"
          fi
          require_writable_directory "$bootstrap_directory"

          if [[ "$bootstrap_missing" == true ]]; then
            service_name=laplace-refactor-postgresql.service
            service=/etc/systemd/system/$service_name
            service_source=packaging/systemd/$service_name
            sudo_policy=/etc/sudoers.d/laplace-refactor-postgresql-service
            systemctl_bin=$(command -v systemctl)
            sudo_bin=$(command -v sudo)

            [[ -f "$service" && ! -L "$service" ]] ||
              fail "$service is absent, a symlink, or not a regular file"
            require_equal "$(stat -c '%U:%G' "$service")" root:root service-owner
            require_equal "$(stat -c '%a' "$service")" 644 service-mode
            cmp -s "$service_source" "$service" ||
              fail "$service differs from the repository static service envelope"
            "$systemctl_bin" is-enabled --quiet "$service_name" ||
              fail "$service_name is not enabled"

            [[ -f "$sudo_policy" && ! -L "$sudo_policy" ]] ||
              fail "$sudo_policy is absent, a symlink, or not a regular file"
            require_equal "$(stat -c '%U:%G' "$sudo_policy")" root:root sudo-policy-owner
            require_equal "$(stat -c '%a' "$sudo_policy")" 440 sudo-policy-mode

            expected_policy=$(printf '%s\n' \
              "laplace-runner ALL=(root) NOPASSWD: $systemctl_bin start $service_name" \
              "laplace-runner ALL=(root) NOPASSWD: $systemctl_bin stop $service_name" \
              "laplace-runner ALL=(root) NOPASSWD: $systemctl_bin restart $service_name" \
              "laplace-runner ALL=(root) NOPASSWD: $systemctl_bin restart laplace-refactor-cognition.service")
            expected_policy_bytes=$(printf '%s\n' "$expected_policy" | wc -c | tr -d ' ')
            require_equal "$(stat -c '%s' "$sudo_policy")" "$expected_policy_bytes" sudo-policy-size
            for action in start stop restart; do
              "$sudo_bin" -n -l "$systemctl_bin" "$action" "$service_name" >/dev/null ||
                fail "laplace-runner lacks declared sudo authority for systemctl $action $service_name"
            done

            service_sha=$(sha256sum "$service" | awk '{print $1}')
            expected_policy_sha=$(printf '%s\n' "$expected_policy" | sha256sum | awk '{print $1}')
            runner_uid=$(id -u)
            runner_gid=$(id -g)
            temporary=$(mktemp "$bootstrap_directory/.host.json.XXXXXX")
            trap 'rm -f "$temporary"' EXIT
            cat > "$temporary" <<EOF
          {
            "schema": "laplace.host-bootstrap/v1",
            "phase": "host-prerequisites-ready",
            "service_identity": {
              "user": "laplace-runner",
              "group": "laplace-runner",
              "uid": $runner_uid,
              "gid": $runner_gid
            },
            "service_envelope": {
              "path": "$service",
              "sha256": "$service_sha",
              "enabled": true,
              "started_by_bootstrap": false
            },
            "sudo_policy": {
              "path": "$sudo_policy",
              "expected_sha256": "$expected_policy_sha",
              "verification": "metadata-size-and-sudo-list",
              "service": "$service_name",
              "systemctl": "$systemctl_bin",
              "allowed_actions": ["start", "stop", "restart"]
            },
            "product_activated": false,
            "postgresql_initialized": false,
            "activation_gateway_installed": false,
            "recovered_from_live_envelope": true,
            "recovered_repository_commit": "$GITHUB_SHA"
          }
          EOF
            python3 -m json.tool "$temporary" >/dev/null
            chmod 0640 "$temporary"
            mv -f "$temporary" "$bootstrap"
            trap - EXIT
            echo "Recovered missing bootstrap receipt from the verified live host envelope: $bootstrap"
          fi

          jq -e '
            .schema == "laplace.host-bootstrap/v1" and
            .phase == "host-prerequisites-ready" and
            .service_identity.user == "laplace-runner" and
            .service_identity.group == "laplace-runner" and
            .product_activated == false and
            .postgresql_initialized == false and
            .activation_gateway_installed == false
          ' "$bootstrap" >/dev/null
          echo 'Laplace runner-owned host prerequisites verified.'

  compose-product:
    needs: runner-authority
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - oneapi
      - postgres-18
      - avx2
    timeout-minutes: 120
    outputs:
      product_receipt: ${{ steps.compose.outputs.product_receipt }}
      resource_observation: ${{ steps.compose.outputs.resource_observation }}
      package_id: ${{ steps.compose.outputs.package_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify protected product-build context and accepted PostgreSQL input
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test "$GITHUB_REPOSITORY" = SaltyPatron/Laplace-Refactor
          test "$GITHUB_REF" = refs/heads/main
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "unsupported product activation event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          test "$GITHUB_SHA" = '${{ inputs.expected_sha }}'
          git diff --quiet
          git diff --cached --quiet
          postgresql_publication=$(jq -er '.product_activation_projection.postgresql_publication.receipt' state/continuation.json)
          expected_sha=$(jq -er '.product_activation_projection.postgresql_publication.receipt_sha256' state/continuation.json)
          test -f "$postgresql_publication"
          test ! -L "$postgresql_publication"
          test "$(sha256sum "$postgresql_publication" | awk '{print $1}')" = "$expected_sha"
          python3 tools/delivery/postgresql_package_publication.py verify \
            --receipt "$postgresql_publication" >/dev/null
          printf 'postgresql_publication=%s\n' "$postgresql_publication" >> "$GITHUB_OUTPUT"

      - name: Compose or verify the exact content-addressed product package
        id: compose
        shell: bash
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/laplace-product-selection.json"
          python3 tools/product/build-package.py compose \
            --postgresql-publication '${{ steps.inputs.outputs.postgresql_publication }}' \
            --output "$selection"
          expected_plan_sha=$(jq -er '.plan_sha256' "$selection")
          product_receipt=$(jq -er '.product_receipt' "$selection")
          test -f "$product_receipt"
          test ! -L "$product_receipt"
          test "$(jq -er '.plan_sha256' "$product_receipt")" = "$expected_plan_sha"
          test "$(jq -er '.activation_eligible' "$product_receipt")" = true
          test "$(jq -er '.build_input_closure_complete' "$product_receipt")" = true
          test "$(jq -er '.product_activated' "$product_receipt")" = false
          manifest=$(jq -er '.manifest' "$product_receipt")
          expected_manifest_sha=$(jq -er '.manifest_sha256' "$product_receipt")
          test -f "$manifest"
          test ! -L "$manifest"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$expected_manifest_sha"
          package_id=$(jq -er '.package_id' "$product_receipt")
          test "$(jq -er '.package_id' "$manifest")" = "$package_id"
          physical_release=$(jq -er '.physical_root' "$product_receipt")
          logical_release=$(jq -er '.root' "$manifest")
          case "$physical_release" in
            *"$logical_release") source_root="${physical_release%"$logical_release"}" ;;
            *) echo 'product physical root does not end in its logical release root' >&2; exit 1 ;;
          esac
          expected_source_root="$(jq -er '.stage_directory' "$selection")/root"
          test "$source_root" = "$expected_source_root"
          test -d "$physical_release"

          receipt_root=$(jq -er '.instance.receipt_directory' contracts/postgresql-cluster.json)
          resource_directory="$receipt_root/cluster-activation/$package_id"
          resource_observation="$resource_directory/resource-observation.json"
          install -d -m 0750 "$resource_directory"
          python3 tools/postgresql/resourcectl.py observe-resources \
            --contract contracts/postgresql-cluster.json \
            --package-manifest "$manifest" \
            --package-physical-root "$source_root" \
            --output "$resource_observation"
          test "$(jq -er '.package_id' "$resource_observation")" = "$package_id"
          test "$(jq -er '.observation_sha256' "$resource_observation")" != null
          printf 'product_receipt=%s\n' "$product_receipt" >> "$GITHUB_OUTPUT"
          printf 'resource_observation=%s\n' "$resource_observation" >> "$GITHUB_OUTPUT"
          printf 'package_id=%s\n' "$package_id" >> "$GITHUB_OUTPUT"

  activate-product:
    needs: compose-product
    environment: product
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify protected runner-owned deployment context
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test "$GITHUB_REPOSITORY" = SaltyPatron/Laplace-Refactor
          test "$GITHUB_REF" = refs/heads/main
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "unsupported product activation event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          test "$GITHUB_SHA" = '${{ inputs.expected_sha }}'
          git diff --quiet
          git diff --cached --quiet
          release_root=/opt/laplace/releases
          test -d "$release_root"
          test ! -L "$release_root"
          test "$(stat -c '%U:%G' "$release_root")" = laplace-runner:laplace-runner
          test -w "$release_root"
          test -w /opt/laplace/runtime
          test -w /opt/laplace/pgdata/refactor

      - name: Reconcile empty uncommitted PostgreSQL candidate leaves
        shell: bash
        run: |
          set -euo pipefail
          recovery="$RUNNER_TEMP/laplace-cluster-candidate-recovery.json"
          python3 tools/delivery/cluster_candidate_recovery.py \
            --contract contracts/postgresql-cluster.json \
            --output "$recovery"
          jq -e '
            .schema == "laplace.cluster-candidate-empty-recovery/v1" and
            .blocked_count == 0 and
            (.receipt_sha256 | test("^[0-9a-f]{64}$"))
          ' "$recovery" >/dev/null

      - name: Activate PostgreSQL, Unicode, and Highway as laplace-runner
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/laplace-product-activation-result.json"
          # tools/delivery/product_activation_runner.py remains the canonical orchestrator;
          # product_activation_reconcile.py selects the physical provider and delegates to it.
          python3 tools/delivery/product_activation_reconcile.py \
            --product-receipt '${{ needs.compose-product.outputs.product_receipt }}' \
            --resource-observation '${{ needs.compose-product.outputs.resource_observation }}' \
            --repository-commit "$GITHUB_SHA" \
            --output "$result"
          jq -e \
            --arg package_id '${{ needs.compose-product.outputs.package_id }}' \
            --arg repository_commit "$GITHUB_SHA" '
            .schema == "laplace.product-activation-result/v1" and
            .phase == "product-unicode-and-highway-activated" and
            .execution_owner == "laplace-runner" and
            .root_product_executor == false and
            .package_id == $package_id and
            .repository_commit == $repository_commit and
            (.package_installation_receipt_sha256 | test("^[0-9a-f]{64}$")) and
            (.cluster_activation_receipt_sha256 | test("^[0-9a-f]{64}$")) and
            (.unicode_activation_receipt_sha256 | test("^[0-9a-f]{64}$")) and
            (.highway_activation_receipt_sha256 | test("^[0-9a-f]{64}$")) and
            (.result_sha256 | test("^[0-9a-f]{64}$"))
          ' "$result" >/dev/null
          printf 'LAPLACE_PRODUCT_ACTIVATION_RESULT=%s\n' "$result" >> "$GITHUB_ENV"

      - name: Verify the persistent DEV/BAT product directly
        shell: bash
        run: |
          set -euo pipefail
          result="$LAPLACE_PRODUCT_ACTIVATION_RESULT"
          package_id='${{ needs.compose-product.outputs.package_id }}'
          socket_directory=$(jq -er '.instance.socket_directory' contracts/postgresql-cluster.json)
          data_directory=$(jq -er '.instance.data_directory' contracts/postgresql-cluster.json)
          test -s "$result"
          test "$(jq -er '.execution_owner' "$result")" = laplace-runner
          test "$(jq -er '.root_product_executor' "$result")" = false
          cluster_result=$(jq -er '.cluster_result' "$result")
          unicode_result=$(jq -er '.unicode_result' "$result")
          highway_result=$(jq -er '.highway_result' "$result")
          for receipt in "$cluster_result" "$unicode_result" "$highway_result"; do
            test -r "$receipt"
            test ! -L "$receipt"
          done
          test "$(jq -er '.phase' "$cluster_result")" = activated
          test "$(jq -er '.package_id' "$cluster_result")" = "$package_id"
          test "$(jq -er '.restart_proven' "$cluster_result")" = true
          test "$(jq -er '.lifecycle_provider' "$cluster_result")" = pg_ctl
          test "$(jq -er '.service_integration_required' "$cluster_result")" = false
          test "$(jq -er '.package_id' "$unicode_result")" = "$package_id"
          test "$(jq -er '.package_id' "$highway_result")" = "$package_id"

          test -L /opt/laplace/current
          test "$(readlink /opt/laplace/current)" = "releases/$package_id"
          test -L /opt/laplace/runtime/refactor
          test "$(readlink /opt/laplace/runtime/refactor)" = "../releases/$package_id"

          package_root="/opt/laplace/releases/$package_id"
          pg_ctl="$package_root/pgsql-18/bin/pg_ctl"
          pg_isready="$package_root/pgsql-18/bin/pg_isready"
          psql="$package_root/pgsql-18/bin/psql"
          cognition="$package_root/bin/laplace-cognition"
          cognition_service="$package_root/bin/laplace-cognition-service"
          test -x "$pg_ctl"
          test -x "$pg_isready"
          test -x "$psql"
          test -x "$cognition"
          test -x "$cognition_service"
          "$pg_ctl" -D "$data_directory" status
          "$pg_isready" \
            --host "$socket_directory" \
            --port 55433 \
            --dbname laplace_refactor

          live_query=$(
            "$psql" \
              --host "$socket_directory" \
              --port 55433 \
              --username laplace_app \
              --dbname laplace_refactor \
              --no-psqlrc \
              --set ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --field-separator '|' \
              --command "SELECT version(),current_database(),current_user,(SELECT extversion FROM pg_extension WHERE extname='laplace')"
          )
          IFS='|' read -r live_version live_database live_role live_extension <<<"$live_query"
          [[ "$live_version" == PostgreSQL\ 18.6* ]]
          test "$live_database" = laplace_refactor
          test "$live_role" = laplace_app
          [[ "$live_extension" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Execute installed product cognition proof
        shell: bash
        run: |
          set -euo pipefail
          package_id='${{ needs.compose-product.outputs.package_id }}'
          receipt_root=$(jq -er '.instance.receipt_directory' contracts/postgresql-cluster.json)
          proof="$receipt_root/cluster-activation/$package_id/installed-cognition-proof.json"
          python3 tools/delivery/product_cognition_live_proof.py --output "$proof"
          jq -e \
            --arg package_id "$package_id" '
            .schema == "laplace.installed-product-cognition-proof/v1" and
            .package_id == $package_id and
            .prompt_utf8 == "AA" and
            .observed_output_utf8 == "A" and
            .execution.status == 0 and
            .execution.completed_steps == 2 and
            .execution.emitted_parts == 1 and
            (.execution.execution_receipt_id | test("^\\\\x[0-9a-f]{64}$")) and
            (.proof_sha256 | test("^[0-9a-f]{64}$"))
          ' "$proof" >/dev/null

      - name: Converge runner-owned package receipt estate
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/receipt_estate_runner_tests.py
          result="$RUNNER_TEMP/laplace-runner-receipt-estate.json"
          python3 tools/delivery/receipt_estate_runner.py \
            --cluster-contract contracts/postgresql-cluster.json \
            --output "$result"
          package_id='${{ needs.compose-product.outputs.package_id }}'
          receipt_root=$(jq -er '.instance.receipt_directory' contracts/postgresql-cluster.json)
          generation="$receipt_root/cluster-activation/$package_id"
          jq -e '
            .schema == "laplace.runner-receipt-estate-convergence/v1" and
            (.migration_count | type) == "number" and
            (.preserved_unknown_or_conflicting | type) == "array" and
            (.receipt_sha256 | test("^[0-9a-f]{64}$"))
          ' "$result" >/dev/null
          for required in \
            resource-observation.json \
            package-installation.json \
            activation-result.json \
            indexed-cognition-upgrade.json \
            public-readback-bindings.json \
            release-capacity.json \
            unicode-product-activation.json \
            highway-product-activation.json \
            installed-cognition-proof.json; do
            test -f "$generation/$required"
            test ! -L "$generation/$required"
          done
          test ! -e "$receipt_root/unicode-product-activation.json"
          test ! -e "$receipt_root/highway-product-activation.json"

      - name: Start and execute the installed Laplace cognition surface
        shell: bash
        run: |
          set -euo pipefail
          package_id='${{ needs.compose-product.outputs.package_id }}'
          service=/opt/laplace/runtime/refactor/bin/laplace-cognition-service
          client=/opt/laplace/runtime/refactor/bin/laplace-cognition
          service_socket=/opt/laplace/runtime/laplace-cognition.sock
          test -x "$service"
          test -x "$client"
          test -d /opt/laplace/runtime
          test ! -L /opt/laplace/runtime
          sudo -n /usr/bin/systemctl restart laplace-refactor-cognition.service
          for attempt in {1..30}; do
            if observed="$($client --relations constituent AA 2>/dev/null)" && [[ "$observed" == A ]]; then break; fi
            [[ "$attempt" != 30 ]] || { echo 'Installed cognition service did not become ready' >&2; exit 1; }
            sleep 1
          done

          test -S "$service_socket"
          test "$(stat -c '%a' "$service_socket")" = 666

          observed="$($client --relations constituent 'AA')"
          test "$observed" = A
          structured="$($client --relations constituent --json 'AA')"
          test "$(jq -r '.status' <<<"$structured")" = 0
          test "$(jq -r '.output_utf8' <<<"$structured")" = A
          test "$(jq -r '.relations | join(",")' <<<"$structured")" = constituent
          test "$(jq -r '.execution_route' <<<"$structured")" = explicit-firmware

          state_root="$RUNNER_TEMP/laplace-cognition-state"
          rm -rf "$state_root"
          first="$($client --session activation-native --state-root "$state_root" --reset-session --json 'AA')"
          jq -e '
            .status == 0 and
            .mode == "auto" and
            .execution_route == "native-conversation" and
            .turn_ordinal == 0 and
            .continued == false and
            (.checkpoint_hex | type == "string" and length > 0) and
            (.next_checkpoint_fingerprint | test("^[0-9a-f]{64}$")) and
            (.execution.execution_receipt_id | test("^\\\\x[0-9a-f]{64}$"))
          ' <<<"$first" >/dev/null
          first_checkpoint=$(jq -er '.next_checkpoint_fingerprint' <<<"$first")

          second="$($client --session activation-native --state-root "$state_root" --json 'AA')"
          jq -e '
            .status == 0 and
            .mode == "auto" and
            .execution_route == "native-conversation" and
            .turn_ordinal == 1 and
            .continued == true and
            (.checkpoint_hex | type == "string" and length > 0) and
            (.next_checkpoint_fingerprint | test("^[0-9a-f]{64}$")) and
            (.execution.execution_receipt_id | test("^\\\\x[0-9a-f]{64}$"))
          ' <<<"$second" >/dev/null
          second_checkpoint=$(jq -er '.next_checkpoint_fingerprint' <<<"$second")
          test "$second_checkpoint" != "$first_checkpoint"

          {
            echo '## Installed usable cognition surface'
            echo '- command: `/opt/laplace/current/bin/laplace-cognition`'
            echo '- transport: local Unix socket `/opt/laplace/runtime/laplace-cognition.sock`; no TCP listener'
            echo '- no database role, sudo, environment variable, receipt path, or SQL is required by the caller'
            echo '- explicit compatibility: `laplace-cognition --relations constituent AA` returned `A` through installed firmware execution'
