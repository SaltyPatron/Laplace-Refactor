name: cold-readback-repair
on:
  push:
    branches: ['fix/public-cold-readback']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retain exact source for cold-readback repair
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cold-readback"
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/cold-readback/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/cold-readback/identity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cold-readback-source-${{ github.sha }}
          path: ${{ runner.temp }}/cold-readback/
          retention-days: 7
