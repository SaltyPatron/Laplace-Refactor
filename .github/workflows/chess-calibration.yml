name: Chess machine calibration

on:
  workflow_call:
    inputs:
      cpu_budget:
        required: false
        type: string
        default: ""
      memory_mib:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      cpu_budget:
        description: Whole CPU equivalents available to the experiment (blank uses observed bound)
        required: false
        type: string
      memory_mib:
        description: Memory budget in MiB (blank fits the sweep demand within observed headroom)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: explicit-chess-calibration
  cancel-in-progress: false

defaults:
  run:
    shell: bash tools/host/run-exclusive.sh bash --noprofile --norc -e -o pipefail {0}

jobs:
  calibrate:
    name: ${{ github.event_name == 'pull_request' && 'Candidate dependency calibration' || 'Chess machine calibration' }}
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 60
    env:
      TMPDIR: /build/laplace/work
      TMP: /build/laplace/work
      TEMP: /build/laplace/work
      CHESS_EVIDENCE_CONTEXT: ${{ github.event_name == 'pull_request' && 'candidate-chess-dependencies' || 'chess-dependencies' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify official chess sources in the configured dependency estate
        run: |
          output="$RUNNER_TEMP/chess-calibration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$output"
          scripts/setup-chess.sh 2>&1 | tee "$output/source-setup.log"
      - name: Measure the actual runner with bounded resource admission
        env:
          CPU_BUDGET: ${{ inputs.cpu_budget }}
          MEMORY_MIB: ${{ inputs.memory_mib }}
        run: |
          limits=()
          [[ -z "$CPU_BUDGET" ]] || limits+=(--cpu-budget "$CPU_BUDGET")
          [[ -z "$MEMORY_MIB" ]] || limits+=(--memory-mib "$MEMORY_MIB")
          # The surrounding shell owns the shared host lock for the complete sweep.
          python3 tools/dependencies/chess_benchmark.py run \
            --output "$RUNNER_TEMP/chess-calibration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/measurements" \
            --hash-mib 16,64,256 --depth 12 --samples 3 --warmups 1 \
            --games 16 --game-depth 8 --game-time-control 60 --timeout 600 --overall-timeout 1800 "${limits[@]}"
      - name: Retain exact execution context separately from product activation
        if: always()
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          output = Path(os.environ["RUNNER_TEMP"]) / f"chess-calibration-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          output.mkdir(parents=True, exist_ok=True)
          paths = ["dependencies/lock.json", "dependencies/artifact-lock.json", "dependencies/chess-release-selection.json", "tools/dependencies/chess_tools.py", "tools/dependencies/git_checkout.py", "tools/dependencies/chess_benchmark.py", "tools/dependencies/chess_pgn.py", "tools/dependencies/source_estate.py"]
          context = {
              "schema": "laplace.chess-calibration-execution-context/v1",
              "scope": os.environ["CHESS_EVIDENCE_CONTEXT"],
              "capability": "Stockfish and CuteChess source dependency builds and machine calibration",
              "product_activation_evidence": "separate product activation workflow; this dependency report does not establish product activation",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "requested_sha": os.environ["GITHUB_SHA"],
              "checked_out_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name": os.environ["RUNNER_NAME"],
              "hostname": platform.node(),
              "input_sha256": {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths},
          }
          (output / "execution-context.json").write_text(json.dumps(context, indent=2, sort_keys=True) + "\n")
          PYTHON
      - name: Retain machine observations, all timed samples and paired PGNs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.CHESS_EVIDENCE_CONTEXT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chess-calibration-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
