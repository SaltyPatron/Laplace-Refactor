name: persisted-indexed-validation
on:
  push:
    branches: ['fix/persisted-cognition-provider']
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Publish the exact diagnosed native-provider capacity correction
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name SaltyPatron
          git config user.email thesaltypatron@gmail.com
          git checkout -B fix/persisted-cognition-provider "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('integrations/postgresql/extension/src/observation_cognition_persisted_pg.c')
          old='    provider.maximum_candidate_records_per_expansion = state.memory_limit / 64u;'
          new='    provider.maximum_candidate_records_per_expansion =\n        request.search_budget.transition_batch_capacity;\n    if (provider.maximum_candidate_records_per_expansion > state.memory_limit / 64u)\n        provider.maximum_candidate_records_per_expansion = state.memory_limit / 64u;'
          text=p.read_text();assert text.count(old)==1;p.write_text(text.replace(old,new))
          data=p.read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='d6677cb4d6e83170607b619add2d24cbeb3cdc58'
          PY
          git rm .github/indexed-transfer/part{1,2,3,4}.b64
          git add integrations/postgresql/extension/src/observation_cognition_persisted_pg.c
          ./tools/tests/verify-requirements.sh
          git commit -m 'Respect the admitted native candidate batch capacity in the PostgreSQL provider'
          git push origin HEAD:refs/heads/fix/persisted-cognition-provider
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git bundle create "$RUNNER_TEMP/indexed-source.bundle" --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: indexed-integrated-source-${{ github.run_id }}
          path: ${{ runner.temp }}/indexed-source.bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  postgresql:
    needs: integrate
    runs-on: [self-hosted, Linux, X64, laplace-refactor, postgres-18]
    timeout-minutes: 30
    concurrency:
      group: laplace-physical-product-proof
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.integrate.outputs.source_sha }}
          persist-credentials: false
      - name: Compile actual extension and execute indexed cognition in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          build="$RUNNER_TEMP/laplace-indexed-$GITHUB_RUN_ID"
          inputs="$RUNNER_TEMP/laplace-indexed-inputs-$GITHUB_RUN_ID"
          mkdir -p "$build"
          ./tools/dependencies/acquire-locked-git.sh dependencies/lock.json "$inputs" blake3 eigen googletest spectra tree-sitter
          cmake -S . -B "$build" -G Ninja \
            -DPython3_EXECUTABLE=/usr/bin/python3 -DCMAKE_BUILD_TYPE=Debug \
            -DLAPLACE_PG_CONFIG=/opt/laplace/current/pgsql-18/bin/pg_config \
            -DLAPLACE_BLAKE3_SOURCE="$inputs/blake3/c" \
            -DLAPLACE_GTEST_SOURCE="$inputs/googletest" \
            -DLAPLACE_EIGEN_SOURCE="$inputs/eigen" \
            -DLAPLACE_SPECTRA_SOURCE="$inputs/spectra" \
            -DLAPLACE_TREE_SITTER_SOURCE="$inputs/tree-sitter" 2>&1 | tee "$build/configure.log"
          cmake --build "$build" --parallel 4 --target \
            laplace_pg laplace_postgres_observation_cognition_probe laplace_observation_query_tests \
            2>&1 | tee "$build/build.log"
          "$build/laplace_observation_query_tests" 2>&1 | tee "$build/native-tests.log"
          ctest --test-dir "$build" -R '^postgres.observation-cognition-native-parity$' \
            --output-on-failure --no-tests=error 2>&1 | tee "$build/postgresql-tests.log"
      - name: Retain exact compilation and database execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: indexed-postgresql-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/laplace-indexed-${{ github.run_id }}/*.log
            ${{ runner.temp }}/laplace-indexed-${{ github.run_id }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 7
