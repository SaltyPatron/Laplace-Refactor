name: one-shot-composition-identity-source

on:
  push:
    branches:
      - product/installed-cognition-surface

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: product/installed-cognition-surface
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          composition = Path('engine/src/composition_legacy.inc')
          text = composition.read_text(encoding='utf-8')
          macro = 'LAPLACE_TEST_COMPOSITION_PHYSICAL_PLAN_IN_SEMANTIC_RECEIPT'
          if macro not in text:
              marker = '    HashU64(hasher, state.summary.novel_entity_count);\n'
              block = '\n'.join([
                  '#if defined(LAPLACE_TEST_COMPOSITION_PHYSICAL_PLAN_IN_SEMANTIC_RECEIPT)',
                  '    for (const auto& execution_receipt : state.frontier_execution_receipts) {',
                  '        blake3_hasher_update(',
                  '            &hasher, execution_receipt.plan_fingerprint.bytes,',
                  '            sizeof(execution_receipt.plan_fingerprint.bytes));',
                  '    }',
                  '#endif',
                  '',
              ])
              if text.count(marker) != 1:
                  raise SystemExit(f'composition insertion marker count={text.count(marker)}')
              composition.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')

          cmake = Path('tests/composition_occurrence.cmake')
          text = cmake.read_text(encoding='utf-8')
          test_name = 'composition.mutation-physical-plan-semantic-identity-detected'
          if test_name not in text:
              marker = 'include("${CMAKE_CURRENT_SOURCE_DIR}/tests/source_structural_witness.cmake")\n'
              lines = [
                  'add_library(laplace_composition_physical_plan_identity_mutant STATIC',
                  '    "${CMAKE_CURRENT_SOURCE_DIR}/engine/src/composition.cpp")',
                  'target_include_directories(laplace_composition_physical_plan_identity_mutant PRIVATE',
                  '    "${CMAKE_CURRENT_SOURCE_DIR}/engine/include"',
                  '    "${CMAKE_BINARY_DIR}/generated")',
                  'target_link_libraries(laplace_composition_physical_plan_identity_mutant PRIVATE',
                  '    Laplace::Engine BLAKE3::blake3)',
                  'target_compile_definitions(laplace_composition_physical_plan_identity_mutant PRIVATE',
                  '    LAPLACE_TEST_COMPOSITION_PHYSICAL_PLAN_IN_SEMANTIC_RECEIPT=1)',
                  'target_compile_options(laplace_composition_physical_plan_identity_mutant PRIVATE',
                  '    $<$<COMPILE_LANG_AND_ID:CXX,GNU,Clang>:-Wall;-Wextra;-Wpedantic;-Werror;-Wconversion;-Wshadow>)',
                  '',
                  'add_executable(laplace_composition_physical_plan_identity_mutation_probe',
                  '    "${CMAKE_CURRENT_SOURCE_DIR}/tests/composition_frontier_runtime_tests.cpp")',
                  'target_include_directories(laplace_composition_physical_plan_identity_mutation_probe PRIVATE',
                  '    "${CMAKE_CURRENT_SOURCE_DIR}/tests")',
                  'target_link_libraries(laplace_composition_physical_plan_identity_mutation_probe PRIVATE',
                  '    laplace_composition_physical_plan_identity_mutant',
                  '    Laplace::Engine',
                  '    GTest::gtest_main)',
                  'target_compile_options(laplace_composition_physical_plan_identity_mutation_probe PRIVATE',
                  '    $<$<CXX_COMPILER_ID:GNU,Clang>:-Wall;-Wextra;-Wpedantic;-Werror;-Wconversion;-Wshadow>)',
                  'add_test(',
                  '    NAME composition.mutation-physical-plan-semantic-identity-detected',
                  '    COMMAND "${CMAKE_COMMAND}"',
                  '        "-DPROBE=$<TARGET_FILE:laplace_composition_physical_plan_identity_mutation_probe>"',
                  '        "-DFILTER=CompositionFrontierRuntime.WorkerGrantAndChunkPlanCannotAlterCanonicalSemanticIdentity"',
                  '        -P "${CMAKE_CURRENT_SOURCE_DIR}/tests/expect_gtest_failure.cmake")',
                  'set_tests_properties(',
                  '    composition.mutation-physical-plan-semantic-identity-detected PROPERTIES',
                  '    LABELS "implementation;composition;execution;identity;receipt;determinism;mutation")',
                  '',
              ]
              block = '\n'.join(lines)
              if text.count(marker) != 1:
                  raise SystemExit(f'CMake insertion marker count={text.count(marker)}')
              cmake.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')

          registry = Path('tests/registry.d/composition-frontier.json')
          document = json.loads(registry.read_text(encoding='utf-8'))
          if not any(item.get('ctest_name') == test_name for item in document['tests']):
              document['tests'].append({
                  'ctest_name': test_name,
                  'evidence_targets': [
                      'LP-TEST-BULK-DETERMINISM',
                      'LP-TEST-FRAMEWORK-RESOURCE-APPLICATION',
                      'LP-TEST-TOPOLOGY-CROSS-ROUTE-PARITY',
                  ],
                  'covered_dimensions': [
                      'changing physical worker grant and chunk plan cannot alter canonical composition publication identity',
                      'the deliberate mutant hashes execution-plan fingerprints into semantic working-set identity and must be detected',
                  ],
                  'defect_controls': [
                      'physical worker or batch scheduling metadata enters canonical semantic composition identity',
                  ],
              })
              registry.write_text(json.dumps(document, indent=2) + '\n', encoding='utf-8')
          PY

          if git diff --quiet -- engine/src/composition_legacy.inc tests/composition_occurrence.cmake tests/registry.d/composition-frontier.json; then
            exit 0
          fi
          grep -F 'LAPLACE_TEST_COMPOSITION_PHYSICAL_PLAN_IN_SEMANTIC_RECEIPT' engine/src/composition_legacy.inc
          grep -F 'composition.mutation-physical-plan-semantic-identity-detected' tests/composition_occurrence.cmake
          git config user.name laplace-ci
          git config user.email laplace-ci@users.noreply.github.com
          git add engine/src/composition_legacy.inc tests/composition_occurrence.cmake tests/registry.d/composition-frontier.json
          git commit -m 'Prove physical execution plan cannot enter composition identity'
          git push origin HEAD:product/installed-cognition-surface
