name: one-shot-composition-identity-source

on:
  push:
    branches: [product/installed-cognition-surface]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: product/installed-cognition-surface
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          if grep -q 'LAPLACE_TEST_COMPOSITION_PHYSICAL_PLAN_IN_SEMANTIC_RECEIPT' engine/src/composition_legacy.inc; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/src/composition_legacy.inc')
          text = path.read_text(encoding='utf-8')
          marker = '    HashU64(hasher, state.summary.novel_entity_count);\n'
          block = '''#if defined(LAPLACE_TEST_COMPOSITION_PHYSICAL_PLAN_IN_SEMANTIC_RECEIPT)
    for (const auto& execution_receipt : state.frontier_execution_receipts) {
        blake3_hasher_update(
            &hasher, execution_receipt.plan_fingerprint.bytes,
            sizeof(execution_receipt.plan_fingerprint.bytes));
    }
#endif
'''
          if text.count(marker) != 1:
              raise SystemExit(f'insertion marker count={text.count(marker)}')
          path.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')
          PY
          git config user.name laplace-ci
          git config user.email laplace-ci@users.noreply.github.com
          git add engine/src/composition_legacy.inc
          git commit -m 'Add physical-plan semantic-identity mutant hook'
          git push origin HEAD:product/installed-cognition-surface
