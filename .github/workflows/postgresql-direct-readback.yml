name: postgresql-direct-readback

on:
  push:
    branches: ['fix/start-stopped-selected-postgresql']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-activation-refs/heads/main
  cancel-in-progress: false

jobs:
  direct-readback:
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Inspect selected predecessor without lifecycle or configuration mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          export PROBE_OUTPUT="$RUNNER_TEMP/predecessor-readback.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import runpy
          import subprocess

          module = runpy.run_path('tools/delivery/product_predecessor_adoption.py')
          ctl = module['clusterctl']
          contract = ctl.load_json(Path('contracts/postgresql-cluster.json'))
          ctl.validate_contract(contract)
          package_id = module['_active_package_id'](contract)
          directory = module['_activation_directory'](contract, package_id)
          receipt = ctl.load_json(directory / 'activation-complete.json')
          plan_path, plan = module['_load_plan'](receipt, contract, package_id)
          module['_require_selection'](contract, package_id)
          status = subprocess.run(ctl._pg_ctl_command(plan, 'status'),
              cwd='/', env=ctl.activation_environment(), text=True,
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=30)
          safe = {'data_directory', 'hba_file', 'ident_file', 'port',
              'unix_socket_directories', 'shared_preload_libraries',
              'dynamic_library_path', 'include', 'include_if_exists',
              'include_dir', 'shared_buffers', 'max_connections',
              'effective_cache_size', 'work_mem', 'maintenance_work_mem',
              'max_worker_processes', 'max_parallel_workers',
              'max_parallel_workers_per_gather', 'huge_pages',
              'listen_addresses', 'temp_tablespaces', 'logging_collector',
              'log_directory', 'log_filename'}
          def visible_lines(data):
              result = []
              for line in data.decode('utf-8', errors='replace').splitlines():
                  if not line.strip() or line.lstrip().startswith('#'):
                      continue
                  match = re.match(r'\s*([a-zA-Z_][a-zA-Z0-9_.]*)\s*(?:=|\s)', line)
                  key = match.group(1) if match else None
                  if key in safe:
                      result.append(line)
                  else:
                      result.append({'setting': key, 'line_sha256': hashlib.sha256(line.encode()).hexdigest()})
              return result
          files = []
          for entry in plan['files']:
              path = Path(entry['path'])
              item = {'path': str(path), 'expected_sha256': entry['sha256'],
                      'present': path.is_file(), 'symlink': path.is_symlink()}
              if path.is_file() and not path.is_symlink():
                  actual = path.read_bytes()
                  item['actual_sha256'] = hashlib.sha256(actual).hexdigest()
                  item['matches'] = item['actual_sha256'] == entry['sha256']
                  if not item['matches'] and path.name == 'postgresql.conf':
                      item['expected_settings'] = visible_lines(entry['content'].encode())
                      item['actual_settings'] = visible_lines(actual)
              files.append(item)
          result = {'schema': 'laplace.predecessor-read-only-inspection/v1',
              'repository_commit': os.environ['GITHUB_SHA'], 'package_id': package_id,
              'plan_path': str(plan_path), 'plan_sha256': plan['plan_sha256'],
              'pg_ctl_status': status.returncode, 'files': files,
              'database_mutations': 0, 'configuration_mutations': 0}
          Path(os.environ['PROBE_OUTPUT']).write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Retain exact tracked source for reproducible offline repair testing
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/repair-source.tar.gz"
          sha256sum "$RUNNER_TEMP/repair-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: predecessor-readback-${{ github.sha }}
          path: |
            ${{ runner.temp }}/predecessor-readback.json
            ${{ runner.temp }}/repair-source.tar.gz
          if-no-files-found: error
          retention-days: 7
