name: Qualify measured profiles and managed build lifetime
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TMPDIR: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b042de4216e1d674effe5bd3e8ecf3ebc7aeddac
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate prepared source leaves and execute behavior controls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import ast,base64,hashlib,io,json,os,pathlib,subprocess,sys,urllib.request,zipfile,yaml
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"refactor-completion-qualification"
          out.mkdir()
          base="https://api.github.com/repos/SaltyPatron/Laplace-Refactor"
          def get(path):
              request=urllib.request.Request(base+path,headers={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              request.add_unredirected_header("Authorization","Bearer "+os.environ["GH_TOKEN"])
              with urllib.request.urlopen(request,timeout=60) as response:return response.read()
          leaves={"tools/bindings/build-dotnet.py":"7f08e3ebb0339bae0dc641cc754b7826d06f1e25","cmake/LaplaceDotnetBindings.cmake":"4c15864d9ebdc47cda1f45c6f3d5cbc55828cd73","tests/CMakeLists.txt":"b72664861103c1a14eee8f4a2bf93da7132088f7","tests/chess_host_evidence_tests.py":"9ac89dcf4aa4fe1c1b90a3c2fa5f31b49bb15d29","tests/program_authority_tests.py":"d3e84eb1ffee907c431001a009f3f09fb199f98f","tools/dependencies/chess_profiles.py":"b5254cb7a45be475752912a0d33cc4595f6de02f","tools/dependencies/chess_tools.py":"a1b81bee8b16532de991abb1f6f40d7302c2dc8d","tests/chess_dependency_tests.py":"25f9185ed92fcedca1b9d622aa873585bc989262",".github/workflows/chess-calibration.yml":"7c3729c6a4bc095b64df907ce8bf1690d1c46441"}
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()=="b042de4216e1d674effe5bd3e8ecf3ebc7aeddac"
          for relative,digest in leaves.items():
              record=json.loads(get("/git/blobs/"+digest))
              assert record["sha"]==digest and record["encoding"]=="base64"
              data=base64.b64decode(record["content"])
              assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()==digest
              path=root/relative
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              if path.suffix==".py":ast.parse(data)
              if path.suffix in (".yml",".yaml"):yaml.safe_load(data)
          report={"source_base":"b042de4216e1d674effe5bd3e8ecf3ebc7aeddac","prepared_blobs":leaves,"checks":[]}
          commands=[
              ["python3","-B","tests/chess_dependency_tests.py","MeasuredChessProfiles"],
              ["python3","-B","tests/chess_host_evidence_tests.py",
               "HostEvidence.test_managed_build_without_host_descriptor_preserves_arguments_and_exit_status",
               "HostEvidence.test_managed_child_cannot_retain_foreground_lock_and_missing_closure_is_detected"],
              ["python3","-B","tests/program_authority_tests.py"]]
          for index,command in enumerate(commands):
              result=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180)
              (out/(str(index)+".log")).write_text(result.stdout)
              report["checks"].append({"command":command,"exit_code":result.returncode})
              print(json.dumps(report["checks"][-1]))
              print(result.stdout[-16000:])
          try:
              metadata=json.loads(get("/actions/artifacts/10474698366"))
              assert metadata["workflow_run"]["id"]==35163097838 and metadata["size_in_bytes"]==8060347 and not metadata["expired"]
              expected="5d9e6f96d52eb5e504828f7d4fe80873457ed4f4e372ca3e4d4e3dbb37ba0058"
              assert metadata["digest"]=="sha256:"+expected
              data=get("/actions/artifacts/10474698366/zip")
              assert hashlib.sha256(data).hexdigest()==expected
              archive=zipfile.ZipFile(io.BytesIO(data))
              names=[name for name in archive.namelist() if name=="measurements/receipt.json"]
              assert len(names)==1
              measured=json.loads(archive.read(names[0]))
              sys.path.insert(0,str(root/"tools/dependencies"))
              import chess_profiles
              selected=chess_profiles.recommendations(measured)
              identity=chess_profiles.tool_identity(measured["tool_identity"])
              signature=chess_profiles.host_signature(measured["host"])
              report["actual_calibration_compatibility"]={"status":"passed","artifact":10474698366,
                  "zip_sha256":expected,"selected":selected,"tool_identity":identity,
                  "scope":"Parser and selection against authenticated actual report; hosted worker is not the measured machine."}
              print(json.dumps(report["actual_calibration_compatibility"],sort_keys=True))
          except Exception as error:
              report["actual_calibration_compatibility"]={"status":"failed","error":str(error)}
              print(json.dumps(report["actual_calibration_compatibility"],sort_keys=True))
          report["status"]="passed" if all(check["exit_code"]==0 for check in report["checks"]) and report["actual_calibration_compatibility"]["status"]=="passed" else "failed"
          (out/"result.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("COMPLETION_QUALIFICATION_"+report["status"].upper())
          raise SystemExit(0 if report["status"]=="passed" else 1)
          PY
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refactor-completion-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/refactor-completion-qualification/
          if-no-files-found: error
          retention-days: 90
