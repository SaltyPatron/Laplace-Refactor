name: Inspect exact historical toolchain provider access
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 5
    steps:
      - name: Observe the selected immutable provider and its parents
        shell: bash
        run: |
          python3 -B - <<'PY'
          import grp, json, os, pathlib, pwd, stat
          prefix=pathlib.Path("/opt/laplace/stage/toolchain/2e899074f53c0495ab966196c15cd89de8b0bd61c87e6591edf5b2801ef55ea6/toolchain")
          paths=list(reversed(prefix.parents))+[prefix,prefix/"share",prefix/"share/laplace",prefix/"share/laplace/toolchain-manifest.json"]
          report={"uid":os.getuid(),"gid":os.getgid(),"groups":os.getgroups(),"paths":[]}
          for path in paths:
              record={"path":str(path),"readable":os.access(path,os.R_OK),"traversable":os.access(path,os.X_OK)}
              try:
                  info=path.lstat()
                  record.update(uid=info.st_uid,gid=info.st_gid,mode=oct(stat.S_IMODE(info.st_mode)),
                      device=info.st_dev,inode=info.st_ino,kind="symlink" if stat.S_ISLNK(info.st_mode) else "directory" if stat.S_ISDIR(info.st_mode) else "file",
                      owner=pwd.getpwuid(info.st_uid).pw_name,group=grp.getgrgid(info.st_gid).gr_name)
                  if path.is_symlink(): record["link"]=os.readlink(path)
              except OSError as error: record["error"]={"type":type(error).__name__,"errno":error.errno}
              report["paths"].append(record)
          print(json.dumps(report,sort_keys=True))
          PY
