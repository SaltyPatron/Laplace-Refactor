name: Observe exact packaged public reconciliation binding
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  observe:
    runs-on: [self-hosted, Linux, X64, laplace-refactor, oneapi, postgres-18, avx2]
    timeout-minutes: 3
    steps:
      - name: Read fixed package metadata and installed binding without host mutation
        shell: bash
        run: |
          python3 -I - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path
          package="d854e1d89e71cbb75a7c94817973ed055f1d496caf712afd430327ebd884264a"
          build=Path("/build/laplace/runner/product/build/d42ce0a0e07e75d54506ae31b1bfaff0b1df7046b0d15843eae535f0ceb5903e")
          manifest_path=build/"package-manifest.json"
          receipt_path=build/"package-receipt.json"
          def load(path):
              assert path.is_file() and not path.is_symlink()
              raw=path.read_bytes()
              assert len(raw)<=16000000
              return json.loads(raw),hashlib.sha256(raw).hexdigest()
          receipt,_=load(receipt_path)
          manifest,manifest_sha=load(manifest_path)
          assert receipt["package_id"]==manifest["package_id"]==package
          assert receipt["manifest"]==str(manifest_path)
          assert receipt["manifest_sha256"]==manifest_sha
          relative="pgsql-18/share/extension/laplace-public-readback.sql"
          path=Path("/opt/laplace/releases")/package/relative
          info=path.lstat()
          entries=[row for row in manifest["files"] if row["path"]==relative]
          raw=path.read_bytes() if stat.S_ISREG(info.st_mode) else b""
          digest=hashlib.sha256(raw).hexdigest()
          current=Path("/opt/laplace/current")
          result={"schema":"laplace.public-binding-failure-observation/v1",
              "source_run":35208985114,"source_job":105171045703,
              "package_id":package,"manifest_sha256":manifest_sha,
              "manifest_entries":entries,"installed_path":str(path),
              "regular_file":stat.S_ISREG(info.st_mode),"symlink":stat.S_ISLNK(info.st_mode),
              "bytes":info.st_size,"sha256":digest,"device":info.st_dev,"inode":info.st_ino,
              "old_65536_byte_check_passes":info.st_size<=65536,
              "manifest_hash_matches":len(entries)==1 and entries[0].get("sha256")==digest,
              "active_link":os.readlink(current) if current.is_symlink() else None,
              "active_resolved":str(current.resolve(strict=True))}
          print("PUBLIC_BINDING_OBSERVATION "+json.dumps(result,sort_keys=True),flush=True)
          PY
