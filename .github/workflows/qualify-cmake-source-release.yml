      - name: Retain operation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmake-component-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CMAKE_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 90
