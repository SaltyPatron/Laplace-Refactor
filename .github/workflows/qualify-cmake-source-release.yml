name: Hosted C++ grammar generation experiment
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qualify-cmake-source-release.yml"
permissions:
  contents: read
concurrency:
  group: hosted-cpp-grammar-experiment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  grammar-generation:
    name: Exact upstream generator and scratch grammar comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QUALIFICATION_ROOT: ${{ github.workspace }}/hosted-cpp-grammar-experiment
    steps:
      - name: Retrieve immutable prepared operator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ["QUALIFICATION_ROOT"])
          target = root / "evidence" / "bootstrap"
          target.mkdir(parents=True, exist_ok=False)
          blob = "b2f5d78e2fca62b4d2e7815a6abf4d8b76f6c460"
          expected = "837f49dfa6cd816bafeddf181c273b27340a3aefd04cab2c68657de34e6fac29"
          url = "https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/" + blob
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github.raw+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Laplace-hosted-grammar-experiment",
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          observed_blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if observed_blob != blob or hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("immutable prepared operator identity mismatch")
          (target / "qualify.py").write_bytes(data)
          (target / "identity.json").write_text(json.dumps({
              "git_blob": blob, "sha256": expected, "bytes": len(data),
              "workflow_sha": os.environ["GITHUB_SHA"],
              "scope": "hosted scratch syntax experiment; no installed provider qualification",
          }, indent=2) + "\n")
          PY
      - name: Validate operator syntax before source acquisition
        shell: bash
        run: |
          python3 -m py_compile "$QUALIFICATION_ROOT/evidence/bootstrap/qualify.py"
      - name: Generate and inspect actual before and after parsers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 "$QUALIFICATION_ROOT/evidence/bootstrap/qualify.py"
      - name: Retain source identities, generation failures, corpus output and CSTs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-cpp-grammar-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
