name: Qualify GNU alias grammar against immutable Stockfish source
on:
  workflow_dispatch:
  push:
    branches: ["qualify/cmake-source-443-20260916"]
    paths: [".github/workflows/qualify-cmake-source-release.yml"]
permissions:
  contents: read
  actions: read
jobs:
  gnu-alias-source-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: "/dev/null"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f510bc4dae608dd9f34ab8e5555c19350d14b039
          persist-credentials: false
      - name: Establish ordinary hosted build and evidence paths
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          qualification_root="/build/laplace/work/gnu-alias-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          qualification_build="/build/laplace/build/gnu-alias-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$qualification_root"
          test ! -e "$qualification_build"
          sudo install -d -m 0775 -o "$(id -u)" -g "$(id -g)" \
            "$qualification_root" "$qualification_build"
          mkdir -p "$qualification_root/evidence/inputs" "$qualification_root/tmp"
          printf 'QUALIFICATION_ROOT=%s\n' "$qualification_root" >> "$GITHUB_ENV"
          printf 'QUALIFICATION_BUILD=%s\n' "$qualification_build" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s/tmp\nTMP=%s/tmp\nTEMP=%s/tmp\n' \
            "$qualification_root" "$qualification_root" "$qualification_root" >> "$GITHUB_ENV"
      - name: Install ordinary hosted compiler tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build jq build-essential
      - name: Authenticate the prepared experiment and parser helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ["QUALIFICATION_ROOT"], "evidence/inputs")
          assets = {
              "prior-experiment.py": "fe2781ef8a80795b20ba4a6f559950be891d0b46",
              "gnu-alias-experiment.py": "8a78b0e65e23f04d78e95eb145e977db4bb4c81a",
          }
          for name, identity in assets.items():
              request = urllib.request.Request(
                  "https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/" + identity,
                  headers={"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              request.add_unredirected_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
              with urllib.request.urlopen(request, timeout=60) as response:
                  row = json.load(response)
              assert row["sha"] == identity and row["encoding"] == "base64"
              data = base64.b64decode(row["content"], validate=False)
              assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == identity
              ast.parse(data, filename=name)
              (root / name).write_bytes(data)
          print("Authenticated both immutable Python owners; AST parsing passed.")
          PY
      - name: Generate parsers and verify byte order and complete native corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, runpy, traceback
          evidence = pathlib.Path(os.environ["QUALIFICATION_ROOT"], "evidence")
          try:
              runpy.run_path(str(evidence / "inputs/gnu-alias-experiment.py"), run_name="__main__")
          except BaseException:
              (evidence / "launcher-exception.txt").write_text(traceback.format_exc())
              raise
          PY
      - name: Retain exact sources parser outputs native evidence and partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnu-alias-source-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_ROOT }}/evidence
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
