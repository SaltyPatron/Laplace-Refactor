name: Read direct container goal actual PostgreSQL failure
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  read-retained:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate existing artifact and report actual lane timing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile
          base='https://api.github.com/repos/SaltyPatron/Laplace-Refactor'
          def get(path):
              request=urllib.request.Request(base+path,headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              request.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
              with urllib.request.urlopen(request,timeout=60) as response:
                  return response.read()
          run=json.loads(get('/actions/runs/35176178856'))
          assert run['head_sha']=='c23d17ab9997ed0e87dc8e9d0165b6208ae7db18'
          assert run['event']=='pull_request' and run['head_branch']=='fix/ci-execution-owners-20260916'
          artifact=json.loads(get('/actions/artifacts/10480366088'))
          assert artifact['workflow_run']['id']==35176178856
          assert not artifact['expired']
          expected='60ed94e5f5ebd46b10969162ecb06b2f94c77170bf3a5c08c74c306b6f5bab00'
          assert artifact['digest']=='sha256:'+expected
          data=get('/actions/artifacts/10480366088/zip')
          assert len(data)==20209 and hashlib.sha256(data).hexdigest()==expected
          archive=zipfile.ZipFile(io.BytesIO(data))
          print(json.dumps({'artifact':10480366088,'run':35176178856,'zip_sha256':expected,'names':archive.namelist()},sort_keys=True))
          names=[n for n in archive.namelist() if n=='result.json' or n.endswith('/result.json')]
          assert len(names)==1
          result=json.loads(archive.read(names[0]))
          print('LAPLACE_QA_RESULT_BEGIN')
          print(json.dumps({key:value for key,value in result.items() if key!='lanes'},sort_keys=True,indent=2))
          for lane in result['lanes']:
              print(json.dumps({key:value for key,value in lane.items() if key not in ('embedded_receipts','command')},sort_keys=True,indent=2))
          print('LAPLACE_QA_RESULT_END')
          for name in archive.namelist():
              if name.endswith('.log'):
                  content=archive.read(name).decode('utf-8',errors='replace')
                  lines=content.splitlines()
                  selected=[line for line in lines if any(word in line for word in ('Total Test time','tests passed','source-runtime-state-schema','verified-cpp-source-contract','Test #'))]
                  print('LAPLACE_QA_LOG '+name)
                  print(content[-180000:])
          PY
