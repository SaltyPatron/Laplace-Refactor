name: Cancel the exact abandoned Refactor readback
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  cancel-abandoned-readback:
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 2
    steps:
      - name: Revalidate and cancel only the timed-out source readback backend
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json,os,pathlib,subprocess,time
          PID=1932005
          START=91298824
          PROFILE="c6ec7000cd7d923361f0f2505c35852cc78c21205598af726706e7a3ef25ddab"
          ROOT=pathlib.Path("/proc")/str(PID)
          def proc():
              try:
                  if ROOT.stat().st_uid!=os.getuid(): raise RuntimeError("backend owner differs")
                  raw=(ROOT/"stat").read_text(); parts=raw[raw.rindex(")")+2:].split()
                  if int(parts[19])!=START or raw[raw.index("(")+1:raw.rindex(")") ]!="postgres": raise RuntimeError("backend identity changed")
                  return {"pid":PID,"start_ticks":START,"state":parts[0],"cpu_ticks":int(parts[11])+int(parts[12])}
              except FileNotFoundError: return None
          def emit(kind,value): print(kind+" "+json.dumps(value,sort_keys=True),flush=True)
          CMD=["/opt/laplace/releases/d12af51d6367e03045e12599d2195894868f8408ebe17e5b313db3032f516490/pgsql-18/bin/psql","--host","/opt/laplace/runtime/postgresql/refactor","--port","55433","--username","laplace_admin","--dbname","laplace_refactor","--no-psqlrc","--set","ON_ERROR_STOP=1","--quiet","--tuples-only","--no-align"]
          env=dict(os.environ);env["PGOPTIONS"]="-c default_transaction_read_only=on -c statement_timeout=2000 -c lock_timeout=500 -c application_name=refactor_abandoned_readback_cancel"
          def sql(query):
              result=subprocess.run(CMD,input=query,text=True,capture_output=True,timeout=5,env=env)
              if result.returncode: raise RuntimeError(result.stderr[-2000:])
              if len(result.stdout)>65536: raise RuntimeError("oversized result")
              return json.loads(result.stdout)
          before=proc();emit("EXACT_BACKEND_BEFORE",before)
          if before:
              result=sql("""SELECT coalesce(jsonb_agg(to_jsonb(a)),'[]'::jsonb) FROM (
          SELECT pid,backend_start,query_start,pg_cancel_backend(pid) AS cancel_requested
          FROM pg_stat_activity WHERE pid=1932005 AND datname='laplace_refactor' AND state='active'
          AND backend_start='2026-09-17T14:31:06.775385+00:00'::timestamptz
          AND query_start='2026-09-17T14:31:06.778372+00:00'::timestamptz
          AND ltrim(query) LIKE 'WITH selected AS MATERIALIZED%'
          AND position('source_readback_utf8_batch' in query)>0
          AND position('c6ec7000cd7d923361f0f2505c35852cc78c21205598af726706e7a3ef25ddab' in query)>0) a;""")
              emit("GUARDED_CANCEL",result)
              for index in range(6):
                  time.sleep(0.5)
                  state=sql("SELECT coalesce(jsonb_agg(to_jsonb(a)),'[]'::jsonb) FROM (SELECT pid,backend_start,query_start,state,wait_event_type,wait_event FROM pg_stat_activity WHERE pid=1932005) a;")
                  emit("BACKEND_AFTER",{"sample":index,"unix":time.time(),"activity":state,"process":proc()})
                  if not state: break
          emit("CANCEL_OBSERVER_COMPLETE",{"unix":time.time(),"broad_kill":False,"database_reset":False})
          
          PY
