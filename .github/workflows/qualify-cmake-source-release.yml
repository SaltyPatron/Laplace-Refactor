name: Qualify reproducible grammar provider and real compiler controls
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  provider-reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92dd91a568d5b764879ab20ffdc739b7db05b902
      - name: Execute complete source verification and actual compiler controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, importlib.util, json, os, pathlib, sys, unittest, urllib.request
          root=pathlib.Path.cwd()
          for path,sha in [("tools/sources/qualify_grammar.py","582f8b5ad926ff3756cae5cbf53a4ffd905532b4"),("tests/verified_git_source_tests.py","52c11b644d54faffd62941f4b77066dd9a43bbd6")]:
              request=urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/"+sha,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(request,timeout=60) as response: value=json.load(response)
              data=base64.b64decode(value["content"],validate=False)
              assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()==sha
              (root/path).write_bytes(data)
          spec=importlib.util.spec_from_file_location("provider_repro_tests",root/"tests/verified_git_source_tests.py")
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
          assert result.testsRun==34 and not result.skipped and result.wasSuccessful(), result
          print(json.dumps({"schema":"laplace.provider-reproducibility-qualification/v1","base":"92dd91a568d5b764879ab20ffdc739b7db05b902","tests":result.testsRun,"skipped":len(result.skipped),"success":result.wasSuccessful(),"provider":"582f8b5ad926ff3756cae5cbf53a4ffd905532b4","controls":"52c11b644d54faffd62941f4b77066dd9a43bbd6"}))
          PY
