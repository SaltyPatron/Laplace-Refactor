name: Observe current Original recording progress
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  observe-fixed-recording:
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 2
    steps:
      - name: Read only exact current recording receipts
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json, pathlib, re, time
          root=pathlib.Path('/build/laplace/recovery/canonical-next2000/35223192542-1')
          names=('receipt.json','recording/receipt.json','recording/measurement/corpus-recording.json','recording/measurement/fresh/recording.json','recording/measurement/fresh/progress.json','recording/measurement/replay-01/progress.json')
          keys=re.compile(r'(status|phase|step|start|end|complet|committ|readback|sealed|heartbeat|updated|created|finished|games|count|elapsed)',re.I)
          omitted=re.compile(r'(gps|rate|throughput|token|secret|password|connection|sql|body|path|command)',re.I)
          def project(value, prefix='', depth=0):
              if depth>7: return []
              found=[]
              if isinstance(value,dict):
                  for key,item in value.items():
                      if omitted.search(key): continue
                      label=prefix+'.'+key if prefix else key
                      if isinstance(item,(dict,list)): found.extend(project(item,label,depth+1))
                      elif keys.search(key) and isinstance(item,(str,int,float,bool,type(None))):
                          found.append({'field':label,'value':item[:300] if isinstance(item,str) else item})
                      if len(found)>=100: break
              elif isinstance(value,list):
                  for index,item in list(enumerate(value))[-8:]:
                      found.extend(project(item,prefix+'['+str(index)+']',depth+1))
              return found[:100]
          for name in names:
              path=root/name
              try:
                  with path.open('rb') as stream: raw=stream.read(8388609)
                  if len(raw)>8388608: raise ValueError('receipt exceeds 8MiB observation bound')
                  data=json.loads(raw)
                  result={'path':str(path),'observed_at_unix':time.time(),'mutable_in_progress':True,'fields':project(data)}
              except (OSError,ValueError) as error:
                  result={'path':str(path),'observed_at_unix':time.time(),'mutable_in_progress':True,'unavailable':type(error).__name__}
              print(json.dumps(result,sort_keys=True),flush=True)
          PY
