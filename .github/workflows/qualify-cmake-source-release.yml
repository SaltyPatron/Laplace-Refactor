name: Qualify CMake and publish its PostgreSQL consumer
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
concurrency:
  group: laplace-cmake-component-qualification
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
  GIT_OPTIONAL_LOCKS: "0"
  TMPDIR: /build/laplace/work
  TMP: /build/laplace/work
  TEMP: /build/laplace/work
  CMAKE_EVIDENCE: /build/laplace/work/cmake-component-qualification/${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  qualify:
    if: github.repository == 'SaltyPatron/Laplace-Refactor'
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b042de4216e1d674effe5bd3e8ecf3ebc7aeddac
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact source and prepare existing-owner operation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(id -un)" = laplace-runner
          test "$GITHUB_REPOSITORY" = SaltyPatron/Laplace-Refactor
          test "$GITHUB_REF" = refs/heads/qualify/cmake-source-443-20260916
          test "$(git rev-parse HEAD)" = b042de4216e1d674effe5bd3e8ecf3ebc7aeddac
          test "$(git rev-parse HEAD^{tree})" = 17c155bb1db7c126c315e6f6dac41b594d614e56
          test "$(git diff --name-only --no-renames HEAD "$GITHUB_SHA")" = .github/workflows/qualify-cmake-source-release.yml
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -B - <<'PY'
          import os, stat
          from pathlib import Path
          target=Path(os.environ["CMAKE_EVIDENCE"])
          target.parent.mkdir(mode=0o700,exist_ok=True)
          info=target.parent.lstat()
          if not stat.S_ISDIR(info.st_mode) or info.st_uid!=os.geteuid() or stat.S_IMODE(info.st_mode) not in (0o700,0o2700):
              raise SystemExit("evidence parent is not a private owned directory")
          target.mkdir(mode=0o700)
          PY
          git show "$GITHUB_SHA:.github/workflows/qualify-cmake-source-release.yml" > "$CMAKE_EVIDENCE/executed-workflow.yml"
          git archive --format=tar HEAD tools contracts dependencies state > "$CMAKE_EVIDENCE/operator-source.tar"
          cat > "$CMAKE_EVIDENCE/operate.py" <<'PY'
          """Qualify CMake and its PostgreSQL consumer without changing installed selection."""
          import hashlib, importlib.util, json, os, re, shutil, stat, subprocess, sys, tempfile, time
          from pathlib import Path
          ROOT=Path.cwd().resolve()
          OUT=Path(os.environ["CMAKE_EVIDENCE"])
          # Fill all three from the finalized installed activation before publication.
          # These placeholders intentionally refuse operation; HEAD is the driver source.
          BASE="b042de4216e1d674effe5bd3e8ecf3ebc7aeddac"
          PACKAGE="912e2628fb504b66ba3cd8da48957e781650622771c826804cdc491ae71202fe"
          AGGREGATE="b3d3ae843cc2aad1a2ed41d7287aa763eb664278962e8d68086bbbc80e513eb8"
          sys.path.insert(0,str(ROOT/"tools"))
          from sources import stockfish_corpus_acceptance as activation
          def module(name,relative):
              spec=importlib.util.spec_from_file_location(name,ROOT/relative)
              value=importlib.util.module_from_spec(spec)
              sys.modules[name]=value
              spec.loader.exec_module(value)
              return value
          toolchain=module("cmake_component_owner","tools/toolchain/build-package.py")
          publication=module("cmake_publication_owner","tools/delivery/postgresql_package_publication.py")
          publication_selection=module("cmake_publication_selection_owner","tools/delivery/recover_postgresql_publication.py")
          postgres=module("cmake_pg_owner","tools/postgresql/build-package.py")
          release=toolchain.load_release_module(ROOT)
          contract=toolchain.read_json(ROOT/"contracts/toolchain-build.json")
          toolchain.validate_contract(contract,ROOT)
          started=time.monotonic()
          deadline=started+14100
          report={"schema":"laplace.cmake-component-operation/v1","status":"running",
                  "source_commit":"b042de4216e1d674effe5bd3e8ecf3ebc7aeddac",
                  "installed_repository_commit":BASE,"installed_package_id":PACKAGE,
                  "component_scope":["cmake"],"unchanged_components_reexecuted":False,
                  "upstream_697_qualified":False,"upstream_697_executed_this_run":False,
                  "consumer_plan_completed":False,
                  "product_built":False,"postgresql_build_executed_this_run":False,
                  "postgresql_qualified":False,"postgresql_publication_completed":False,
                  "installed_selection_changed":False,
                  "phases":[]}
          before=None
          plan=None
          successor=None
          consumer_arguments=None
          def save():
              report["elapsed_seconds"]=time.monotonic()-started
              activation.save(OUT/"result.json",report)
          def require(condition,message):
              if not condition:
                  raise RuntimeError(message)
          def active(label):
              # The current owner resolves durable package metadata and independently
              # observes the selected PostgreSQL service; historical receipts stay intact.
              value=activation.observe_activation(BASE,OUT/(label+".json"))
              require(value["package_id"]==PACKAGE and any(
                  item["document"].get("result_sha256")==AGGREGATE for item in value["runner_receipts"]),
                  "installed package or activation aggregate differs")
              return value
          def command(name,argv,seconds=300):
              entry={"name":name,"status":"running"}
              report["phases"].append(entry);save()
              began=time.monotonic()
              maximum=min(seconds,int(deadline-time.monotonic())-120)
              require(maximum>0,"CMake operation deadline exhausted before "+name)
              try:
                  with (OUT/(name+".stdout")).open("xb") as out,(OUT/(name+".stderr")).open("xb") as err:
                      result=subprocess.run(["/usr/bin/timeout","--signal=TERM","--kill-after=15s",
                                             str(maximum)+"s",*map(str,argv)],
                                            cwd=ROOT,env=environment,stdout=out,stderr=err,
                                            timeout=maximum+20,check=False)
                      out.flush();err.flush();os.fsync(out.fileno());os.fsync(err.fileno())
                  entry["exit_code"]=result.returncode
                  require(result.returncode==0,name+" failed; exact output is retained")
                  entry["status"]="passed"
              except BaseException:
                  entry["status"]="failed"
                  raise
              finally:
                  entry["elapsed_seconds"]=time.monotonic()-began
                  save()
              return OUT/(name+".stdout")
          def json_command(name,argv,seconds=300):
              return toolchain.read_json(command(name,argv,seconds))
          def save_copy(name,path,digest):
              document=toolchain.authenticated_json(path,digest)
              shutil.copyfile(path,OUT/name)
              require(toolchain.sha256_file(OUT/name)==digest,"retained evidence changed: "+name)
              return document
          def physical_directory(path,create=False):
              if create:
                  path.mkdir(mode=0o750,parents=True,exist_ok=True)
              require(path.is_dir() and not path.is_symlink(),"configured directory unavailable: "+str(path))
              return path
          environment=dict(os.environ)
          removed=sorted(key for key in contract["environment"]["rejected_nonempty"] if environment.pop(key,None))
          report["ambient_build_variable_names_removed"]=removed
          toolchain.validate_environment(contract,environment)
          save()
          try:
              require(re.fullmatch(r"[0-9a-f]{40}",BASE) is not None and
                      re.fullmatch(r"[0-9a-f]{64}",PACKAGE) is not None and
                      re.fullmatch(r"[0-9a-f]{64}",AGGREGATE) is not None,
                      "fill the three exact finalized installed activation identities before operation")
              before=active("activation-before")
              published_path,published_sha=publication_selection.require_selected_state(
                  toolchain.read_json(ROOT/"state/product-publication-selection.json"))
              projection=toolchain.read_json(ROOT/"state/continuation.json")["product_activation_projection"]["postgresql_publication"]
              require(projection=={"receipt":str(published_path),"receipt_sha256":published_sha},
                      "product and PostgreSQL proof publication selectors differ")
              save_copy("historical-publication.json",published_path,published_sha)
              published=publication.verify_publication(published_path)
              source_record=published["source_receipt"]
              historical=save_copy("historical-postgresql-source.json",Path(source_record["path"]),source_record["sha256"])
              selected=published["toolchain"]
              old_receipt=Path(selected["source_receipt"])
              old_sha=selected["source_receipt_sha256"]
              require(old_sha==historical["build_toolchain"]["receipt_sha256"],
                      "published historical toolchain receipt differs from the PostgreSQL source")
              save_copy("historical-toolchain-receipt.json",old_receipt,old_sha)
              provider,old=toolchain.verify_reuse_provider(contract,ROOT,old_receipt,old_sha)
              # This receipt already retains the source-test path and runtime selection;
              # a disposable historical build-plan.json is not an input requirement.
              archive_root=Path(contract["logical_roots"]["archive_root"])
              try:
                  pg_contract=postgres.read_json(ROOT/"contracts/postgresql-build.json")
                  qualification=historical["runtime_provider_qualification"]
                  source_test=qualification["source_test"]
                  suffix=Path(pg_contract["runtime_qualification"]["liburing"]["source_test"])
                  source_test_path=Path(source_test["path"])
                  require(source_test_path.is_absolute() and
                          source_test_path.parts[-len(suffix.parts):]==suffix.parts and
                          source_test["sha256"]==pg_contract["runtime_qualification"]["liburing"]["source_test_sha256"],
                          "historical source-test path or digest differs from the selected PostgreSQL contract")
                  pg_source=Path(*source_test_path.parts[:-len(suffix.parts)])
                  source_check=postgres.verify_release_import(pg_contract,ROOT,archive_root,pg_source)
                  activation.save(OUT/"selected-postgresql-source.json",source_check)
                  runtime=historical["runtime_package"]
                  runtime_path=Path(runtime["receipt_path"])
                  save_copy("historical-runtime-package.json",runtime_path,runtime["receipt_sha256"])
                  require(postgres.verify_runtime_receipt(pg_contract,runtime_path)==runtime,
                          "original runtime package differs from published PostgreSQL input")
                  consumer_arguments=[sys.executable,"-B","tools/postgresql/build-package.py",
                      "--repository",str(ROOT),"plan","--archive-root",str(archive_root),
                      "--source-root",str(pg_source),"--toolchain-receipt",str(old_receipt),
                      "--runtime-receipt",str(runtime_path)]
                  report["consumer_inputs"]={"status":"verified","source_root":str(pg_source),
                      "runtime_receipt":str(runtime_path),"runtime_receipt_sha256":runtime["receipt_sha256"],
                      "historical_plan_required":False}
              except Exception as error:
                  # Missing consumer inputs do not erase independently valid component qualification.
                  report["consumer_inputs"]={"status":"unavailable",
                      "error":{"type":type(error).__module__+"."+type(error).__name__,
                               "message":str(error)[:2000]}}
              steps=old["component_steps"]
              report["historical_provider"]={
                  "receipt":str(old_receipt),"receipt_sha256":old_sha,"prefix":provider["prefix"],
                  "package_tree":provider["package_tree"],"source_versions":{key:value["version"] for key,value in old["source_inputs"].items()},
                  "retained_component_step_names":sorted(steps),
                  "component_keys_complete":set(steps)==set(toolchain.EXPECTED_ORDER),
                  "retained_step_counts":{key:len(value) if isinstance(value,list) else None for key,value in steps.items()},
                  "historical_steps_reexecuted":False}
              save()
              # Only the selected entry is acquired/imported; no reduced lock or full-generation claim.
              lock_path=ROOT/contract["release_lock"]
              lock=release.load_lock(lock_path)
              entry=lock["archives"]["cmake"]
              generation=Path(contract["logical_roots"]["source_generation"])
              require(generation.name==toolchain.sha256_file(lock_path),"source generation does not bind the current complete lock")
              physical_directory(archive_root)
              physical_directory(generation.parent)
              archive=archive_root/entry["filename"]
              require(not archive.is_symlink(),"selected archive must not be a symlink")
              if not archive.exists():
                  acquisition=Path(tempfile.mkdtemp(prefix=".cmake-acquire-",dir=archive_root))
                  try:
                      incoming=acquisition/entry["filename"]
                      command("acquire-cmake",["/usr/bin/curl","--fail","--location","--proto","=https",
                          "--proto-redir","=https","--connect-timeout","15","--max-time","240",
                          "--max-filesize",str(entry["size_bytes"]),"--output",str(incoming),entry["url"]],300)
                      release.verify_entry("cmake",entry,acquisition)
                      os.link(incoming,archive,follow_symlinks=False)
                  finally:
                      shutil.rmtree(acquisition)
              source_receipt=release.verify_entry("cmake",entry,archive_root)
              physical_directory(generation,create=True)
              if not (generation/"cmake").exists() and not (generation/"cmake").is_symlink():
                  temporary=Path(tempfile.mkdtemp(prefix=".cmake-import-",dir=generation.parent))
                  try:
                      release.import_entry("cmake",entry,archive_root,temporary)
                      release.verify_imported_entry("cmake",entry,archive_root,temporary)
                      os.rename(temporary/"cmake",generation/"cmake")
                  finally:
                      shutil.rmtree(temporary)
              release.verify_imported_entry("cmake",entry,archive_root,generation)
              activation.save(OUT/"selected-cmake-source.json",{
                  "scope":"only cmake; complete release generation not asserted",
                  "lock_sha256":toolchain.sha256_file(lock_path),"source_generation":str(generation),
                  "receipt":source_receipt})
              arguments=[sys.executable,"-B","tools/toolchain/build-package.py","--repository",str(ROOT)]
              provider_arguments=["--provider-receipt",str(old_receipt),"--provider-receipt-sha256",old_sha]
              plan=json_command("cmake-plan",arguments+["plan-cmake"]+provider_arguments)
              build=Path(plan["build_directory"])
              action="resume-cmake" if build.exists() else "build-cmake"
              report["cmake_build_input_id"]=plan["build_input_id"]
              report["cmake_build_directory"]=str(build)
              report["cmake_action"]=action;save()
              qualified_path=build/"cmake-component-qualification.json"
              completed_before=[]
              if (build/"completed-components.json").exists():
                  checkpoint=toolchain.read_json(build/"completed-components.json")
                  completed_before=checkpoint.get("completed",[])
              report["component_qualification_present_before"]=qualified_path.is_file()
              report["component_checkpoint_names_before"]=completed_before
              command("cmake-component",arguments+[action]+provider_arguments,6000)
              qualified=toolchain.read_json(qualified_path)
              toolchain.verify_cmake_component_receipt(qualified)
              require(qualified["plan"]==plan,"completed CMake qualification belongs to another plan")
              qualified_sha=toolchain.sha256_file(qualified_path)
              save_copy("cmake-component-qualification.json",qualified_path,qualified_sha)
              report["upstream_697_qualified"]=True
              report["upstream_697_executed_this_run"]=(
                  not report["component_qualification_present_before"] and "cmake" not in completed_before)
              report["cmake_qualification_scope"]=(
                  "executed-and-verified-this-run" if report["upstream_697_executed_this_run"]
                  else "authenticated-retained-execution-reverified")
              report["cmake_qualification_sha256"]=qualified_sha
              report["cmake_test_result"]=qualified["component_steps"]["cmake"][2]["test_result_contract"]
              selected_path=build/"selected-toolchain.json"
              if not selected_path.exists():
                  json_command("compose-cmake",arguments+["compose-cmake","--qualification",str(qualified_path),
                      "--qualification-sha256",qualified_sha,"--output",str(selected_path)])
              manifest=json_command("verify-composed",arguments+["verify-composed","--receipt",str(selected_path)])
              for name in ("cmake","ctest","cpack"):
                  path=manifest["tools"][name]["path"]
                  log=command("selected-"+name+"-loader",["/usr/bin/ldd",path],30)
                  require("not found" not in log.read_text(),"selected "+name+" has unresolved loader dependencies")
              again,_=toolchain.verify_reuse_provider(contract,ROOT,old_receipt,old_sha)
              require(again==provider,"historical provider changed")
              toolchain.verify_composed_toolchain_receipt(toolchain.read_json(selected_path),selected_path)
              report.update(status="component-qualified",
                  selected_toolchain_receipt=str(selected_path),
                  selected_toolchain_receipt_sha256=toolchain.sha256_file(selected_path),
                  selected_cmake=manifest["tools"]["cmake"],
                  retained_provider_roots=manifest["provider_roots"])
              save()
              require(consumer_arguments is not None,
                      "CMake is qualified, but authenticated PostgreSQL consumer inputs are unavailable; see consumer_inputs")
              successor_arguments=list(consumer_arguments)
              successor_arguments[successor_arguments.index("--toolchain-receipt")+1]=str(selected_path)
              successor=json_command("selected-provider-current-consumer-plan",successor_arguments)
              require(successor["build_toolchain"]["build_input_id"]==manifest["build_input_id"],
                      "PostgreSQL consumer plan selected another composed toolchain")
              report.update(consumer_plan_completed=True,
                  selected_consumer_plan=successor["build_input_id"],
                  postgresql_build_directory=successor["build_directory"])
              save()
              pg_build=Path(successor["build_directory"])
              pg_receipt_path=pg_build/"package-receipt.json"
              pg_completed_before=pg_receipt_path.is_file()
              if not pg_completed_before:
                  pg_action="resume" if pg_build.exists() else "build"
                  pg_arguments=list(successor_arguments)
                  pg_arguments[pg_arguments.index("plan")]=pg_action
                  report["postgresql_build_action"]=pg_action
                  save()
                  report["postgresql_build_executed_this_run"]=True
                  save()
                  command("postgresql-consumer-build",pg_arguments,6600)
              pg_receipt=postgres.read_json(pg_receipt_path)
              require(postgres.read_json(pg_build/"build-plan.json")==successor and
                      pg_receipt["build_input_id"]==successor["build_input_id"] and
                      pg_receipt["build_plan_sha256"]==postgres.canonical_sha256(successor) and
                      pg_receipt["build_toolchain"]==successor["build_toolchain"] and
                      pg_receipt["completed_targets"]==pg_contract["build"]["make_targets"] and
                      pg_receipt["build_log_sha256"]==postgres.sha256_file(pg_build/"build.log"),
                      "completed PostgreSQL receipt differs from its exact plan or execution log")
              # Re-read the canonical io_uring test evidence and independently verify
              # current package bytes and recursive loaded-object closure on replay.
              io_uring=postgres.qualify_postgresql_io_uring(
                  pg_contract,successor,pg_build,pg_build/"build.log")
              qualification=pg_receipt["runtime_provider_qualification"]
              require({key:value for key,value in qualification.items()
                       if key not in ("receipt_path","receipt_sha256")}==io_uring,
                      "PostgreSQL io_uring evidence differs from the completed receipt")
              save_copy("postgresql-io-uring-qualification.json",
                  Path(qualification["receipt_path"]),qualification["receipt_sha256"])
              current_pg=json_command("postgresql-consumer-verify",
                  [sys.executable,"-B","tools/postgresql/build-package.py","--repository",str(ROOT),
                   "verify-package","--prefix",successor["staged_product_prefix"],
                   "--toolchain-receipt",str(selected_path),
                   "--closure-output",str(OUT/"postgresql-recursive-elf-closure.json")],1200)
              for field in ("schema","prefix","version","configure","tree_sha256","file_count",
                            "total_file_bytes","direct_elf_needed","runpath_verification",
                            "recursive_elf_closure_verified"):
                  require(current_pg[field]==pg_receipt[field],
                          "PostgreSQL package re-verification differs: "+field)
              closure_before=pg_receipt["recursive_elf_closure"]
              closure_after=current_pg["recursive_elf_closure"]
              for field in ("schema","verifier","summary","platform_abi_objects",
                            "packaged_runtime_objects","verified","product_runtime_activated"):
                  require(closure_before[field]==closure_after[field],
                          "PostgreSQL recursive closure differs: "+field)
              pg_receipt_sha=postgres.sha256_file(pg_receipt_path)
              save_copy("postgresql-package-receipt.json",pg_receipt_path,pg_receipt_sha)
              report.update(postgresql_qualified=True,
                  postgresql_qualification_scope=("authenticated-retained-execution-reverified"
                      if pg_completed_before else "executed-and-verified-this-run"),
                  postgresql_package_receipt=str(pg_receipt_path),
                  postgresql_package_receipt_sha256=pg_receipt_sha)
              save()
              publication_arguments=[sys.executable,"-B","tools/delivery/postgresql_package_publication.py"]
              pub_plan=json_command("postgresql-publication-plan",
                  publication_arguments+["plan","--postgresql-receipt",str(pg_receipt_path)],600)
              published_successor=json_command("postgresql-publication",
                  publication_arguments+["publish","--postgresql-receipt",str(pg_receipt_path)],1200)
              require(published_successor==pub_plan,
                      "published PostgreSQL package differs from its selected plan")
              new_publication_path=Path(published_successor["receipt_path"])
              verified_publication=json_command("postgresql-publication-verify",
                  publication_arguments+["verify","--receipt",str(new_publication_path)],600)
              require(verified_publication==published_successor,
                      "new PostgreSQL publication changed on independent verification")
              require(verified_publication["toolchain"].get("schema")==
                      publication.toolchain_receipts.RETAINED_TOOLCHAIN_SCHEMA and
                      verified_publication["toolchain"]["provider_roots"]==manifest["provider_roots"],
                      "PostgreSQL publication lost its composed toolchain providers")
              new_selection={"receipt":str(new_publication_path),
                  "receipt_sha256":publication.sha256_file(new_publication_path)}
              save_copy("published-postgresql-receipt.json",new_publication_path,
                  new_selection["receipt_sha256"])
              proposal={"schema":"laplace.postgresql-selection-update/v1",
                  "source_commit":"b042de4216e1d674effe5bd3e8ecf3ebc7aeddac",
                  "previous":projection,"selected":new_selection,
                  "publication_id":verified_publication["publication_id"],
                  "postgresql_build_input_id":successor["build_input_id"],
                  "toolchain_build_input_id":manifest["build_input_id"],
                  "updates":[
                      {"path":"state/product-publication-selection.json",
                       "field":["postgresql_publication"],"value":new_selection},
                      {"path":"state/continuation.json",
                       "field":["product_activation_projection","postgresql_publication"],
                       "value":new_selection}],
                  "historical_evidence_rewritten":False,
                  "repository_selection_changed":False,
                  "product_activation_occurred":False}
              activation.save(OUT/"selection-update.json",proposal)
              report.update(status="passed",postgresql_publication_completed=True,
                  selected_postgresql_publication=new_selection,
                  selection_update_proposal=str(OUT/"selection-update.json"))
          
          except Exception as error:
              report.update(status="failed",error={"type":type(error).__module__+"."+type(error).__name__,
                                                  "message":str(error)[:2000]})
          finally:
              if plan is not None:
                  # Preserve actual logs on every exit; never delete the addressed build for retry.
                  for relative in ("build-plan.json","completed-components.json","components/cmake/configure.log",
                      "components/cmake/build.log","components/cmake/test.log","components/cmake/install.log",
                      "components/cmake/Testing/Temporary/LastTest.log",
                      "selected-toolchain.json","selected-toolchain-manifest.json"):
                      path=Path(plan["build_directory"])/relative
                      if path.is_file() and not path.is_symlink() and path.stat().st_size<=256*1024*1024:
                          target=OUT/"retained-build"/relative
                          target.parent.mkdir(parents=True,exist_ok=True)
                          shutil.copyfile(path,target)
              if successor is not None:
                  for relative in ("build-plan.json","package-receipt.json","build.log",
                      "io-uring-qualification.json","recursive-elf-closure.json",
                      "build-input-preflight.json","source-test-overlays-check-world.json",
                      pg_contract["runtime_qualification"]["liburing"]["regress_log"],
                      pg_contract["runtime_qualification"]["liburing"]["server_log"]):
                      path=Path(successor["build_directory"])/relative
                      if path.is_file() and not path.is_symlink() and path.stat().st_size<=256*1024*1024:
                          target=OUT/"retained-postgresql-build"/relative
                          target.parent.mkdir(parents=True,exist_ok=True)
                          shutil.copyfile(path,target)
              if before is not None:
                  try:
                      after=active("activation-after")
                      require(activation.stable_activation(before)==activation.stable_activation(after),
                              "installed product changed during CMake qualification")
                      report["activation_unchanged"]=True
                  except Exception as error:
                      report.update(status="failed",activation_after_error={
                          "type":type(error).__module__+"."+type(error).__name__,"message":str(error)[:2000]})
              save()
          raise SystemExit(0 if report["status"]=="passed" else 1)
          
          PY
      - name: Qualify CMake and its PostgreSQL consumer through existing owners
        shell: bash
        run: |
          set -euo pipefail
          bash tools/host/run-exclusive.sh \
            timeout --signal=TERM --kill-after=20s 14400s \
            python3 -B "$CMAKE_EVIDENCE/operate.py" \
            > "$CMAKE_EVIDENCE/operation.stdout" 2> "$CMAKE_EVIDENCE/operation.stderr"
      - name: Retain bounded partial build logs and report exact phase disposition
        if: always()
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, re, shutil
          out=pathlib.Path(os.environ["CMAKE_EVIDENCE"])
          path=out/"result.json"
          if not path.is_file():
              print("Operation did not produce a result; retained setup and process logs remain authoritative.")
              raise SystemExit(0)
          report=json.loads(path.read_text())
          identity=report.get("cmake_build_input_id")
          if isinstance(identity,str) and re.fullmatch("[0-9a-f]{64}",identity):
              contract=json.loads(pathlib.Path("contracts/toolchain-build.json").read_text())
              build=pathlib.Path(contract["logical_roots"]["build_root"])/identity
              if str(build)==report.get("cmake_build_directory") and build.is_dir() and not build.is_symlink():
                  for relative in ("build-plan.json","completed-components.json",
                      "cmake-component-qualification.json","components/cmake/configure.log",
                      "components/cmake/build.log","components/cmake/test.log",
                      "components/cmake/install.log","components/cmake/Testing/Temporary/LastTest.log",
                      "selected-toolchain.json","selected-toolchain-manifest.json"):
                      source=build/relative
                      if source.is_file() and not source.is_symlink() and source.stat().st_size<=256*1024*1024:
                          target=out/"retained-build"/relative
                          target.parent.mkdir(parents=True,exist_ok=True)
                          shutil.copyfile(source,target)
          pg_identity=report.get("selected_consumer_plan")
          if isinstance(pg_identity,str) and re.fullmatch("[0-9a-f]{64}",pg_identity):
              pg_contract=json.loads(pathlib.Path("contracts/postgresql-build.json").read_text())
              pg_build=pathlib.Path(pg_contract["execution"]["build_root"])/pg_identity
              plan_path=pg_build/"build-plan.json"
              if (str(pg_build)==report.get("postgresql_build_directory") and pg_build.is_dir()
                      and not pg_build.is_symlink() and plan_path.is_file()
                      and not plan_path.is_symlink()):
                  pg_plan=json.loads(plan_path.read_text())
                  if (pg_plan.get("build_input_id")==pg_identity
                          and pg_plan.get("build_directory")==str(pg_build)):
                      for relative in ("build-plan.json","package-receipt.json","build.log",
                          "io-uring-qualification.json","recursive-elf-closure.json",
                          "build-input-preflight.json","source-test-overlays-check-world.json",
                          pg_contract["runtime_qualification"]["liburing"]["regress_log"],
                          pg_contract["runtime_qualification"]["liburing"]["server_log"]):
                          source=pg_build/relative
                          if (source.is_file() and not source.is_symlink()
                                  and source.stat().st_size<=256*1024*1024):
                              target=out/"retained-postgresql-build"/relative
                              target.parent.mkdir(parents=True,exist_ok=True)
                              shutil.copyfile(source,target)
          if report.get("status") not in ("passed","failed"):
              report["interrupted_previous_status"]=report.get("status")
              report["status"]="interrupted"
              report["operator_exit_without_terminal_receipt"]=True
              temporary=out/"result-after-interruption.json"
              temporary.write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
              temporary.replace(path)
          allowed=("status","error","activation_after_error","elapsed_seconds","source_commit",
              "installed_repository_commit","installed_package_id","historical_provider",
              "consumer_inputs","cmake_build_input_id","cmake_action","cmake_qualification_scope",
              "upstream_697_qualified","upstream_697_executed_this_run","cmake_test_result",
              "selected_toolchain_receipt","selected_toolchain_receipt_sha256",
              "selected_consumer_plan","consumer_plan_completed","selected_cmake",
              "retained_provider_roots","unchanged_components_reexecuted",
              "product_built","postgresql_build_executed_this_run","postgresql_qualified",
              "postgresql_publication_completed","postgresql_qualification_scope",
              "postgresql_package_receipt","postgresql_package_receipt_sha256",
              "selected_postgresql_publication","selection_update_proposal",
              "installed_selection_changed","activation_unchanged","interrupted_previous_status",
              "operator_exit_without_terminal_receipt","phases")
          print(json.dumps({key:report[key] for key in allowed if key in report},sort_keys=True))
          PY
      - name: Retain operation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmake-component-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CMAKE_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 90
