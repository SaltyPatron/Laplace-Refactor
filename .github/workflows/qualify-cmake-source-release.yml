name: Pause superseded unmanaged PostgreSQL main delivery
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: write
concurrency:
  group: laplace-superseded-pgctl-main-pause
  cancel-in-progress: false
jobs:
  pause:
    if: github.repository == 'SaltyPatron/Laplace-Refactor'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Guard exact preserved source and normally cancel obsolete activation chains
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/superseded-pgctl-audit"
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          OUT=pathlib.Path(os.environ["RUNNER_TEMP"])/"superseded-pgctl-audit"
          REPO="SaltyPatron/Laplace-Refactor"
          API="https://api.github.com/repos/"+REPO
          MAIN="4c51e1d37006667867de0f7768a19025561b2eb8"
          HEAD="91f3e58814ece4dbf5f3a4ce9b067448a265098f"
          TREE="d8e2ba2b15e0aab5abd6cec1833aac914aa551b2"
          OLD_TREE="a772252db92984b499fc2f42e33efaa8164c416b"
          TARGETS={35154689537:"6f82dd036489ed26ea59dc86c4acf4cdec8b0437",
                   35155051133:MAIN}
          audit={"schema":"laplace.superseded-main-normal-pause/v1","status":"running",
                 "repository":REPO,"replacement_pr":394,"replacement_head":HEAD,
                 "replacement_tree":TREE,"targets":[],"force_cancel":False}
          def save():
              (OUT/"audit.json").write_text(json.dumps(audit,sort_keys=True,indent=2)+"\n")
          def require(ok,message):
              if not ok: raise RuntimeError(message)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          def api(path,method="GET"):
              require(path.startswith("/") and "://" not in path,"invalid fixed API path")
              request=urllib.request.Request(API+path,data=b"" if method=="POST" else None,
                  method=method,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with opener.open(request,timeout=30) as response:
                  body=response.read(4000000)
                  require(len(body)<4000000,"API response bound exceeded")
                  return response.status,json.loads(body) if body else None
          def get(path): return api(path)[1]
          def guard(run_id,head):
              run=get("/actions/runs/"+str(run_id))
              require(run["head_sha"]==head and run["head_branch"]=="main"
                  and run["event"]=="push" and run["run_attempt"]==1
                  and run["path"]==".github/workflows/product-path.yml",
                  "exact obsolete run identity differs")
              document=get("/actions/runs/"+str(run_id)+"/jobs?per_page=100")
              require(document["total_count"]==len(document["jobs"]),"jobs pagination refused")
              for job in document["jobs"]:
                  if any(part in job["name"] for part in ("compose-product","activate-product",
                         "dev-bat-live-substrate","deployed-stockfish-corpus","deployed-chess-calibration")):
                      started=any(step.get("started_at") for step in job.get("steps",[]))
                      require(not started and job["status"] in ("queued","pending"),
                              "obsolete product mutation or installed acceptance already started")
              return run,document["jobs"]
          try:
              require(os.environ["GITHUB_REPOSITORY"]==REPO,"repository differs")
              require(get("/git/ref/heads/main")["object"]["sha"]==MAIN,"main advanced")
              pr=get("/pulls/394")
              require(pr["state"]=="open" and pr["head"]["sha"]==HEAD,
                      "replacement PR head differs")
              replacement=get("/git/commits/"+HEAD)
              require(replacement["tree"]["sha"]==TREE
                  and MAIN in [parent["sha"] for parent in replacement["parents"]],
                  "replacement does not preserve exact current main")
              for run_id,head in TARGETS.items():
                  require(get("/git/commits/"+head)["tree"]["sha"]==OLD_TREE,
                          "obsolete run source tree differs")
                  run,jobs=guard(run_id,head)
                  audit["targets"].append({"run":run_id,"head":head,"before_status":run["status"],
                      "before_conclusion":run["conclusion"],"jobs_before":jobs,
                      "action":"not_needed" if run["status"]=="completed" else "guarded_pending"})
              save()
              for target in audit["targets"]:
                  if target["action"]=="not_needed": continue
                  run,jobs=guard(target["run"],target["head"])
                  if run["status"]=="completed":
                      target["action"]="completed_before_request";save();continue
                  status,_=api("/actions/runs/"+str(target["run"])+"/cancel","POST")
                  require(status==202,"normal cancellation was not accepted")
                  target.update(action="normal_cancel_accepted",http_status=status,
                                observed_status_after_request=get("/actions/runs/"+str(target["run"]))["status"])
                  save()
              audit["status"]="passed"
          except Exception as error:
              audit.update(status="refused_or_failed",error_type=type(error).__name__,error=str(error)[:1500])
              raise
          finally:
              save()
              print(json.dumps({key:value for key,value in audit.items() if key!="targets"}))
              print(json.dumps([ {key:value for key,value in row.items() if key!="jobs_before"} for row in audit["targets"]]))
          PY
      - name: Retain exact cancellation audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: superseded-pgctl-main-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/superseded-pgctl-audit/
          if-no-files-found: error
          retention-days: 90
