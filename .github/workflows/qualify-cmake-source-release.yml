name: Source runtime state actual PostgreSQL controls
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: ea6710b22a06d166218403d74d5cd6caf6ff526e
      SOURCE_TREE: 00a4cb88106a65657c190810a53a9e457e048750
      TMPDIR: /build/laplace/work/sql
      TMP: /build/laplace/work/sql
      TEMP: /build/laplace/work/sql
      EVIDENCE: /build/laplace/recovery/source-runtime-state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Prepare exact source and selected real PostgreSQL
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR" "$EVIDENCE" /build/laplace/worktrees
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          git worktree add --detach /build/laplace/worktrees/source-runtime-state "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA $SOURCE_TREE" > "$EVIDENCE/source.txt"
          pg_bindir="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -n "$pg_bindir"
          for tool in initdb pg_ctl postgres psql; do test -x "$pg_bindir/$tool"; done
          printf 'PG_BINDIR=%s\n' "$pg_bindir" >> "$GITHUB_ENV"
          "$pg_bindir/postgres" --version | tee "$EVIDENCE/postgresql-version.txt"
          cmake --version > "$EVIDENCE/cmake-version.txt"
      - name: Execute installed caller and actual schema controls
        run: |
          set -euo pipefail
          cd /build/laplace/worktrees/source-runtime-state
          status=0
          qualify() {
            local label="$1"
            shift
            set +e
            timeout --signal=TERM --kill-after=10s 300s "$@" 2>&1 | tee "$EVIDENCE/$label.log"
            local result=$?
            set -e
            printf '%s\t%s\n' "$label" "$result" >> "$EVIDENCE/exit-codes.tsv"
            if [ "$result" -ne 0 ]; then status=1; fi
          }
          qualify installed-callers python3 tests/source_admission_guard_tests.py tools/admit_source_guard.py -v
          qualify actual-postgresql python3 tests/source_runtime_state_postgres_tests.py --pg-bindir "$PG_BINDIR" -v
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/python-ast.log"
          import ast
          from pathlib import Path
          for name in ("tools/admit_source.py", "tools/admit_source_guard.py",
                       "tools/sources/runtime_state.py", "tests/source_admission_guard_tests.py",
                       "tests/source_runtime_state_postgres_tests.py"):
              ast.parse(Path(name).read_text())
              print("PASS Python AST " + name)
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "PASS clean source worktree" | tee "$EVIDENCE/source-clean.txt"
          exit "$status"
      - name: Retain exact source and actual PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-runtime-state-postgresql-controls
          path: /build/laplace/recovery/source-runtime-state/
          if-no-files-found: error
          retention-days: 30
