name: Read authenticated GNU alias experiment evidence
on:
  workflow_dispatch:
  push:
    branches: ["qualify/cmake-source-443-20260916"]
    paths: [".github/workflows/qualify-cmake-source-release.yml"]
permissions:
  actions: read
  contents: read
jobs:
  retained-gnu-alias-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate the exact retained artifact and print compiler evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, stat, urllib.request, zipfile
          repository = "https://api.github.com/repos/SaltyPatron/Laplace-Refactor"
          artifact_id = 10510640146
          run_id = 35251761409
          head = "c4ca4e49f7851a15e9b4750cab4efe16194635c1"
          size = 14387295
          digest = "f3d79307b9a89700dab202b56e20b6c457f85c3b4f5c5ba77fa099bb84702ffb"
          def fetch(url, limit):
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              request.add_unredirected_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
              with urllib.request.urlopen(request, timeout=90) as response:
                  body = response.read(limit + 1)
              assert len(body) <= limit
              return body
          metadata = json.loads(fetch(repository + "/actions/artifacts/" + str(artifact_id), 1048576))
          assert metadata["id"] == artifact_id and not metadata["expired"]
          assert metadata["size_in_bytes"] == size and metadata["digest"] == "sha256:" + digest
          assert metadata["workflow_run"]["id"] == run_id and metadata["workflow_run"]["head_sha"] == head
          payload = fetch(repository + "/actions/artifacts/" + str(artifact_id) + "/zip", size)
          assert len(payload) == size and hashlib.sha256(payload).hexdigest() == digest
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              entries = archive.infolist()
              names = [entry.filename for entry in entries]
              assert len(names) == len(set(names)) and len(names) <= 4096
              for entry in entries:
                  name = entry.filename
                  path = pathlib.PurePosixPath(name)
                  assert name and not path.is_absolute() and ".." not in path.parts
                  assert "\\" not in name and "\0" not in name
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
              def member(name, limit):
                  entry = archive.getinfo(name)
                  assert not entry.is_dir() and 0 <= entry.file_size <= limit
                  with archive.open(entry) as stream:
                      body = stream.read(limit + 1)
                  assert len(body) == entry.file_size and len(body) <= limit
                  return body
              log = member("logs/166-build-native-engine.stdout", 10573)
              assert len(log) == 10573 and hashlib.sha256(log).hexdigest() == "21cee0b578d457f73842fb497b4d9e8f93d3a734bd2d5779d6885177ea067e48"
              assert member("logs/166-build-native-engine.stderr", 0) == b""
              report_bytes = member("report.json", 2097152)
              report = json.loads(report_bytes)
              assert report["schema"] == "laplace.hosted-gnu-alias-experiment/v1"
              assert report["product_commit"] == "54c3ec6f8d5caf01d6923b2c79d496dea0606311"
              assert report["candidate_grammar_blob"] == "89388c776ae4ba0f7294f670b8b33b4b42ad1da4"
              assert report["runner"]["run_id"] == str(run_id) and report["runner"]["workflow_sha"] == head
              commands = report["commands"]
              assert len(commands) <= 256
              summary = {
                  "artifact_id": artifact_id, "run_id": run_id, "head": head,
                  "zip_bytes": size, "zip_sha256": digest,
                  "report_sha256": hashlib.sha256(report_bytes).hexdigest(),
                  "status": report["status"], "fatal_exception": report.get("fatal_exception"),
                  "generator": report.get("generator"),
                  "inherited_c_corpus": report.get("inherited_c_corpus"),
                  "variants": {key: {"generation_status": value.get("generation_status"),
                      "upstream_tests": value.get("upstream_tests")}
                      for key, value in report["variants"].items()},
                  "generated_grammar_delta": report.get("generated_grammar_delta"),
                  "controls": report.get("controls"),
                  "product_declaration_changes": report.get("product_declaration_changes"),
                  "immutable_source_input": report.get("immutable_source_input"),
                  "hosted_candidate": report.get("hosted_candidate"),
                  "commands": [{"number": i+1, "label": item["label"],
                      "returncode": item.get("returncode"), "elapsed_seconds": item.get("elapsed_seconds"),
                      "timed_out": item.get("timed_out", False)} for i,item in enumerate(commands)],
                  "full_native_corpus_ran": "whole_corpus_comparison" in report,
                  "postgresql_admission_executed": report["postgresql_admission_executed"],
                  "installed_provider_changed": report["installed_provider_changed"]}
              print("GNU_ALIAS_RETAINED_REPORT " + json.dumps(summary, sort_keys=True), flush=True)
              print("GNU_ALIAS_COMPILER_STDOUT_BEGIN", flush=True)
              print(log.decode("utf-8", "strict"), end="", flush=True)
              print("GNU_ALIAS_COMPILER_STDOUT_END", flush=True)
          PY
