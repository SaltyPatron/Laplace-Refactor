name: Adjudicate authenticated retained GNU alias evidence
on:
  workflow_dispatch:
  push:
    branches: ["qualify/cmake-source-443-20260916"]
    paths: [".github/workflows/qualify-cmake-source-release.yml"]
permissions:
  actions: read
  contents: read
jobs:
  retained-gnu-alias-adjudication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONOPTIMIZE: ""
    steps:
      - name: Establish ordinary hosted evidence paths
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          adjudication_root="/build/laplace/work/gnu-alias-adjudication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$adjudication_root"
          sudo install -d -m 0775 -o "$(id -u)" -g "$(id -g)" "$adjudication_root"
          mkdir -p "$adjudication_root/evidence" "$adjudication_root/tmp"
          printf 'ADJUDICATION_ROOT=%s\n' "$adjudication_root" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s/tmp\nTMP=%s/tmp\nTEMP=%s/tmp\n' \
            "$adjudication_root" "$adjudication_root" "$adjudication_root" >> "$GITHUB_ENV"
      - name: Authenticate adjudicator and revalidate retained artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, base64, hashlib, json, os, pathlib, runpy, traceback, urllib.request
          evidence = pathlib.Path(os.environ["ADJUDICATION_ROOT"], "evidence")
          identity = "1119575cd31562304a736eecc9d442595879abf3"
          try:
              request = urllib.request.Request(
                  "https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/" + identity,
                  headers={"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              request.add_unredirected_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = response.read(1048577)
              assert len(payload) <= 1048576
              row = json.loads(payload)
              assert row["sha"] == identity and row["encoding"] == "base64"
              data = base64.b64decode(row["content"], validate=False)
              assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == identity
              ast.parse(data, filename="adjudicate-retained-gnu.py")
              source = evidence / "adjudicate-retained-gnu.py"
              source.write_bytes(data)
              print("Authenticated exact artifact-only adjudicator; AST parsing passed.", flush=True)
              runpy.run_path(str(source), run_name="__main__")
          except BaseException:
              (evidence / "launcher-exception.txt").write_text(traceback.format_exc())
              raise
          PY
      - name: Retain adjudication and unchanged authenticated producer artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnu-alias-artifact-adjudication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ADJUDICATION_ROOT }}/evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
