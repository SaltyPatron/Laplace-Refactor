name: Qualify pointer-to-member C++ syntax
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  pointer-member:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QUALIFICATION_ROOT: ${{ github.workspace }}/laplace-pointer-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Read exact hosted experiment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          root=pathlib.Path(os.environ['QUALIFICATION_ROOT'])
          root.mkdir(mode=0o700)
          blob='fe2781ef8a80795b20ba4a6f559950be891d0b46'
          req=urllib.request.Request('https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/'+blob,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github.raw+json'})
          with urllib.request.urlopen(req,timeout=60) as response: data=response.read()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob
          (root/'experiment.py').write_bytes(data)
          (root/'evidence'/'inputs').mkdir(parents=True)
          (root/'evidence'/'inputs'/'experiment.py').write_bytes(data)
          compile(data,str(root/'experiment.py'),'exec')
          print('AUTHENTICATED_POINTER_EXPERIMENT '+blob,flush=True)
          PY
      - name: Generate and execute actual C and C++ syntax controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 "$QUALIFICATION_ROOT/experiment.py"
      - name: Retain exact syntax experiment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pointer-member-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 30
