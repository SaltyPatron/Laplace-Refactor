name: Read authenticated installed cognition service authority
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  read-installed-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate retained experiment and expose bounded diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.request, zipfile
          repository = "SaltyPatron/Laplace-Refactor"
          run_id = 35231752869
          job_id = 105243505238
          api = "https://api.github.com/repos/" + repository
          token = os.environ.pop("GH_TOKEN")
          def get(url, limit):
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Laplace-authenticated-pointer-diagnostic-reader"})
              request.add_unredirected_header("Authorization", "Bearer " + token)
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise RuntimeError("response exceeds exact bounded reader limit")
              return data
          job = json.loads(get(api + "/actions/jobs/" + str(job_id), 1000000))
          assert job["run_id"] == run_id and job["head_sha"] == "df158f21bfecaf4045d065b10c21cd92464ce3ec"
          assert job["status"] == "completed" and job["conclusion"] == "success"
          print("ACTIVATION_JOB_AUTHENTICATED " + json.dumps({
              "run_id": run_id, "job_id": job_id, "head_sha": job["head_sha"],
              "started_at": job["started_at"], "completed_at": job["completed_at"],
              "conclusion": job["conclusion"]
          }, sort_keys=True), flush=True)
          service_artifacts = [{"kind":"service-restart","id":10502143951,"size":291458,"sha256":"cb865a8df75f3ca439f03df26375076e7ea061bb8965f71c4b67fb7242a26c7c","member":"result.json"},{"kind":"http-readiness","id":10502855195,"size":1182,"sha256":"3d431f96bef89fe46cec87c9a021e488f45ec35095118a7044f2513973cb3b77","member":"installed-http-readiness-35231752869-1.json"},{"kind":"gateway","id":10502795314,"size":4386,"sha256":"dc7af7e47018a4b20b950a8dedb4981c64d55101242e1c2316eab605fa80182d","member":"proof.json"}]
          assert [item["kind"] for item in service_artifacts] == ["service-restart", "http-readiness", "gateway"]
          for selected in service_artifacts:
              metadata = json.loads(get(api + "/actions/artifacts/" + str(selected["id"]), 100000))
              assert metadata["id"] == selected["id"] and not metadata["expired"]
              assert metadata["size_in_bytes"] == selected["size"]
              assert metadata["digest"] == "sha256:" + selected["sha256"]
              assert metadata["workflow_run"]["id"] == run_id
              payload = get(api + "/actions/artifacts/" + str(selected["id"]) + "/zip", selected["size"])
              assert len(payload) == selected["size"] and hashlib.sha256(payload).hexdigest() == selected["sha256"]
              with zipfile.ZipFile(io.BytesIO(payload)) as service_archive:
                  entries = service_archive.infolist()
                  names = [entry.filename for entry in entries]
                  assert len(names) == len(set(names))
                  assert all(not pathlib.PurePosixPath(name).is_absolute() and ".." not in pathlib.PurePosixPath(name).parts for name in names)
                  entry = service_archive.getinfo(selected["member"])
                  assert 0 < entry.file_size <= 1000000
                  raw = service_archive.read(entry)
                  result = json.loads(raw)
              assert result["status"] == "passed"
              if selected["kind"] == "service-restart":
                  assert result["schema"] == "laplace.cognition-service-lifecycle/v1"
                  assert result["action"] == "restart"
                  observation = result["observation"]
                  assert observation["repository_commit"] == "df158f21bfecaf4045d065b10c21cd92464ce3ec"
                  assert observation["activated_package_verified"] is True
                  assert observation["http_auth"] == {"mode": "managed-operator", "credential_source": "/opt/laplace/secrets/operator.env"}
                  assert observation["unit"]["ActiveState"] == "active"
                  assert observation["health"]["response"]["status"] == "ready"
                  assert observation["health"]["response"]["package_id"] == observation["package_id"]
                  service_package = observation["package_id"]
                  assert service_package == "d12af51d6367e03045e12599d2195894868f8408ebe17e5b313db3032f516490"
                  projection = {
                      "schema": result["schema"], "status": result["status"],
                      "service": "laplace-refactor-cognition.service",
                      "service_scope": observation["scope"],
                      "http_auth": observation["http_auth"],
                      "unit": {key: observation["unit"].get(key) for key in (
                          "Id", "LoadState", "ActiveState", "SubState", "UnitFileState", "MainPID")},
                      "package_id": service_package,
                      "repository_commit": observation["repository_commit"],
                      "health": observation["health"]["response"],
                      "timings_seconds": observation["timings_seconds"],
                      "cold_boot_proven": result["cold_boot_proven"]
                  }
              elif selected["kind"] == "http-readiness":
                  assert result["schema"] == "laplace.installed-product-http-readiness/v1"
                  assert result["package_id"] == service_package
                  assert result["endpoint"] == "http://127.0.0.1:55434"
                  assert result["http_auth"] == {"mode": "managed-operator", "credential_source": "/opt/laplace/secrets/operator.env"}
                  assert result["anonymous_protected_status"] == 401
                  assert result["health"]["status"] == 200
                  projection = {key: result.get(key) for key in (
                      "schema", "status", "scope", "package_id", "endpoint", "http_auth", "anonymous_protected_status")}
                  projection["external_reachability_verified"] = False
              else:
                  assert result["schema"] == "laplace.installed-product-gateway-proof/v2"
                  assert result["package_id"] == service_package
                  assert result["http_auth"] == {"mode": "managed-operator", "credential_source": "/opt/laplace/secrets/operator.env"}
                  partial = result["partial"]
                  assert partial["http_authority"]["anonymous_mcp_status"] == 401
                  assert partial["product_events"]["status"] == 200
                  assert partial["product_events"]["package_id"] == service_package
                  assert partial["product_events"]["complete_frame"] is True
                  assert result["openai_chat"]["streaming"]["done"] is True
                  assert result["openai_chat"]["streaming"]["finished"] is True
                  assert result["mcp"]["query_schema"] == "laplace.inspect.summary/v1"
                  projection = {"schema": result["schema"], "status": result["status"],
                      "package_id": service_package, "http_auth": result["http_auth"],
                      "anonymous_mcp_status": 401, "product_events": partial["product_events"],
                      "completed_phases": result["completed_phases"],
                      "external_reachability_verified": False}
              print("SERVICE_ARTIFACT_AUTHENTICATED " + json.dumps({
                  "artifact_id": selected["id"], "zip_bytes": selected["size"],
                  "zip_sha256": selected["sha256"], "kind": selected["kind"],
                  "member": selected["member"], "member_bytes": len(raw),
                  "member_sha256": hashlib.sha256(raw).hexdigest(),
                  "projection": projection
              }, sort_keys=True), flush=True)
          print("SERVICE_READER_COMPLETE", flush=True)
          PY
