name: Cancel superseded completed-proof cleanup
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: write
jobs:
  cancel-superseded-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Revalidate exact supersession and request ordinary cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          base="https://api.github.com/repos/SaltyPatron/Laplace-Refactor"
          def request(path,method="GET"):
              req=urllib.request.Request(base+path,method=method,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=30) as response:
                  body=response.read()
                  return response.status,json.loads(body) if body else None
          _,pr=request("/pulls/398")
          assert pr["head"]["sha"]=="1c23fa0a7c8c044c26ef91da3656e8f08e8a3948", "current owner changed"
          _,run=request("/actions/runs/35184451666")
          assert run["head_sha"]=="727debeb4e72f4a6356c7c7980f8e16ad37d2df9"
          assert run["head_branch"]=="fix/ci-execution-owners-20260916" and run["run_attempt"]==1
          if run["status"]=="completed":
              print("SUPERSEDED_PROOF_ALREADY_TERMINAL "+json.dumps({"run":run["id"],"conclusion":run["conclusion"]}))
          else:
              _,jobs=request("/actions/runs/35184451666/jobs?filter=latest&per_page=100")
              active=[job for job in jobs["jobs"] if job["status"]!="completed"]
              assert len(active)==1 and active[0]["id"]==105090702716, "active work changed"
              job=active[0]
              steps={step["number"]:step for step in job["steps"]}
              assert steps[6]["name"]=="Prove exact current-change PostgreSQL 18.6 package runtime"
              assert steps[6]["status"]=="completed" and steps[6]["conclusion"]=="success"
              assert steps[8]["name"]=="Clean disposable PostgreSQL-product workspace" and steps[8]["status"]=="in_progress"
              assert all(step["number"]==8 for step in job["steps"] if step["status"]=="in_progress")
              print("EXACT_SUPERSEDED_PROOF "+json.dumps({"run":run["id"],"head":run["head_sha"],"replacement":pr["head"]["sha"],"job":job["id"],"completedProof":steps[6],"remainingCleanup":steps[8],"retention":"Existing successful QA artifacts and durable proof receipts preserved; no host or database mutation."},sort_keys=True),flush=True)
              status,_=request("/actions/runs/35184451666/cancel","POST")
              assert status==202,status
              print("ORDINARY_CANCELLATION_ACCEPTED "+json.dumps({"run":35184451666,"httpStatus":status,"force":False}),flush=True)
          PY
