name: Qualify exact execution-observation replay acceptance
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f6d2afd31ba3b17e8fe474f86eb554900ae8560c
      - name: Execute exact new replay-evidence controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, py_compile, subprocess, urllib.request
          root = pathlib.Path.cwd()
          leaves = {
           "tools/sources/stockfish_corpus_acceptance.py": "badb012dab8616efb12c402a364d9045feffe575",
           "tests/stockfish_corpus_acceptance_tests.py": "ae41b0d33b4fc3eabe4f98e9c8defe1c99194556",
          }
          for path, sha in leaves.items():
           request = urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/" + sha,
               headers={"Authorization":"Bearer " + os.environ["GH_TOKEN"],"Accept":"application/vnd.github.raw+json"})
           raw = urllib.request.urlopen(request, timeout=60).read()
           if hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest() != sha:
            raise RuntimeError("authenticated Git blob mismatch: " + path)
           destination = root / path
           destination.write_bytes(raw)
           py_compile.compile(str(destination), doraise=True)
          result = subprocess.run(["python3", "tests/stockfish_corpus_acceptance_tests.py", "-v"], check=False)
          print("ACCEPTANCE_EXECUTION_OBSERVATION_CONTROLS " + json.dumps({"source_base":"f6d2afd31ba3b17e8fe474f86eb554900ae8560c","leaves":leaves,"exit_code":result.returncode,"installed":False}, sort_keys=True), flush=True)
          raise SystemExit(result.returncode)
          PY
