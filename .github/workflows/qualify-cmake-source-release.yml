name: Prepare immutable C++ derivative dependency objects
on:
  workflow_dispatch:
  push:
    branches: [qualify/cmake-source-443-20260916]
    paths:
      - ".github/workflows/qualify-cmake-source-release.yml"
permissions:
  contents: read
  actions: read
jobs:
  prepare-source-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      MATERIALIZATION_ROOT: ${{ github.workspace }}/cpp-derivative-objects-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Authenticate and compile the bounded Git-object preparation driver
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, py_compile, urllib.request
          blob = "f6a896f901c2d88a374c9bc149455057a0180ab1"
          expected = "858ca320f2f278c8e255e03edca3c5b8bb69746e8f08ea12c4783eecfbad0495"
          request = urllib.request.Request(
              "https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/" + blob,
              headers={"Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28"})
          request.add_unredirected_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
          with urllib.request.urlopen(request, timeout=60) as response:
              record = json.load(response)
          assert record["encoding"] == "base64"
          source = base64.b64decode(record["content"])
          assert record["sha"] == blob
          assert hashlib.sha1(b"blob " + str(len(source)).encode() + b"\0" + source).hexdigest() == blob
          assert hashlib.sha256(source).hexdigest() == expected
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cpp-dependency-objects.py"
          path.write_bytes(source)
          py_compile.compile(str(path), doraise=True)
          print("Authenticated driver and Python syntax PASS: " + blob)
          PY
      - name: Prepare exact dependency blobs tree commit and unselected lock proposal
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cpp-dependency-objects.py"
      - name: Retain complete or partial object preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpp-derivative-source-objects-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MATERIALIZATION_ROOT }}/evidence
          if-no-files-found: warn
          compression-level: 9
          retention-days: 21
