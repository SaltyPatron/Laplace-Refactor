name: Authenticate selected C++ native qualification evidence
on:
  workflow_dispatch:
  push:
    branches: ["qualify/cmake-source-443-20260916"]
    paths: [".github/workflows/qualify-cmake-source-release.yml"]
permissions:
  contents: read
  actions: read
jobs:
  read-selected-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Authenticate actual successful artifact and native qualification receipts
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, tarfile, urllib.request, xml.etree.ElementTree as ET, zipfile
          api = "https://api.github.com/repos/SaltyPatron/Laplace-Refactor"
          run_id, job_id, artifact_id = 35186357806, 105089158422, 10481758203
          head = "d7da5e820a60aee30599bf8abd0b16d022c79a6b"
          artifact_sha, artifact_bytes = "d3869e90096cd21dcccf37d0e44c46363bfe81f8ace12cd6272e2f868d69af82", 19735930
          def get(route, raw=False):
              request = urllib.request.Request(api + route,
                  headers={"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              request.add_unredirected_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = response.read()
              return data if raw else json.loads(data)
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def git_object(kind, data):
              return hashlib.sha1(kind.encode() + b" " + str(len(data)).encode() + b"\0" + data).hexdigest()
          run, job, metadata = (get("/actions/runs/" + str(run_id)),
              get("/actions/jobs/" + str(job_id)), get("/actions/artifacts/" + str(artifact_id)))
          assert run["head_sha"] == head and run["status"] == "completed" and run["conclusion"] == "success"
          assert job["run_id"] == run_id and job["conclusion"] == "success"
          assert not metadata["expired"] and metadata["workflow_run"]["id"] == run_id
          assert metadata["workflow_run"]["head_sha"] == head and metadata["digest"] == "sha256:" + artifact_sha
          data = get("/actions/artifacts/" + str(artifact_id) + "/zip", True)
          assert len(data) == artifact_bytes and sha(data) == artifact_sha
          archive = zipfile.ZipFile(io.BytesIO(data))
          assert len(archive.namelist()) == len(set(archive.namelist()))
          read = archive.read
          member_sha = {}
          def document(name):
              raw = read(name)
              member_sha[name] = sha(raw)
              return json.loads(raw)
          inputs = document("input.json")
          acquisition = document("public-acquisition.json")
          preparation = document("preparation-result.json")
          qualification = document("qualification.json")
          corpus = document("stockfish-native.json")
          control = document("official-control.json")
          runtime = document("runtime-compilation-observation.json")
          retention = document("native-build-retention.json")
          assert preparation["phase"] == "prepared-clean-local-candidate"
          assert qualification["phase"] == "passed-hosted-native-provider-and-source-plan"
          assert inputs == qualification["candidate_input"]
          assert inputs["product_parent_commit"] == "ce4328efec8aed403080ded6c16bca8a720d8e07"
          assert inputs["product_tree"] == "3b31f451bd3acfad722cd8893d38c4df298a2c3c"
          assert inputs["tracked_clean"] and inputs["local_disposable_candidate"]
          assert set(inputs["changed_product_paths"]) == {"dependencies/tree-sitter-grammars.lock.json",
              "tests/verified_cpp_source_probe.cpp"}
          commit_bytes = read("local-product-candidate.commit")
          assert git_object("commit", commit_bytes) == inputs["product_commit"]
          headers = commit_bytes.split(b"\n\n", 1)[0].decode().splitlines()
          assert [line[5:] for line in headers if line.startswith("tree ")] == [inputs["product_tree"]]
          assert [line[7:] for line in headers if line.startswith("parent ")] == [inputs["product_parent_commit"]]
          assert sha(read("local-product-candidate.patch")) == inputs["product_patch_sha256"]
          proposal_bytes = read("proposed-grammar-lock.json")
          assert git_object("blob", proposal_bytes) == inputs["grammar_lock_blob"] == "0433ef054fd5ff21977616688ce0087f741cdcb4"
          assert sha(proposal_bytes) == inputs["grammar_lock_sha256"] == "8978e6b56b72c174436529f4e3990b3a08ae3364aaf73df860e4df793699d5a3"
          old_bytes = read("official-grammar-lock.json")
          assert git_object("blob", old_bytes) == "da364f3938a9d23fd54a1857431817c9b14a7453"
          old, proposed = json.loads(old_bytes), json.loads(proposal_bytes)
          old_entries = {item["name"]: item for item in old["repositories"]}
          new_entries = {item["name"]: item for item in proposed["repositories"]}
          assert old_entries.keys() == new_entries.keys()
          assert all(old_entries[name] == new_entries[name] for name in old_entries if name != "tree-sitter-cpp")
          assert all(old[key] == proposed[key] for key in old if key != "repositories")
          assert new_entries["tree-sitter-cpp"] == inputs["grammar"]
          assert acquisition == inputs["public_acquisition"]
          assert acquisition["revision"] == "8ece5afbc1e97f8d4344355b15822110e8231056"
          assert acquisition["tree"] == "cd00239b00007a65e70fde9c8163233e5f651095"
          assert acquisition["git_archive_sha256"] == "e0be65c894548c136ad059942375d89750381a6d3a2138cd383eb70b213fcb9f"
          derivative_tar = read("derivative-source.tar")
          assert sha(derivative_tar) == acquisition["git_archive_sha256"]
          assert len(derivative_tar) == acquisition["git_archive_bytes"] == 27197440
          derivative = tarfile.open(fileobj=io.BytesIO(derivative_tar), mode="r:")
          for source in acquisition["generated_files"]:
              content = derivative.extractfile(source["path"]).read()
              assert len(content) == source["bytes"] and sha(content) == source["sha256"]
          assert git_object("blob", read("verified_cpp_source_probe.cpp")) == "246cb95c380211a11db11ad50dce09700bd8238c"
          assert qualification["runtime"]["revision"] == "d97971e24500218865c05ed1febdee2acf41bae1"
          assert qualification["runtime"]["version"] == "v0.26.13"
          for name in ("candidate", "official", "pgn"):
              receipt = document("providers/" + name + "/build-receipt.json")
              assert receipt["schema"] == "laplace.grammar-provider-build/v1" and receipt["exit_code"] == 0
              assert receipt["runtime"]["revision"] == qualification["runtime"]["revision"]
              assert sha(read("providers/" + name + "/provider.so")) == receipt["library"]["sha256"]
              if name != "pgn":
                  assert member_sha["providers/" + name + "/build-receipt.json"] == qualification[name + "_build_receipt_sha256"]
          assert sha(read("laplace_verified_cpp_source_probe")) == qualification["native_probe_sha256"]
          assert sha(read("liblaplace_engine.so")) == qualification["native_engine_sha256"]
          assert sha(read("libtree-sitter.a")) == qualification["runtime_archive_sha256"]
          assert runtime == qualification["actual_runtime_compilation"]
          assert runtime["amalgamated"] == "OFF"
          assert len(runtime["objects"]) == len(runtime["expected_sources"]) > 1
          assert set(runtime["expected_sources"]) == set(runtime["observed_sources"])
          for item in runtime["objects"]:
              assert sha(read(item["artifact_member"])) == item["object_sha256"]
          for item in retention:
              assert item["exists"] and sha(read(item["artifact_member"])) == item["sha256"]
          cases = ET.fromstring(read("native-contracts.xml")).findall(".//testcase")
          assert {case.attrib["name"] for case in cases} == {
              "source.verified-cpp-native-contract", "source.verified-grammar-loader-contract"}
          assert len(cases) == 2 and all(not any(case.find(kind) is not None
              for kind in ("failure", "error", "skipped")) for case in cases)
          assert control == qualification["official_provider_control"] and control["returncode"] == 16
          assert control["expected_rejection_observed"] and control["baseline_cases_completed"] == 4
          assert control["native_probe_sha256"] == qualification["native_probe_sha256"]
          assert corpus == qualification["native_corpus"] and corpus["returncode"] == 0
          assert corpus["preceding_native_fixture_count"] == 11 and len(corpus["source_plan"]) == 1
          plan = corpus["source_plan"][0]
          assert plan["files"] == 119 and plan["bytes"] == 1172144 and plan["all_files_reconstructed"]
          assert plan["semantic_testimony"] == 0 and plan["postgresql_admission"] is False
          assert all(qualification[key] is False for key in ("postgresql_admission_executed",
              "installed_provider_changed", "persisted102_diagnostics_recounted", "executable_semantics_verified"))
          result = {"schema": "laplace.authenticated-selected-cpp-native-qualification/v1",
              "producer_run_id": run_id, "producer_job_id": job_id, "producer_head": head,
              "artifact_id": artifact_id, "artifact_sha256": artifact_sha, "artifact_bytes": artifact_bytes,
              "artifact_members_sha256": member_sha, "input": inputs, "qualification": qualification,
              "proposed_lock": {"git_blob": git_object("blob", proposal_bytes),
                  "sha256": sha(proposal_bytes), "bytes": len(proposal_bytes),
                  "other299_entries_unchanged": True}}
          print("CPP_SELECTED_NATIVE_AUTHENTICATED_REPORT " + json.dumps(result, sort_keys=True))
          PY
