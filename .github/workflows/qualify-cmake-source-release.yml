name: Retain required hosted proof without duplicate physical PR work
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: write
  pull-requests: read
jobs:
  retain-hosted-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Guard exact PR and run, then cancel optional physical continuation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo = "SaltyPatron/Laplace-Refactor"
          head = "e625ee1e5277d91337793b18ef344ba8901c0066"
          run_id = 35249740957
          pr_number = 404
          assert os.environ["GITHUB_REPOSITORY"] == repo
          token = os.environ.pop("GH_TOKEN")
          api = "https://api.github.com/repos/" + repo
          def request(path, method="GET"):
              req = urllib.request.Request(api + path, method=method, headers={
                  "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "Laplace-exact-PR-proof-retention"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read(2000001)
                  assert len(raw) <= 2000000
                  return response.status, json.loads(raw) if raw else None
          def guard():
              _, pr = request("/pulls/" + str(pr_number))
              assert pr["state"] == "open" and not pr["merged"]
              assert pr["head"]["sha"] == head and pr["head"]["repo"]["full_name"] == repo
              _, run = request("/actions/runs/" + str(run_id))
              assert run["id"] == run_id and run["head_sha"] == head
              assert run["event"] == "pull_request" and run["path"] == ".github/workflows/product-path.yml"
              assert run["repository"]["full_name"] == repo and run["run_attempt"] == 1
              assert any(p["number"] == pr_number for p in run["pull_requests"])
              return run
          required = {"hosted-proof / requirements", "hosted-proof / native (linux-dev)",
                      "hosted-proof / native (linux-sanitize)"}
          deadline = time.monotonic() + 720
          while True:
              run = guard()
              _, inventory = request("/actions/runs/" + str(run_id) + "/jobs?per_page=100")
              assert inventory["total_count"] <= 100
              jobs = inventory["jobs"]
              selected = [j for j in jobs if j["name"] in required]
              assert len({j["name"] for j in selected}) == len(selected)
              if any(j["status"] == "completed" and j["conclusion"] != "success" for j in selected):
                  raise RuntimeError("a required hosted check did not pass; no cancellation submitted")
              if len(selected) == 3 and all(j["status"] == "completed" and j["conclusion"] == "success" for j in selected):
                  print("REQUIRED_HOSTED_PROOF " + json.dumps([
                      {k:j[k] for k in ("id","name","status","conclusion","started_at","completed_at")}
                      for j in selected], sort_keys=True), flush=True)
                  guard()
                  if run["status"] != "completed":
                      code, _ = request("/actions/runs/" + str(run_id) + "/cancel", method="POST")
                      assert code == 202
                      print("EXACT_OPTIONAL_PR_CONTINUATION_CANCEL_REQUESTED", flush=True)
                  break
              assert time.monotonic() < deadline, "required hosted proof did not finish within the bounded wait"
              time.sleep(5)
          deadline = time.monotonic() + 120
          while True:
              _, run = request("/actions/runs/" + str(run_id))
              assert run["head_sha"] == head
              _, inventory = request("/actions/runs/" + str(run_id) + "/jobs?per_page=100")
              jobs = inventory["jobs"]
              selected = [j for j in jobs if j["name"] in required]
              assert len(selected) == 3 and all(j["conclusion"] == "success" and j["status"] == "completed" for j in selected)
              active = [j for j in jobs if j["status"] != "completed"]
              if run["status"] == "completed" and not active:
                  print("FINAL_EXACT_PR_JOBS " + json.dumps({
                      "run_id": run_id, "head_sha": head, "run_conclusion": run["conclusion"],
                      "required_checks_remain_successful": True,
                      "optional_physical_success_claimed": False,
                      "jobs": [{k:j[k] for k in ("id","name","status","conclusion","started_at","completed_at")} for j in jobs]
                  }, sort_keys=True), flush=True)
                  break
              assert time.monotonic() < deadline, "ordinary cancellation has not yet reached terminal jobs"
              time.sleep(5)
          PY
