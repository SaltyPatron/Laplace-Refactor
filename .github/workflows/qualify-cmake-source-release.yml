name: Read exact installed cognition failure evidence
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate the actual main activation failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,zipfile
          BASE="https://api.github.com/repos/SaltyPatron/Laplace-Refactor"
          def get(path):
              request=urllib.request.Request(BASE+path,headers={"Accept":"application/vnd.github+json"})
              request.add_unredirected_header("Authorization","Bearer "+os.environ["GH_TOKEN"])
              with urllib.request.urlopen(request,timeout=60) as response:return response.read()
          run=json.loads(get("/actions/runs/35172058662"))
          assert run["head_sha"]=="2e62b2260a145de41596c7f4ab2c4aff65e07352" and run["event"]=="push" and run["head_branch"]=="main"
          metadata=json.loads(get("/actions/artifacts/10477892824"))
          expected="d4cc15776a8a8a4b01cee38131086bc14242e68300e3d089fe182bdf9112ecd4"
          assert metadata["workflow_run"]["id"]==35172058662 and not metadata["expired"]
          assert metadata["digest"]=="sha256:"+expected
          raw=get("/actions/artifacts/10477892824/zip")
          assert len(raw)==2991 and hashlib.sha256(raw).hexdigest()==expected
          files=zipfile.ZipFile(io.BytesIO(raw))
          assert len(files.namelist())==1,files.namelist()
          document=json.loads(files.read(files.namelist()[0]))
          print("AUTHENTICATED_FAILURE_ARTIFACT "+json.dumps({"id":10477892824,"run":35172058662,"bytes":len(raw),"sha256":expected,"name":files.namelist()[0]}))
          print("INSTALLED_COGNITION_FAILURE "+json.dumps(document,sort_keys=True))
          PY
