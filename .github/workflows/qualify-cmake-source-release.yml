name: Qualify public reconciliation envelope and exact execution replay receipts
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6f0d04753344d43081c78ee85d9c258cc973dc67
          persist-credentials: false
      - name: Authenticate the exact four Python leaves
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,urllib.request
          files={
              "tools/delivery/product_activation_runner.py":"19842ade06b918df91508836f8977a706c6f024f",
              "tests/product_activation_runner_tests.py":"0a67829edc7fca6b4d1af85bf77b9e2e4dd4cb81",
              "tools/sources/stockfish_corpus_acceptance.py":"badb012dab8616efb12c402a364d9045feffe575",
              "tests/stockfish_corpus_acceptance_tests.py":"ae41b0d33b4fc3eabe4f98e9c8defe1c99194556"}
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          for relative,sha in files.items():
              request=urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/"+sha,
                  headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(request,timeout=30) as response:
                  document=json.load(response)
              raw=base64.b64decode(document["content"])
              assert document["sha"]==sha and document["size"]==len(raw)
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==sha
              ast.parse(raw,filename=relative)
              (root/relative).write_bytes(raw)
          temporary=root/".qualification-work"
          temporary.mkdir()
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as output:
              for key in ("TMPDIR","TMP","TEMP"):
                  output.write(key+"="+str(temporary)+"\n")
          print("QUALIFIED_SOURCE_SELECTION "+json.dumps(files,sort_keys=True))
          PY
      - name: Execute all selected owner controls
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,sys
          results=[]
          for path in ("tests/product_activation_runner_tests.py","tests/stockfish_corpus_acceptance_tests.py"):
              result=subprocess.run([sys.executable,path],timeout=300)
              results.append({"test":path,"exit_code":result.returncode})
          print("PUBLIC_BINDING_AND_REPLAY_CONTROLS "+json.dumps(results),flush=True)
          raise SystemExit(0 if all(row["exit_code"]==0 for row in results) else 1)
          PY
