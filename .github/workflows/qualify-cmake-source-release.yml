name: Qualify exact readback server deadline
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  readback-deadline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: df158f21bfecaf4045d065b10c21cd92464ce3ec
          persist-credentials: false
      - name: Authenticate and syntax-check exact three source leaves
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,urllib.request
          for entry in json.loads("[{\"path\":\"tools/admit_source.py\",\"sha\":\"b20ef5ab21ea17dc056e13cf8d3d5baa4e1dce96\"},{\"path\":\"tests/verified_git_source_tests.py\",\"sha\":\"dba35cfbdee0c066447b20d2f33a809b159a897a\"},{\"path\":\"tests/source_runtime_state_postgres_tests.py\",\"sha\":\"78e77fff37d86ab8e527b0841d36e0c0553198d0\"}]"):
              request=urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/"+entry["sha"],headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(request,timeout=30) as response: value=json.load(response)
              data=base64.b64decode(value["content"],validate=False)
              if hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()!=entry["sha"]:raise ValueError("source blob digest differs")
              ast.parse(data,filename=entry["path"])
              pathlib.Path(entry["path"]).write_bytes(data)
              print("AUTHENTICATED_SOURCE",entry["path"],entry["sha"],len(data))
          
          PY
      - name: Prepare owned hosted PostgreSQL fixture workspace
        shell: bash
        run: |
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /build/laplace/work/readback-deadline
          python3 -I - <<'PY'
          import os,pathlib
          candidates=sorted(pathlib.Path("/usr/lib/postgresql").glob("*/bin"),key=lambda p:int(p.parent.name),reverse=True)
          selected=next((p for p in candidates if all((p/n).is_file() for n in ("initdb","pg_ctl","postgres","psql"))),None)
          if selected is None:raise RuntimeError("hosted PostgreSQL fixture binaries unavailable")
          with open(os.environ["GITHUB_ENV"],"a") as output:
              output.write("SELECTED_PG_BINDIR="+str(selected)+"\nTMPDIR=/build/laplace/work/readback-deadline\n")
          print("SELECTED_POSTGRESQL",selected)
          PY
      - name: Exercise exact readback parser and private PostgreSQL cancellation
        shell: bash
        run: |
          "${SELECTED_PG_BINDIR}/postgres" --version
          PYTHONPATH=tools python3 -B tests/verified_git_source_tests.py GitReadbackReceiptTests
          PYTHONPATH=tools python3 -B tests/source_runtime_state_postgres_tests.py --pg-bindir "${SELECTED_PG_BINDIR}"
