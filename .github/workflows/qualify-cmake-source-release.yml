name: Diagnose private PostgreSQL witness statistics
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  witness-statistics:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_TERMINAL_PROMPT: "0"
      QUAL_ROOT: /build/laplace/work/witness-stats-${{ github.run_id }}-${{ github.run_attempt }}
      QUAL_BUILD: /build/laplace/build/witness-stats-${{ github.run_id }}-${{ github.run_attempt }}
      TMPDIR: /build/laplace/work
      TMP: /build/laplace/work
      TEMP: /build/laplace/work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: df158f21bfecaf4045d065b10c21cd92464ce3ec
          persist-credentials: false
      - name: Authenticate the isolated fixture and source extraction
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /build/laplace/work /build/laplace/build
          test ! -e "$QUAL_ROOT"
          test ! -e "$QUAL_BUILD"
          mkdir -p "$QUAL_ROOT/output" "$QUAL_ROOT/archives" "$QUAL_BUILD"
          python3 - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,runpy,subprocess,urllib.request
          base="df158f21bfecaf4045d065b10c21cd92464ce3ec"
          fixture_sha="1a7c4044f986cb739c96b89bc19ef37df5bfbfe4"
          if subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()!=base:
              raise SystemExit("fixture source checkout differs")
          root=pathlib.Path(os.environ["QUAL_ROOT"])
          request=urllib.request.Request(
              "https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/"+fixture_sha,
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(request,timeout=30) as response:
              document=json.load(response)
          if document.get("sha")!=fixture_sha or document.get("encoding")!="base64":
              raise SystemExit("fixture blob response differs")
          payload=base64.b64decode(document["content"])
          actual=hashlib.sha1(b"blob "+str(len(payload)).encode()+b"\0"+payload).hexdigest()
          if actual!=fixture_sha:raise SystemExit("fixture bytes differ")
          fixture=root/"output"/"stale_witness_plan_fixture.py"
          fixture.write_bytes(payload)
          ast.parse(payload,filename=str(fixture))
          module=runpy.run_path(str(fixture))
          schema,parameterized,query=module["extract_sources"](pathlib.Path.cwd())
          source={"schema":"laplace.private-witness-statistics-source/v1",
              "base_commit":base,"fixture_blob":fixture_sha,
              "source_blobs":module["SOURCES"],
              "query_sha256":hashlib.sha256(parameterized.encode()).hexdigest(),
              "fixture_schema_sha256":hashlib.sha256(schema.encode()).hexdigest(),
              "query_scope":"unchanged native full-profile v4 witness cursor",
              "native_admission_performed":False,"historical_cause_proven":False}
          (root/"output"/"source-selection.json").write_text(json.dumps(source,indent=2)+"\n")
          print("LAPLACE_WITNESS_STATISTICS_SOURCE "+json.dumps(source,sort_keys=True))
          PY
          sudo apt-get update
          sudo apt-get install --yes build-essential bison flex perl curl
          {
            uname -a
            gcc --version
            python3 --version
          } > "$QUAL_ROOT/output/hosted-provider-versions.txt"
      - name: Acquire the exact official PostgreSQL 18.6 source
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          source=json.loads(pathlib.Path("dependencies/release-lock.json").read_text())
          entry=source["archives"]["postgresql"]
          if entry["version"]!="18.6" or entry["sha256"]!="555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f":
              raise SystemExit("selected PostgreSQL release differs")
          target=pathlib.Path(os.environ["QUAL_ROOT"])/"output"/"postgresql-release-lock.json"
          target.write_text(json.dumps({"schema":source["schema"],"archives":{"postgresql":entry}},indent=2)+"\n")
          PY
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            --output "$QUAL_ROOT/archives/postgresql-18.6.tar.bz2" \
            https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.bz2
          python3 tools/dependencies/release-assets.py import \
            --lock "$QUAL_ROOT/output/postgresql-release-lock.json" \
            --archive-root "$QUAL_ROOT/archives" \
            --destination "$QUAL_ROOT/release-source" \
            | tee "$QUAL_ROOT/output/postgresql-source-verification.json"
      - name: Build disposable PostgreSQL 18.6
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QUAL_BUILD/postgresql"
          cd "$QUAL_BUILD/postgresql"
          "$QUAL_ROOT/release-source/postgresql/configure" \
            --prefix="$QUAL_ROOT/pgsql-18" \
            --without-readline --without-zlib --without-icu \
            2>&1 | tee "$QUAL_ROOT/output/postgresql-configure.log"
          make --jobs=2 2>&1 | tee "$QUAL_ROOT/output/postgresql-build.log"
          make install 2>&1 | tee "$QUAL_ROOT/output/postgresql-install.log"
          "$QUAL_ROOT/pgsql-18/bin/pg_config" --version \
            | tee "$QUAL_ROOT/output/postgresql-version.txt"
          test "$("$QUAL_ROOT/pgsql-18/bin/pg_config" --version)" = "PostgreSQL 18.6"
      - name: Compare the unchanged full cursor before and after ANALYZE
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 "$QUAL_ROOT/output/stale_witness_plan_fixture.py" \
            --repository "$GITHUB_WORKSPACE" \
            --pg-bindir "$QUAL_ROOT/pgsql-18/bin" \
            --work-root /build/laplace/work \
            --output "$QUAL_ROOT/output/fixture" \
            2>&1 | tee "$QUAL_ROOT/output/fixture.log"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["QUAL_ROOT"])/"output"
          report=json.loads((root/"fixture"/"report.json").read_text())
          if report["status"]!="completed" or not report["cleanup"]["stopped"]:
              raise SystemExit("private fixture did not complete and clean up")
          if report["postgres"]["server_version_num"]!="180006":
              raise SystemExit("private provider version differs")
          if report["final_counts"]!={"canonical":571627,"execution":571627,"other_sessions":0}:
              raise SystemExit("synthetic full-profile counts differ")
          source=json.loads((root/"source-selection.json").read_text())
          if report["source_blobs"]!=source["source_blobs"] or report["query_sha256"]!=source["query_sha256"]:
              raise SystemExit("executed source binding differs")
          summary={"schema":"laplace.private-witness-statistics-observation/v1",
              "status":"completed","provider":"official PostgreSQL 18.6; hosted private cluster",
              "native_admission_performed":False,"historical_cause_proven":False,
              "source":source,"old_profile_rows":report["old_profile_rows"],
              "new_profile_rows":report["new_profile_rows"],"scenarios":{},
              "cleanup":report["cleanup"]}
          for name in ("stale","fresh"):
              phase=report[name]
              summary["scenarios"][name]={
                  "estimated_nodes":phase["plan"]["nodes"],
                  "execution_outcome":phase["analyze"]["outcome"],
                  "elapsed_seconds":phase["analyze"]["elapsed_seconds"],
                  "actual_nodes":phase["analyze"].get("nodes"),
                  "server_statement_timeout_seconds":phase["analyze"]["server_statement_timeout_seconds"]}
          manifest={}
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  payload=path.read_bytes()
                  manifest[str(path.relative_to(root))]={"bytes":len(payload),
                      "sha256":hashlib.sha256(payload).hexdigest()}
          summary["evidence"]=manifest
          (root/"observation.json").write_text(json.dumps(summary,indent=2)+"\n")
          print("LAPLACE_WITNESS_STATISTICS_OBSERVATION "+json.dumps(summary,sort_keys=True))
          PY
      - name: Retain configure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QUAL_ROOT/output"
          if [[ -f "$QUAL_BUILD/postgresql/config.log" ]]; then
            cp "$QUAL_BUILD/postgresql/config.log" "$QUAL_ROOT/output/postgresql-config.log"
          fi
      - name: Retain source binding and private PostgreSQL plans
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: witness-statistics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUAL_ROOT }}/output/
          if-no-files-found: error
          retention-days: 30
