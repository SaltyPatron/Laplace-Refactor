name: Observe existing Original foundation progress read-only
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
    paths: [.github/workflows/qualify-cmake-source-release.yml]
permissions:
  contents: read
jobs:
  observe-foundation:
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Authenticate fixed observer and retain two bounded progress samples
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          observation_root="$RUNNER_TEMP/foundation-progress-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$observation_root"
          mkdir -m 0700 "$observation_root"
          printf 'OBSERVATION_ROOT=%s\n' "$observation_root" >> "$GITHUB_ENV"
          export OBSERVATION_ROOT="$observation_root"
          python3 - <<'PY'
          import ast, base64, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ["OBSERVATION_ROOT"])
          identity = "044c37f97273541ae7887b36a8fb553029de7825"
          token = os.environ.pop("GH_TOKEN")
          request = urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/" + identity, headers={"Accept":"application/vnd.github+json"})
          request.add_unredirected_header("Authorization", "Bearer " + token)
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = response.read(1048577)
          assert len(payload) <= 1048576
          row = json.loads(payload)
          assert row["sha"] == identity and row["encoding"] == "base64"
          data = base64.b64decode(row["content"], validate=False)
          assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == identity
          ast.parse(data)
          source = root / "observer.py"
          source.write_bytes(data)
          print("Authenticated fixed observer " + identity + "; no checkout or shared lease.", flush=True)
          with (root / "observations.jsonl").open("wb") as stdout, (root / "stderr.log").open("wb") as stderr:
              result = subprocess.run(["timeout", "--signal=TERM", "--kill-after=5s", "40s", "/usr/bin/python3", "-I", str(source)], stdout=stdout, stderr=stderr, check=False)
          print((root / "observations.jsonl").read_text(), end="", flush=True)
          print((root / "stderr.log").read_text(), end="", flush=True)
          (root / "execution.json").write_text(json.dumps({"schema":"laplace.bounded-foundation-observer-execution/v1","observer_git_blob":identity,"foundation_run":35259453971,"exit_code":result.returncode,"shared_lease_acquired":False,"checkout_performed":False},sort_keys=True)+"\n")
          raise SystemExit(result.returncode)
          PY
      - name: Retain exact read-only observation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-progress-35259453971-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OBSERVATION_ROOT }}
          if-no-files-found: error
          retention-days: 30
