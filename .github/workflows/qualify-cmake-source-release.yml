name: Qualify CMake consumer operator and publication selector coherence
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
concurrency:
  group: laplace-cmake-operator-source-controls
  cancel-in-progress: false
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate and syntax-check the prepared consumer operation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import ast, base64, hashlib, json, os, pathlib, re, subprocess, urllib.request
          import yaml
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"cmake-operator-source-controls"
          out.mkdir(mode=0o700)
          blob="f4cc02a7213c58a3b87e6f3717da302fb85958d3"
          url="https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/"+blob
          request=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(request,timeout=30) as response:
              document=json.load(response)
          body=base64.b64decode(document["content"])
          assert document["sha"]==blob and document["encoding"]=="base64"
          assert hashlib.sha1(b"blob "+str(len(body)).encode()+b"\0"+body).hexdigest()==blob
          source=body.decode("utf-8")
          (out/"prepared-operation.yml").write_bytes(body)
          parsed=yaml.safe_load(source)
          bash_count=python_count=0
          for job in parsed["jobs"].values():
              for step in job["steps"]:
                  if "run" not in step:
                      continue
                  run=step["run"]
                  bash_count+=1
                  subprocess.run(["bash","-n"],input=run,text=True,check=True)
                  lines=run.splitlines()
                  index=0
                  while index<len(lines):
                      match=re.search(r"<<'([A-Z_]+)'",lines[index])
                      if match:
                          closing=match.group(1)
                          end=index+1
                          while end<len(lines) and lines[end]!=closing:
                              end+=1
                          assert end<len(lines),"unterminated heredoc"
                          program="\n".join(lines[index+1:end])+"\n"
                          ast.parse(program,filename=f"prepared-heredoc-{python_count+1}.py")
                          python_count+=1
                          (out/f"prepared-heredoc-{python_count}.py").write_text(program)
                          index=end
                      index+=1
          assert bash_count==3 and python_count==3,(bash_count,python_count)
          placeholders=sorted(set(re.findall(r"__EXPECTED_[A-Z_]+__",source)))
          assert len(placeholders)==5,placeholders
          receipt={"schema":"laplace.cmake-operator-source-controls/v1","status":"passed",
              "operator_blob":blob,"operator_sha256":hashlib.sha256(body).hexdigest(),
              "bash_programs":bash_count,"python_programs":python_count,
              "unfilled_binding_placeholders":placeholders,
              "host_operation_executed":False,"installed_selection_changed":False}
          (out/"syntax.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Execute publication projection and historical evidence controls
        shell: bash
        run: |
          set -euo pipefail
          unset LAPLACE_VERIFY_CONTINUATION_PHYSICAL
          python3 -B tests/program_authority_tests.py 2>&1 |
            tee "$RUNNER_TEMP/cmake-operator-source-controls/program-authority-tests.log"
      - name: Retain source qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmake-operator-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmake-operator-source-controls/
          if-no-files-found: error
          retention-days: 90
