name: Authenticate actual chess profiles and persisted source diagnostics
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact artifact bytes and actual profile invocation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,zipfile
          BASE="https://api.github.com/repos/SaltyPatron/Laplace-Refactor"
          def get(path):
              request=urllib.request.Request(BASE+path,headers={"Accept":"application/vnd.github+json"})
              request.add_unredirected_header("Authorization","Bearer "+os.environ["GH_TOKEN"])
              with urllib.request.urlopen(request,timeout=60) as response: return response.read()
          def artifact(identity,expected_run,expected_size,expected_sha):
              metadata=json.loads(get("/actions/artifacts/"+str(identity)))
              assert metadata["workflow_run"]["id"]==expected_run and not metadata["expired"]
              assert metadata["digest"]=="sha256:"+expected_sha
              raw=get("/actions/artifacts/"+str(identity)+"/zip")
              assert len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected_sha
              print("AUTHENTICATED_ARTIFACT "+json.dumps({"id":identity,"run":expected_run,"bytes":expected_size,"sha256":expected_sha}))
              return zipfile.ZipFile(io.BytesIO(raw))
          def read(bundle,path): return json.loads(bundle.read(path))
          diagnostics=artifact(10476716479,35168832815,331918,"f857f717882a5310f4828bfcc564b0fa0b29ffb3ebac2496d98521fb68bd7386")
          observed=read(diagnostics,"diagnostics.json")
          assert observed["diagnostic_count"]==len(observed["nodes"])==102 and observed["activation_unchanged"]
          assert observed["source_profile_id"]=="2368be2a20fd01a5cdfca1f90a79b923741e521e64718ae996a70af98f4ec651"
          assert observed["executable_semantics_verified"] is False
          print("PERSISTED_SYNTAX_DIAGNOSTICS "+json.dumps(observed,sort_keys=True))
          calibration_run=json.loads(get("/actions/runs/"+str(35168534734)))
          assert calibration_run["head_sha"]=="b54819f93feec51e35e3c6cf76f7658a8eb170b5" and calibration_run["event"]=="pull_request"
          calibration=artifact(10476786113,35168534734,8086884,"bbe1e2caaa063f6b5d8be3d0f6ff7be113fbfcdc692167bd7bcdb7dbeb529608")
          report=read(calibration,"measurements/receipt.json")
          receipt_sha=hashlib.sha256(calibration.read("measurements/receipt.json")).hexdigest()
          activation=read(calibration,"profile-activation.json")
          assert report["schema"]=="laplace.chess-benchmark-receipt/v2"
          assert report["completion"] in ("completed","completed-with-rejected-configurations")
          assert activation["calibration_sha256"]==receipt_sha
          selected=report["recommendations"]
          print("CALIBRATION_HOST "+json.dumps({"before":report["host"],"after":report["host_after"]},sort_keys=True))
          print("CALIBRATION_AND_ACTIVATION "+json.dumps({"execution":read(calibration,"execution-context.json"),"receipt_sha256":receipt_sha,"recommendations":selected,"activation":activation,"database_recording":report.get("database_recording")},sort_keys=True))
          for name,mode in (("profile-analysis-defaults","analysis"),("profile-analysis-overrides","analysis"),("profile-games-defaults","games")):
              invocation=read(calibration,name+"/receipt.json")
              assert invocation["completion"]=="completed"
              assert invocation["calibration"]["sha256"]==receipt_sha
              assert invocation["profile_id"]==activation["profiles"][mode]["profile_id"]
              assert invocation["database_recording"]=={"measured":False,"recorded_games":None,"games_per_second":None}
              if mode=="analysis":
                  actual=calibration.read(name+"/input.txt")
                  assert hashlib.sha256(actual).hexdigest()==invocation["input_sha256"]
                  assert hashlib.sha256(calibration.read(name+"/engine.log")).hexdigest()==invocation["execution"]["transcript_sha256"]
                  assert invocation["command"]==[invocation["tool_identity"]["stockfish"]["executable"]]
                  if name=="profile-analysis-defaults":
                      assert invocation["configuration"]["initial"]==invocation["configuration"]["effective_final"]==selected["single_engine_fixed_depth_suite"]["configuration"]
                  else:
                      assert invocation["configuration"]["effective_final"]["threads"]==1
                      assert invocation["configuration"]["effective_final"]["hash_mib"]==16
              else:
                  assert invocation["command"][0]==invocation["tool_identity"]["cutechess"]["executable"]
                  configuration=selected["aggregate_game_throughput"]["configuration"]
                  assert invocation["configuration"]["concurrency"]==configuration["concurrency"]
                  for engine in invocation["configuration"]["engines"]:
                      assert engine["cmd"]==invocation["tool_identity"]["stockfish"]["executable"]
                      assert engine["option.Threads"]==str(configuration["threads"])
                      assert engine["option.Hash"]==str(configuration["hash_mib"])
                  assert hashlib.sha256(calibration.read(name+"/games.pgn")).hexdigest()==invocation["generated_pgn"]["sha256"]
              print("DIRECT_PROFILE_INVOCATION "+json.dumps({key:invocation[key] for key in ("mode","completion","profile_id","calibration","command","configuration","tool_identity","database_recording","execution")},sort_keys=True))
          validation=read(calibration,"profile-games-defaults-validation.json")
          assert not validation["database_recording_capacity_measured"] and not validation["throughput_measured"] and not validation["playing_strength_inferred"]
          print("PROFILE_LEGAL_TERMINALS "+json.dumps(validation,sort_keys=True))
          PY
