name: Qualify canonical runtime checkpoint replay
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  runtime-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 54665b6f0a645455469195e1bc7f041edfc587c0
          fetch-depth: 0
          persist-credentials: false
      - name: Execute complete canonical runtime owner tests
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 54665b6f0a645455469195e1bc7f041edfc587c0
          test "$(git rev-parse HEAD^{tree})" = c867033ce78bea44595b5bd85b4cb98c254d9ace
          python3 -B tests/runtime_build_graph_tests.py -v
      - name: Prove the serialization regression test detects the original ordering defect
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          python3 -B - <<'PY'
          import pathlib,subprocess,sys
          path=pathlib.Path("tools/dependencies/build-runtime-graph.py")
          original=path.read_bytes()
          old=b"set(provider) != set(dimensions)"
          assert original.count(old)==1
          try:
              path.write_bytes(original.replace(old,b"list(provider) != dimensions"))
              result=subprocess.run([sys.executable,"-B","tests/runtime_build_graph_tests.py",
                  "RuntimeBuildGraphTests.test_host_provider_dimensions_survive_canonical_checkpoint_roundtrip"],
                  capture_output=True,text=True)
              assert result.returncode!=0,result.stdout+result.stderr
              assert "runtime-provider observation mismatch: liburing" in result.stderr,result.stderr
              print("Original ordered-key defect was detected by the actual serialized checkpoint roundtrip.")
              print(result.stderr)
          finally:
              path.write_bytes(original)
          subprocess.run(["git","diff","--exit-code"],check=True)
          PY
