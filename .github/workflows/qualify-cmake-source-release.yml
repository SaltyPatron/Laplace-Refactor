name: Read authenticated installed Stockfish execution replay
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  read-installed-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate retained experiment and expose bounded diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.request, zipfile
          repository = "SaltyPatron/Laplace-Refactor"
          artifact_id = 10514425502
          run_id = 35257154254
          job_id = 105329941854
          expected_size = 3010349
          expected_sha = "cb3fe07f41392eff98238400da489cf88caf70f6e7ba4f67f1d56f001bb2bc0b"
          api = "https://api.github.com/repos/" + repository
          token = os.environ.pop("GH_TOKEN")
          def get(url, limit):
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Laplace-authenticated-pointer-diagnostic-reader"})
              request.add_unredirected_header("Authorization", "Bearer " + token)
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise RuntimeError("response exceeds exact bounded reader limit")
              return data
          metadata = json.loads(get(api + "/actions/artifacts/" + str(artifact_id), 100000))
          assert metadata["id"] == artifact_id and not metadata["expired"], metadata
          assert metadata["size_in_bytes"] == expected_size, metadata
          assert metadata["digest"] == "sha256:" + expected_sha, metadata
          assert metadata["workflow_run"]["id"] == run_id, metadata
          archive_data = get(api + "/actions/artifacts/" + str(artifact_id) + "/zip", expected_size)
          assert len(archive_data) == expected_size
          assert hashlib.sha256(archive_data).hexdigest() == expected_sha
          print("SOURCE_ARTIFACT_AUTHENTICATED " + json.dumps({
              "repository": repository, "run_id": run_id, "job_id": job_id,
              "artifact_id": artifact_id, "zip_bytes": len(archive_data),
              "zip_sha256": expected_sha}), flush=True)
          with zipfile.ZipFile(io.BytesIO(archive_data)) as archive:
              entries = archive.infolist()
              names = [entry.filename for entry in entries]
              assert len(names) == len(set(names))
              assert all(not pathlib.PurePosixPath(name).is_absolute() and ".." not in pathlib.PurePosixPath(name).parts for name in names)
              print("SOURCE_ARTIFACT_MEMBERS " + json.dumps([{"name": e.filename, "bytes": e.file_size} for e in entries if "/" not in e.filename]), flush=True)
              report = json.loads(archive.read("result.json"))
              print("SOURCE_ACCEPTANCE_RESULT " + json.dumps(report, sort_keys=True), flush=True)
              context = json.loads(archive.read("execution-context.json"))
              assert context["expected_sha"] == "32f65922abfe358b9d690645781af676e8a8f575"
              assert str(context["workflow_run_id"]) == str(run_id)
              print("SOURCE_EXECUTION_CONTEXT " + json.dumps(context, sort_keys=True), flush=True)
              source_activation = None
              for name in ("activation-before.json", "runtime-selection.json", "grammar/build-receipt.json"):
                  if name in names:
                      raw = archive.read(name)
                      assert len(raw) <= 1000000
                      value = json.loads(raw)
                      scope = "complete-json"
                      if name == "activation-before.json":
                          source_activation = dict(value)
                          value = {key: value.get(key) for key in (
                              "repository_commit", "repository_build_fingerprint",
                              "package_id", "cli", "cli_sha256", "manifest_sha256",
                              "release", "native_receipt_paths", "loaded")}
                          scope = "selected-installed-identity-fields"
                      print("SOURCE_RETAINED_JSON " + json.dumps({
                          "name": name, "bytes": len(raw),
                          "sha256": hashlib.sha256(raw).hexdigest(),
                          "content_scope": scope, "value": value}, sort_keys=True), flush=True)
              admissions = {}
              for command in report.get("commands", []):
                  if command.get("name") not in ("grammar-qualification", "admission", "repeat"):
                      continue
                  print("SOURCE_COMMAND " + json.dumps(command, sort_keys=True), flush=True)
                  for stream in ("stdout", "stderr"):
                      name = command["name"] + "." + stream + ".log"
                      raw = archive.read(name)
                      expected = command.get(stream + "_sha256")
                      assert expected is not None and hashlib.sha256(raw).hexdigest() == expected
                      if stream == "stdout" and command["name"] in ("admission", "repeat") and command.get("exit_code") == 0:
                          assert len(raw) <= 8000000
                          value = json.loads(raw)
                          admissions[command["name"]] = value
                          print("SOURCE_ADMISSION_PROJECTION " + json.dumps({
                              "phase": command["name"], "json_sha256": expected,
                              "profile": value["admission"]["profile_id"],
                              "source_fingerprint": value["admission"]["source_fingerprint"],
                              "root_entity_id": value["admission"]["root_entity_id"],
                              "root_physicality_id": value["admission"]["root_physicality_id"],
                              "composition_receipt": value["admission"]["composition_working_set_receipt_id"],
                              "execution_metrics": value.get("execution_metrics"),
                              "readback": {key:item for key,item in value["readback"].items() if key != "records"}
                          }, sort_keys=True), flush=True)
                      print("SOURCE_STREAM_IDENTITY " + json.dumps({"name": name, "bytes": len(raw), "sha256": expected, "truncated": len(raw) > 64000}), flush=True)
                      print("SOURCE_STREAM_BEGIN " + name, flush=True)
                      print((raw if len(raw) <= 64000 else raw[:8000] + b"\n[bounded middle omitted]\n" + raw[-56000:]).decode("utf-8", errors="replace"), flush=True)
                      print("SOURCE_STREAM_END " + name, flush=True)
              if report.get("status") == "passed":
                  assert set(admissions) == {"admission", "repeat"}
                  first, repeat = admissions["admission"], admissions["repeat"]
                  expected_profile = "\\xc6ec7000cd7d923361f0f2505c35852cc78c21205598af726706e7a3ef25ddab"
                  assert first["admission"]["profile_id"] == repeat["admission"]["profile_id"] == expected_profile
                  count_fields = ("structural_execution_observation_count", "structural_execution_receipt_count")
                  identity_fields = ("structural_execution_receipt_id", "execution_witness_fingerprint", "historical_structural_receipt_id")
                  for field in count_fields:
                      assert type(first["readback"][field]) is int and first["readback"][field] > 0
                      assert first["readback"][field] == repeat["readback"][field]
                  for field in identity_fields:
                      assert first["readback"][field] == repeat["readback"][field]
                  print("SOURCE_IDENTICAL_EXECUTION_REPLAY " + json.dumps({
                      "scope": "same installed current provider replay, separate from its first observation",
                      "profile": expected_profile,
                      "execution_observation_delta": 0, "execution_receipt_delta": 0,
                      "counts": {key:first["readback"][key] for key in count_fields},
                      "identities": {key:first["readback"][key] for key in identity_fields},
                      "first_pass_global_entity_physicality_delta_measured": False,
                      "executable_semantics_verified": False
                  }, sort_keys=True), flush=True)
              print("SOURCE_EXECUTION_READER_COMPLETE", flush=True)
          service_artifacts = [{"id":10514215326,"kind":"service-restart","member":"result.json","sha256":"7958baa44a2afb78febfb3077255762f12fd91b5d06b690512c7666d1a290479","size":291442},{"id":10513815633,"kind":"http-readiness","member":"installed-http-readiness-35257154254-1.json","sha256":"369c249e8ee1bc38e0920634ce7b8dc3a471f8e693ca35d888cdca1d4b425a3b","size":1181},{"id":10514480093,"kind":"gateway","member":"proof.json","sha256":"7c9295305cfc910eaa8a063d83e93a387bc6fc578d79f28c635f82eea7f15a79","size":4386}]
          assert [item["kind"] for item in service_artifacts] == ["service-restart", "http-readiness", "gateway"]
          assert source_activation is not None
          for selected in service_artifacts:
              metadata = json.loads(get(api + "/actions/artifacts/" + str(selected["id"]), 100000))
              assert metadata["id"] == selected["id"] and not metadata["expired"]
              assert metadata["size_in_bytes"] == selected["size"]
              assert metadata["digest"] == "sha256:" + selected["sha256"]
              assert metadata["workflow_run"]["id"] == run_id
              payload = get(api + "/actions/artifacts/" + str(selected["id"]) + "/zip", selected["size"])
              assert len(payload) == selected["size"] and hashlib.sha256(payload).hexdigest() == selected["sha256"]
              with zipfile.ZipFile(io.BytesIO(payload)) as service_archive:
                  entries = service_archive.infolist()
                  names = [entry.filename for entry in entries]
                  assert len(names) == len(set(names))
                  assert all(not pathlib.PurePosixPath(name).is_absolute() and ".." not in pathlib.PurePosixPath(name).parts for name in names)
                  entry = service_archive.getinfo(selected["member"])
                  assert 0 < entry.file_size <= 1000000
                  raw = service_archive.read(entry)
                  result = json.loads(raw)
              assert result["status"] == "passed"
              if selected["kind"] == "service-restart":
                  assert result["schema"] == "laplace.cognition-service-lifecycle/v1"
                  assert result["action"] == "restart"
                  observation = result["observation"]
                  assert observation["repository_commit"] == "32f65922abfe358b9d690645781af676e8a8f575"
                  assert observation["activated_package_verified"] is True
                  assert observation["http_auth"] == {"mode": "managed-operator", "credential_source": "/opt/laplace/secrets/operator.env"}
                  assert observation["unit"]["ActiveState"] == "active"
                  assert observation["health"]["response"]["status"] == "ready"
                  assert observation["health"]["response"]["package_id"] == observation["package_id"]
                  service_package = observation["package_id"]
                  assert service_package == source_activation["package_id"]
                  projection = {
                      "schema": result["schema"], "status": result["status"],
                      "service": "laplace-refactor-cognition.service",
                      "service_scope": observation["scope"],
                      "http_auth": observation["http_auth"],
                      "unit": {key: observation["unit"].get(key) for key in (
                          "Id", "LoadState", "ActiveState", "SubState", "UnitFileState", "MainPID")},
                      "package_id": service_package,
                      "repository_commit": observation["repository_commit"],
                      "health": observation["health"]["response"],
                      "timings_seconds": observation["timings_seconds"],
                      "cold_boot_proven": result["cold_boot_proven"]
                  }
              elif selected["kind"] == "http-readiness":
                  assert result["schema"] == "laplace.installed-product-http-readiness/v1"
                  assert result["package_id"] == service_package
                  assert result["endpoint"] == "http://127.0.0.1:55434"
                  assert result["http_auth"] == {"mode": "managed-operator", "credential_source": "/opt/laplace/secrets/operator.env"}
                  assert result["anonymous_protected_status"] == 401
                  assert result["health"]["status"] == 200
                  projection = {key: result.get(key) for key in (
                      "schema", "status", "scope", "package_id", "endpoint", "http_auth", "anonymous_protected_status")}
                  projection["external_reachability_verified"] = False
              else:
                  assert result["schema"] == "laplace.installed-product-gateway-proof/v2"
                  assert result["package_id"] == service_package
                  assert result["http_auth"] == {"mode": "managed-operator", "credential_source": "/opt/laplace/secrets/operator.env"}
                  partial = result["partial"]
                  assert partial["http_authority"]["anonymous_mcp_status"] == 401
                  assert partial["product_events"]["status"] == 200
                  assert partial["product_events"]["package_id"] == service_package
                  assert partial["product_events"]["complete_frame"] is True
                  assert result["openai_chat"]["streaming"]["done"] is True
                  assert result["openai_chat"]["streaming"]["finished"] is True
                  assert result["mcp"]["query_schema"] == "laplace.inspect.summary/v1"
                  projection = {"schema": result["schema"], "status": result["status"],
                      "package_id": service_package, "http_auth": result["http_auth"],
                      "anonymous_mcp_status": 401, "product_events": partial["product_events"],
                      "completed_phases": result["completed_phases"],
                      "external_reachability_verified": False}
              print("SERVICE_ARTIFACT_AUTHENTICATED " + json.dumps({
                  "artifact_id": selected["id"], "zip_bytes": selected["size"],
                  "zip_sha256": selected["sha256"], "kind": selected["kind"],
                  "member": selected["member"], "member_bytes": len(raw),
                  "member_sha256": hashlib.sha256(raw).hexdigest(),
                  "projection": projection
              }, sort_keys=True), flush=True)
          print("SOURCE_AND_SERVICE_READER_COMPLETE", flush=True)
          PY
