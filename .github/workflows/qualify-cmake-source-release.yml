name: Observe current Original workspace activity
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  original-progress:
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 2
    steps:
      - name: Read fixed source markers and same-user process metadata
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json,os,pathlib,time
          root=pathlib.Path("/var/lib/agents/laplace-runner/actions-runner/_work/Laplace/Laplace")
          build=(root/"build").resolve()
          def emit(kind,value): print(kind+" "+json.dumps(value,sort_keys=True),flush=True)
          def metadata(path):
              try:
                  s=path.stat()
                  return {"path":str(path),"bytes":s.st_size,"mtime_ns":s.st_mtime_ns,"uid":s.st_uid}
              except OSError as error:return {"path":str(path),"unavailable":type(error).__name__}
          head=(root/".git/HEAD")
          head_text=head.read_text()[:256].strip() if head.is_file() else None
          if head_text and head_text.startswith("ref: "):
              ref=head_text[5:]
              if ref.startswith("refs/") and ".." not in ref.split("/"):
                  p=root/".git"/ref
                  head_text=p.read_text()[:256].strip() if p.is_file() else head_text
          marker=build/".laplace-source-revision"
          emit("ORIGINAL_WORKSPACE",{"unix":time.time(),"head":head_text,"build":str(build),"build_source":marker.read_text()[:256].strip() if marker.is_file() else None,"test_logs":[metadata(build/"Testing/Temporary"/n) for n in ("LastTest.log","LastTestsFailed.log")]})
          def sample():
              out=[]
              for path in pathlib.Path("/proc").iterdir():
                  if not path.name.isdecimal():continue
                  try:
                      if path.stat().st_uid!=os.getuid():continue
                      cwd=(path/"cwd").resolve()
                      if not(cwd==root or cwd==build or root in cwd.parents or build in cwd.parents):continue
                      raw=(path/"stat").read_text();parts=raw[raw.rindex(")")+2:].split()
                      out.append({"pid":int(path.name),"ppid":int(parts[1]),"comm":raw[raw.index("(")+1:raw.rindex(")")],"executable":(path/"exe").resolve().name,"start_ticks":int(parts[19]),"cpu_ticks":int(parts[11])+int(parts[12]),"state":parts[0]})
                  except(OSError,ValueError,IndexError):continue
              return out[:128]
          emit("ORIGINAL_PROCESS_SAMPLE_1",{"unix":time.time(),"rows":sample()})
          time.sleep(1)
          emit("ORIGINAL_PROCESS_SAMPLE_2",{"unix":time.time(),"rows":sample()})
          
          PY
