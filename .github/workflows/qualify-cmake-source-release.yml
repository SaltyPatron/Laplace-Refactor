name: Qualify private final cleanup
on:
  workflow_dispatch:
  push:
    branches: [qualify/cmake-source-443-20260916]
    paths: [".github/workflows/qualify-cmake-source-release.yml"]
permissions:
  contents: read
jobs:
  qualify-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 727debeb4e72f4a6356c7c7980f8e16ad37d2df9
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate leaves and create the exact local candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repository = "SaltyPatron/Laplace-Refactor"
          base = "727debeb4e72f4a6356c7c7980f8e16ad37d2df9"
          manifest_sha = "7c3313adb15ad771a2b39a326b65a6630ac8a760"
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "laplace-cleanup-qualification"
          out.mkdir(exist_ok=False)
          def git(*args):
              return subprocess.check_output(["git", *args]).decode().strip()
          def blob(sha):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repository + "/git/blobs/" + sha,
                  headers={"Accept": "application/vnd.github+json", "User-Agent": "laplace-cleanup-qualification"})
              request.add_unredirected_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
              with urllib.request.urlopen(request, timeout=60) as response:
                  record = json.load(response)
              assert record["sha"] == sha and record["encoding"] == "base64"
              body = base64.b64decode(record["content"])
              actual = hashlib.sha1(b"blob " + str(len(body)).encode() + b"\0" + body).hexdigest()
              assert actual == sha
              return body
          assert git("rev-parse", "HEAD") == base
          assert git("status", "--porcelain") == ""
          manifest_bytes = blob(manifest_sha)
          manifest = json.loads(manifest_bytes)
          assert manifest["repository"] == repository and manifest["base_commit"] == base
          assert len(manifest["leaves"]) == 3
          (out / "manifest.json").write_bytes(manifest_bytes)
          for row in [manifest["unchanged_package_workflow"], *manifest["unchanged_cleanup_owners"]]:
              assert git("rev-parse", base + ":" + row["path"]) == row["sha"]
          paths = []
          for row in manifest["leaves"]:
              path = pathlib.Path(row["path"])
              assert row["mode"] == "100644" and not path.is_absolute() and ".." not in path.parts
              assert git("rev-parse", base + ":" + row["path"]) == row["base"]
              if row["path"] == ".github/workflows/postgresql-product.yml":
                  (out / "baseline-postgresql-product.yml").write_bytes(path.read_bytes())
              path.write_bytes(blob(row["sha"]))
              paths.append(row["path"])
          patch = subprocess.check_output(["git", "diff", "--binary", "--", *paths])
          (out / "candidate.patch").write_bytes(patch)
          subprocess.run(["git", "add", "--", *paths], check=True)
          subprocess.run(["git", "-c", "user.name=Laplace hosted qualification",
                          "-c", "user.email=qualification@users.noreply.github.com",
                          "commit", "-m", "Local qualification of explicit private terminal cleanup"], check=True)
          assert git("status", "--porcelain") == ""
          for row in manifest["leaves"]:
              assert git("rev-parse", "HEAD:" + row["path"]) == row["sha"]
          identity = {
              "operator_commit": os.environ["GITHUB_SHA"], "source_parent": base,
              "actual_candidate_commit": git("rev-parse", "HEAD"),
              "actual_candidate_tree": git("rev-parse", "HEAD^{tree}"),
              "manifest_blob": manifest_sha,
              "patch_sha256": hashlib.sha256(patch).hexdigest(),
              "leaves": manifest["leaves"],
              "scope": "hosted source and isolated cleanup tests; no shared self-hosted work"}
          (out / "candidate.json").write_text(json.dumps(identity, indent=2) + "\n")
          print("CLEANUP_CANDIDATE " + json.dumps(identity, sort_keys=True))
          PY
      - name: Qualify owned cleanup with real contention and refusal controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, py_compile, subprocess, time
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "laplace-cleanup-qualification"
          paths = (
              "tests/proof_workspace_cleanup_tests.py",
              "tests/runner_orphan_cleanup_tests.py",
              "tests/proof_workspace_foreign_owner_tests.py",
              "tests/postgresql_product_proof_tests.py",
              "tests/package_product_proof_tests.py")
          for path in (*paths, "tools/delivery/proof_workspace_cleanup.py",
                       "tools/delivery/runner_orphan_cleanup.py"):
              py_compile.compile(path, doraise=True)
          spec = importlib.util.spec_from_file_location("qualified_private_cleanup", paths[0])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          case = module.ProofWorkspaceCleanupTests()
          case.setUp()
          try:
              for workflow, name, names in case.cleanup_cases():
                  script = case.assert_private_cleanup(workflow.read_text(), name, names)
                  subprocess.run(["bash", "-n"], input=script, text=True, check=True)
              try:
                  case.assert_private_cleanup(
                      (out / "baseline-postgresql-product.yml").read_text(),
                      "Clean disposable PostgreSQL-product workspace",
                      ("laplace-postgresql-product-proof",))
              except AssertionError as error:
                  control = {"status": "expected-failure", "baseline": "727debeb4e72f4a6356c7c7980f8e16ad37d2df9",
                             "diagnostic": str(error), "execution": "source assertion only; baseline cleanup not run"}
              else:
                  raise AssertionError("old globally locked cleanup passed the new private-boundary check")
          finally:
              case.tearDown()
          (out / "old-workflow-control.json").write_text(json.dumps(control, indent=2) + "\n")
          results = []
          for path in paths:
              started = time.monotonic()
              command = ["python3", path, "-v"]
              try:
                  completed = subprocess.run(command, cwd=root, text=True,
                                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
                  output, status = completed.stdout, completed.returncode
              except subprocess.TimeoutExpired as error:
                  output = error.stdout or b""
                  if isinstance(output, bytes):
                      output = output.decode("utf-8", "replace")
                  output += "\nQUALIFIER: finite test timeout\n"
                  status = 124
              (out / (pathlib.Path(path).stem + ".log")).write_text(output)
              results.append({"command": command, "exit_code": status, "elapsed_seconds": time.monotonic() - started})
              print(output, flush=True)
          receipt = {
              "candidate": json.loads((out / "candidate.json").read_text()),
              "checks": results, "old_workflow_control": control,
              "passed": all(row["exit_code"] == 0 for row in results),
              "shared_host_actions": [], "installed_product_claim": False}
          (out / "qualification.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print("CLEANUP_QUALIFICATION " + json.dumps(receipt, sort_keys=True), flush=True)
          if not receipt["passed"]:
              raise SystemExit(1)
          PY
      - name: Retain exact cleanup qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-cleanup-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/laplace-cleanup-qualification/
          if-no-files-found: error
          retention-days: 30
