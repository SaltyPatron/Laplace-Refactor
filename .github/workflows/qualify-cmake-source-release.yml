name: Qualify browser origin and prefix paths
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  browser-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate exact production browser and tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          token = os.environ.pop('GH_TOKEN')
          leaves = [{"path":"product/web/app.js","sha":"6fd4999c21d29de2150ca5c2731a60f72187f936"},{"path":"product/web/index.html","sha":"22d457e46142794fb7900184236ebf74ca322621"},{"path":"tests/browser_surface_paths_tests.cjs","sha":"1c1ba260359ff60ef19a2a598aa795f713b9d27d"}]
          for leaf in leaves:
              request = urllib.request.Request('https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/' + leaf['sha'], headers={'Accept':'application/vnd.github+json','User-Agent':'Laplace-browser-path-controls'})
              request.add_unredirected_header('Authorization', 'Bearer ' + token)
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read(1000000)
              blob = json.loads(raw)
              assert blob['sha'] == leaf['sha'] and blob['encoding'] == 'base64'
              data = base64.b64decode(blob['content'])
              assert len(data) == blob['size']
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == leaf['sha']
              path = root / leaf['path']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(json.dumps({'path':leaf['path'],'blob':leaf['sha'],'bytes':len(data)}))
          PY
      - name: Execute shipped browser in root and prefixed contexts
        shell: bash
        run: |
          node --test tests/browser_surface_paths_tests.cjs | tee browser-path-results.tap
      - name: Retain exact source and controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-prefix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            product/web/app.js
            product/web/index.html
            tests/browser_surface_paths_tests.cjs
            browser-path-results.tap
          if-no-files-found: error
          retention-days: 30
