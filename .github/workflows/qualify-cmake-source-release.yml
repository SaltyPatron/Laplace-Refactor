name: Read retained Stockfish grammar provider bytes
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  read-retained-providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate prior source artifacts and expose provider receipts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.request, zipfile
          repo = "SaltyPatron/Laplace-Refactor"
          api = "https://api.github.com/repos/" + repo
          token = os.environ.pop("GH_TOKEN")
          sources = [
              {"name": "historical-success", "run": 35163097838, "artifact": 10474447094, "bytes": 3016206,
               "sha256": "a462210322043e84d68bf5d7ba441337f7542f2a5945ce645d464aa1559ac007",
               "commit": "b042de4216e1d674effe5bd3e8ecf3ebc7aeddac"},
              {"name": "current-failure", "run": 35191157961, "artifact": 10484374565, "bytes": 2742993,
               "sha256": "27f6594ba16630711192fb1654358589ad879cbc312b9824a3e6df2f9d6be260",
               "commit": "af0f3cf48de13005875f78888271ec8ccdf332c4"},
          ]
          def get(url, limit):
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Laplace-retained-provider-reader"})
              request.add_unredirected_header("Authorization", "Bearer " + token)
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise RuntimeError("bounded response exceeded")
              return data
          observations = []
          for source in sources:
              metadata = json.loads(get(api + "/actions/artifacts/" + str(source["artifact"]), 100000))
              assert metadata["id"] == source["artifact"] and not metadata["expired"]
              assert metadata["workflow_run"]["id"] == source["run"]
              assert metadata["workflow_run"]["head_sha"] == source["commit"]
              assert metadata["size_in_bytes"] == source["bytes"]
              assert metadata["digest"] == "sha256:" + source["sha256"]
              raw = get(api + "/actions/artifacts/" + str(source["artifact"]) + "/zip", source["bytes"])
              assert len(raw) == source["bytes"] and hashlib.sha256(raw).hexdigest() == source["sha256"]
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  entries = archive.infolist()
                  names = [e.filename for e in entries]
                  assert len(names) == len(set(names))
                  assert all(not pathlib.PurePosixPath(n).is_absolute() and ".." not in pathlib.PurePosixPath(n).parts for n in names)
                  report = json.loads(archive.read("result.json"))
                  assert report["expected_repository_commit"] == source["commit"]
                  selected = [e for e in entries if e.filename.startswith("grammar/") and
                              (e.filename.endswith("build-receipt.json") or e.filename.endswith(".so"))]
                  observation = {"source": source, "acceptance_status": report["status"],
                                 "selected_members": [], "missing_grammar_members": not bool(selected),
                                 "does_not_establish_mismatch_cause": True}
                  for entry in selected:
                      limit = 2000000 if entry.filename.endswith(".json") else 32000000
                      assert 0 <= entry.file_size <= limit
                      data = archive.read(entry)
                      member = {"path": entry.filename, "bytes": len(data),
                                "sha256": hashlib.sha256(data).hexdigest()}
                      if entry.filename.endswith(".json"):
                          member["receipt"] = json.loads(data)
                      observation["selected_members"].append(member)
                  if not selected:
                      observation["retained_grammar_paths"] = [
                          {"path": e.filename, "bytes": e.file_size}
                          for e in entries if "grammar" in e.filename][:64]
                  observations.append(observation)
                  print("RETAINED_PROVIDER_OBSERVATION " + json.dumps(observation, sort_keys=True), flush=True)
          print("RETAINED_PROVIDER_COMPARISON_COMPLETE " + json.dumps({
              "sources_authenticated": len(observations), "host_actions": False,
              "database_actions": False, "profile_mutations": False}), flush=True)
          PY
