name: Read exact derived-container diagnostic
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  read-retained:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate immutable diagnostic and project named operands
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile, xml.etree.ElementTree as ET
          base='https://api.github.com/repos/SaltyPatron/Laplace-Refactor'
          def get(path):
              request=urllib.request.Request(base+path,headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              request.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
              with urllib.request.urlopen(request,timeout=60) as response:
                  return response.read()
          run=json.loads(get('/actions/runs/35183813555'))
          assert run['head_sha']=='9c2f9e997fb01eb86f0763e143ac243b831178e4'
          assert run['event']=='push' and run['head_branch']=='qualify/cmake-source-443-20260916'
          artifact=json.loads(get('/actions/artifacts/10481293376'))
          assert artifact['workflow_run']['id']==35183813555
          assert not artifact['expired']
          expected='475108b22598ba2fdfda8993b75cf4bc3543441d17ef264e6ab2650cfa4e4438'
          assert artifact['digest']=='sha256:'+expected
          data=get('/actions/artifacts/10481293376/zip')
          assert len(data)==32240 and hashlib.sha256(data).hexdigest()==expected
          archive=zipfile.ZipFile(io.BytesIO(data))
          print(json.dumps({'artifact':10481293376,'run':35183813555,'zip_sha256':expected,'names':archive.namelist()},sort_keys=True))
          for name in ('source.txt','diagnostic-only.diff','exit-code.txt'):
              matches=[n for n in archive.namelist() if n==name or n.endswith('/'+name)]
              assert len(matches)==1,(name,matches)
              print('DIAGNOSTIC_MEMBER '+name)
              print(archive.read(matches[0]).decode('utf-8'))
          matches=[n for n in archive.namelist() if n=='ctest.log' or n.endswith('/ctest.log')]
          assert len(matches)==1
          lines=archive.read(matches[0]).decode('utf-8',errors='replace').splitlines()
          selected=set()
          for i,line in enumerate(lines):
              if any(token in line for token in ('ERROR:','DETAIL:','CONTEXT:','Test #','tests passed','Total Test time','CMake Error','No tests were found','FAIL','PASS','LAPLACE_')):
                  selected.update(range(max(0,i-2),min(len(lines),i+5)))
          print('DIAGNOSTIC_RESULT_BEGIN')
          print('\n'.join(lines[i] for i in sorted(selected)))
          print('DIAGNOSTIC_RESULT_END')
          matches=[n for n in archive.namelist() if n=='result.junit.xml' or n.endswith('/result.junit.xml')]
          assert len(matches)==1
          junit=ET.fromstring(archive.read(matches[0]))
          print('PASSED_TEST_JUNIT '+json.dumps(junit.attrib,sort_keys=True))
          for case in junit.iter('testcase'):
              print('PASSED_TEST_CASE '+json.dumps(case.attrib,sort_keys=True))
              assert not list(case.iter('failure')) and not list(case.iter('error'))
          for output in junit.iter('system-out'):
              for line in (output.text or '').splitlines():
                  if any(token in line for token in ('derived direct CONTAINER','passed','ERROR:','DETAIL:','LAPLACE_QA_RECEIPT')):
                      print(line)
          for name in archive.namelist():
              if name.endswith('executed-physicality-contract.sql'):
                  source=archive.read(name)
                  print('EXECUTED_SQL '+json.dumps({'path':name,'bytes':len(source),'sha256':hashlib.sha256(source).hexdigest()},sort_keys=True))
          PY
