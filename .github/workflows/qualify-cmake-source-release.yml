name: Persistent PostgreSQL system owner controls
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: 2f5a1f9f37ca6ce98080d445c0b00520c72405d3
      SOURCE_TREE: 962428b5912263d98039d8c9b1b03489ed707daf
      TMPDIR: /build/laplace/work/pg-service
      TMP: /build/laplace/work/pg-service
      TEMP: /build/laplace/work/pg-service
      EVIDENCE: /build/laplace/recovery/pg-service-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Prepare exact source
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR" "$EVIDENCE" /build/laplace/worktrees
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          git worktree add --detach /build/laplace/worktrees/pg-service-owner "$SOURCE_SHA"
          python3 -c 'import yaml; print("PyYAML " + yaml.__version__)'
          printf '%s\n' "$SOURCE_SHA $SOURCE_TREE" > "$EVIDENCE/source.txt"
      - name: Execute existing lifecycle and caller controls
        run: |
          set -euo pipefail
          cd /build/laplace/worktrees/pg-service-owner
          status=0
          qualify() {
            local label="$1"
            shift
            set +e
            timeout --signal=TERM --kill-after=10s 300s "$@" 2>&1 | tee "$EVIDENCE/$label.log"
            local result=$?
            set -e
            printf '%s\t%s\n' "$label" "$result" >> "$EVIDENCE/exit-codes.tsv"
            if [ "$result" -ne 0 ]; then status=1; fi
          }
          qualify cluster python3 tests/postgresql_cluster_tests.py
          qualify host-evidence python3 tests/chess_host_evidence_tests.py
          bash -n tools/host/run-exclusive.sh
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/python-ast.log"
          import ast, json
          from pathlib import Path
          paths = [
              "tools/postgresql/service_lifecycle.py", "tools/postgresql/clusterctl.py",
              "tools/delivery/product_activation_runner.py", "tools/delivery/product_cluster_upgrade.py",
              "tools/delivery/product_predecessor_adoption.py", "tools/delivery/product_activation_reconcile.py",
              "tools/delivery/install_product_activation_gateway.py", "tools/delivery/product_distribution_core.py",
              "tools/sources/stockfish_corpus_acceptance.py", "tests/postgresql_cluster_tests.py",
              "tests/product_activation_runner_tests.py", "tests/chess_host_evidence_tests.py",
          ]
          for path in paths:
              ast.parse(Path(path).read_text())
          json.loads(Path("contracts/product-activation-gateway.json").read_text())
          print("PASS 12 Python ASTs and gateway JSON; no service/native execution claimed")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "PASS clean source worktree" | tee "$EVIDENCE/source-clean.txt"
          exit "$status"
      - name: Retain lifecycle control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pg-service-owner-controls
          path: /build/laplace/recovery/pg-service-owner/
          if-no-files-found: error
          retention-days: 30

  retained-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read exact retained installed admission failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.error, urllib.parse, urllib.request, zipfile
          base = "https://api.github.com/repos/SaltyPatron/Laplace-Refactor"
          artifact_id = 10469078104
          expected = "f9836776d3439f3f9df0b4993e999c1c06c302fe807db16f02364d4d9334a2c2"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          api = urllib.request.build_opener(NoRedirect(), urllib.request.ProxyHandler({}))
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          def request(path):
              return api.open(urllib.request.Request(base + path, headers=headers), timeout=15)
          with request("/actions/artifacts/" + str(artifact_id)) as response:
              metadata = json.loads(response.read(65537))
          assert metadata["workflow_run"]["id"] == 35148600029
          assert metadata["workflow_run"]["head_sha"] == "f2dd8357c85114e455c063e31c075b48b4cde04b"
          assert metadata["digest"] == "sha256:" + expected and metadata["size_in_bytes"] == 2742204
          try:
              request("/actions/artifacts/" + str(artifact_id) + "/zip")
              raise RuntimeError("artifact did not return a signed download redirect")
          except urllib.error.HTTPError as redirect:
              if redirect.code not in (301, 302, 303, 307, 308): raise
              location = redirect.headers["Location"]
          target = urllib.parse.urlsplit(location)
          assert target.scheme == "https" and target.hostname and not target.username and not target.password
          assert target.hostname.endswith(".blob.core.windows.net") or target.hostname.endswith(".actions.githubusercontent.com")
          unsigned = urllib.request.build_opener(NoRedirect(), urllib.request.ProxyHandler({}))
          with unsigned.open(location, timeout=30) as response:
              raw = response.read(8388609)
          assert len(raw) == 2742204 and hashlib.sha256(raw).hexdigest() == expected
          archive = zipfile.ZipFile(io.BytesIO(raw))
          infos = archive.infolist()
          assert len(infos) <= 2000 and sum(item.file_size for item in infos) <= 67108864
          print("EXACT_ADMISSION_ARTIFACT " + json.dumps({"artifact": artifact_id, "zip_sha256": expected, "entries": len(infos)}))
          for item in infos:
              if "stderr" in item.filename.lower():
                  assert item.file_size <= 4194304
                  data = archive.read(item)
                  print("RETAINED_STDERR " + json.dumps({"path": item.filename, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest(), "text": data[:4096].decode("utf-8", errors="replace"), "truncated": len(data) > 4096}))
          PY
