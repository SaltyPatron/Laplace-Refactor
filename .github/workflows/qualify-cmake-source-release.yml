name: Authenticate completed committed source readback
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  retained-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate exact artifact and native output scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import hashlib,io,json,os,pathlib,urllib.request,zipfile
          REPO="SaltyPatron/Laplace-Refactor";ARTIFACT=10505599545;RUN=35242450404
          HEAD="1ca73182518e068254bbf0dcb829e86d054de17c";SIZE=90291
          DIGEST="ed7c878b2f576c13fe27fb4420ad472ef63173f55c234e6ee735ee74f1fcf0c4"
          PACKAGE="d12af51d6367e03045e12599d2195894868f8408ebe17e5b313db3032f516490"
          PROFILE="c6ec7000cd7d923361f0f2505c35852cc78c21205598af726706e7a3ef25ddab"
          RECEIPT="d1f9cd77cda9b20f220d60644472a513e9e182ff279470e113844c0972667843"
          def fetch(url,maximum):
              request=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json"})
              request.add_unredirected_header("Authorization","Bearer "+os.environ["GH_TOKEN"])
              with urllib.request.urlopen(request,timeout=45) as response:data=response.read(maximum+1)
              if len(data)>maximum:raise RuntimeError("authenticated response exceeded bound")
              return data
          base="https://api.github.com/repos/"+REPO
          metadata=json.loads(fetch(base+"/actions/artifacts/"+str(ARTIFACT),65536))
          if metadata["id"]!=ARTIFACT or metadata["workflow_run"]["id"]!=RUN or metadata["workflow_run"]["head_sha"]!=HEAD or metadata["size_in_bytes"]!=SIZE or metadata["digest"]!="sha256:"+DIGEST or metadata["expired"]:raise RuntimeError("artifact metadata differs")
          archive=fetch(metadata["archive_download_url"],SIZE)
          if len(archive)!=SIZE or hashlib.sha256(archive).hexdigest()!=DIGEST:raise RuntimeError("artifact ZIP differs")
          with zipfile.ZipFile(io.BytesIO(archive)) as source:
              names=source.namelist()
              if len(names)!=len(set(names)) or len(names)>8 or any(pathlib.PurePosixPath(n).is_absolute() or ".." in pathlib.PurePosixPath(n).parts or "\\" in n for n in names):raise RuntimeError("artifact paths differ")
              def member(name):
                  matches=[n for n in names if pathlib.PurePosixPath(n).name==name]
                  if len(matches)!=1:raise RuntimeError("artifact member absent or ambiguous")
                  info=source.getinfo(matches[0])
                  if info.file_size>2097152:raise RuntimeError("artifact member too large")
                  return source.read(info)
              payload=member("result.json");document=json.loads(payload)
              output=member("full119.stdout.json")
              error=member("full119.stderr.log")
          if document["schema"]!="laplace.committed-source-readback/v1" or document["status"]!="completed" or document["package_id"]!=PACKAGE or document["source_profile_id"]!=PROFILE or document["receipt_id"]!=RECEIPT:raise RuntimeError("retained readback identity differs")
          if not document["database_read_only"] or document["admission_executed"] or document["admission_replayed"] or document["admission_metrics_reconstructed"] or not document["selected_package_unchanged"] or document["package_after"]!="/opt/laplace/releases/"+PACKAGE:raise RuntimeError("retained operation scope differs")
          if not document["whole_corpus_verified"] or document["verified_file_count"]!=119 or document["verified_byte_count"]!=1172144 or document["executable_semantics_verified"]:raise RuntimeError("retained corpus scope differs")
          phases=document["phases"]
          if len(phases)!=1:raise RuntimeError("retained phase count differs")
          phase=phases[0]
          if phase["name"]!="full119" or phase["status"]!="completed" or phase["exit_code"]!=0 or phase["backend_cleanup"][-1]["remaining"]!=[]:raise RuntimeError("phase or cleanup differs")
          if hashlib.sha256(output).hexdigest()!=phase["stdout_sha256"] or hashlib.sha256(error).hexdigest()!=phase["stderr_sha256"] or error:raise RuntimeError("phase output bytes differ")
          raw=json.loads(output);readback=document["readback"]
          if raw!=phase["result"]:raise RuntimeError("retained native result differs")
          records=readback["records"]
          if len(records)!=119 or [int(r["artifact_index"]) for r in records]!=list(range(119)) or sum(int(r["output_bytes"]) for r in records)!=1172144:raise RuntimeError("returned file scope differs")
          if any(r["source_profile_id"]!="\\x"+PROFILE or r["structural_receipt_id"]!="\\x"+RECEIPT or int(r["verified_witnesses"])!=571627 for r in records):raise RuntimeError("native record identity/witness scope differs")
          for item,retained in zip(raw["records"],records):
              if item!={key:value for key,value in retained.items() if key!="path"}:raise RuntimeError("normal verified record differs from native output")
          selection=document["durable_selection"]
          summary={"schema":"laplace.committed-source-readback-summary/v1","status":"passed","source":"df158f21bfecaf4045d065b10c21cd92464ce3ec","package_id":PACKAGE,"profile_id":PROFILE,"current_structural_receipt_id":RECEIPT,"historical_structural_receipt_id":readback["historical_structural_receipt_id"],"canonical_witness_fingerprint":readback["structural_witness_fingerprint"],"execution_witness_fingerprint":readback["execution_witness_fingerprint"],"file_count":119,"byte_count":1172144,"resolved_roots":sum(int(r["resolved_nodes"]) for r in records),"trajectory_carriers":sum(int(r["trajectory_carriers"]) for r in records),"database_operations":sum(int(r["database_operations"]) for r in records),"source_occurrence_count":readback["source_occurrence_count"],"canonical_witness_count":readback["structural_witness_count"],"execution_observation_count":readback["structural_execution_observation_count"],"execution_receipt_count":readback["structural_execution_receipt_count"],"database_row_counts":readback["database_row_counts"],"profile_counts":{k:v for k,v in selection["profile"].items() if k.endswith("_count")},"execution_seconds":phase["seconds"],"execution_and_cleanup_seconds":phase["seconds_including_cleanup"],"started_unix":document["started_unix"],"finished_unix":document["finished_unix"],"remaining_owned_backends":[],"admission_executed":False,"replay_growth_measured":False,"executable_semantics_verified":False,"package_changed":False,"artifact":{"run":RUN,"job":105274103339,"id":ARTIFACT,"zip_bytes":SIZE,"zip_sha256":DIGEST,"member":"result.json","member_bytes":len(payload),"member_sha256":hashlib.sha256(payload).hexdigest(),"native_output_sha256":hashlib.sha256(output).hexdigest()},"reader":{"run":int(os.environ["GITHUB_RUN_ID"])}}
          pathlib.Path("committed-readback-summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("AUTHENTICATED_COMMITTED_READBACK "+json.dumps(summary,sort_keys=True))
          
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: committed-readback-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: committed-readback-summary.json
          if-no-files-found: error
          retention-days: 30
