name: Diagnose exact committed source readback boundaries
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Authenticate bounded diagnostic and parse its Python syntax
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_SCRIPT: ${{ runner.temp }}/bounded_readback_diagnostic.py
        shell: bash
        run: |
          python3 -I - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,urllib.request
          expected="56d8d6f6f6c1bb219ce06de13616e02349291815"
          request=urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/"+expected,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(request,timeout=30) as response:document=json.load(response)
          data=base64.b64decode(document["content"])
          if hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()!=expected:raise ValueError("diagnostic source differs")
          ast.parse(data,filename="bounded_readback_diagnostic.py")
          target=pathlib.Path(os.environ["DIAGNOSTIC_SCRIPT"])
          with target.open("xb") as output:output.write(data)
          print("AUTHENTICATED_DIAGNOSTIC",expected,len(data))
          
          PY
  exact-readback:
    needs: syntax
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 10
    env:
      DIAGNOSTIC_SCRIPT: /build/laplace/work/refactor-readback-diagnostic-${{ github.run_id }}.py
    steps:
      - name: Authenticate exact reviewed diagnostic without checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,urllib.request
          expected="56d8d6f6f6c1bb219ce06de13616e02349291815"
          request=urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace-Refactor/git/blobs/"+expected,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(request,timeout=30) as response:document=json.load(response)
          data=base64.b64decode(document["content"])
          if hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()!=expected:raise ValueError("diagnostic source differs")
          ast.parse(data,filename="bounded_readback_diagnostic.py")
          target=pathlib.Path(os.environ["DIAGNOSTIC_SCRIPT"])
          with target.open("xb") as output:output.write(data)
          print("AUTHENTICATED_DIAGNOSTIC",expected,len(data))
          
          PY
      - name: Measure only two bounded read-only phases under the common reservation
        shell: bash
        run: |
          flock --exclusive --close --wait 300 /build/laplace/work/host-resource.lock             python3 -I "${DIAGNOSTIC_SCRIPT}"
      - name: Retain actual phase outputs and owned-backend cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-source-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: /build/laplace/work/refactor-readback-diagnostic-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
