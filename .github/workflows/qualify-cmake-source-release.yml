name: Read authenticated structural execution PostgreSQL proof
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  read-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate exact required QA archive and current execution receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, re, urllib.request, zipfile, xml.etree.ElementTree as ET
          repository="SaltyPatron/Laplace-Refactor"
          artifact_id=10490249252
          run_id=35206242161
          expected_size=35770
          expected_sha="70861be62237ad5eba7df54b2b981c2d4209f2b94a03e69977010afbf9f9db2d"
          expected_head="b314c3305b943498063e31fe10252875f2a14629"
          token=os.environ.pop("GH_TOKEN")
          api="https://api.github.com/repos/"+repository
          def get(url, limit):
           request=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
           request.add_unredirected_header("Authorization","Bearer "+token)
           with urllib.request.urlopen(request,timeout=90) as response:
            raw=response.read(limit+1)
           assert len(raw)<=limit
           return raw
          meta=json.loads(get(api+"/actions/artifacts/"+str(artifact_id),100000))
          assert meta["workflow_run"]["id"]==run_id and not meta["expired"]
          assert meta["size_in_bytes"]==expected_size and meta["digest"]=="sha256:"+expected_sha
          raw=get(api+"/actions/artifacts/"+str(artifact_id)+"/zip",expected_size)
          assert len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected_sha
          print("PG_EXECUTION_ARTIFACT_AUTHENTICATED "+json.dumps({"run":run_id,"artifact":artifact_id,"bytes":len(raw),"sha256":expected_sha}),flush=True)
          found=[]
          result_verified=False
          def visit(value):
           if isinstance(value,dict):
            if value.get("schema")=="laplace.structural-execution-separation/v1": found.append(value)
            for child in value.values(): visit(child)
           elif isinstance(value,list):
            for child in value: visit(child)
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
           entries=archive.infolist()
           assert len(entries)<=100 and sum(e.file_size for e in entries)<=32000000
           assert len({e.filename for e in entries})==len(entries)
           for entry in entries:
            path=pathlib.PurePosixPath(entry.filename)
            assert not path.is_absolute() and ".." not in path.parts and entry.file_size<=8000000
            if entry.is_dir(): continue
            data=archive.read(entry)
            print("PG_RETAINED_MEMBER "+json.dumps({"name":entry.filename,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}),flush=True)
            if entry.filename.endswith(".json"):
             value=json.loads(data)
             visit(value)
             if isinstance(value,dict) and value.get("schema")=="laplace.custom-stack-qa-result/v1":
              assert value["head_sha"]==expected_head
              print("PG_QA_RESULT "+json.dumps(value,sort_keys=True),flush=True)
              result_verified=True
            text="\n".join(ET.fromstring(data).itertext()) if entry.filename.endswith(".xml") else data.decode("utf-8")
            for match in re.finditer(r"LAPLACE_QA_RECEIPT structural_execution_separation (\{[^\n]*\})",text):
             found.append(json.loads(match.group(1)))
          unique={json.dumps(value,sort_keys=True) for value in found}
          assert result_verified, "exact source QA result missing"
          assert len(unique)==1, "missing or conflicting structural execution proof"
          proof=json.loads(next(iter(unique)))
          for key in ("same_profile","same_entity_physicality","historical_rows_and_receipts_unchanged"):
           assert proof[key] is True
          for key in ("repeat_execution_row_delta","repeat_execution_receipt_delta","repeat_entity_delta","repeat_physicality_delta","repeat_attestation_delta"):
           assert proof[key]==0
          assert proof["corruption_controls"]==15 and proof["schema_controls"]==2 and proof["exact_readback_files"]==4
          assert proof["execution_rows_created_once"]==180
          assert proof["first_provider_sha256"]!=proof["second_provider_sha256"]
          print("ACTUAL_STRUCTURAL_EXECUTION_SEPARATION "+json.dumps(proof,sort_keys=True),flush=True)
          PY
