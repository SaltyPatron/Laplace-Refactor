name: Source runtime state QA registration controls
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: ed0cb03ec0a50d78e45bc20b7bbba23d1dcb8540
      SOURCE_TREE: a6460aeb36bce941b032483ab99c5f8e46a35b51
      TMPDIR: /build/laplace/work/sql
      TMP: /build/laplace/work/sql
      TEMP: /build/laplace/work/sql
      EVIDENCE: /build/laplace/recovery/source-runtime-state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Prepare exact source
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR" "$EVIDENCE" /build/laplace/worktrees
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          git worktree add --detach /build/laplace/worktrees/source-runtime-state "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA $SOURCE_TREE" > "$EVIDENCE/source.txt"
      - name: Execute QA registration controls
        run: |
          set -euo pipefail
          cd /build/laplace/worktrees/source-runtime-state
          status=0
          qualify() {
            local label="$1"
            shift
            set +e
            timeout --signal=TERM --kill-after=10s 300s "$@" 2>&1 | tee "$EVIDENCE/$label.log"
            local result=$?
            set -e
            printf '%s\t%s\n' "$label" "$result" >> "$EVIDENCE/exit-codes.tsv"
            if [ "$result" -ne 0 ]; then status=1; fi
          }
          qualify qa-registration python3 tests/custom_stack_qa_tests.py -v
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/python-ast.log"
          import ast, json
          from pathlib import Path
          ast.parse(Path("tests/custom_stack_qa_tests.py").read_text())
          json.loads(Path("tests/registry.d/verified-cpp-source.json").read_text())
          print("PASS QA Python AST and registry JSON")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "PASS clean source worktree" | tee "$EVIDENCE/source-clean.txt"
          exit "$status"
      - name: Retain QA registration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-runtime-state-qa-controls
          path: /build/laplace/recovery/source-runtime-state/
          if-no-files-found: error
          retention-days: 30
