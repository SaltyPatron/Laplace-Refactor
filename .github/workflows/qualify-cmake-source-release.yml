name: Qualify persistent PostgreSQL service ownership
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: /build/laplace/work
      TMP: /build/laplace/work
      TEMP: /build/laplace/work
      INSTALLED_SHA: f2dd8357c85114e455c063e31c075b48b4cde04b
      INSTALLED_PACKAGE: 2ac8c9293be74fe4cb73400cbf9ae56ee80b1f8242232a6f4df83362bf8dad20
      INSTALLED_AGGREGATE: 86139f3b320d4b6976d795ed3ccbc5d1123e0b598d6590282c9a163a2497ada3
      DRIVER_SHA: bc6ecc54f2e64a9922c4df3c1356d208b5cacb60
      DRIVER_TREE: d340139e294fc03bdbfb5e3fc4ace9dcb560a831
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare private service evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SaltyPatron/Laplace-Refactor
          test "$(git rev-parse "$DRIVER_SHA^{tree}")" = "$DRIVER_TREE"
          test "$(git rev-parse HEAD^{tree})" != "$DRIVER_TREE"
          evidence="$RUNNER_TEMP/pg-system-owner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export SERVICE_EVIDENCE="$evidence"
          python3 - <<'PY'
          import os, stat
          from pathlib import Path
          path=Path(os.environ["SERVICE_EVIDENCE"])
          parent=path.parent
          if parent.resolve(strict=True) != parent or not parent.is_dir():
              raise SystemExit("service evidence parent is not a physical directory")
          path.mkdir(mode=0o700)
          m=path.lstat()
          if path.is_symlink() or not path.is_dir() or m.st_uid != os.geteuid() or stat.S_IMODE(m.st_mode) not in (0o700,0o2700):
              raise SystemExit("service evidence directory is not private and owned")
          PY
          printf 'SERVICE_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          git show "$GITHUB_SHA:.github/workflows/qualify-cmake-source-release.yml" > "$evidence/executed-workflow.yml"
          git archive --format=tar "$DRIVER_SHA" tools/postgresql tools/delivery tools/sources contracts > "$evidence/executed-source.tar"
          sha256sum "$evidence/executed-workflow.yml" "$evidence/executed-source.tar" > "$evidence/input-sha256.txt"
      - name: Observe exact cancelled Original foundation without host mutation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s python3 -B - <<'PY_ORIGINAL' 2>&1 | tee "$SERVICE_EVIDENCE/original-post-cancel.log"
          import datetime, hashlib, json, os, signal, stat, subprocess, time, urllib.error, urllib.request
          from pathlib import Path
          RUN=35145274819
          SOURCE="ab1d442ffe7f26deaac3e19784e0483abba4ee4f"
          JOB=104959583060
          SQL="BEGIN READ ONLY;\nSET LOCAL statement_timeout='5s'; SET LOCAL lock_timeout='1s';\nWITH journal AS (\n SELECT CASE source_name WHEN 'UnicodeDecomposer' THEN 'unicode' WHEN 'ChessPgnDecomposer' THEN 'chess-pgn' WHEN 'ISO639Decomposer' THEN 'iso639' WHEN 'OperationalDecomposer' THEN 'operational' WHEN 'CILIDecomposer' THEN 'cili' WHEN 'WordNetDecomposer' THEN 'wordnet' WHEN 'VerbNetDecomposer' THEN 'verbnet' WHEN 'PropBankDecomposer' THEN 'propbank' WHEN 'FrameNetDecomposer' THEN 'framenet' WHEN 'MapNetDecomposer' THEN 'mapnet' WHEN 'WordFrameNetDecomposer' THEN 'wordframenet' WHEN 'SemLinkDecomposer' THEN 'semlink' ELSE 'other' END source_family,\n CASE WHEN status IN ('running','ok','failed','empty-noop','capped','cancelled','skipped-complete','already-present','already-complete','dependency-unset') THEN status ELSE 'other' END status,\n count(*) runs,min(started_at) oldest_started,max(started_at) newest_started,\n sum(units_attempted) units_attempted,sum(units_applied) units_applied,sum(units_failed) units_failed,\n sum(entities) entities,sum(physicalities) physicalities,sum(attestations) attestations,sum(files_done) files_done,sum(files_total) files_total\n FROM laplace.ingest_run_journal GROUP BY 1, 2\n), activity AS MATERIALIZED (\n SELECT pid,backend_start,state,xact_start,query_start,wait_event_type,wait_event,\n CASE WHEN query IS NULL OR query='<insufficient privilege>' THEN 'not-visible'\n WHEN state IS NULL THEN 'unknown-state' WHEN state='idle' THEN 'idle-last-query-not-classified'\n WHEN position('ops.physicality_descriptor_materialize' in query)>0 THEN 'physicality-descriptor-materialize'\n WHEN query ~* '^[[:space:]]*COPY[[:space:]]' THEN 'copy'\n WHEN position('pg_advisory_xact_lock' in query)>0 THEN 'advisory-transaction-lock' ELSE 'other' END query_class\n FROM pg_stat_activity WHERE datname=current_database() AND backend_type='client backend' AND pid<>pg_backend_pid()\n), bounded AS (SELECT * FROM activity ORDER BY backend_start, pid LIMIT 64)\nSELECT jsonb_build_object('schema','laplace.recording-ingest-observation/v1','observed_at',clock_timestamp(),'database',current_database(),'postmaster_started',pg_postmaster_start_time(),\n 'running_ingests',(SELECT count(*) FROM laplace.ingest_run_journal WHERE status='running'),\n 'journal_groups',COALESCE((SELECT jsonb_agg(jsonb_build_object('source_family',source_family,'status',status,'runs',runs,'oldest_age_seconds',GREATEST(0,EXTRACT(EPOCH FROM statement_timestamp()-oldest_started)),'newest_age_seconds',GREATEST(0,EXTRACT(EPOCH FROM statement_timestamp()-newest_started)),'units_attempted',units_attempted,'units_applied',units_applied,'units_failed',units_failed,'entities',entities,'physicalities',physicalities,'attestations',attestations,'files_done',files_done,'files_total',files_total) ORDER BY source_family,status) FROM journal),'[]'::jsonb),\n 'client_backends_total',(SELECT count(*) FROM activity),'client_backends_truncated',(SELECT count(*)>64 FROM activity),\n 'client_backends',COALESCE((SELECT jsonb_agg(jsonb_build_object('pid',pid,'backend_start',backend_start,'state',state,'transaction_age_seconds',CASE WHEN xact_start IS NULL THEN NULL ELSE GREATEST(0,EXTRACT(EPOCH FROM statement_timestamp()-xact_start)) END,'query_age_seconds',CASE WHEN state='idle' OR query_start IS NULL THEN NULL ELSE GREATEST(0,EXTRACT(EPOCH FROM statement_timestamp()-query_start)) END,'wait_event_type',wait_event_type,'wait_event',wait_event,'query_class',query_class) ORDER BY backend_start,pid) FROM bounded),'[]'::jsonb));\nROLLBACK;\n"
          BASE="https://api.github.com/repos/SaltyPatron/Laplace"
          HEADERS={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          def deadline(signum, frame): raise TimeoutError("bounded observation deadline")
          signal.signal(signal.SIGALRM, deadline)
          signal.alarm(55)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  raise ValueError("fixed metadata endpoint attempted a redirect")
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          ALLOWED=("/actions/runs/"+str(RUN),"/actions/runs/"+str(RUN)+"/jobs?per_page=100")
          def api(path):
              if path not in ALLOWED: raise ValueError("metadata endpoint is not allowlisted")
              def read(headers):
                  request=urllib.request.Request(BASE+path,headers=headers)
                  with opener.open(request,timeout=8) as response:
                      raw=response.read(2097153)
                  if len(raw)>2097152: raise ValueError("metadata bound exceeded")
                  return json.loads(raw)
              try:
                  return read(HEADERS)
              except urllib.error.HTTPError as error:
                  if error.code not in (403,404): raise
                  # This token belongs to the observer repository. Public fixed
                  # metadata remains readable without cross-repository authority.
                  return read({"Accept":"application/vnd.github+json"})
          def bound_run():
              run=api("/actions/runs/"+str(RUN))
              if (run["head_sha"]!=SOURCE or run["path"]!=".github/workflows/seed-foundation.yml"
                  or run["run_attempt"]!=1 or run["event"]!="workflow_dispatch"):
                  raise ValueError("foundation source/run identity changed")
              jobs=api("/actions/runs/"+str(RUN)+"/jobs?per_page=100")["jobs"]
              selected=[j for j in jobs if j["id"]==JOB]
              if len(selected)!=1: raise ValueError("foundation job identity unavailable")
              job=selected[0]
              return {"run":RUN,"source":SOURCE,"status":run["status"],"conclusion":run["conclusion"],
                      "job":JOB,"jobStatus":job["status"],"jobConclusion":job["conclusion"],"runner":job.get("runner_name"),
                      "activeSteps":[s["name"] for s in job.get("steps",[]) if s["status"]=="in_progress"]}
          def bounded_proc(path, budget):
              fd=os.open(path,os.O_RDONLY|getattr(os,"O_NOFOLLOW",0))
              with os.fdopen(fd,"rb") as stream:
                  raw=stream.read(budget+1)
              if len(raw)>budget: raise ValueError("process observation budget exceeded")
              return raw.decode("ascii")
          def process(pid, started):
              raw=bounded_proc("/proc/"+str(pid)+"/stat",4096)
              end=raw.rfind(")")
              if end<0 or raw.split(" ",1)[0]!=str(pid): raise ValueError("process identity invalid")
              fields=raw[end+2:].split()
              ticks=os.sysconf("SC_CLK_TCK")
              boot=[int(s.split()[1]) for s in bounded_proc("/proc/stat",262144).splitlines() if s.startswith("btime ")]
              expected=datetime.datetime.fromisoformat(started.replace("Z","+00:00")).timestamp()
              birth=int(fields[19])
              if len(boot)!=1 or abs(expected-(boot[0]+birth/ticks))>2:
                  raise ValueError("backend birth differs from process")
              return {"pid":pid,"startTicks":birth,"userSeconds":int(fields[11])/ticks,
                      "systemSeconds":int(fields[12])/ticks,"residentBytes":int(fields[21])*os.sysconf("SC_PAGE_SIZE"),
                      "threads":int(fields[17]),"observedMonotonic":time.monotonic()}
          HISTORICAL_PIDS=(607996,608078,608185,608186)
          def historical_pid_slots():
              observations=[]
              for pid in HISTORICAL_PIDS:
                  try:
                      raw=bounded_proc("/proc/"+str(pid)+"/stat",4096)
                      end=raw.rfind(")")
                      if end<0 or raw.split(" ",1)[0]!=str(pid):
                          raise ValueError("numeric process slot identity invalid")
                      fields=raw[end+2:].split()
                      observations.append({"pid":pid,"slotPresent":True,"startTicks":int(fields[19]),
                          "historicalProcessIdentityProven":False})
                  except FileNotFoundError:
                      observations.append({"pid":pid,"slotPresent":False,
                          "historicalProcessIdentityProven":False})
                  except (OSError,ValueError,IndexError) as error:
                      observations.append({"pid":pid,"slotPresent":None,
                          "unavailableErrorType":type(error).__name__,"errno":getattr(error,"errno",None),
                          "historicalProcessIdentityProven":False})
              return observations
          previous={}
          for sample in range(2):
              owner=bound_run()
              print("FOUNDATION_BOUND_JOB "+json.dumps(owner),flush=True)
              if (owner["status"]!="completed" or owner["conclusion"]!="cancelled"
                  or owner["jobStatus"]!="completed" or owner["jobConclusion"]!="cancelled"):
                  raise ValueError("exact foundation cancellation is not terminal")
              slots=historical_pid_slots()
              print("FOUNDATION_POST_CANCEL_PID_SLOTS "+json.dumps({"sample":sample,"observations":slots,
                  "scope":"Fixed numeric PID slots from the finalized cancellation log; retained birth identities are unavailable, so a present slot is not attributed to the historical process."}),flush=True)
              env={k:v for k,v in os.environ.items() if not k.startswith("PG")}
              env["PGOPTIONS"]="-c default_transaction_read_only=on -c statement_timeout=5000 -c lock_timeout=1000"
              result=subprocess.run(["/opt/laplace/pgsql-18/bin/psql","-X","-q","-h","/var/run/postgresql",
                  "-p","5432","-U","laplace_admin","-d","laplace","-v","ON_ERROR_STOP=1","-A","-t"],
                  input=SQL.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,timeout=8)
              if result.returncode or len(result.stdout)>262144:
                  print("FOUNDATION_DATABASE_OBSERVATION_UNAVAILABLE "+json.dumps({"returncode":result.returncode,
                      "stdoutBytes":len(result.stdout),"stderrBytes":len(result.stderr),
                      "stderrSha256":hashlib.sha256(result.stderr).hexdigest()}),flush=True)
                  break
              lines=[line for line in result.stdout.splitlines() if line.strip()]
              if len(lines)!=1: raise ValueError("unexpected bounded database output")
              data=json.loads(lines[0])
              assert data["schema"]=="laplace.recording-ingest-observation/v1" and data["database"]=="laplace"
              assert len(data["client_backends"])<=64
              metrics=[]
              for backend in data["client_backends"]:
                  pid=backend["pid"]
                  if type(pid) is not int or not 0<pid<2147483648: raise ValueError("backend pid invalid")
                  try:
                      current=process(pid,backend["backend_start"])
                      prior=previous.get(pid)
                      if prior and prior["startTicks"]==current["startTicks"]:
                          elapsed=current["observedMonotonic"]-prior["observedMonotonic"]
                          cpu=current["userSeconds"]+current["systemSeconds"]-prior["userSeconds"]-prior["systemSeconds"]
                          if elapsed>0 and cpu>=0: current["delta"]={"seconds":elapsed,"cpuSeconds":cpu,"coreEquivalents":cpu/elapsed}
                      previous[pid]=current.copy()
                      metrics.append(current)
                  except (OSError,ValueError,KeyError,IndexError) as error:
                      metrics.append({"pid":pid,"unavailableErrorType":type(error).__name__,"errno":getattr(error,"errno",None)})
              print("FOUNDATION_READONLY_SAMPLE "+json.dumps({"sample":sample,"owner":owner,"database":data,"backendProcesses":metrics,
                  "historicalPidSlots":slots,"observerUid":os.getuid(),"host":os.uname().nodename,
                  "scope":"Read-only operational counters; database clients are not exclusively attributed to this foundation run; no query text, commands, environment, journal mutation or process action."}),flush=True)
              if sample==0: time.sleep(8)
          signal.alarm(0)
          
          
          PY_ORIGINAL
      - name: Converge the authenticated installed database
        shell: bash tools/host/run-exclusive.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"tools"))
          from sources import stockfish_corpus_acceptance as owner
          out=Path(os.environ["SERVICE_EVIDENCE"])
          allowed=subprocess.check_output(["git","diff","--name-only",os.environ["DRIVER_SHA"],"HEAD","--"],text=True).splitlines()
          owner.require(allowed==[".github/workflows/qualify-cmake-source-release.yml"],"operator delta differs from reviewed source")
          active=owner.observe_activation(os.environ["INSTALLED_SHA"],out/"activation-before.json")
          owner.require(active["package_id"]==os.environ["INSTALLED_PACKAGE"],"selected installed package changed")
          owner.require(any(x["document"]["result_sha256"]==os.environ["INSTALLED_AGGREGATE"] for x in active["runner_receipts"]),"selected activation aggregate changed")
          owner.save(out/"driver-identity.json",{"driver_sha":os.environ["DRIVER_SHA"],"driver_tree":os.environ["DRIVER_TREE"],"installed_sha":os.environ["INSTALLED_SHA"],"package_id":active["package_id"],"native_code_rebuilt":False})
          PY
          exec timeout --signal=TERM --kill-after=1800s 600s python3 -B tools/postgresql/service_lifecycle.py converge \
            --expected-sha "$INSTALLED_SHA" --output-directory "$SERVICE_EVIDENCE/convergence" \
            > "$SERVICE_EVIDENCE/convergence.log" 2>&1
      - name: Verify the persistent database owner and product services
        shell: bash tools/host/run-exclusive.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"tools"))
          from sources import stockfish_corpus_acceptance as owner
          out=Path(os.environ["SERVICE_EVIDENCE"])
          before=owner.load(out/"activation-before.json")
          active=owner.observe_activation(os.environ["INSTALLED_SHA"],out/"activation-before-services.json")
          owner.require(owner.stable_activation(before)==owner.stable_activation(active),"activation changed before service verification")
          owner.require(active["postgresql_service_owner"] is not None,"persistent database service owner is not selected")
          PY
          timeout --signal=TERM --kill-after=10s 300s python3 -B tools/delivery/product_cognition_service.py restart \
            --expected-sha "$INSTALLED_SHA" --output "$SERVICE_EVIDENCE/cognition-restart" \
            2>&1 | tee "$SERVICE_EVIDENCE/cognition-restart.log"
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"tools"))
          from sources import stockfish_corpus_acceptance as owner
          out=Path(os.environ["SERVICE_EVIDENCE"])
          active=owner.observe_activation(os.environ["INSTALLED_SHA"],out/"activation-after-restart.json")
          owner.require(active["package_id"]==os.environ["INSTALLED_PACKAGE"],"installed package changed during handoff")
          (out/"product-receipt-path.txt").write_text(active["package_metadata"]["receipt_path"]+"\n")
          PY
          receipt="$(cat "$SERVICE_EVIDENCE/product-receipt-path.txt")"
          timeout --signal=TERM --kill-after=10s 120s python3 -B tools/delivery/product_gateway_live_proof.py \
            --output "$SERVICE_EVIDENCE/readiness" --package-id "$INSTALLED_PACKAGE" \
            --readiness-only --product-receipt "$receipt" 2>&1 | tee "$SERVICE_EVIDENCE/readiness.log"
          timeout --signal=TERM --kill-after=10s 180s python3 -B tools/delivery/product_gateway_live_proof.py \
            --output "$SERVICE_EVIDENCE/gateway" --package-id "$INSTALLED_PACKAGE" \
            2>&1 | tee "$SERVICE_EVIDENCE/gateway.log"
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"tools"))
          from sources import stockfish_corpus_acceptance as owner
          out=Path(os.environ["SERVICE_EVIDENCE"])
          before=owner.load(out/"activation-before.json")
          after=owner.observe_activation(os.environ["INSTALLED_SHA"],out/"activation-after.json")
          owner.require(owner.stable_activation(before)==owner.stable_activation(after),"activation changed during service handoff")
          service=after["postgresql_service_owner"]
          owner.require(service is not None and service["service"]["boot_enabled"] is True and service["service"]["cold_boot_proven"] is False,"actual persistent service owner is not verified")
          report={"status":"passed","installed_sha":os.environ["INSTALLED_SHA"],"package_id":after["package_id"],"activation_unchanged":True,"service":service,"gateway_semantics":"passed","cold_boot_proven":False}
          owner.save(out/"result.json",report)
          print(__import__("json").dumps(report,sort_keys=True))
          PY
      - name: Report completed or partial convergence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["SERVICE_EVIDENCE"])
          path=root/"convergence/result.json"
          if path.is_file():
              report=json.loads(path.read_text())
              selected={key:report[key] for key in ("schema","status","phase","provider","package_id","repository_commit","system_identifier","cold_boot_proven","error_type","error","previous_owner_restored","rollback_error_type","rollback_error") if key in report}
              print(json.dumps(selected,sort_keys=True))
          else:
              print(json.dumps({"status":"no-convergence-receipt","service_handoff_proven":False}))
          PY
      - name: Retain successful or partial service evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pg-system-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pg-system-owner-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
