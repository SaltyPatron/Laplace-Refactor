name: Read authenticated normal custom-stack QA evidence
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
    paths: [.github/workflows/qualify-cmake-source-release.yml]
permissions:
  contents: read
  actions: read
jobs:
  read-retained:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate normal QA artifact and retain actual results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile
          base='https://api.github.com/repos/SaltyPatron/Laplace-Refactor'
          def get(path):
              request=urllib.request.Request(base+path,headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              request.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
              with urllib.request.urlopen(request,timeout=60) as response:
                  return response.read()
          run=json.loads(get('/actions/runs/35184451666'))
          assert run['head_sha']=='727debeb4e72f4a6356c7c7980f8e16ad37d2df9'
          assert run['event']=='pull_request'
          artifact=json.loads(get('/actions/artifacts/10482420724'))
          assert artifact['workflow_run']['id']==35184451666
          assert artifact['workflow_run']['head_sha']==run['head_sha'] and not artifact['expired']
          expected='d9fc8087c2af6434cabdead0a5cb30c9e7fa6fe24ab9fc2d4d5dec3f32b82424'
          assert artifact['digest']=='sha256:'+expected
          data=get('/actions/artifacts/10482420724/zip')
          assert len(data)==44225 and hashlib.sha256(data).hexdigest()==expected
          archive=zipfile.ZipFile(io.BytesIO(data))
          assert len(archive.namelist())==len(set(archive.namelist()))
          assert sum(i.file_size for i in archive.infolist()) < 16*1024*1024
          print('NORMAL_QA_ARTIFACT '+json.dumps({'artifact':10482420724,'run':35184451666,'head':run['head_sha'],'zip_sha256':expected,'names':archive.namelist()},sort_keys=True))
          for item in archive.infolist():
              if item.is_dir():
                  continue
              data=archive.read(item.filename)
              print('NORMAL_QA_MEMBER '+json.dumps({'path':item.filename,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()},sort_keys=True))
              if item.filename.endswith('.json'):
                  value=json.loads(data)
                  if len(data)<=65536:
                      print('NORMAL_QA_JSON '+item.filename+' '+json.dumps(value,sort_keys=True))
              elif item.filename.endswith(('.log','.txt','.xml','.out')):
                  for line in data.decode('utf-8',errors='replace').splitlines():
                      if any(token in line for token in ('LAPLACE_QA_RECEIPT','tests passed','Total Test time','ERROR:','DETAIL:','Test #','FAILED','PASSED')):
                          print('NORMAL_QA_RESULT '+item.filename+' '+line[:16384])
          PY
