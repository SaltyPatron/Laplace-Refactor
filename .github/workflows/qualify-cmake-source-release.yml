name: Read retained private statistics experiment
on:
  push:
    branches: [qualify/cmake-source-443-20260916]
permissions:
  contents: read
  actions: read
jobs:
  retained-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate bounded retained diagnostic members
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import hashlib,io,json,os,pathlib,urllib.request,zipfile
          ARTIFACT=10506537492;RUN=35243657318;SIZE=105005
          SHA="7fb44f003f816c3932e91b54a2bc83de9791109805e08600b6ea49717231c01f"
          HEAD="5d08016a427edf6f31965d9b0202886fa85b4f1e"
          BASE="https://api.github.com/repos/SaltyPatron/Laplace-Refactor"
          def get(url,limit):
              request=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json"})
              request.add_unredirected_header("Authorization","Bearer "+os.environ["GH_TOKEN"])
              with urllib.request.urlopen(request,timeout=45) as response:raw=response.read(limit+1)
              if len(raw)>limit:raise RuntimeError("response exceeded bound")
              return raw
          meta=json.loads(get(BASE+"/actions/artifacts/"+str(ARTIFACT),65536))
          if meta["id"]!=ARTIFACT or meta["workflow_run"]["id"]!=RUN or meta["workflow_run"]["head_sha"]!=HEAD or meta["size_in_bytes"]!=SIZE or meta["digest"]!="sha256:"+SHA or meta["expired"]:raise RuntimeError("artifact binding differs")
          raw=get(meta["archive_download_url"],SIZE)
          if len(raw)!=SIZE or hashlib.sha256(raw).hexdigest()!=SHA:raise RuntimeError("ZIP differs")
          result={"artifact":ARTIFACT,"run":RUN,"sha256":SHA,"members":{}}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              names=archive.namelist()
              if len(names)!=len(set(names)) or any(pathlib.PurePosixPath(n).is_absolute() or ".." in pathlib.PurePosixPath(n).parts or "\\" in n for n in names):raise RuntimeError("unsafe artifact paths")
              for name in ("fixture/report.json","fixture/final-counts.stdout","fixture/final-counts.stderr","fixture/stale.analyze.stderr","fixture/fresh.analyze.stderr"):
                  matches=[n for n in names if n==name or n.endswith("/"+name)]
                  if len(matches)>1:raise RuntimeError("ambiguous diagnostic member")
                  if not matches:continue
                  info=archive.getinfo(matches[0])
                  if info.file_size>1048576:raise RuntimeError("diagnostic member exceeds bound")
                  value=archive.read(info)
                  result["members"][name]={"bytes":len(value),"sha256":hashlib.sha256(value).hexdigest(),"content":json.loads(value) if name.endswith(".json") else value.decode()}
          pathlib.Path("stale-fixture-diagnostic.json").write_text(json.dumps(result,indent=2)+"\n")
          report=result["members"]["fixture/report.json"]["content"]
          summary={k:v for k,v in report.items() if k not in ("baseline_statistics","stale_statistics","fresh_statistics","source_blobs","stale","fresh")}
          for key in ("stale","fresh"):
              if key in report:summary[key]={phase:{k:v for k,v in details.items() if k!="explain"} for phase,details in report[key].items()}
          print("STALE_FIXTURE_DIAGNOSTIC "+json.dumps({"summary":summary,"other_members":{k:v for k,v in result["members"].items() if k!="fixture/report.json"}},sort_keys=True))
          
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-plan-${{ github.run_id }}
          path: stale-fixture-diagnostic.json
          if-no-files-found: error
