name: architecture-batch-transport-v2

on:
  push:
    branches:
      - feat/decomposition-orchestration

permissions:
  contents: write

concurrency:
  group: architecture-batch-transport-v2
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Apply epistemic authority batch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply authority provenance batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          # Seed-vs-observation is not modality.  Evidence provenance is a second,
          # identity-bound axis and is declared by each profile rather than guessed
          # from its serialization.
          for path, source_type in (
              ('contracts/sources/iso-639-3-20260415.json', 'standard'),
              ('contracts/sources/cili-pwn-mappings-20240611.json', 'curated_dataset'),
          ):
              p = Path(path)
              doc = json.loads(p.read_text(encoding='utf-8'))
              if doc['profile'].get('source_class') != 'foundational_seed':
                  raise SystemExit(f'{path}: foundational_seed class missing')
              doc['profile']['evidence_source_type'] = source_type
              p.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n',
                           encoding='utf-8', newline='\n')

          once(
              'tests/tabular_profile_fixture.hpp',
              '        declaration.flags = Profile::epistemic_class;\n',
              '        declaration.flags = LAPLACE_SOURCE_PROFILE_MAKE_FLAGS(\n'
              '            Profile::epistemic_class, Profile::evidence_type);\n')

          test_path = Path('tests/source_profile_tests.cpp')
          test = test_path.read_text(encoding='utf-8')
          replacements = {
              'TEST(SourceProfile, EpistemicClassIsOrthogonalAndIdentityBound) {':
                  'TEST(SourceProfile, EpistemicAndEvidenceAxesAreOrthogonalAndIdentityBound) {',
              '    seed.flags = LAPLACE_SOURCE_PROFILE_EPISTEMIC_FOUNDATIONAL_SEED;':
                  '    seed.flags = LAPLACE_SOURCE_PROFILE_MAKE_FLAGS(\n'
                  '        LAPLACE_SOURCE_PROFILE_EPISTEMIC_FOUNDATIONAL_SEED,\n'
                  '        LAPLACE_SOURCE_PROFILE_EVIDENCE_STANDARD);',
              '    observation.flags = LAPLACE_SOURCE_PROFILE_EPISTEMIC_OBSERVATION;':
                  '    observation.flags = LAPLACE_SOURCE_PROFILE_MAKE_FLAGS(\n'
                  '        LAPLACE_SOURCE_PROFILE_EPISTEMIC_OBSERVATION,\n'
                  '        LAPLACE_SOURCE_PROFILE_EVIDENCE_STANDARD);',
              '    derived.flags = LAPLACE_SOURCE_PROFILE_EPISTEMIC_DERIVED;':
                  '    derived.flags = LAPLACE_SOURCE_PROFILE_MAKE_FLAGS(\n'
                  '        LAPLACE_SOURCE_PROFILE_EPISTEMIC_DERIVED,\n'
                  '        LAPLACE_SOURCE_PROFILE_EVIDENCE_STANDARD);',
              '    invalid.flags = UINT32_C(0x10);':
                  '    invalid.flags = UINT32_C(0x100);',
          }
          for old, new in replacements.items():
              if test.count(old) != 1:
                  raise SystemExit(f'source_profile_tests.cpp: expected one {old!r}')
              test = test.replace(old, new)
          seed_marker = '''    ASSERT_EQ(laplace_source_profile_identify(&seed, &seed.profile_id),
                        LAPLACE_SOURCE_PROFILE_OK);
          '''
          seed_extension = '''    ASSERT_EQ(laplace_source_profile_identify(&seed, &seed.profile_id),
                        LAPLACE_SOURCE_PROFILE_OK);
              EXPECT_EQ(laplace_source_profile_epistemic_class(&seed),
                        LAPLACE_SOURCE_PROFILE_EPISTEMIC_FOUNDATIONAL_SEED);
              EXPECT_EQ(laplace_source_profile_evidence_source_type(&seed),
                        LAPLACE_SOURCE_PROFILE_EVIDENCE_STANDARD);

              auto curated = seed;
              curated.flags = LAPLACE_SOURCE_PROFILE_MAKE_FLAGS(
                  LAPLACE_SOURCE_PROFILE_EPISTEMIC_FOUNDATIONAL_SEED,
                  LAPLACE_SOURCE_PROFILE_EVIDENCE_CURATED_DATASET);
              ASSERT_EQ(laplace_source_profile_identify(&curated, &curated.profile_id),
                        LAPLACE_SOURCE_PROFILE_OK);
              EXPECT_NE(std::memcmp(seed.profile_id.bytes, curated.profile_id.bytes, 32u), 0);
          '''
          if test.count(seed_marker) != 1:
              raise SystemExit('source_profile_tests.cpp: seed identity marker changed')
          test = test.replace(seed_marker, seed_extension)
          test_path.write_text(test, encoding='utf-8', newline='\n')

          pg_path = Path('postgres/extension/src/source_admission_pg.c')
          pg = pg_path.read_text(encoding='utf-8')
          marker = 'PG_FUNCTION_INFO_V1(LAPLACE_PG_SOURCE_ADMIT_TABULAR_SYMBOL);\n'
          assertions = '''PG_FUNCTION_INFO_V1(LAPLACE_PG_SOURCE_ADMIT_TABULAR_SYMBOL);

          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_STANDARD == LAPLACE_EVIDENCE_SOURCE_STANDARD,
                         "standard provenance constants diverged");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_CURATED_DATASET == LAPLACE_EVIDENCE_SOURCE_CURATED_DATASET,
                         "curated provenance constants diverged");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_CORPUS == LAPLACE_EVIDENCE_SOURCE_CORPUS,
                         "corpus provenance constants diverged");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_DIRECT_OBSERVATION == LAPLACE_EVIDENCE_SOURCE_DIRECT_OBSERVATION,
                         "observation provenance constants diverged");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_CALCULATION == LAPLACE_EVIDENCE_SOURCE_CALCULATION,
                         "calculation provenance constants diverged");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_MODEL == LAPLACE_EVIDENCE_SOURCE_MODEL,
                         "model provenance constants diverged");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_SELF_ASSERTION == LAPLACE_EVIDENCE_SOURCE_SELF_ASSERTION,
                         "self-assertion provenance constants diverged");
          _Static_assert(LAPLACE_SOURCE_PROFILE_EVIDENCE_EXTERNAL_PROVIDER == LAPLACE_EVIDENCE_SOURCE_EXTERNAL_PROVIDER,
                         "external-provider provenance constants diverged");
          '''
          if pg.count(marker) != 1:
              raise SystemExit('source_admission_pg.c: function marker changed')
          pg = pg.replace(marker, assertions)
          builder_marker = '''    const laplace_digest256 trust = trust_input_id(profile);
              size_t index;
          '''
          builder_replacement = '''    const laplace_digest256 trust = trust_input_id(profile);
              const uint32_t source_type =
                  laplace_source_profile_evidence_source_type(profile);
              size_t index;
              if (source_type == LAPLACE_SOURCE_PROFILE_EVIDENCE_UNSPECIFIED) {
                  ereport(ERROR,
                          (errcode(ERRCODE_DATA_CORRUPTED),
                           errmsg("Laplace admitted testimony has no declared evidence source type")));
              }
          '''
          if pg.count(builder_marker) != 1:
              raise SystemExit('source_admission_pg.c: testimony builder marker changed')
          pg = pg.replace(builder_marker, builder_replacement)
          hardcoded = 'records[index].source_type = LAPLACE_EVIDENCE_SOURCE_STANDARD;'
          if pg.count(hardcoded) != 1:
              raise SystemExit('source_admission_pg.c: hard-coded provenance marker changed')
          pg = pg.replace(hardcoded, 'records[index].source_type = source_type;')
          pg_path.write_text(pg, encoding='utf-8', newline='\n')

          # Only source-profile/world-admission flags carry these source axes.
          sql_path = Path('postgres/extension/laplace--version.sql.in')
          sql = sql_path.read_text(encoding='utf-8')
          replacement = '''flags integer NOT NULL CHECK (
                  flags >= 0 AND (flags & ~255) = 0 AND
                  (flags & 15) BETWEEN 0 AND 4 AND
                  ((flags >> 4) & 15) BETWEEN 0 AND 8),'''
          for table in ('source_profile', 'world_admission'):
              pattern = re.compile(
                  rf'(CREATE TABLE @LAPLACE_PG_SCHEMA@\.{table} \(.*?)(flags integer NOT NULL CHECK \(flags = 0\),)(.*?\n\);)',
                  re.S)
              sql, count = pattern.subn(lambda m: m.group(1) + replacement + m.group(3), sql, count=1)
              if count != 1:
                  raise SystemExit(f'laplace--version.sql.in: {table} flags constraint not found')
          sql_path.write_text(sql, encoding='utf-8', newline='\n')

          once('tests/isa_tests.cpp',
               '    static_assert(LAPLACE_ISA_MINOR == 10u);\n',
               '    static_assert(LAPLACE_ISA_MINOR == 11u);\n')
          once('tests/isa_tests.cpp',
               '    EXPECT_EQ(LAPLACE_ISA_OPCODE_REFERENCE_MAPPING_RESOLVE_BATCH, 0x00060004u);\n',
               '    EXPECT_EQ(LAPLACE_ISA_OPCODE_REFERENCE_MAPPING_RESOLVE_BATCH, 0x00060004u);\n'
               '    EXPECT_EQ(LAPLACE_ISA_OPCODE_COGNITION_SOLVE_PACKET, 0x00070001u);\n'
               '    EXPECT_EQ(LAPLACE_ISA_INSTRUCTION_VERSION_COGNITION_SOLVE_PACKET, 1u);\n'
               '    EXPECT_EQ(LAPLACE_ISA_INTRODUCED_MINOR_COGNITION_SOLVE_PACKET, 11u);\n')
          PY
          rm -f .github/workflows/architecture-batch-transport.yml
          rm -f .github/workflows/architecture-batch-transport-v2.yml
          git config user.name "laplace-runner"
          git config user.email "laplace-runner@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind seeded authority provenance through admission"
          git push origin HEAD:feat/decomposition-orchestration
