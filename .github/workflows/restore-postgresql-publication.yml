name: restore-postgresql-publication

on:
  push:
    branches:
      - recovery/restore-postgresql-publication-20260911

permissions:
  contents: read

concurrency:
  group: laplace-postgresql-recovery-discovery
  cancel-in-progress: true

jobs:
  discover-retained-build-inputs:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - oneapi
      - postgres-18
      - avx2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Discover exact retained PostgreSQL rebuild inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          output="$RUNNER_TEMP/postgresql-rebuild-inputs.json"
          python3 - "$output" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          schemas = {
              "laplace.toolchain-package-receipt/v1",
              "laplace.postgresql-runtime-package/v2",
              "laplace.postgresql-host-build-provider/v1",
              "laplace.postgresql-package-receipt/v2",
              "laplace.release-import-receipt/v1",
          }
          scan_roots = [
              Path("/build/laplace"),
              Path("/opt/laplace/build"),
              Path("/opt/laplace/receipts"),
              Path("/opt/laplace/external"),
          ]
          inaccessible = []

          def record_inaccessible(path, operation, exc):
              inaccessible.append({
                  "path": str(path),
                  "operation": operation,
                  "error": f"{type(exc).__name__}: {exc}",
              })

          def regular_readable_file(path: Path) -> bool:
              try:
                  return path.is_file() and not path.is_symlink()
              except OSError as exc:
                  record_inaccessible(path, "stat", exc)
                  return False

          def directory_without_symlink(path: Path) -> bool:
              try:
                  return path.is_dir() and not path.is_symlink()
              except OSError as exc:
                  record_inaccessible(path, "stat", exc)
                  return False

          def sha256(path: Path):
              try:
                  digest = hashlib.sha256()
                  with path.open("rb") as stream:
                      for block in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(block)
                  return digest.hexdigest()
              except OSError as exc:
                  record_inaccessible(path, "sha256", exc)
                  return None

          def walk_error(exc):
              record_inaccessible(getattr(exc, "filename", "<unknown>"), "walk", exc)

          receipts = []
          seen = set()
          for root in scan_roots:
              if not directory_without_symlink(root):
                  continue
              for current, directories, files in os.walk(root, followlinks=False, onerror=walk_error):
                  filtered = []
                  for name in directories:
                      candidate = Path(current) / name
                      try:
                          if not candidate.is_symlink():
                              filtered.append(name)
                      except OSError as exc:
                          record_inaccessible(candidate, "lstat", exc)
                  directories[:] = filtered

                  for name in files:
                      if not name.endswith(".json") or "receipt" not in name.lower():
                          continue
                      path = Path(current) / name
                      try:
                          if path.is_symlink() or path.stat().st_size > 16 * 1024 * 1024:
                              continue
                          document = json.loads(path.read_text(encoding="utf-8"))
                      except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                          if isinstance(exc, OSError):
                              record_inaccessible(path, "read-json", exc)
                          continue
                      schema = document.get("schema") if isinstance(document, dict) else None
                      if schema not in schemas:
                          continue
                      try:
                          resolved = str(path.resolve(strict=False))
                      except OSError as exc:
                          record_inaccessible(path, "resolve", exc)
                          resolved = str(path)
                      if resolved in seen:
                          continue
                      digest = sha256(path)
                      if digest is None:
                          continue
                      seen.add(resolved)
                      receipts.append({
                          "path": str(path),
                          "schema": schema,
                          "sha256": digest,
                          "build_input_id": document.get("build_input_id"),
                          "install_prefix": document.get("install_prefix"),
                          "prefix": document.get("prefix"),
                          "activation_eligible": document.get("activation_eligible"),
                      })

          filenames = ["postgresql-18.6.tar.bz2"]
          exact_files = []
          source_candidates = []
          source_roots = [Path("/build/laplace"), Path("/opt/laplace/external")]
          for root in source_roots:
              if not directory_without_symlink(root):
                  continue
              for current, directories, files in os.walk(root, followlinks=False, onerror=walk_error):
                  filtered = []
                  for name in directories:
                      candidate = Path(current) / name
                      try:
                          if not candidate.is_symlink():
                              filtered.append(name)
                      except OSError as exc:
                          record_inaccessible(candidate, "lstat", exc)
                  directories[:] = filtered
                  current_path = Path(current)
                  for filename in filenames:
                      if filename in files:
                          path = current_path / filename
                          digest = sha256(path)
                          try:
                              size = path.stat().st_size
                          except OSError as exc:
                              record_inaccessible(path, "stat", exc)
                              continue
                          if digest is not None:
                              exact_files.append({
                                  "path": str(path),
                                  "sha256": digest,
                                  "bytes": size,
                              })
                  if current_path.name == "postgresql" and "configure" in files:
                      configure = current_path / "configure"
                      digest = sha256(configure)
                      if digest is not None:
                          source_candidates.append({
                              "path": str(current_path),
                              "configure_sha256": digest,
                          })

          host_provider = Path("/build/laplace/build/postgresql-host-provider/0b3378486ff5e39942b19b6292644e69573ad2b802307e095968aa148ca29e18/host-provider-receipt.json")
          host_provider_exists = regular_readable_file(host_provider)
          host_provider_sha = sha256(host_provider) if host_provider_exists else None

          result = {
              "schema": "laplace.postgresql-rebuild-input-discovery/v1",
              "receipts": sorted(receipts, key=lambda item: (item["schema"], item["path"])),
              "postgresql_archives": sorted(exact_files, key=lambda item: item["path"]),
              "postgresql_sources": sorted(source_candidates, key=lambda item: item["path"]),
              "expected_host_provider": {
                  "path": str(host_provider),
                  "exists": host_provider_exists,
                  "sha256": host_provider_sha,
              },
              "inaccessible": sorted(inaccessible, key=lambda item: (item["path"], item["operation"], item["error"])),
          }
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

          test -s "$output"
          jq -e '.schema == "laplace.postgresql-rebuild-input-discovery/v1"' "$output" >/dev/null
      - name: Retain rebuild input discovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgresql-rebuild-inputs
          path: ${{ runner.temp }}/postgresql-rebuild-inputs.json
          if-no-files-found: error
