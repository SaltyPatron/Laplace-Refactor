name: capture-pr369-test34

on:
  push:
    branches:
      - complete/typed-standing-query-20260913

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete/typed-standing-query-20260913
          fetch-depth: 0
      - name: Extract exact failing test output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/103866763705/logs" \
            -o /tmp/job.log
          {
            grep -n -C 80 'TargetCompilationUsesSameLiveMaterializedOperator' /tmp/job.log || true
            grep -n -C 30 'cognition_observation_operator_view_tests.cpp' /tmp/job.log || true
          } > ci-failure-test34.txt
          test -s ci-failure-test34.txt
      - name: Publish excerpt and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/capture-pr369-test34.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Capture PR369 test34 failure excerpt"
          git push origin HEAD:complete/typed-standing-query-20260913
