name: one-shot-wire-composition-benchmark

on:
  push:
    branches:
      - product/installed-cognition-surface

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: product/installed-cognition-surface
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')
          line = '    include("${CMAKE_CURRENT_SOURCE_DIR}/tests/composition_frontier_benchmark.cmake")\n'
          if line not in text:
              marker = '    include("${CMAKE_CURRENT_SOURCE_DIR}/tests/composition_occurrence.cmake")\n'
              if text.count(marker) != 1:
                  raise SystemExit(f'composition include marker count={text.count(marker)}')
              text = text.replace(marker, marker + line, 1)
              path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- CMakeLists.txt; then
            exit 0
          fi
          git config user.name laplace-ci
          git config user.email laplace-ci@users.noreply.github.com
          git add CMakeLists.txt
          git commit -m 'Wire explicit composition benchmark target'
          git push origin HEAD:product/installed-cognition-surface
