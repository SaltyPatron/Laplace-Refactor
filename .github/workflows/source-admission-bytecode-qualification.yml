name: Qualify independent CI execution selection
on:
  push:
    branches: [verify/source-admission-bytecode-20260916]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Bind reviewed product source and diagnostic-only workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^2)" = 219fd0d750a3eb5436b32903ca83514c7f64c115
          test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/source-admission-bytecode-qualification.yml
          test "$(git hash-object '.github/workflows/ci.yml')" = 75d47fb52f13bffc5c45f812323c90a4ca382940
          test "$(git hash-object '.github/workflows/product-path.yml')" = 461fce9ebb2826898fcdd7180d563e84279cbed3
          test "$(git hash-object 'contracts/product-path.json')" = 71a23b68ac00d6d7c03cfc756323809ff5db9395
          test "$(git hash-object 'tests/product_path_concurrency_tests.py')" = d36beb648338abc8a9d35f612f0b457bc411d2ed
          test "$(git hash-object 'tests/product_path_status_tests.py')" = ef5cc892906b9b43c227f7a529f12b3e754818f0
          test "$(git hash-object 'tests/product_path_tests.py')" = b588e45bad08087a74fefd4a049183e3bb403aad
          test "$(git hash-object 'tools/delivery/product_path.py')" = 46b83a4580e5e2e50cb21880c82ddc41019934a6
          test "$(git hash-object 'tests/stockfish_corpus_acceptance_tests.py')" = 72e8cadfe5042ab8bbd9f7a98e6472564d670140
          test "$(git hash-object 'tools/dependencies/chess_tools.py')" = 03aa08c2d67c013a873b65e9e94f7854035479df
          test "$(git hash-object 'tests/chess_dependency_tests.py')" = 514861cd8309baa08c390e2fb37ad6e826c876e6
          test "$(git hash-object 'docs/delivery/CHESS_DEPENDENCIES.md')" = d182875792b05e45f240882060c9c30e06343476
          root="/build/laplace/work/ci-execution-selection/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$root"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$root"
          printf 'QUALIFICATION_DIR=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Execute actual classifier and workflow counterexamples
        shell: bash
        run: |
          set -euo pipefail
          for suite in product_path_tests product_path_status_tests product_path_concurrency_tests hosted_ci_cache_contract_tests stockfish_corpus_acceptance_tests chess_dependency_tests; do
            timeout --signal=TERM --kill-after=5s 120s python3 "tests/$suite.py" \
              2>&1 | tee "$QUALIFICATION_DIR/$suite.log"
          done
          python3 tools/delivery/product_path.py classify \
            --path .github/scripts/consolidate-branches.py \
            --path .github/branch-resolutions.json \
            --output "$QUALIFICATION_DIR/housekeeping-classification.json"
          python3 - "$QUALIFICATION_DIR/housekeeping-classification.json" <<'PY'
          import json,sys
          from pathlib import Path
          result=json.loads(Path(sys.argv[1]).read_text())
          assert result["required_evidence"] == ["hosted"]
          assert result["requires_hosted_native"] is False
          assert result["requires_deployment"] is False
          assert result["requires_stockfish_corpus"] is False
          print(json.dumps(result,sort_keys=True))
          PY
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain actual controls and selection evidence
        if: always() && env.QUALIFICATION_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-execution-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_DIR }}/
          if-no-files-found: error
          retention-days: 30
  hosted-proof:
    needs: qualify
    uses: ./.github/workflows/ci.yml
    with:
      build_native: false
  result:
    if: always()
    needs: [qualify, hosted-proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require actual current-run controls and hosted source checks
        env:
          CONTROLS: ${{ needs.qualify.result }}
          HOSTED: ${{ needs.hosted-proof.result }}
        run: |
          set -euo pipefail
          test "$CONTROLS" = success
          test "$HOSTED" = success
          echo 'Current-source classifier/workflow controls and hosted requirements passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Both required native matrix contexts reported no native build or tests requested.' >> "$GITHUB_STEP_SUMMARY"
