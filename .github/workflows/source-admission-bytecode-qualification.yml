name: Read retained installed candidate failure
on:
  push:
    branches: [verify/source-admission-bytecode-20260916]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'SaltyPatron/Laplace-Refactor'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Authenticate the exact retained failure and print bounded diagnostic fields
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.error, urllib.parse, urllib.request, zipfile
          API = "https://api.github.com/repos/SaltyPatron/Laplace-Refactor"
          EXPECTED_HEAD = "36964101d350cf05d58fbfe4c770fee9d5c41607"
          EXPECTED_ZIP = "af96d0ded656252c97c189c92cfeb4665dcd955151fe2adb983e23a2eb5bde2f"
          EXPECTED_RESULT = "d76789e3fb4714dcecfebdbfa6a6e7bf4d14ef3eb841fe477ba81d68f1551aca"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def bounded(response, maximum):
              value = response.read(maximum + 1)
              if len(value) > maximum:
                  raise RuntimeError("response exceeds diagnostic bound")
              return value
          def api(path):
              return urllib.request.Request(API + path, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"})
          with opener.open(api("/actions/runs/35141112986"), timeout=30) as response:
              run = json.loads(bounded(response, 1048576))
          if (run["id"] != 35141112986 or run["head_sha"] != EXPECTED_HEAD
                  or run["head_branch"] != "verify/source-admission-bytecode-20260916"
                  or run["status"] != "completed" or run["conclusion"] != "failure"):
              raise RuntimeError("retained run identity or terminal result differs")
          with opener.open(api("/actions/artifacts/10465506726"), timeout=30) as response:
              artifact = json.loads(bounded(response, 1048576))
          if (artifact["id"] != 10465506726 or artifact["expired"]
                  or artifact["name"] != "installed-full-stockfish-source-35141112986-1"
                  or artifact["size_in_bytes"] != 997023
                  or artifact["workflow_run"]["id"] != 35141112986
                  or artifact["workflow_run"]["head_sha"] != EXPECTED_HEAD
                  or artifact.get("digest") != "sha256:" + EXPECTED_ZIP):
              raise RuntimeError("retained artifact identity differs")
          try:
              opener.open(api("/actions/artifacts/10465506726/zip"), timeout=30)
              raise RuntimeError("archive endpoint did not return its expected redirect")
          except urllib.error.HTTPError as error:
              if error.code != 302:
                  raise
              target = error.headers["Location"]
              error.close()
          parsed = urllib.parse.urlparse(target)
          if (parsed.scheme != "https" or parsed.username or parsed.password
                  or not parsed.hostname
                  or not (parsed.hostname.endswith(".blob.core.windows.net")
                          or parsed.hostname.endswith(".actions.githubusercontent.com"))):
              raise RuntimeError("artifact redirect host is not the supported storage owner")
          with opener.open(urllib.request.Request(target), timeout=30) as response:
              raw = bounded(response, 2097152)
          if len(raw) != 997023 or hashlib.sha256(raw).hexdigest() != EXPECTED_ZIP:
              raise RuntimeError("archive digest or length differs")
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              names = [entry.filename for entry in entries]
              if len(entries) != 122 or len(set(names)) != len(names):
                  raise RuntimeError("archive member count or uniqueness differs")
              if sum(entry.file_size for entry in entries) > 67108864:
                  raise RuntimeError("archive expansion exceeds diagnostic bound")
              for entry in entries:
                  path = pathlib.PurePosixPath(entry.filename)
                  if (path.is_absolute() or ".." in path.parts or entry.flag_bits & 1
                          or entry.file_size > 2097152):
                      raise RuntimeError("invalid archive member")
              result_raw = archive.read("corpus/result.json")
              if hashlib.sha256(result_raw).hexdigest() != EXPECTED_RESULT:
                  raise RuntimeError("retained corpus result digest differs")
              result = json.loads(result_raw)
              if (result["status"] != "failed"
                      or result["expected_repository_commit"] != "6347401133605adada0b3ebad06ef0051082e76a"
                      or result["database_mutation_outcome"] != "admission-not-submitted"
                      or result["canonical_corpus_admission_completed"] is not False):
                  raise RuntimeError("retained failure scope differs")
              selected = [entry for entry in result["commands"] if entry["name"] == "grammar-qualification"]
              if len(selected) != 1 or selected[0]["status"] != "failed" or selected[0]["exit_code"] == 0:
                  raise RuntimeError("grammar failure receipt differs")
              projection = {"name": selected[0]["name"], "status": selected[0]["status"],
                            "exit_code": selected[0]["exit_code"]}
              for stream in ("stdout","stderr"):
                  name = "corpus/grammar-qualification." + stream + ".log"
                  entry = archive.getinfo(name)
                  if entry.file_size > 131072:
                      raise RuntimeError("grammar diagnostic exceeds declared bound")
                  raw = archive.read(name)
                  digest = hashlib.sha256(raw).hexdigest()
                  if digest != selected[0][stream+"_sha256"]:
                      raise RuntimeError("grammar stream digest differs")
                  projection[stream+"_sha256"] = digest
                  projection[stream+"_bytes"] = len(raw)
                  projection[stream+"_tail"] = raw.decode("utf-8", errors="replace")[-12000:]
              print(json.dumps({
                  "schema": "laplace.retained-grammar-failure-readback/v1",
                  "run_id": 35141112986, "head_sha": EXPECTED_HEAD,
                  "artifact_id": 10465506726, "archive_sha256": EXPECTED_ZIP,
                  "result_sha256": EXPECTED_RESULT, "grammar_failure": projection,
                  "members": [{"name": x.filename, "bytes": x.file_size} for x in entries
                              if x.filename.startswith("corpus/") and
                              ("qualification" in x.filename or x.filename.endswith("result.json"))],
                  "host_actions": False}, sort_keys=True))
          PY
