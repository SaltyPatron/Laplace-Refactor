name: Read retained installed candidate failure
on:
  push:
    branches: [verify/source-admission-bytecode-20260916]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'SaltyPatron/Laplace-Refactor'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Authenticate the exact retained failure and print bounded diagnostic fields
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.error, urllib.parse, urllib.request, zipfile
          API = "https://api.github.com/repos/SaltyPatron/Laplace-Refactor"
          EXPECTED_HEAD = "772bad57e5e955bbf1e5d6480f309c0e535ac6cf"
          EXPECTED_ZIP = "fa7d6015c5e456267a7623441230392903efb09c671da00bb68e83d6f0fa0450"
          EXPECTED_RESULT = "197c50a8754c4ff3c4397e9b9fff91612ee6ce7bdb7c493224400829e1771a85"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def bounded(response, maximum):
              value = response.read(maximum + 1)
              if len(value) > maximum:
                  raise RuntimeError("response exceeds diagnostic bound")
              return value
          def api(path):
              return urllib.request.Request(API + path, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"})
          with opener.open(api("/actions/runs/35136939684"), timeout=30) as response:
              run = json.loads(bounded(response, 1048576))
          if (run["id"] != 35136939684 or run["head_sha"] != EXPECTED_HEAD
                  or run["head_branch"] != "verify/source-admission-bytecode-20260916"
                  or run["status"] != "completed" or run["conclusion"] != "failure"):
              raise RuntimeError("retained run identity or terminal result differs")
          with opener.open(api("/actions/artifacts/10464006661"), timeout=30) as response:
              artifact = json.loads(bounded(response, 1048576))
          if (artifact["id"] != 10464006661 or artifact["expired"]
                  or artifact["name"] != "installed-native-candidate-compiler-35136939684-1"
                  or artifact["size_in_bytes"] != 55940
                  or artifact["workflow_run"]["id"] != 35136939684
                  or artifact["workflow_run"]["head_sha"] != EXPECTED_HEAD
                  or artifact.get("digest") != "sha256:" + EXPECTED_ZIP):
              raise RuntimeError("retained artifact identity differs")
          try:
              opener.open(api("/actions/artifacts/10464006661/zip"), timeout=30)
              raise RuntimeError("archive endpoint did not return its expected redirect")
          except urllib.error.HTTPError as error:
              if error.code != 302:
                  raise
              target = error.headers["Location"]
              error.close()
          parsed = urllib.parse.urlparse(target)
          if (parsed.scheme != "https" or parsed.username or parsed.password
                  or not parsed.hostname
                  or not (parsed.hostname.endswith(".blob.core.windows.net")
                          or parsed.hostname.endswith(".actions.githubusercontent.com"))):
              raise RuntimeError("artifact redirect host is not the supported storage owner")
          with opener.open(urllib.request.Request(target), timeout=30) as response:
              raw = bounded(response, 2097152)
          if len(raw) != 55940 or hashlib.sha256(raw).hexdigest() != EXPECTED_ZIP:
              raise RuntimeError("archive digest or length differs")
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              names = [entry.filename for entry in entries]
              if len(entries) != 10 or len(set(names)) != len(names):
                  raise RuntimeError("archive member count or uniqueness differs")
              if sum(entry.file_size for entry in entries) > 8388608:
                  raise RuntimeError("archive expansion exceeds diagnostic bound")
              for entry in entries:
                  path = pathlib.PurePosixPath(entry.filename)
                  if (path.is_absolute() or ".." in path.parts or entry.flag_bits & 1
                          or entry.file_size > 2097152):
                      raise RuntimeError("invalid archive member")
              result_raw = archive.read("result.json")
              if hashlib.sha256(result_raw).hexdigest() != EXPECTED_RESULT:
                  raise RuntimeError("retained result digest differs")
              result = json.loads(result_raw)
              if (result["status"] != "failed" or result["active_phase"] != "activation-before"
                      or result["completed_phases"] != ["source-identity"]
                      or result["candidate_commit"] != "614bef1f08963e3d935921dd08bc0c39e6ce5331"
                      or result["installed_package_id"] != "48a00562c1900089593a3333f8a5b0ad90b6f95aafa524a97740d21e490a3198"):
                  raise RuntimeError("retained failure scope differs")
              errors_raw = archive.read("errors.json")
              if len(errors_raw) > 65536:
                  raise RuntimeError("error evidence exceeds bound")
              errors = json.loads(errors_raw)
              if not isinstance(errors.get("errors"), list) or len(errors["errors"]) > 4:
                  raise RuntimeError("error evidence shape differs")
              projection = []
              for entry in errors["errors"]:
                  if set(entry) != {"phase", "type", "message"} or not all(isinstance(x, str) for x in entry.values()):
                      raise RuntimeError("error evidence fields differ")
                  if entry["phase"] != "activation-before" or len(entry["message"]) > 4096:
                      raise RuntimeError("error evidence scope differs")
                  projection.append(entry)
              print(json.dumps({
                  "schema": "laplace.retained-candidate-failure-readback/v1",
                  "run_id": 35136939684, "head_sha": EXPECTED_HEAD,
                  "artifact_id": 10464006661, "archive_sha256": EXPECTED_ZIP,
                  "result_sha256": EXPECTED_RESULT,
                  "errors_sha256": hashlib.sha256(errors_raw).hexdigest(),
                  "errors": projection,
                  "members": [{"name": x.filename, "bytes": x.file_size} for x in entries],
                  "host_actions": False}, sort_keys=True))
          PY
