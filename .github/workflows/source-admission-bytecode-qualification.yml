name: Qualify durable installed package metadata
on:
  push:
    branches: [verify/source-admission-bytecode-20260916]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'SaltyPatron/Laplace-Refactor'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and execute existing metadata lifecycle controls
        shell: bash
        run: |
          python3 -B - <<'PY'
          import ast, hashlib, json, os, pathlib, re, subprocess, time
          root = pathlib.Path.cwd()
          expected = {"tests/product_build_workspace_retention_tests.py":"a40d2c1cb5bf7efcbcf62488609ea781da1b47d0","tests/product_gateway_contract_tests.py":"1a699c3d1ec8116e1ea5afe3506fbb835e1abec4","tests/stockfish_corpus_acceptance_tests.py":"e695f01e6035b8062508a5f15fb8c240de848e09","tools/delivery/product_gateway_live_proof.py":"b17c5ce2a5f4e3e3a62b7dd7e340e5e0f832b0da","tools/product/build_workspace_retention.py":"b4096647685940393d8880fd1e0bdcc6bf900196","tools/sources/stockfish_corpus_acceptance.py":"b00543ad24b0d6e22624c6ed2b4a2adfc8cb910a"}
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "retained-package-metadata-controls"
          output.mkdir()
          observed = {}
          for name, blob in expected.items():
              path = root / name
              raw = path.read_bytes()
              value = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
              if path.is_symlink() or value != blob:
                  raise RuntimeError("qualified candidate source differs: " + name)
              ast.parse(raw, filename=name)
              observed[name] = {"git_blob": blob, "sha256": hashlib.sha256(raw).hexdigest()}
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames",
               "6347401133605adada0b3ebad06ef0051082e76a", "HEAD"], text=True).splitlines()
          if set(changed) != set(expected) | {".github/workflows/source-admission-bytecode-qualification.yml"}:
              raise RuntimeError("cumulative qualification delta differs")
          if subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all"], text=True):
              raise RuntimeError("qualification checkout is dirty")
          report = {"schema": "laplace.retained-package-metadata-controls/v1",
              "head": os.environ["GITHUB_SHA"], "base": "6347401133605adada0b3ebad06ef0051082e76a",
              "source": observed, "status": "running", "suites": [],
              "host_execution": False, "consumer_installed": False}
          result = output / "result.json"
          def save():
              result.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          save()
          for filename, expected_count in (
                  ("product_build_workspace_retention_tests.py", 18),
                  ("stockfish_corpus_acceptance_tests.py", 56),
                  ("product_gateway_contract_tests.py", 20)):
              started = time.monotonic()
              entry = {"suite": filename, "expected_controls": expected_count, "status": "running"}
              report["suites"].append(entry)
              save()
              target = output / (filename + ".log")
              with target.open("xb") as log:
                  try:
                      completed = subprocess.run(["python3", "-B", "tests/" + filename],
                          stdout=log, stderr=subprocess.STDOUT, timeout=180, check=False)
                      entry["exit_code"] = completed.returncode
                  except subprocess.TimeoutExpired:
                      entry["exit_code"] = 124
                      entry["status"] = "timed-out"
              raw = target.read_bytes()
              text = raw.decode("utf-8", errors="replace")
              counts = re.findall(r"^Ran (\d+) tests? in ", text, re.M)
              entry.update({"seconds": time.monotonic() - started,
                  "log_sha256": hashlib.sha256(raw).hexdigest(),
                  "actual_controls": int(counts[-1]) if counts else None})
              if entry["status"] != "timed-out":
                  entry["status"] = ("passed" if entry["exit_code"] == 0
                      and entry["actual_controls"] == expected_count else "failed")
              print(filename + "\n" + text, flush=True)
              save()
          report["status"] = "passed" if all(x["status"] == "passed" for x in report["suites"]) else "failed"
          report["actual_controls"] = sum(x["actual_controls"] or 0 for x in report["suites"])
          save()
          print(json.dumps(report, sort_keys=True), flush=True)
          raise SystemExit(0 if report["status"] == "passed" else 1)
          PY
      - name: Retain actual control output and source identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-package-metadata-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-package-metadata-controls/
          if-no-files-found: error
          retention-days: 30
