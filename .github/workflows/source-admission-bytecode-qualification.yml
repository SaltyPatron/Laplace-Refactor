name: Installed source import bytecode qualification

on:
  push:
    branches: [verify/source-admission-bytecode-20260916]

permissions:
  contents: read

jobs:
  installed-imports:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exercise writable installed imports and exact source acceptance controls
        run: |
          python3 tests/source_admission_guard_tests.py tools/admit_source_guard.py
          python3 tests/stockfish_corpus_acceptance_tests.py
          python3 tests/verified_git_source_tests.py
