name: Observe existing PostgreSQL service authority
on:
  push:
    branches: [verify/source-admission-bytecode-20260916]
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'SaltyPatron/Laplace-Refactor'
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OBSERVATION: ${{ runner.temp }}/postgresql-service-capability-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9dfd692e6a848e015de212b79898fc759a890d1e
          fetch-depth: 0
          persist-credentials: false
      - name: Read only the exact PostgreSQL unit and declared lifecycle authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9dfd692e6a848e015de212b79898fc759a890d1e
          test "$(git diff --name-only --no-renames HEAD "$GITHUB_SHA")" = .github/workflows/source-admission-bytecode-qualification.yml
          test "$(id -un)" = laplace-runner
          umask 077
          mkdir "$OBSERVATION"
          (
          timeout --signal=TERM --kill-after=5s 60s python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          
          UNIT = "laplace-refactor-postgresql.service"
          SOURCE_BLOB = "7c11d67f63396cd49cdce38f5f5e35f812b81238"
          source = Path("packaging/systemd") / UNIT
          installed = Path("/etc/systemd/system") / UNIT
          bootstrap = Path("/opt/laplace/receipts/bootstrap/host.json")
          environment = {"LANG": "C", "LC_ALL": "C", "PATH": "/usr/sbin:/usr/bin:/sbin:/bin"}
          result = {"schema": "laplace.postgresql-service-capability-observation/v1",
                    "lifecycle_mutation_performed": False, "cold_boot_proven": False, "uid": os.geteuid(),
                    "source_blob": SOURCE_BLOB}
          stage = "source"
          
          def read_regular(path, maximum):
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or info.st_size > maximum:
                  raise ValueError("not a bounded physical regular file")
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  opened = os.fstat(descriptor)
                  if (info.st_dev, info.st_ino) != (opened.st_dev, opened.st_ino):
                      raise ValueError("file identity changed")
                  data = os.read(descriptor, maximum + 1)
                  after = os.fstat(descriptor)
                  if (opened.st_size, opened.st_mtime_ns, opened.st_ctime_ns) != (
                          after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                      raise ValueError("file changed during observation")
                  if len(data) != opened.st_size or len(data) > maximum:
                      raise ValueError("file length changed or exceeds bound")
                  return data, {"uid": opened.st_uid, "gid": opened.st_gid,
                                "mode": format(stat.S_IMODE(opened.st_mode), "04o"),
                                "size": len(data), "sha256": hashlib.sha256(data).hexdigest()}
              finally:
                  os.close(descriptor)
          
          def command(arguments):
              value = subprocess.run(arguments, cwd="/", env=environment, timeout=8,
                                     capture_output=True, check=False)
              if len(value.stdout) > 16384 or len(value.stderr) > 16384:
                  raise ValueError("command output exceeds bound")
              return value
          
          try:
              source_bytes, source_identity = read_regular(source, 65536)
              framed = b"blob " + str(len(source_bytes)).encode("ascii") + b"\0" + source_bytes
              if hashlib.sha1(framed).hexdigest() != SOURCE_BLOB:
                  raise ValueError("source unit differs from pinned blob")
              result["source"] = source_identity
              stage = "installed-unit"
              try:
                  unit_bytes, unit_identity = read_regular(installed, 65536)
                  result["installed_unit"] = {**unit_identity, "present": True,
                      "matches_source": unit_bytes == source_bytes,
                      "root_owned_mode_0644": unit_identity["uid"] == 0 and
                          unit_identity["gid"] == 0 and unit_identity["mode"] == "0644"}
              except FileNotFoundError:
                  result["installed_unit"] = {"present": False}
              stage = "system-manager"
              fields = ("LoadState", "ActiveState", "SubState", "UnitFileState", "FragmentPath",
                        "NeedDaemonReload", "User", "Group", "MainPID", "ControlGroup", "DropInPaths")
              shown = command(["/usr/bin/systemctl", "show", UNIT, "--no-pager",
                               "--property=" + ",".join(fields)])
              values = dict(line.split("=", 1) for line in shown.stdout.decode("utf-8", "strict").splitlines()
                            if "=" in line)
              if any(key not in fields or len(value) > 2048 for key, value in values.items()):
                  raise ValueError("unexpected or oversized manager property")
              result["system_unit"] = {"exit_code": shown.returncode, "properties": values}
              enabled = command(["/usr/bin/systemctl", "is-enabled", "--quiet", UNIT])
              result["is_enabled"] = {"exit_code": enabled.returncode, "enabled": enabled.returncode == 0}
              stage = "fixed-sudo-authority"
              result["fixed_sudo_authority"] = {}
              for action in ("start", "stop", "restart"):
                  checked = command(["/usr/bin/sudo", "-n", "-l", "/usr/bin/systemctl", action, UNIT])
                  result["fixed_sudo_authority"][action] = {
                      "exit_code": checked.returncode, "permitted": checked.returncode == 0}
              stage = "historical-bootstrap"
              try:
                  data, identity = read_regular(bootstrap, 65536)
                  value = json.loads(data)
                  if not isinstance(value, dict):
                      raise ValueError("bootstrap is not an object")
                  envelope = value.get("service_envelope", {})
                  principal = value.get("service_identity", {})
                  policy = value.get("sudo_policy", {})
                  if not all(isinstance(item, dict) for item in (envelope, principal, policy)):
                      raise ValueError("bootstrap public sections differ")
                  def public(section, names):
                      selected = {name: section[name] for name in names if name in section}
                      if any(not isinstance(item, (str, int, bool, type(None))) or
                             isinstance(item, str) and len(item) > 512 for item in selected.values()):
                          raise ValueError("bootstrap public scalar differs")
                      return selected
                  result["historical_bootstrap"] = {
                      "present": True, "file": identity,
                      "identity": public(value, ("schema", "phase", "recovered_from_live_envelope",
                                                 "recovered_repository_commit")),
                      "service_identity": public(principal, ("user", "group", "uid", "gid")),
                      "service_envelope": public(envelope, ("path", "sha256", "enabled", "started_by_bootstrap")),
                      "sudo_policy": public(policy, ("path", "sha256", "expected_sha256", "verification",
                                                     "service", "systemctl"))}
              except FileNotFoundError:
                  result["historical_bootstrap"] = {"present": False}
              result["postmaster_process"] = {
                  "observed": False,
                  "reason": "Use the enclosing operator's authenticated activation observation; no new database query."}
              result["status"] = "observed"
          except Exception as error:
              result.update(status="failed", failed_stage=stage, error_type=type(error).__name__)
              print(json.dumps(result, sort_keys=True))
              raise SystemExit(1)
          print(json.dumps(result, sort_keys=True))
          PY
          ) | tee "$OBSERVATION/result.json"
      - name: Retain actual observed authority or bounded failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-service-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OBSERVATION }}/
          if-no-files-found: error
          retention-days: 30
