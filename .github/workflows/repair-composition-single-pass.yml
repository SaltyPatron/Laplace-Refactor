name: Repair composition single pass

on:
  push:
    branches:
      - repair/common-composition-single-pass
    paths:
      - tools/apply_composition_single_pass_repair.py
      - .github/workflows/repair-composition-single-pass.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/common-composition-single-pass
      - name: Apply exact repair
        run: python3 tools/apply_composition_single_pass_repair.py
      - name: Validate patch shape
        run: |
          git diff --check
          git diff --exit-code -- tools/apply_composition_single_pass_repair.py .github/workflows/repair-composition-single-pass.yml
          git diff -- engine/src/composition.cpp engine/include/laplace/composition.h tests/composition_resource_accounting_tests.cpp tests/composition_occurrence.cmake contracts/composition.json
      - name: Commit repaired engine
        run: |
          git config user.name "laplace-ci"
          git config user.email "laplace-ci@users.noreply.github.com"
          git add engine/src/composition.cpp engine/include/laplace/composition.h tests/composition_resource_accounting_tests.cpp tests/composition_occurrence.cmake contracts/composition.json
          git commit -m "fix(composition): eliminate semantic preflight replay"
          git push origin HEAD:repair/common-composition-single-pass
