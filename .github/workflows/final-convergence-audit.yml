name: branch-consolidation

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/final-convergence-audit.yml
      - .github/scripts/consolidate-branches.py
      - .github/branch-resolutions.json

permissions:
  contents: read

concurrency:
  group: branch-estate-audit
  cancel-in-progress: false

jobs:
  branch-estate:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve original histories and reconcile exact branch tips
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/consolidate-branches.py
      - name: Retain full recovery bundle and unresolved implementation diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-consolidation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/branch-consolidation/
          if-no-files-found: error
          retention-days: 90
