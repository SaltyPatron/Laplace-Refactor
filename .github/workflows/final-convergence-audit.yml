name: branch-estate-audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-estate-audit
  cancel-in-progress: false

jobs:
  branch-estate:
    runs-on: [self-hosted, Linux, X64, laplace-refactor]
    timeout-minutes: 45
    env:
      TMPDIR: /build/laplace/work/refactor-scratch
      TMP: /build/laplace/work/refactor-scratch
      TEMP: /build/laplace/work/refactor-scratch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Allocate permanent audit workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          mountpoint -q /build
          test -d "$TMPDIR" && test -w "$TMPDIR"
          audit_root=$(mktemp -d "$TMPDIR/branch-audit.XXXXXXXX")
          printf 'AUDIT_ROOT=%s\n' "$audit_root" >> "$GITHUB_ENV"
      - name: Fetch actual branch state
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git clone --no-checkout https://github.com/SaltyPatron/Laplace.git "$AUDIT_ROOT/Laplace"
          git -C "$AUDIT_ROOT/Laplace" fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Inventory branches against their actual main
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/branch_estate_live_audit.py \
            "Laplace-Refactor=$GITHUB_WORKSPACE" \
            "Laplace=$AUDIT_ROOT/Laplace" \
            --output "$AUDIT_ROOT/branch-estate-live.raw.json"
          python3 tools/branch_estate_candidate_subsume.py \
            --ledger "$AUDIT_ROOT/branch-estate-live.raw.json" \
            --output "$AUDIT_ROOT/branch-estate-live.json" \
            --repository "Laplace-Refactor=$GITHUB_WORKSPACE" \
            --repository "Laplace=$AUDIT_ROOT/Laplace"
          printf 'Branch inventory retained at `%s`. Unresolved candidates require code review; this report does not certify delivery.\n' \
            "$AUDIT_ROOT/branch-estate-live.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: branch-estate-live
          path: ${{ env.AUDIT_ROOT }}/branch-estate-live.json
          if-no-files-found: error
