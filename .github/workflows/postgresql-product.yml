name: postgresql-product

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: laplace-physical-product-proof
  cancel-in-progress: false

jobs:
  postgresql-product:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - oneapi
      - postgres-18
      - avx2
    timeout-minutes: 240
    env:
      LAPLACE_SOURCE_ESTATE_ROOT: /vault/Data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify PostgreSQL-product proof authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test -x /usr/bin/bwrap
          test -w "$RUNNER_TEMP"
          test -w /build/laplace
          git diff --quiet
          git diff --cached --quiet
          publication=$(jq -er '.product_activation_projection.postgresql_publication.receipt' state/continuation.json)
          expected_sha=$(jq -er '.product_activation_projection.postgresql_publication.receipt_sha256' state/continuation.json)
          test -f "$publication"
          test ! -L "$publication"
          test "$(sha256sum "$publication" | awk '{print $1}')" = "$expected_sha"
          python3 tools/delivery/postgresql_package_publication.py verify \
            --receipt "$publication" >/dev/null
          printf 'LAPLACE_POSTGRESQL_PUBLICATION=%s\n' "$publication" >> "$GITHUB_ENV"
      - name: Prove exact current-change PostgreSQL 18.6 package runtime
        shell: bash
        run: |
          set -euo pipefail
          work_root="$RUNNER_TEMP/laplace-postgresql-product-proof"
          result="$RUNNER_TEMP/laplace-postgresql-product-proof.json"
          python3 tools/postgresql/prove-product.py \
            --repository . \
            --postgresql-publication "$LAPLACE_POSTGRESQL_PUBLICATION" \
            --work-root "$work_root" \
            --output "$result"
          expected_tree=$(git rev-parse 'HEAD^{tree}')
          jq -e \
            --arg source_commit "$GITHUB_SHA" \
            --arg source_tree "$expected_tree" '
            .schema == "laplace.postgresql-product-proof/v1" and
            .phase == "exact-postgresql-18.6-package-runtime-retained" and
            .repository_commit == $source_commit and
            .repository_tree == $source_tree and
            .postgresql_version == "18.6" and
            .product_activated == false and
            .laplace_schema_present == true and
            .active_epoch_count == 0 and
            .loaded_object_count == .required_loaded_object_count and
            .loaded_object_count > 0 and
            .forbidden_loader_environment_absent == true and
            .hba_trust_absent == true and
            (.package_id | test("^[0-9a-f]{64}$")) and
            (.package_proof_binding_blake3 | test("^[0-9a-f]{64}$")) and
            (.runtime_receipt_blake3 | test("^[0-9a-f]{64}$")) and
            (.binding_receipt_blake3 | test("^[0-9a-f]{64}$"))
          ' "$result" >/dev/null
          {
            echo '## Exact PostgreSQL-product proof'
            echo 'This is an isolated current-change package runtime proof, not product activation.'
            echo '```json'
            cat "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
