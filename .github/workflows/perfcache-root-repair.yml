name: perfcache-root-repair-validation
on:
  push:
    branches: [fix/product-perfcache-root]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply source repair and execute regression gates
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/product-perfcache-root
          git merge-base --is-ancestor 403c0cc70225a6d8dd7af73dbb8247e5055bf6eb HEAD
          if test -f tools/delivery/_apply_perfcache_root_repair.py; then
            python3 tools/delivery/_apply_perfcache_root_repair.py
            python3 tests/postgresql_perfcache_configuration_tests.py
            python3 tests/postgresql_cluster_tests.py
            python3 tests/unicode_product_activation_tests.py
            ./tools/tests/verify-requirements.sh
            git diff --check
            rm tools/delivery/_apply_perfcache_root_repair.py
            git add tools/postgresql/cluster_core.py tools/postgresql/clusterctl.py tools/postgresql/unicodectl.py tests/postgresql_perfcache_configuration_tests.py tests/unicode_product_activation_tests.py tools/tests/verify-requirements.sh tools/delivery/_apply_perfcache_root_repair.py
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bind persistent perfcache root and preserve historical configuration replay'
            git push origin HEAD:refs/heads/fix/product-perfcache-root
          fi
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/perfcache-root-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perfcache-root-tested-source
          path: ${{ runner.temp }}/perfcache-root-source.tar.gz
          if-no-files-found: error
          retention-days: 7
