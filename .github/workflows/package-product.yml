name: package-product

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: laplace-physical-product-proof
  queue: max
  cancel-in-progress: false

jobs:
  package-product:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - oneapi
      - postgres-18
      - avx2
    timeout-minutes: 180
    env:
      LAPLACE_SOURCE_ESTATE_ROOT: /vault/Data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Sweep stale interrupted package-product residue
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/delivery/proof_workspace_cleanup.py \
            --runner-temp "$RUNNER_TEMP" \
            --minimum-age-seconds 300 \
            --name laplace-package-product-proof
      - name: Verify package-proof authority and exact PostgreSQL publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test -w "$RUNNER_TEMP"
          test -w /build/laplace
          git diff --quiet
          git diff --cached --quiet
          test "$(jq -er '.schema' state/product-publication-selection.json)" = \
            laplace.product-publication-selection/v1
          publication=$(jq -er '.postgresql_publication.receipt' state/product-publication-selection.json)
          expected_sha=$(jq -er '.postgresql_publication.receipt_sha256' state/product-publication-selection.json)
          test -f "$publication"
          test ! -L "$publication"
          test "$(sha256sum "$publication" | awk '{print $1}')" = "$expected_sha"
          python3 tools/delivery/postgresql_package_publication.py verify \
            --receipt "$publication" >/dev/null
          printf 'LAPLACE_POSTGRESQL_PUBLICATION=%s\n' "$publication" >> "$GITHUB_ENV"
      - name: Reclaim obsolete persistent product build generations
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/product_build_workspace_retention_tests.py

          plan="$RUNNER_TEMP/laplace-product-current-plan.json"
          python3 tools/product/build-package.py \
            --repository . \
            plan \
            --postgresql-publication "$LAPLACE_POSTGRESQL_PUBLICATION" > "$plan"
          current_plan=$(jq -er '.plan_id' "$plan")
          test "$current_plan" = "$(jq -er '.plan_id' "$plan")"
          test "${#current_plan}" -eq 64

          build_root=$(jq -er '.build.root' contracts/product-package.json)
          stage_root=$(jq -er '.build.stage_root' contracts/product-package.json)
          retention="$RUNNER_TEMP/laplace-product-build-retention.json"
          if [[ ! -e "$build_root" && ! -L "$build_root" && ! -e "$stage_root" && ! -L "$stage_root" ]]; then
            {
              echo '## Product build retention'
              echo '- fresh host: no persistent build/stage generations exist yet'
              echo "- selected plan: \`$current_plan\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            test -d "$build_root"
            test ! -L "$build_root"
            test -d "$stage_root"
            test ! -L "$stage_root"
            python3 tools/product/build_workspace_retention.py \
              --contract contracts/product-package.json \
              --retention-root /build/laplace/runner/product/retention \
              --preserve-plan "$current_plan" \
              --minimum-age-seconds 300 \
              --output "$retention"
            jq -e \
              --arg plan "$current_plan" '
                .schema == "laplace.product-build-workspace-retention/v1" and
                .retention_root == "/build/laplace/runner/product/retention" and
                (.preserved_plan_ids | index($plan)) != null and
                (.allocated_bytes_reclaimed | type) == "number"
              ' "$retention" >/dev/null
            reclaimed=$(jq -r '.allocated_bytes_reclaimed' "$retention")
            removed=$(jq -r '.removed | length' "$retention")
            preserved=$(jq -r '.preserved | length' "$retention")
            {
              echo '## Product build retention'
              echo "- selected plan: \`$current_plan\`"
              echo "- obsolete generations reclaimed: $removed"
              echo "- generations preserved: $preserved"
              echo "- allocated bytes reclaimed: $reclaimed"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prove package-product verifier mutation controls
        run: python3 tests/package_product_proof_tests.py
      - name: Compose install replay and durably retain exact package receipts
        shell: bash
        run: |
          set -euo pipefail
          work_root="$RUNNER_TEMP/laplace-package-product-proof"
          result="$RUNNER_TEMP/laplace-package-product-proof.json"
          python3 tools/product/prove-package.py \
            --repository . \
            --postgresql-publication "$LAPLACE_POSTGRESQL_PUBLICATION" \
            --work-root "$work_root" \
            --output "$result"
          expected_tree=$(git rev-parse 'HEAD^{tree}')
          jq -e \
            --arg source_commit "$GITHUB_SHA" \
            --arg source_tree "$expected_tree" '
            .schema == "laplace.package-product-proof/v1" and
            .phase == "composed-installed-retained" and
            .repository_commit == $source_commit and
            .repository_tree == $source_tree and
            .source_package_verified == true and
            .installed_package_verified == true and
            .installation_replay_identical == true and
            (.package_id | test("^[0-9a-f]{64}$")) and
            (.package_receipt_blake3 | test("^[0-9a-f]{64}$")) and
            (.installation_receipt_blake3 | test("^[0-9a-f]{64}$")) and
            (.binding_receipt_blake3 | test("^[0-9a-f]{64}$"))
          ' "$result" >/dev/null
          {
            echo '## Exact package-product proof'
            echo '```json'
            cat "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'LAPLACE_PRODUCT_PROOF_RESULT=%s\n' "$result" >> "$GITHUB_ENV"

      - name: Query persistent Laplace substrate with branch-built command
        shell: bash
        run: |
          set -euo pipefail
          product_receipt=$(jq -er '.product_receipt' "$LAPLACE_PRODUCT_PROOF_RESULT")
          physical_release=$(jq -er '.physical_root' "$product_receipt")
          inspect="$physical_release/bin/laplace-inspect"
          pg_ctl="$physical_release/pgsql-18/bin/pg_ctl"
          pg_isready="$physical_release/pgsql-18/bin/pg_isready"
          data_directory=$(jq -er '.instance.data_directory' contracts/postgresql-cluster.json)
          socket_directory=$(jq -er '.instance.socket_directory' contracts/postgresql-cluster.json)
          port=$(jq -er '.instance.port' contracts/postgresql-cluster.json)
          database=$(jq -er '.instance.database' contracts/postgresql-cluster.json)
          admin_role=$(jq -er '.instance.admin_role' contracts/postgresql-cluster.json)
          config_file=/etc/laplace/instances/refactor/postgresql.conf
          test -x "$inspect"
          test -x "$pg_ctl"
          test -x "$pg_isready"
          test -d "$data_directory"
          test -f "$config_file"

          started_database=0
          if ! "$pg_isready" \
            --host "$socket_directory" \
            --port "$port" \
            --dbname "$database" \
            --username "$admin_role" >/dev/null 2>&1; then
            OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 MKL_DYNAMIC=FALSE \
              "$pg_ctl" \
                -D "$data_directory" \
                -o "-c config_file=$config_file" \
                -w \
                -t 180 \
                start
            started_database=1
          fi
          printf 'LAPLACE_PACKAGE_PRODUCT_STARTED_DATABASE=%s\n' "$started_database" >> "$GITHUB_ENV"

          ready=0
          for _attempt in $(seq 1 30); do
            if "$pg_isready" \
              --host "$socket_directory" \
              --port "$port" \
              --dbname "$database" \
              --username "$admin_role" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            "$pg_ctl" -D "$data_directory" status || true
            echo 'branch-built PostgreSQL package did not make the persistent substrate ready' >&2
            exit 1
          fi

          summary="$RUNNER_TEMP/laplace-live-summary.json"
          entities="$RUNNER_TEMP/laplace-live-entities.json"
          physicalities="$RUNNER_TEMP/laplace-live-physicalities.json"
          attestations="$RUNNER_TEMP/laplace-live-attestations.json"
          profiles="$RUNNER_TEMP/laplace-live-source-profiles.json"

          "$inspect" --pretty summary > "$summary"
          "$inspect" --pretty entities --limit 5 > "$entities"
          "$inspect" --pretty physicalities --limit 5 > "$physicalities"
          "$inspect" --pretty attestations --limit 5 > "$attestations"
          "$inspect" --pretty source-profiles --limit 5 > "$profiles"

          jq -e '
            .schema == "laplace.inspect.summary/v1" and
            .database == "laplace_refactor" and
            .role == "laplace_admin" and
            (.counts.entities | tonumber) > 0 and
            (.counts.physicalities | tonumber) > 0 and
            (.counts.attestations | tonumber) > 0 and
            .unicode.active_present == true and
            .highway.active_present == true
          ' "$summary" >/dev/null
          jq -e '.schema == "laplace.inspect.entities/v1" and (.rows | length) > 0' "$entities" >/dev/null
          jq -e '.schema == "laplace.inspect.physicalities/v1" and (.rows | length) > 0' "$physicalities" >/dev/null
          jq -e '.schema == "laplace.inspect.attestations/v1" and (.rows | length) > 0' "$attestations" >/dev/null
          jq -e '.schema == "laplace.inspect.source-profiles/v1"' "$profiles" >/dev/null

          {
            echo '## Live persisted Laplace substrate'
            echo 'Branch-built PostgreSQL and `laplace-inspect` queried the persistent PostgreSQL product data without publishing an activation pointer.'
            echo '### Summary'
            echo '```json'
            cat "$summary"
            echo '```'
            echo '### Entity rows'
            echo '```json'
            cat "$entities"
            echo '```'
            echo '### Physicality rows'
            echo '```json'
            cat "$physicalities"
            echo '```'
            echo '### Attestation rows'
            echo '```json'
            cat "$attestations"
            echo '```'
            echo '### Source-profile rows before admission'
            echo '```json'
            cat "$profiles"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Admit real ISO 639 source through branch-built product command
        shell: bash
        run: |
          set -euo pipefail
          product_receipt=$(jq -er '.product_receipt' "$LAPLACE_PRODUCT_PROOF_RESULT")
          physical_release=$(jq -er '.physical_root' "$product_receipt")
          admit="$physical_release/bin/laplace-admit-source"
          inspect="$physical_release/bin/laplace-inspect"
          test -x "$admit"
          test -x "$physical_release/bin/laplace_source_profile_compile"
          test -x "$inspect"
          test -d "$LAPLACE_SOURCE_ESTATE_ROOT/ISO639"
          test -d "$LAPLACE_SOURCE_ESTATE_ROOT/UCD/Public/UCD/latest"

          admission="$RUNNER_TEMP/laplace-iso639-admission.json"
          profiles="$RUNNER_TEMP/laplace-source-profiles-after-admission.json"
          "$admit" \
            iso-639-3-20260415 \
            "$LAPLACE_SOURCE_ESTATE_ROOT/ISO639" \
            --unicode-root "$LAPLACE_SOURCE_ESTATE_ROOT/UCD/Public/UCD/latest" \
            --tool-root "$physical_release" \
            --pretty > "$admission"
          "$inspect" --pretty source-profiles --limit 10 > "$profiles"

          jq -e '
            .schema == "laplace.admit-source/v1" and
            .profile == "iso-639-3-20260415" and
            (.native_source_fingerprint | test("^[0-9a-f]{64}$")) and
            (.native_reconstruction_fingerprint | test("^[0-9a-f]{64}$")) and
            (.admission.profile_id | test("^\\\\x[0-9a-f]{64}$")) and
            (.admission.source_profile_receipt_id | test("^\\\\x[0-9a-f]{64}$")) and
            .persisted_profile != null and
            (.entity_count | tonumber) > 0 and
            (.physicality_count | tonumber) > 0 and
            (.attestation_count | tonumber) > 0
          ' "$admission" >/dev/null
          jq -e '
            .schema == "laplace.inspect.source-profiles/v1" and
            (.rows | length) > 0
          ' "$profiles" >/dev/null

          {
            echo '## Real ISO 639 admission into persistent Laplace substrate'
            echo '```json'
            cat "$admission"
            echo '```'
            echo '### Persisted source-profile readback'
            echo '```json'
            cat "$profiles"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compose and verify the standalone customer installer
        shell: bash
        run: |
          set -euo pipefail
          product_receipt=$(jq -er '.product_receipt' "$LAPLACE_PRODUCT_PROOF_RESULT")
          product_build_directory=$(dirname "$product_receipt")
          cmake_build_directory="$product_build_directory/laplace"
          installer_root=/build/laplace/runner/product/installers

          # Reconfigure from the exact package bytes proved above, never from an
          # ambient host PostgreSQL. pg_config reports the package's logical
          # /opt/laplace/releases/<id> paths, so provide the corresponding staged
          # physical root exactly as build-package.py does during composition.
          package_manifest=$(jq -er '.manifest' "$product_receipt")
          logical_release=$(jq -er '.root' "$package_manifest")
          physical_release=$(jq -er '.physical_root' "$product_receipt")
          case "$physical_release" in
            *"$logical_release") pg_physical_root="${physical_release%"$logical_release"}" ;;
            *) echo 'product physical root does not end in its logical release root' >&2; exit 1 ;;
          esac
          pg_config="$physical_release/pgsql-18/bin/pg_config"
          test -x "$pg_config"
          test "$($pg_config --version | awk '{print $2}' | cut -d. -f1)" = 18

          cmake -S . -B "$cmake_build_directory" \
            -DLAPLACE_PRODUCT_RECEIPT="$product_receipt" \
            -DLAPLACE_INSTALLER_OUTPUT_DIRECTORY="$installer_root" \
            -DLAPLACE_PG_CONFIG="$pg_config" \
            -DLAPLACE_PG_PHYSICAL_ROOT="$pg_physical_root"
          cmake --build "$cmake_build_directory" --target laplace_product_installer
          package_id=$(jq -er '.package_id' "$product_receipt")
          installer_selection="$cmake_build_directory/laplace-product-installer-selection.json"
          test -f "$installer_selection"
          installer_id=$(jq -er '.bundle_id' "$installer_selection")
          installer_manifest="$installer_root/laplace-installer-$installer_id/installer-manifest.json"
          test -f "$installer_manifest"
          python3 tools/delivery/product_distribution.py verify \
            --manifest "$installer_manifest" >/dev/null
          installer_directory=$(dirname "$installer_manifest")
          installer_archive=$(jq -er '.archive' "$installer_selection")
          test "$(jq -er '.archive_sha256' "$installer_selection")" = \
            "$(sha256sum "$installer_archive" | awk '{print $1}')"
          installer_archive_sha256=$(jq -er '.checksum' "$installer_selection")
          printf 'LAPLACE_PRODUCT_INSTALLER_ARCHIVE=%s\n' "$installer_archive" >> "$GITHUB_ENV"
          printf 'LAPLACE_PRODUCT_INSTALLER_ARCHIVE_SHA256=%s\n' "$installer_archive_sha256" >> "$GITHUB_ENV"
          {
            echo '## Standalone customer installer'
            echo '```json'
            jq '{schema, bundle_id, package: {id: .package.id}, sources: {unicode: {id: .sources.unicode.id, version: .sources.unicode.version}}}' "$installer_manifest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the verified standalone customer installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: laplace-product-installer-${{ github.sha }}
          path: |
            ${{ env.LAPLACE_PRODUCT_INSTALLER_ARCHIVE }}
            ${{ env.LAPLACE_PRODUCT_INSTALLER_ARCHIVE_SHA256 }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Clean disposable package-product workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LAPLACE_PACKAGE_PRODUCT_STARTED_DATABASE:-0}" == 1 && -n "${LAPLACE_PRODUCT_PROOF_RESULT:-}" ]]; then
            product_receipt=$(jq -er '.product_receipt' "$LAPLACE_PRODUCT_PROOF_RESULT")
            physical_release=$(jq -er '.physical_root' "$product_receipt")
            pg_ctl="$physical_release/pgsql-18/bin/pg_ctl"
            data_directory=$(jq -er '.instance.data_directory' contracts/postgresql-cluster.json)
            if "$pg_ctl" -D "$data_directory" status >/dev/null 2>&1; then
              "$pg_ctl" -D "$data_directory" -w -t 120 stop -m fast
            fi
          fi
          python3 tools/delivery/proof_workspace_cleanup.py \
            --runner-temp "$RUNNER_TEMP" \
            --name laplace-package-product-proof