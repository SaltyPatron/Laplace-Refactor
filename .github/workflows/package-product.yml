name: package-product

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: laplace-physical-product-proof
  cancel-in-progress: false

jobs:
  package-product:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - laplace-refactor
      - oneapi
      - postgres-18
      - avx2
    timeout-minutes: 180
    env:
      LAPLACE_SOURCE_ESTATE_ROOT: /vault/Data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Sweep stale interrupted package-product residue
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/delivery/proof_workspace_cleanup.py \
            --runner-temp "$RUNNER_TEMP" \
            --minimum-age-seconds 300 \
            --name laplace-package-product-proof
      - name: Verify package-proof authority and exact PostgreSQL publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = laplace-runner
          test -w "$RUNNER_TEMP"
          test -w /build/laplace
          git diff --quiet
          git diff --cached --quiet
          test "$(jq -er '.schema' state/product-publication-selection.json)" = \
            laplace.product-publication-selection/v1
          publication=$(jq -er '.postgresql_publication.receipt' state/product-publication-selection.json)
          expected_sha=$(jq -er '.postgresql_publication.receipt_sha256' state/product-publication-selection.json)
          test -f "$publication"
          test ! -L "$publication"
          test "$(sha256sum "$publication" | awk '{print $1}')" = "$expected_sha"
          python3 tools/delivery/postgresql_package_publication.py verify \
            --receipt "$publication" >/dev/null
          printf 'LAPLACE_POSTGRESQL_PUBLICATION=%s\n' "$publication" >> "$GITHUB_ENV"
      - name: Prove package-product verifier mutation controls
        run: python3 tests/package_product_proof_tests.py
      - name: Compose install replay and durably retain exact package receipts
        shell: bash
        run: |
          set -euo pipefail
          work_root="$RUNNER_TEMP/laplace-package-product-proof"
          result="$RUNNER_TEMP/laplace-package-product-proof.json"
          python3 tools/product/prove-package.py \
            --repository . \
            --postgresql-publication "$LAPLACE_POSTGRESQL_PUBLICATION" \
            --work-root "$work_root" \
            --output "$result"
          expected_tree=$(git rev-parse 'HEAD^{tree}')
          jq -e \
            --arg source_commit "$GITHUB_SHA" \
            --arg source_tree "$expected_tree" '
            .schema == "laplace.package-product-proof/v1" and
            .phase == "composed-installed-retained" and
            .repository_commit == $source_commit and
            .repository_tree == $source_tree and
            .source_package_verified == true and
            .installed_package_verified == true and
            .installation_replay_identical == true and
            (.package_id | test("^[0-9a-f]{64}$")) and
            (.package_receipt_blake3 | test("^[0-9a-f]{64}$")) and
            (.installation_receipt_blake3 | test("^[0-9a-f]{64}$")) and
            (.binding_receipt_blake3 | test("^[0-9a-f]{64}$"))
          ' "$result" >/dev/null
          {
            echo '## Exact package-product proof'
            echo '```json'
            cat "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'LAPLACE_PRODUCT_PROOF_RESULT=%s\n' "$result" >> "$GITHUB_ENV"
      - name: Compose and verify the standalone customer installer
        shell: bash
        run: |
          set -euo pipefail
          product_receipt=$(jq -er '.product_receipt' "$LAPLACE_PRODUCT_PROOF_RESULT")
          product_build_directory=$(dirname "$product_receipt")
          cmake_build_directory="$product_build_directory/laplace"
          installer_root=/build/laplace/runner/product/installers

          # Reconfigure from the exact package bytes proved above, never from an
          # ambient host PostgreSQL. pg_config reports the package's logical
          # /opt/laplace/releases/<id> paths, so provide the corresponding staged
          # physical root exactly as build-package.py does during composition.
          package_manifest=$(jq -er '.manifest' "$product_receipt")
          logical_release=$(jq -er '.root' "$package_manifest")
          physical_release=$(jq -er '.physical_root' "$product_receipt")
          case "$physical_release" in
            *"$logical_release") pg_physical_root="${physical_release%"$logical_release"}" ;;
            *) echo 'product physical root does not end in its logical release root' >&2; exit 1 ;;
          esac
          pg_config="$physical_release/pgsql-18/bin/pg_config"
          test -x "$pg_config"
          test "$($pg_config --version | awk '{print $2}' | cut -d. -f1)" = 18

          cmake -S . -B "$cmake_build_directory" \
            -DLAPLACE_PRODUCT_RECEIPT="$product_receipt" \
            -DLAPLACE_INSTALLER_OUTPUT_DIRECTORY="$installer_root" \
            -DLAPLACE_PG_CONFIG="$pg_config" \
            -DLAPLACE_PG_PHYSICAL_ROOT="$pg_physical_root"
          cmake --build "$cmake_build_directory" --target laplace_product_installer
          package_id=$(jq -er '.package_id' "$product_receipt")
          installer_selection="$cmake_build_directory/laplace-product-installer-selection.json"
          test -f "$installer_selection"
          installer_id=$(jq -er '.bundle_id' "$installer_selection")
          installer_manifest="$installer_root/laplace-installer-$installer_id/installer-manifest.json"
          test -f "$installer_manifest"
          python3 tools/delivery/product_distribution.py verify \
            --manifest "$installer_manifest" >/dev/null
          installer_directory=$(dirname "$installer_manifest")
          installer_archive=$(jq -er '.archive' "$installer_selection")
          test "$(jq -er '.archive_sha256' "$installer_selection")" = \
            "$(sha256sum "$installer_archive" | awk '{print $1}')"
          installer_archive_sha256=$(jq -er '.checksum' "$installer_selection")
          printf 'LAPLACE_PRODUCT_INSTALLER_ARCHIVE=%s\n' "$installer_archive" >> "$GITHUB_ENV"
          printf 'LAPLACE_PRODUCT_INSTALLER_ARCHIVE_SHA256=%s\n' "$installer_archive_sha256" >> "$GITHUB_ENV"
          {
            echo '## Standalone customer installer'
            echo '```json'
            jq '{schema, bundle_id, package: {id: .package.id}, sources: {unicode: {id: .sources.unicode.id, version: .sources.unicode.version}}}' "$installer_manifest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the verified standalone customer installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: laplace-product-installer-${{ github.sha }}
          path: |
            ${{ env.LAPLACE_PRODUCT_INSTALLER_ARCHIVE }}
            ${{ env.LAPLACE_PRODUCT_INSTALLER_ARCHIVE_SHA256 }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Clean disposable package-product workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/delivery/proof_workspace_cleanup.py \
            --runner-temp "$RUNNER_TEMP" \
            --name laplace-package-product-proof
