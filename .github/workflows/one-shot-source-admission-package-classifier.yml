name: one-shot-source-admission-package-classifier

on:
  push:
    branches:
      - repair/source-admission-live-generation-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repair/source-admission-live-generation-20260912
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/product_path_tests.py')
          text = path.read_text(encoding='utf-8')
          marker = '''    def test_package_proof_control_plane_requires_its_own_physical_proof(self) -> None:\n'''
          block = '''    def test_source_admission_runtime_requires_package_product(self) -> None:\n        for path in ("tools/admit_source.py", "tools/admit_source_guard.py"):\n            with self.subTest(path=path):\n                result = self.classify(path)\n                self.assertIn("package", result["classes"])\n                self.assertTrue(result["requires_package_product"])\n                self.assertIn("package-product", result["required_evidence"])\n                self.assertFalse(result["blocked"])\n\n'''
          if 'def test_source_admission_runtime_requires_package_product' not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f'classifier insertion anchor count={text.count(marker)}')
              text = text.replace(marker, block + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 tests/product_path_tests.py
          git diff --check
          git config user.name laplace-ci
          git config user.email laplace-ci@users.noreply.github.com
          git add tests/product_path_tests.py
          git commit -m 'Prove source admission changes require package product'
          git push origin HEAD:repair/source-admission-live-generation-20260912
