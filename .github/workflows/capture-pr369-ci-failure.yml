name: capture-pr369-ci-failure

on:
  push:
    branches:
      - complete/typed-standing-query-20260913

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete/typed-standing-query-20260913
          fetch-depth: 0
      - name: Capture failed native job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/103866763705/logs" \
            -o /tmp/job.log
          {
            printf 'Temporary CI failure excerpt for PR #369, source job `103866763705`.\n\n```text\n'
            grep -E -n -C 8 'The following tests FAILED|FAILED|Failure|failure|Expected|Actual|ASSERT_|EXPECT_|Errors while running CTest|[0-9]+% tests passed' /tmp/job.log | tail -n 260 || true
            printf '\n```\n'
          } > /tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/369/comments" \
            --method POST \
            --input /tmp/comment.md
      - name: Remove temporary capture workflow
        run: |
          set -euo pipefail
          rm .github/workflows/capture-pr369-ci-failure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary PR369 CI failure capture"
          git push origin HEAD:complete/typed-standing-query-20260913
